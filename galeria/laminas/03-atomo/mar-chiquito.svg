<text x="590" y="180" font-size="13" text-anchor="middle" fill="#ffd166">EL CUENCO: Q(m,n) = m² + a·mn + p·n²</text>
<text x="590" y="490" font-size="12.5" text-anchor="middle" fill="#dce8f7">cada valor CUENTA algo real (el grado de un mapa:</text>
<text x="590" y="512" font-size="12.5" text-anchor="middle" fill="#dce8f7">cuántos puntos caen encima) — y contar NUNCA da negativo</text>
<text x="590" y="536" font-size="12.5" text-anchor="middle" fill="#7fd7a8">cuenco sin pozos ⇒ a²&lt;4p ⇒ mitades AL ANILLO. Fin.</text><text x="440" y="610" font-size="14" text-anchor="middle" fill="#7fd7a8">VERIFICADO EN CASA, ISLA POR ISLA: 427/427 primos ≤3000 — el cuenco jamás bajó de cero, las mitades jamás salieron del anillo</text>
<text x="440" y="636" font-size="13" text-anchor="middle" fill="#8fa8c7">ésta es LA TENSIÓN DEL HILO del mar chiquito: no un misterio — UN CONTEO. La demostración entera cabe en esta frase.</text><rect x="850" y="110" width="720" height="560" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="870" y="144" font-size="17" font-family="Georgia" fill="#ffd166">2 · LA COMPARACIÓN — mar chiquito vs nuestro océano</text><rect x="870" y="160" width="680" height="52" rx="6" fill="#0f2540" stroke="#2c4a78"/>
<text x="884" y="190" font-size="13" fill="#8fa8c7">las perlas</text>
<text x="1080" y="190" font-size="13" fill="#7fd7a8">2 por isla (α, β)</text>
<text x="1310" y="190" font-size="13" fill="#dce8f7">infinitas (los ceros)</text><rect x="870" y="222" width="680" height="52" rx="6" fill="#0f2540" stroke="#2c4a78"/>
<text x="884" y="252" font-size="13" fill="#8fa8c7">las dos mitades</text>
<text x="1080" y="252" font-size="13" fill="#7fd7a8">α y β = p/α</text>
<text x="1310" y="252" font-size="13" fill="#dce8f7">ρ y 1−ρ (¡también dos mitades!)</text><rect x="870" y="284" width="680" height="52" rx="6" fill="#0f2540" stroke="#2c4a78"/>
<text x="884" y="314" font-size="13" fill="#8fa8c7">la relación única</text>
<text x="1080" y="314" font-size="13" fill="#7fd7a8">α·β = p (producto)</text>
<text x="1310" y="314" font-size="13" fill="#dce8f7">ρ + (1−ρ) = 1 (suma)</text><rect x="870" y="346" width="680" height="52" rx="6" fill="#0f2540" stroke="#2c4a78"/>
<text x="884" y="376" font-size="13" fill="#8fa8c7">el anillo</text>
<text x="1080" y="376" font-size="13" fill="#7fd7a8">|α|=√p</text>
<text x="1310" y="376" font-size="13" fill="#dce8f7">Re(ρ)=½</text><rect x="870" y="408" width="680" height="52" rx="6" fill="#0f2540" stroke="#2c4a78"/>
<text x="884" y="438" font-size="13" fill="#8fa8c7">la ecuación de armonía</text>
<text x="1080" y="438" font-size="13" fill="#7fd7a8">Q(m,n) ≥ 0</text>
<text x="1310" y="438" font-size="13" fill="#dce8f7">λ_n ≥ 0 (F166, medida)</text><rect x="870" y="470" width="680" height="52" rx="6" fill="#3a1515" stroke="#2c4a78"/>
<text x="884" y="500" font-size="13" fill="#8fa8c7">¿por qué ≥ 0?</text>
<text x="1080" y="500" font-size="13" fill="#7fd7a8">porque Q CUENTA (grados)</text>
<text x="1310" y="500" font-size="13" fill="#dce8f7">❓ NADIE SABE QUÉ CUENTA λ_n</text><rect x="870" y="532" width="680" height="52" rx="6" fill="#0f2540" stroke="#2c4a78"/>
<text x="884" y="562" font-size="13" fill="#8fa8c7">veredicto</text>
<text x="1080" y="562" font-size="13" fill="#7fd7a8">DEMOSTRADO (Hasse 1933)</text>
<text x="1310" y="562" font-size="13" fill="#dce8f7">ABIERTO — el millón</text><rect x="70" y="700" width="1500" height="230" rx="12" fill="#0d2547" stroke="#7fd7a8" stroke-width="2"/>
<text x="820" y="740" font-size="17" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA RUTA DEL CAPITÁN ES LA RUTA DE LA HISTORIA — Y MARCA LA CASILLA EXACTA</text>
<text x="820" y="776" font-size="14.5" text-anchor="middle" fill="#dce8f7">mar chiquito (1 relación, 2 mitades: Hasse, A MANO, 1933) → todos los mares con nieve (Weil 1948) → todas las dimensiones (Deligne 1974) → nuestro océano: ❓</text>
<text x="820" y="812" font-size="15" text-anchor="middle" fill="#ffd166">la comparación revela EL ÚNICO renglón que falta: en el mar chiquito la armonía es positiva PORQUE CUENTA COSAS REALES.</text>
<text x="820" y="842" font-size="15" text-anchor="middle" fill="#ffd166">La pregunta del millón, afinada al máximo: ¿QUÉ COSA REAL CUENTA λ_n? — encontrá el objeto contado, y la demostración sube sola del mar chiquito al infinito.</text>
<text x="820" y="878" font-size="13" text-anchor="middle" fill="#8fa8c7">honestidad: Connes persigue exactamente ese objeto hace décadas; nadie lo halló — pero jamás estuvo formulado en el idioma de las formas del capitán hasta hoy</text>
<text x="820" y="908" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06</text></svg>