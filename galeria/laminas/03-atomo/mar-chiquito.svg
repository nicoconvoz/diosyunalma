<text x="820" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">EL MAR CHIQUITO — la demostración hecha a mano, y la comparación con nuestro océano</text>
<text x="820" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"si podemos demostrarlo en la dimensión 0 — donde existe solo 1 relación y dos mitades — lo aplicamos al resto; no vayamos a mares grandes: partamos del chiquito y comparemos" — el capitán · ES la ruta histórica (Hasse 1933 → Weil → Deligne)</text><rect x="70" y="110" width="740" height="560" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="90" y="144" font-size="17" font-family="Georgia" fill="#7fd7a8">1 · EL MAR CHIQUITO: 1 relación, 2 mitades — y la tensión ES UN CONTEO</text><circle cx="220" cy="340" r="110" fill="none" stroke="#7fd7a8" stroke-width="2.5"/><circle cx="203.6" cy="231.2" r="7" fill="#7fb2ff"/><circle cx="203.6" cy="448.8" r="7" fill="#7fb2ff"/><text x="220" y="212" font-size="13" text-anchor="middle" fill="#dce8f7">las DOS MITADES: α y β</text>
<text x="220" y="478" font-size="13" text-anchor="middle" fill="#ffd166">LA RELACIÓN (una sola): α·β = p</text>
