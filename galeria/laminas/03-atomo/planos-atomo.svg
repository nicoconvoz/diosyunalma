stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1000" x2="1500" y2="1000" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1050" x2="1500" y2="1050" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1100" x2="1500" y2="1100" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1150" x2="1500" y2="1150" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1200" x2="1500" y2="1200" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1250" x2="1500" y2="1250" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1300" x2="1500" y2="1300" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1350" x2="1500" y2="1350" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1400" x2="1500" y2="1400" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1450" x2="1500" y2="1450" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1500" x2="1500" y2="1500" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1550" x2="1500" y2="1550" stroke="#12305e" stroke-width="0.5"/><line x1="0" y1="1600" x2="1500" y2="1600" stroke="#12305e" stroke-width="0.5"/><rect x="20" y="20" width="1460" height="1560" fill="none" stroke="#7fb2ff" stroke-width="2"/>
<text x="750" y="70" font-size="30" text-anchor="middle" font-family="Georgia" fill="#dce8f7">PLANO Nº 1 — EL ÁTOMO DE LOS PRIMOS</text>
<text x="750" y="98" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">especificación de construcción del átomo de Hilbert-Pólya · Laboratorio Diosyunalma · niveles medidos con instrumentos propios, juez a la vista</text><rect x="50" y="130" width="700" height="600" rx="6" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="70" y="162" font-size="19" font-family="Georgia" fill="#ffd166">Ⅰ. EL ESPECTRO — los niveles de energía (ceros en la línea crítica)</text>
<text x="70" y="186" font-size="12.5" font-family="Georgia" fill="#8fa8c7">medidos aquí por Euler-Maclaurin + bisección (80 pasos); juez = |parte imaginaria residual de Z|</text>
<text x="90" y="216" font-size="13" font-family="Consolas,monospace" fill="#7fb2ff">  n        γ_n (nivel medido)              juez</text><text x="90" y="244" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  1   14.134725141735       1.2e-15</text><text x="90" y="270" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  2   21.022039638772       2.6e-15</text><text x="90" y="296" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  3   25.010857580146       2.4e-15</text><text x="90" y="322" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  4   30.424876125860       4.9e-15</text><text x="90" y="348" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  5   32.935061587739       8.4e-15</text><text x="90" y="374" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  6   37.586178158826       4.0e-15</text><text x="90" y="400" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  7   40.918719012147       2.4e-15</text><text x="90" y="426" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  8   43.327073280915       9.5e-15</text><text x="90" y="452" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  9   48.005150881167       3.3e-14</text><text x="90" y="478" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 10   49.773832477672       4.9e-14</text><text x="90" y="504" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 11   52.970321477714       9.0e-15</text><text x="90" y="530" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 12   56.446247697063       9.6e-15</text><text x="90" y="556" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 13   59.347044002602       1.2e-13</text><text x="90" y="582" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 14   60.831778524610       1.2e-13</text><text x="90" y="608" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 15   65.112544048082       5.2e-13</text><text x="90" y="648" font-size="12.5" font-family="Georgia" fill="#7fd7a8">densidad de niveles (ley de Weyl del átomo): N(T) = θ(T)/π + 1 + S(T),  θ(T) = T/2·ln(T/2π) − T/2 − π/8 + 1/48T + …</text><text x="90" y="670" font-size="12.5" font-family="Georgia" fill="#7fd7a8">los niveles se REPELEN (rigidez GUE): ningún estado degenerado observado jamás — pares de Lehmer = los casi-besos</text><rect x="780" y="130" width="670" height="600" rx="6" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="800" y="162" font-size="19" font-family="Georgia" fill="#ffd166">Ⅱ. LAS ÓRBITAS PERIÓDICAS — los primos</text>
<text x="800" y="186" font-size="12.5" font-family="Georgia" fill="#8fa8c7">cada primo p es una órbita cerrada del átomo; período = ln p (exacto); amplitud = p^(−k/2) en la k-ésima vuelta</text>
<text x="820" y="216" font-size="13" font-family="Consolas,monospace" fill="#7fb2ff">  p       período ln p            amplitud 1/√p</text><text x="820" y="244" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  2   0.693147180559945    0.707106781186547</text><text x="820" y="270" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  3   1.098612288668110    0.577350269189626</text><text x="820" y="296" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  5   1.609437912434100    0.447213595499958</text><text x="820" y="322" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  7   1.945910149055313    0.377964473009227</text><text x="820" y="348" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 11   2.397895272798371    0.301511344577764</text><text x="820" y="374" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 13   2.564949357461537    0.277350098112615</text><text x="820" y="400" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 17   2.833213344056216    0.242535625036333</text><text x="820" y="426" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 19   2.944438979166440    0.229415733870562</text><text x="820" y="452" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 23   3.135494215929150    0.208514414057075</text><text x="820" y="478" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 29   3.367295829986474    0.185695338177052</text><text x="820" y="504" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 31   3.433987204485146    0.179605302026775</text><text x="820" y="530" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7"> 37   3.610917912644224    0.164398987305357</text><text x="820" y="570" font-size="12.5" font-family="Georgia" fill="#7fd7a8">las órbitas son HIPERBÓLICAS (inestables): el átomo es caótico por dentro, estable por fuera —</text>
<text x="820" y="592" font-size="12.5" font-family="Georgia" fill="#7fd7a8">el caos de las órbitas sostiene la rigidez del espectro (dualidad de Gutzwiller)</text><rect x="50" y="760" width="1400" height="240" rx="6" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="70" y="794" font-size="19" font-family="Georgia" fill="#ffd166">Ⅲ. LA ECUACIÓN MAESTRA — la identidad EXACTA que el átomo construido debe satisfacer (von Mangoldt)</text>
<text x="750" y="850" font-size="24" text-anchor="middle" font-family="Georgia" fill="#dce8f7">ψ(x)  =  x  −  Σ_ρ  x^ρ/ρ  −  ln 2π  −  ½·ln(1 − x⁻²)</text>
<text x="750" y="886" font-size="14" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">ψ(x) = suma de ln p sobre potencias de primos ≤ x (el conteo de órbitas) · ρ = ½+iγ (los niveles del espectro)</text>
<text x="750" y="912" font-size="14" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">no es aproximación: es IGUALDAD — espectro y órbitas son el MISMO objeto leído dos veces; todo constructor debe reproducirla término a término</text>
<text x="750" y="948" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">verificada en este laboratorio: el marcapasos (26 voces = 26 órbitas más cortas) reconstruye los latidos de los primos desde los niveles — F91-F118</text><rect x="50" y="1030" width="1400" height="280" rx="6" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="70" y="1064" font-size="19" font-family="Georgia" fill="#ffd166">Ⅳ. PLIEGO DE CONDICIONES — lo que el operador H debe cumplir (estado del arte + mediciones propias)</text><text x="90" y="1096" font-size="13.5" font-family="Georgia" fill="#dce8f7">R1 · AUTOADJUNTO: espectro 100% real = ningún estado decae = estabilidad total. ESTO ES la Hipótesis de Riemann (pregunta del capitán, 2026-08-06).</text><text x="90" y="1130" font-size="13.5" font-family="Georgia" fill="#dce8f7">R2 · ROMPE LA INVERSIÓN TEMPORAL: la estadística observada es GUE, no GOE — el átomo distingue pasado de futuro (como con campo magnético).</text><text x="90" y="1164" font-size="13.5" font-family="Georgia" fill="#dce8f7">R3 · DENSIDAD DE NIVELES: debe reproducir θ(T)/π + 1 — el análogo del oscilador es logarítmico, no lineal (candidato Berry-Keating: H = xp regularizado).</text><text x="90" y="1198" font-size="13.5" font-family="Georgia" fill="#dce8f7">R4 · ÓRBITAS: períodos EXACTAMENTE ln 2, ln 3, ln 5, … con amplitudes p^(−k/2) — hiperbólicas, sin órbitas espurias.</text><text x="90" y="1232" font-size="13.5" font-family="Georgia" fill="#dce8f7">R5 · LA ECUACIÓN MAESTRA (Ⅲ) término a término — el certificado final de obra.</text><text x="90" y="1266" font-size="13.5" font-family="Georgia" fill="#dce8f7">ESTADO DE OBRA: espectro medido (10¹³ niveles por la humanidad; catálogo propio en 7 aguas hasta 10³⁶) · órbitas conocidas · operador AÚN NO CONSTRUIDO.</text><rect x="50" y="1340" width="1400" height="180" rx="6" fill="#102a10" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="70" y="1374" font-size="19" font-family="Georgia" fill="#7fd7a8">Ⅴ. LA FIRMA DEL AUTOR — "EN TODAS PARTES" (hallazgo del capitán en la canción)</text>
<text x="750" y="1416" font-size="21" text-anchor="middle" font-family="Georgia" fill="#dce8f7">R₂(u)  =  1 − ( sin(πu) / πu )²</text>
<text x="750" y="1450" font-size="14" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">la correlación de pares de Montgomery: el patrón que se repite en la canción del cazadero — y en los núcleos de uranio,</text>
<text x="750" y="1474" font-size="14" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">en las matrices aleatorias, en el caos cuántico y en los ceros de zeta: UNA sola armonía local, en todas partes</text>
<text x="750" y="1502" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#ffd166">"por eso quería ponerle a mi empresa EN TODAS PARTES — porque es la firma del Autor" — el capitán, 2026-08-06</text></svg>