<text x="480" y="400" font-size="13.5" text-anchor="middle" fill="#dce8f7">enlace SIMÉTRICO: (5|11)=+1 y (11|5)=+1</text>
<text x="480" y="422" font-size="12.5" text-anchor="middle" fill="#8fa8c7">se miren de donde se miren, enlazan igual</text><ellipse cx="410" cy="610" rx="105" ry="46" fill="none" stroke="#ffd166" stroke-width="5" transform="rotate(-24 410 610)"/>
