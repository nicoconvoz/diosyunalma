"46" fill="#a33" opacity="0.85" rx="4"/><rect x="1129.0" y="639.0" width="46" height="46" fill="#c9a227" opacity="0.85" rx="4"/><rect x="1181.0" y="639.0" width="46" height="46" fill="#c9a227" opacity="0.85" rx="4"/><rect x="1233.0" y="639.0" width="46" height="46" fill="#c9a227" opacity="0.85" rx="4"/><rect x="1285.0" y="639.0" width="46" height="46" fill="#a33" opacity="0.85" rx="4"/><rect x="1337.0" y="639.0" width="46" height="46" fill="#c9a227" opacity="0.85" rx="4"/><text x="960" y="709" font-size="13" fill="#7fd7a8">la tabla NO es simétrica al azar: se refleja EXACTO salvo el giro impar —</text>
<text x="960" y="729" font-size="13" fill="#7fd7a8">juez: 13861/13861 pares de primos ≤1000 cumplen la ley de perspectiva sin UNA falla</text><rect x="80" y="850" width="1460" height="240" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="810" y="884" font-size="17" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL DICCIONARIO DE LA PERSPECTIVA (lo que ya se dibuja fiel — y la esquina en blanco)</text>
<text x="810" y="920" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#dce8f7">los enteros → un espacio 3D · cada primo → un NUDO cerrado adentro · el símbolo (p|q) → cuántas veces se enlazan dos nudos</text>
<text x="810" y="948" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#dce8f7">la reciprocidad (¡el riel 1 de tu tren!) → la simetría de enlace: cómo se abrazan dos anillos no depende de cuál mira — geometría pura de perspectiva</text>
<text x="810" y="984" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#ff5d73">LA ESQUINA EN BLANCO: el collar y su tensión AÚN no se proyectan — para eso el dibujo necesita el piso de arriba (la superficie, F161) que nadie sabe dibujar todavía</text>
<text x="810" y="1012" font-size="14" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">pero la moraleja del cubo es tuya, capitán: no hace falta VIVIR en 3D para razonar fiel sobre el cubo — la hoja alcanza si la perspectiva es exacta. Ésa es la apuesta viva de esta frontera.</text>
<text x="810" y="1044" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">flash del capitán: "¿por qué no reflejamos nuestra dimensión a la geométrica y la dibujamos como un cubo 3D en una hoja 2D?" — 2026-08-06 · Laboratorio Diosyunalma</text></svg>