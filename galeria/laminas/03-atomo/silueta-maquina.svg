<text x="780" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">LA SILUETA DE LA MÁQUINA — su forma, leída del canto (el libro sigue cerrado)</text>
<text x="780" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"las paredes están dentro del libro, solo las conoce el Autor — entendamos la forma y la armonía, no la máquina" — el capitán · método: identificar el instrumento por su timbre, sin abrirlo</text><rect x="110" y="130" width="900" height="480" rx="8" fill="#081020" stroke="#44608c"/><rect x="112.0" y="610.0" width="56.0" height="0.0" fill="#7fb2ff" opacity="0.55"/><rect x="172.0" y="547.6" width="56.0" height="62.4" fill="#7fb2ff" opacity="0.55"/><rect x="232.0" y="375.9" width="56.0" height="234.1" fill="#7fb2ff" opacity="0.55"/><rect x="292.0" y="212.1" width="56.0" height="397.9" fill="#7fb2ff" opacity="0.55"/><rect x="352.0" y="134.1" width="56.0" height="475.9" fill="#7fb2ff" opacity="0.55"/><rect x="412.0" y="258.9" width="56.0" height="351.1" fill="#7fb2ff" opacity="0.55"/><rect x="472.0" y="360.3" width="56.0" height="249.7" fill="#7fb2ff" opacity="0.55"/><rect x="532.0" y="454.0" width="56.0" height="156.0" fill="#7fb2ff" opacity="0.55"/><rect x="592.0" y="485.2" width="56.0" height="124.8" fill="#7fb2ff" opacity="0.55"/><rect x="652.0" y="571.0" width="56.0" height="39.0" fill="#7fb2ff" opacity="0.55"/><rect x="712.0" y="610.0" width="56.0" height="0.0" fill="#7fb2ff" opacity="0.55"/><rect x="772.0" y="610.0" width="56.0" height="0.0" fill="#7fb2ff" opacity="0.55"/><rect x="832.0" y="610.0" width="56.0" height="0.0" fill="#7fb2ff" opacity="0.55"/><rect x="892.0" y="610.0" width="56.0" height="0.0" fill="#7fb2ff" opacity="0.55"/><rect x="952.0" y="610.0" width="56.0" height="0.0" fill="#7fb2ff" opacity="0.55"/><polyline fill="none" stroke="#ffd166" stroke-width="2.6" points="110.0,610.0 116.0,609.5 122.0,607.8 128.0,605.1 134.0,601.4 140.0,596.6 146.0,590.8 152.0,584.1 158.0,576.4 164.0,567.8 170.0,558.5 176.0,548.3 182.0,537.4 188.0,525.9 194.0,513.8 200.0,501.2 206.0,488.1 212.0,474.7 218.0,461.0 224.0,447.1 230.0,433.0 236.0,418.9 242.0,404.9 248.0,390.9 254.0,