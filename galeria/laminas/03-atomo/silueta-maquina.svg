="#8fa8c7">espaciado normalizado s entre perlas vecinas · azul: NUESTRO collar (268 huecos medidos) · oro: GUE (caótica sin inversión temporal) · rojo punteado: Poisson (notas independientes)</text><text x="560" y="694" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#ffd166">nuestro collar abraza la curva de oro: desvío GUE 0.049 vs Poisson 0.287 (5.9× peor) — y cerca de s=0 el histograma MUERE: las perlas se repelen en s²</text><rect x="1060" y="130" width="440" height="480" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="1082" y="164" font-size="16" font-family="Georgia" fill="#ffd166">LA SILUETA LEÍDA (sin abrir el libro)</text>
<rect x="1180" y="186" width="200" height="130" rx="14" fill="#05090f" stroke="#44608c" stroke-width="2" stroke-dasharray="7,5"/>
<text x="1280" y="260" font-size="26" text-anchor="middle" fill="#44608c">?</text>
<text x="1280" y="300" font-size="12" text-anchor="middle" fill="#8fa8c7">las paredes: solo el Autor</text>
<text x="1082" y="360" font-size="13.5" fill="#7fd7a8">✔ es CAÓTICA (las perlas se repelen: nada de</text>
<text x="1082" y="382" font-size="13.5" fill="#7fd7a8">   notas independientes — Poisson descartado)</text>
<text x="1082" y="412" font-size="13.5" fill="#7fd7a8">✔ ROMPE la inversión temporal (repulsión s²,</text>
<text x="1082" y="434" font-size="13.5" fill="#7fd7a8">   no s: distingue pasado de futuro — GUE)</text>
<text x="1082" y="464" font-size="13.5" fill="#7fd7a8">✔ densidad logarítmica (ley de Weyl θ/π+1)</text>
<text x="1082" y="494" font-size="13.5" fill="#7fd7a8">✔ sus órbitas son los primos (período ln p)</text>
<text x="1082" y="524" font-size="13.5" fill="#7fd7a8">✔ sus energías de armonía son nuestros λ_n</text>
<text x="1082" y="560" font-size="13" fill="#ffd166">la familia entera de la máquina, conocida</text>
<text x="1082" y="582" font-size="13" fill="#ffd166">por su timbre — el libro jamás se abrió</text><rect x="110" y="720" width="1390" height="150" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="805" y="756" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA TÁCTICA DEL CAPITÁN, ADOPTADA COMO DOCTRINA</text>
<text x="805" y="790" font-size="14" text-anchor="middle" fill="#dce8f7">no perseguimos más las paredes (son del Autor): perseguimos LA FORMA — y la forma ya entregó la familia, las órbitas, la densidad y las energías.</text>
<text x="805" y="816" font-size="14" text-anchor="middle" fill="#ffd166">lo que la silueta aún no entrega: POR QUÉ esa familia obliga la positividad — el último velo del libro. Pero ahora sabemos exactamente qué página mirar.</text>
<text x="805" y="846" font-size="12.5" text-anchor="middle" fill="#8fa8c7">medido en casa: 268 huecos, GUE 5.9× mejor que Poisson · Laboratorio Diosyunalma · 2026-08-06</text></svg>