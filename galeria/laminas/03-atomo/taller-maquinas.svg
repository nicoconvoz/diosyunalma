<text x="600" y="604" font-size="12.5" fill="#ff5d73">perlas: niveles anónimos — REPROBADO</text><rect x="1050" y="110" width="460" height="540" rx="10" fill="#102a10" stroke="#ffd166" stroke-width="2"/>
<text x="1068" y="146" font-size="15.5" font-family="Georgia" fill="#ffd166">LA MÁQUINA REAL — lo que exige</text>
<text x="1068" y="186" font-size="13.5" fill="#dce8f7">✔ el canto del corazón (como B)</text>
<text x="1068" y="214" font-size="13.5" fill="#dce8f7">✔ niveles ARITMÉTICOS: γ₁=14.1347…, γ₂=21.0220…</text>
<text x="1068" y="242" font-size="13.5" fill="#dce8f7">✔ órbitas en k·ln p (arquitectura F176)</text>
<text x="1068" y="270" font-size="13.5" fill="#dce8f7">✔ energías de armonía = nuestros λ_n</text>
<text x="1068" y="318" font-size="14.5" fill="#ffd166">LA ÚNICA PIEZA QUE SEPARA A B DE LA REAL:</text>
<text x="1068" y="346" font-size="14.5" fill="#ffd166">la afinación aritmética de las paredes —</text>
<text x="1068" y="374" font-size="14.5" fill="#ffd166">LOS PRIMOS PLEGADOS EN EL ESPACIO</text>
<text x="1068" y="418" font-size="13" fill="#7fd7a8">v1.0 del taller: paredes plegadas por primos</text>
<text x="1068" y="442" font-size="13" fill="#7fd7a8">(el plegado total = el espacio adélico — la</text>
<text x="1068" y="466" font-size="13" fill="#7fd7a8">frontera exacta donde cava Connes)</text>
<text x="1068" y="510" font-size="12.5" fill="#8fa8c7">el hueco del millón dejó de ser filosofía:</text>
<text x="1068" y="534" font-size="12.5" fill="#8fa8c7">es un ÍTEM DE INGENIERÍA en el pizarrón del</text>
<text x="1068" y="558" font-size="12.5" fill="#8fa8c7">taller, con sus exámenes listos y jueces armados</text><rect x="70" y="690" width="1440" height="230" rx="12" fill="#0d2547" stroke="#7fd7a8" stroke-width="2"/>
<text x="790" y="728" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">EL PIZARRÓN DEL TALLER — estado de obra de LA MÁQUINA</text>
<text x="790" y="764" font-size="14" text-anchor="middle" fill="#dce8f7">arquitectura ✔ (trinidad F176) · material ✔ (el telar [x,p]=iℏ, F175) · examen del canto ✔ (el corazón, F177) · examen de perlas ✔ (espectro medido, F153-158)</text>
<text x="790" y="790" font-size="14" text-anchor="middle" fill="#dce8f7">prototipo A construido y reprobado (enseña) ✔ · prototipo B construido y semi-aprobado (acota) ✔</text>
<text x="790" y="826" font-size="14.5" text-anchor="middle" fill="#ffd166">PENDIENTE v1.0: las paredes plegadas por los primos — el único ítem; cuando un flash muestre CÓMO plegar sin perder el espectro discreto, el taller lo arma en el día</text>
<text x="790" y="856" font-size="12.5" text-anchor="middle" fill="#8fa8c7">honestidad: ese plegado es la frontera exacta de la matemática viva; nadie lo logró — pero jamás un taller tuvo el pizarrón tan completo</text>
<text x="790" y="888" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06 · las dos mitades, 1 completo</text></svg>