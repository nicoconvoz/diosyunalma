<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LA RAMA DE LOS PARES — el 2 corta de un hachazo, los impares no se podan nunca</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">cuánto se lleva cada primo, medido uno por uno · F409</text><rect x="20" y="76" width="1020" height="300" fill="#131826" stroke="#2a3040"/><text x="530" y="102" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">la tajada de cada primo (qué fracción de TODOS los números se lleva)</text><rect x="70.0" y="120.0" width="60" height="220.0" fill="#f2c14e" opacity="0.9"/><text x="100" y="112" font-size="12" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">50.0%</text><text x="100" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="168.0" y="266.7" width="60" height="73.3" fill="#5ec8ff" opacity="0.9"/><text x="198" y="259" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">16.7%</text><text x="198" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">3</text><rect x="266.0" y="310.7" width="60" height="29.3" fill="#5ec8ff" opacity="0.9"/><text x="296" y="303" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">6.7%</text><text x="296" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">5</text><rect x="364.0" y="323.2" width="60" height="16.8" fill="#5ec8ff" opacity="0.9"/><text x="394" y="315" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">3.8%</text><text x="394" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">7</text><rect x="462.0" y="330.9" width="60" height="9.1" fill="#5ec8ff" opacity="0.9"/><text x="492" y="323" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">2.1%</text><text x="492" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">11</text><rect x="560.0" y="333.0" width="60" height="7.0" fill="#5ec8ff" opacity="0.9"/><text x="590" y="325" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">1.6%</text><text x="590" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">13</text><rect x="658.0" y="335.0" width="60" height="5.0" fill="#5ec8ff" opacity="0.9"/><text x="688" y="327" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">1.1%</text><text x="688" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">17</text><rect x="756.0" y="335.8" width="60" height="4.2" fill="#5ec8ff" opacity="0.9"/><text x="786" y="328" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">1.0%</text><text x="786" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">19</text><rect x="854.0" y="336.7" width="60" height="3.3" fill="#5ec8ff" opacity="0.9"/><text x="884" y="329" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">0.7%</text><text x="884" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">23</text><rect x="952.0" y="337.5" width="60" height="2.5" fill="#5ec8ff" opacity="0.9"/><text x="982" y="330" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">0.6%</text><text x="982" y="358" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">29</text><text x="530" y="384" font-size="11" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">el 2 se lleva el 50 % de un solo golpe · el 3 apenas el 16,7 % · el 5 el 6,7 % · y sigue cayendo</text><rect x="20" y="392" width="500" height="250" fill="#121a16" stroke="#2a5a40"/><text x="270" y="418" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">cuántos primos cuesta cada mitad</text><text x="48" y="452" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">dejar 1/2</text><text x="150" y="452" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">1 primo — el 2, solo</text><text x="48" y="484" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">dejar 1/4</text><text x="150" y="484" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">4 primos — hasta el 7</text><text x="48" y="516" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">dejar 1/8</text><text x="150" y="516" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">22 primos — hasta el 79</text><text x="48" y="548" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">dejar 1/16</text><text x="150" y="548" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">996 primos — hasta el 7.879</text><text x="48" y="580" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">dejar 1/32</text><text x="150" y="580" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">más de 348.000 — no alcanzó la criba</text><text x="270" y="620" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">cada mitad cuesta el CUADRADO del esfuerzo anterior</text><rect x="540" y="392" width="500" height="250" fill="#1a1216" stroke="#5a2a30"/><text x="790" y="418" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">ninguna cuadrilla finita termina</text><text x="564" y="452" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">por más primos que uses hasta p, el cuadrado</text><text x="564" y="472" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">del primo siguiente SIEMPRE se te escapa:</text><text x="580" y="506" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">barriendo hasta el 2</text><text x="810" y="506" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">el 9 = 3 × 3 sobrevive</text><text x="580" y="532" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">barriendo hasta el 3</text><text x="810" y="532" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">el 25 = 5 × 5 sobrevive</text><text x="580" y="558" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">barriendo hasta el 5</text><text x="810" y="558" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">el 49 = 7 × 7 sobrevive</text><text x="790" y="600" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">hay que seguir sumando podadores para siempre</text><text x="790" y="624" font-size="11" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">ésas son las «ramas infinitas» del capitán</text></svg>