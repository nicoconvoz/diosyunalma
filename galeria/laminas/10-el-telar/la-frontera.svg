<text x="720.0" y="48.0" font-size="23.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">🧵🌿 LA FRONTERA — ¿la frustración da RIGIDEZ, o esconde los estados?</text>
<text x="720.0" y="74.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">«No busquemos el número más bajo. Busquemos la estructura que lo hace bajo sin esconder los estados.» — la auditora</text>
<rect x="32.0" y="96.0" width="856.0" height="470.0" rx="10" fill="#101b30" stroke="#ffd98a"/>
<text x="47.0" y="121.0" font-size="14.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">A · EL PLANO QUE DECIDE — Σ²(10) contra PARTICIPACIÓN</text>
<text x="48.0" y="145.5" font-size="11.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Cada punto es un brazo. A la DERECHA hay más participación (estados extendidos); ABAJO hay menos varianza.</text>
<text x="48.0" y="163.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">Los huecos son INADMISIBLES: vaciaron la banda por debajo del riel, así que su Σ² mide otro recorte.</text>
