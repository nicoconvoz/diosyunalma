<text x="332.2" y="198.6" font-size="10.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">S0 control</text>
<text x="48.0" y="560.0" font-size="11.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">eje horizontal: PR/N   ·   eje vertical: Σ²(10), escala logarítmica</text>
<text x="48.0" y="577.5" font-size="11.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">verde = signo por ENLACE   ·   rosa = signo por SITIO   ·   azul = signo por DISTANCIA</text>
<rect x="904.0" y="96.0" width="504.0" height="470.0" rx="10" fill="#101b30" stroke="#7fb2ff"/>
<text x="919.0" y="121.0" font-size="14.0" font-family="Georgia,serif" fill="#7fb2ff" text-anchor="start">B · SU §6 CONTESTADA: no alcanza con la frustración</text>
<text x="920.0" y="145.5" font-size="11.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Tres familias A LA MISMA frustración de triángulos (≈0,22):</text>
<text x="920.0" y="166.5" font-size="11.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="start">familia          Σ²(10)   PR/N   vivos</text>
<text x="920.0" y="183.5" font-size="11.0" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="start">por ENLACE        1,39  0,247    122</text>
<text x="920.0" y="200.5" font-size="11.0" font-family="Consolas,monospace" fill="#ff9aa8" text-anchor="start">por SITIO         7,88  0,046    181</text>
<text x="920.0" y="217.5" font-size="11.0" font-family="Consolas,monospace" fill="#7fb2ff" text-anchor="start">por DISTANCIA     2,44  0,281    137</text>
<text x="920.0" y="241.5" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">⟹ Misma frustración, y PR/N va de 0,046 a 0,281.</text>
<text x="920.0" y="259.5" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">   La frustración de triángulos NO determina nada.</text>
<text x="920.0" y="282.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">Lo que decide es DÓNDE VIVE EL SIGNO:</text>
<text x="920.0" y="300.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· signo derivado de los SITIOS  → atrapa los estados</text>
<text x="920.0" y="318.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· signo puesto en los ENLACES   → NO los atrapa</text>
<text x="920.0" y="342.0" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">Y eso reinterpreta la Fase IX: allá toda la familia</text>
<text x="920.0" y="360.0" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">era por sitio, así que la localización que vimos NO</text>
<text x="920.0" y="378.0" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">venía de la frustración — venía de la CODIFICACIÓN.</text>
<rect x="32.0" y="582.0" width="856.0" height="200.0" rx="10" fill="#101b30" stroke="#7ee0c0"/>
<text x="47.0" y="607.0" font-size="14.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">C · EL VEREDICTO, con los dos rieles</text>
<text x="48.0" y="632.5" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Riel 1 · PR/N ≥ 0,090 (declarado antes).   Riel 2 · conservar ≥ 149 de los 187 niveles del control.</text>
<text x="48.0" y="655.0" font-size="12.5" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="start">mejor brazo ADMISIBLE: B · q = 0.020</text>
<text x="48.0" y="673.5" font-size="12.5" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="start">  Σ²(10) 6,324 ± 0,781  contra 18,335 del control  →  15,4 sigmas</text>
<text x="48.0" y="692.0" font-size="12.5" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="start">  PR/N 0,189  (el control tiene 0,105: SUBIÓ)   ·   vivos 170 de 187</text>
<text x="48.0" y="717.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">⟹ GANA H2. Por primera vez en toda la cadena, Σ² baja y la participación NO cae — sube.</text>
<text x="48.0" y="735.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">No es esconder los estados: es ordenarlos. Es exactamente lo que su §16 pedía demostrar primero.</text>
<rect x="904.0" y="582.0" width="504.0" height="200.0" rx="10" fill="#101b30" stroke="#ff9aa8"/>
<text x="919.0" y="607.0" font-size="14.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">D · LO QUE SE CIERRA</text>
<text x="920.0" y="632.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Igualando densidad Y frustración de triángulos:</text>
<text x="920.0" y="649.5" font-size="11.5" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="start">reciprocidad   5,565</text>
<text x="920.0" y="667.0" font-size="11.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="start">azar igualado  5,310 ± 1,431</text>
<text x="920.0" y="684.5" font-size="11.5" font-family="Consolas,monospace" fill="#ff9aa8" text-anchor="start">distancia      0,18 sigmas</text>
<text x="920.0" y="706.5" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">⟹ La aritmética NO se separa. Su §14 dice qué hacer:</text>
<text x="920.0" y="724.5" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">   cerrar este canal y no insistir con esta codificación.</text>
<text x="920.0" y="748.0" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">Pero queda un hecho estructural: enlaces independientes</text>
<text x="920.0" y="765.5" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">a densidad 0,267 dan frustración 0,449, y la reciprocidad</text>
<text x="920.0" y="783.0" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">da 0,536. El campo aritmético vive donde el azar por</text>
<text x="920.0" y="800.5" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">enlace no llega — aunque el espectro no lo distinga.</text>
<rect x="32.0" y="798.0" width="1376.0" height="108.0" rx="10" fill="#101b30" stroke="#7fb2ff"/>
<text x="47.0" y="823.0" font-size="14.0" font-family="Georgia,serif" fill="#7fb2ff" text-anchor="start">E · Y UN DEFECTO PROPIO, DE NUEVO CAZADO ADENTRO</text>
<text x="48.0" y="848.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">La primera corrida de esta fase no tenía el riel de niveles vivos que su §4 pedía. Sin él, el «mejor» brazo daba Σ²(10) = 0,988</text>
<text x="48.0" y="866.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">—por debajo del piso GUE— pero con 87 niveles de 187: la banda vaciándose, que es EXACTAMENTE el error que obligó a retractar la</text>
<text x="48.0" y="884.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">Fase VI. Con el riel puesto, siete brazos quedan descartados y el ganador honesto es otro. El hallazgo sobrevive; el número, no.</text>
<text x="720.0" y="928.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/lafrontera · 400 modos · R6 limpio · las bandas se declararon antes de medir · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
</svg>
