" font-family="Georgia,serif">t≈802</text><text x="319" y="538" font-size="10" fill="#5c6478" text-anchor="middle" font-family="Georgia,serif">t≈1600</text><text x="425" y="538" font-size="10" fill="#5c6478" text-anchor="middle" font-family="Georgia,serif">t≈3201</text><text x="530" y="538" font-size="10" fill="#5c6478" text-anchor="middle" font-family="Georgia,serif">t≈6401</text><text x="740" y="538" font-size="10" fill="#5c6478" text-anchor="middle" font-family="Georgia,serif">t≈25600</text><text x="950" y="538" font-size="10" fill="#5c6478" text-anchor="middle" font-family="Georgia,serif">t≈102400</text><text x="530" y="588" font-size="12" fill="#c7cdd9" text-anchor="middle" font-family="Georgia,serif">las dos razones angulares aprietan el 1/2 desde los dos lados, y su punto medio da 0.5000 en el peldaño más hondo — sin σ en ninguna parte del esqueleto</text><text x="530" y="608" font-size="12" fill="#c9b458" text-anchor="middle" font-family="Georgia,serif">la pintura obedece β = 1−σ (0,7 / 0,5 / 0,3 medidos): el único σ donde la pintura empata al esqueleto es 1/2 · Todavía no</text></svg>