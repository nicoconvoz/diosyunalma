<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="620" viewBox="0 0 1060 620"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="34" font-size="21" fill="#e8e2d4" text-anchor="middle" font-family="Georgia,serif">LA PROPORCIÓN — ¿converge alguna razón a 1/2 sin que se lo pidamos?</text><text x="530" y="56" font-size="12" fill="#8a93a6" text-anchor="middle" font-family="Georgia,serif">esqueleto angular puro (pasos de largo 1, sin σ): razones geométricas por la escalera t = 200 … 6400</text><rect x="70" y="100" width="920" height="420" fill="#11151f" stroke="#232a3a"/><line x1="70" y1="315.8" x2="990" y2="315.8" stroke="#c9b458" stroke-width="1.2" stroke-dasharray="7 5"/><text x="984" y="309" font-size="12" fill="#c9b458" text-anchor="end" font-family="Georgia,serif">1/2</text><line x1="70" y1="508.4" x2="990" y2="508.4" stroke="#1c2230" stroke-width="1"/><text x="62" y="512" font-size="10" fill="#5c6478" text-anchor="end" font-family="Georgia,serif">0.00</text><line x1="70" y1="412.1" x2="990" y2="412.1" stroke="#1c2230" stroke-width="1"/><text x="62" y="416" font-size="10" fill="#5c6478" text-anchor="end" font-family="Georgia,serif">0.25</text><line x1="70" y1="219.4" x2="990" y2="219.4" stroke="#1c2230" stroke-width="1"/><text x="62" y="223" font-size="10" fill="#5c6478" text-anchor="end" font-family="Georgia,serif">0.75</text><line x1="70" y1="123.1" x2="990" y2="123.1" stroke="#1c2230" stroke-width="1"/><text x="62" y="127" font-size="10" fill="#5c6478" text-anchor="end" font-family="Georgia,serif">1.00</text><circle cx="110.0" cy="123.1" r="3.4" fill="#f2a6c0"/><circle cx="214.7" cy="123.5" r="3.4" fill="#f2a6c0"/><circle cx="319.5" cy="171.5" r="3.4" fill="#f2a6c0"/><circle cx="424.6" cy="191.3" r="3.4" fill="#f2a6c0"/><circle cx="529.7" cy="200.4" r="3.4" fill="#f2a6c0"/><circle cx="739.8" cy="229.9" r="3.4" fill="#f2a6c0"/><circle cx="950.0" cy="240.1" r="3.4" fill="#f2a6c0"/><polyline points="110.0,123.1 214.7,123.5 319.5,171.5 424.6