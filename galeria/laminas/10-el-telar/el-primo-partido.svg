<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL PRIMO PARTIDO — sí se puede, de tres maneras, y ninguna es nueva</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">cambiar el anillo · cambiar la cuenta · cambiar los primos · F397</text><rect x="20" y="76" width="330" height="270" fill="#131826" stroke="#f2c14e"/><text x="185" y="104" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">A · CAMBIAR EL ANILLO</text><text x="185" y="124" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">enteros de Gauss — Fermat 1640</text><text x="40" y="162" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el 5 NO es primo ahí:</text><text x="40" y="180" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">ES múltiplo de 2+i</text><text x="185" y="218" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">5 = (2+i)(2−i)</text><line x1="40" y1="244" x2="330" y2="244" stroke="#f2c14e" opacity="0.4"/><text x="185" y="268" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">se parte ⟺ p ≡ 1 (mod 4) · la mitad</text><rect x="366" y="76" width="330" height="270" fill="#131826" stroke="#6ee7a0"/><text x="531" y="104" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">B · CAMBIAR LA CUENTA</text><text x="531" y="124" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">función d_z — Selberg y Delange</text><text x="386" y="162" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">cada primo con MEDIO</text><text x="386" y="180" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">divisor, exacto:</text><text x="531" y="218" font-size="15" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">d_½(p) = 0,5000</text><line x1="386" y1="244" x2="676" y2="244" stroke="#6ee7a0" opacity="0.4"/><text x="531" y="268" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">coeficiente de la serie de ζ(s)^½</text><rect x="712" y="76" width="330" height="270" fill="#131826" stroke="#5ec8ff"/><text x="877" y="104" font-size="13" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">C · CAMBIAR LOS PRIMOS</text><text x="877" y="124" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">sistemas de Beurling — 1937</text><text x="732" y="162" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">primos en lugares</text><text x="732" y="180" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">fraccionarios:</text><text x="877" y="218" font-size="15" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">«primos» en 2,5 · 3,5 · 5,5</text><line x1="732" y1="244" x2="1022" y2="244" stroke="#5ec8ff" opacity="0.4"/><text x="877" y="268" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el sistema entero sigue funcionando</text><rect x="20" y="366" width="1020" height="130" fill="#1a1216" stroke="#5a2a30"/><text x="530" y="394" font-size="14" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">LO QUE NINGUNA DE LAS TRES HACE</text><text x="530" y="422" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">Encontrar un divisor escondido del primo DENTRO de los enteros.</text><text x="530" y="444" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">Eso no se puede, y no por falta de ingenio: es la definición de primo.</text><text x="530" y="470" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Las tres rutas pagan el mismo precio — salir de los enteros — y a cambio dan estructura nueva.</text><rect x="20" y="512" width="1020" height="130" fill="#131826" stroke="#2a3040"/><text x="530" y="540" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">los primeros primos, partidos o enteros según su resto módulo 4</text><circle cx="60.0" cy="580" r="11" fill="#c9c3b0" opacity="0.9"/><text x="60" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">2</text><circle cx="93.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="93" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">3</text><circle cx="126.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="126" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">5</text><circle cx="159.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="159" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">7</text><circle cx="192.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="192" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">11</text><circle cx="225.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="225" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">13</text><circle cx="258.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="258" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">17</text><circle cx="291.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="291" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">19</text><circle cx="324.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="324" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">23</text><circle cx="357.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="357" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">29</text><circle cx="390.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="390" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">31</text><circle cx="423.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="423" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">37</text><circle cx="456.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="456" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">41</text><circle cx="489.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="489" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">43</text><circle cx="522.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="522" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">47</text><circle cx="555.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="555" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">53</text><circle cx="588.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="588" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">59</text><circle cx="621.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="621" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">61</text><circle cx="654.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="654" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">67</text><circle cx="687.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="687" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">71</text><circle cx="720.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="720" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">73</text><circle cx="753.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="753" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">79</text><circle cx="786.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="786" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">83</text><circle cx="819.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="819" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">89</text><circle cx="852.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="852" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">97</text><circle cx="885.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="885" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">101</text><circle cx="918.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="918" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">103</text><circle cx="951.0" cy="580" r="11" fill="#5ec8ff" opacity="0.9"/><text x="951" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">107</text><circle cx="984.0" cy="580" r="11" fill="#f2c14e" opacity="0.9"/><text x="984" y="584" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">109</text><text x="60" y="618" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">● amarillo: se parte en los enteros de Gauss (p ≡ 1 mod 4)</text><text x="560" y="618" font-size="11" fill="#5ec8ff" text-anchor="start" font-family="Georgia,serif">● celeste: resiste entero (p ≡ 3 mod 4) · gris: el 2 ramifica</text><text x="1020" y="636" font-size="10" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">Todavía no.</text></svg>