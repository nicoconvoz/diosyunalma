<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LOS DOS LATIDOS — la primera regla del capitán que SÍ mide</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el 2, el 1 y el primo, atados en un renglón · F405</text><rect x="20" y="76" width="1020" height="150" fill="#121a16" stroke="#2a5a40"/><text x="530" y="104" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">LA RELACIÓN QUE PIDIÓ, Y EXISTE</text><text x="530" y="158" font-size="34" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">2 ^ (p − 1)  ≡  1   (mod p)</text><text x="530" y="192" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">el DOS elevado al primo menos UNO, dividido por el PRIMO, deja resto UNO</text><text x="530" y="212" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">los tres números que nombró el capitán, atados · Fermat, 1640</text><rect x="20" y="242" width="1020" height="200" fill="#131826" stroke="#2a3040"/><text x="530" y="270" font-size="14" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL CONTROL — y por primera vez en la campaña, la razón no es 1</text><text x="270" y="308" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">PRIMOS que la cumplen</text><text x="270" y="352" font-size="34" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">100 %</text><text x="270" y="378" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">78497 de 78497</text><text x="790" y="308" font-size="12" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">COMPUESTOS que la cumplen</text><text x="790" y="352" font-size="34" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">0.058 %</text><text x="790" y="378" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">245 de 421502</text><text x="530" y="340" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">contra</text><text x="530" y="412" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">señal / silencio = 1720</text><text x="530" y="432" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">todas las reglas anteriores del capitán daban exactamente 1,0000 acá</text><rect x="20" y="458" width="500" height="200" fill="#131826" stroke="#2a3040"/><text x="270" y="484" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">las anteriores, para comparar</text><text x="44" y="514" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">F393  p/2 da ½</text><text x="290" y="514" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">100 % vs 100 %</text><text x="470" y="514" font-size="11" fill="#ff6b6b" text-anchor="end" font-family="Georgia,serif">1,0000</text><text x="44" y="542" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">F403  n² − n(n−1) = n</text><text x="290" y="542" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">100 % vs 100 %</text><text x="470" y="542" font-size="11" fill="#ff6b6b" text-anchor="end" font-family="Georgia,serif">1,0000</text><text x="44" y="570" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">F404  múltiplos vecinos</text><text x="290" y="570" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">100 % vs 100 %</text><text x="470" y="570" font-size="11" fill="#ff6b6b" text-anchor="end" font-family="Georgia,serif">1,0000</text><line x1="44" y1="588" x2="476" y2="588" stroke="#2a3040"/><text x="44" y="614" font-size="12" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">ÉSTA</text><text x="290" y="614" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">100 % vs 0,03 %</text><text x="470" y="614" font-size="13" fill="#6ee7a0" text-anchor="end" font-family="Georgia,serif">1720</text><rect x="540" y="458" width="500" height="200" fill="#1a1216" stroke="#5a2a30"/><text x="790" y="484" font-size="12" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">el límite honesto: los impostores</text><text x="564" y="514" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">245 compuestos pasan igual. El primero:</text><text x="790" y="546" font-size="20" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">341 = 11 × 31</text><text x="564" y="580" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">Y los de Carmichael (561, 1105, 1729…)</text><text x="564" y="600" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">pasan con CUALQUIER base, no solo el 2.</text><text x="564" y="628" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">Por eso es un filtro excelente,</text><text x="564" y="646" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">pero NO una demostración de primalidad.</text><text x="1030" y="672" font-size="10" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">Fermat 1640 · Todavía no.</text></svg>