<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">APÉRY EN LA CASA — el experimento que se pidió, y dio negativo</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">meter ζ(3) en nuestras fórmulas, con nueve controles al lado · F412</text><rect x="20" y="76" width="1020" height="230" fill="#131826" stroke="#2a3040"/><text x="530" y="102" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">el cambiaformas w(s) = 1 − 1/s, y dónde cae cada constante</text><line x1="80" y1="200" x2="980" y2="200" stroke="#3a4050" stroke-width="1.5"/><circle cx="-350.0" cy="200" r="5" fill="#8a8676"/><text x="-350" y="184" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">½ → −1 (la piel)</text><circle cx="530.0" cy="200" r="5" fill="#8a8676"/><text x="530" y="184" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">1 → 0 (el polo)</text><circle cx="970.0" cy="200" r="5" fill="#f2c14e"/><text x="970" y="184" font-size="11" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">2 → ½ EXACTO</text><circle cx="677.9" cy="200" r="5" fill="#ff6b6b"/><text x="678" y="222" font-size="11" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif"></text><circle cx="622.9" cy="200" r="5" fill="#5ec8ff"/><text x="623" y="222" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif"></text><circle cx="787.7" cy="200" r="5" fill="#5ec8ff"/><text x="788" y="222" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif"></text><circle cx="648.6" cy="200" r="5" fill="#5ec8ff"/><text x="649" y="222" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif"></text><circle cx="863.1" cy="200" r="5" fill="#5ec8ff"/><text x="863" y="222" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif"></text><circle cx="702.5" cy="200" r="5" fill="#5ec8ff"/><text x="703" y="222" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif"></text><circle cx="645.6" cy="200" r="5" fill="#5ec8ff"/><text x="646" y="222" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif"></text><circle cx="560.6" cy="200" r="5" fill="#5ec8ff"/><text x="561" y="222" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif"></text><circle cx="530.2" cy="200" r="5" fill="#5ec8ff"/><text x="530" y="222" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif"></text><circle cx="633.7" cy="200" r="5" fill="#5ec8ff"/><text x="634" y="222" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif"></text><text x="678" y="242" font-size="12" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">ζ(3) → 0.1681</text><text x="530" y="280" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">● los puntos celestes son las nueve constantes de control — ζ(3) cae entre ellas, sin distinguirse</text><rect x="20" y="322" width="500" height="250" fill="#131826" stroke="#2a3040"/><text x="270" y="348" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">ranking de cercanía a un número redondo</text><text x="50" y="380" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">1°  azar 2</text><text x="490" y="380" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">a 0.00023 de 0</text><text x="50" y="408" font-size="11" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">2°  ζ(3)  Apéry</text><text x="490" y="408" font-size="11" fill="#ff6b6b" text-anchor="end" font-family="Georgia,serif">a 0.00143 de 1/6</text><text x="50" y="436" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">3°  γ+2/3</text><text x="490" y="436" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">a 0.00393 de 1/5</text><text x="50" y="464" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">4°  π/e</text><text x="490" y="464" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">a 0.00811 de 1/7</text><text x="50" y="492" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">5°  ln(10)/2</text><text x="490" y="492" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">a 0.01145 de 1/7</text><text x="50" y="520" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">6°  azar 3</text><text x="490" y="520" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">a 0.02504 de 1/7</text><text x="270" y="552" font-size="11" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">ζ(3) quedó 2° de 10: en el montón</text><rect x="540" y="322" width="500" height="250" fill="#1a1216" stroke="#5a2a30"/><text x="790" y="348" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">RESULTADO: NO PASA NADA</text><text x="564" y="384" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">Y estaba predicho antes de correr, porque</text><text x="564" y="404" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">ζ(3) viene de contar fotones del fondo</text><text x="564" y="424" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">cósmico, y ninguna de nuestras dos</text><text x="564" y="444" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">fórmulas la deriva de ningún lado.</text><line x1="564" y1="466" x2="1016" y2="466" stroke="#5a2a30"/><text x="564" y="492" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">Meterla a mano es ponerle una pieza de</text><text x="564" y="512" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">otro motor a un motor que anda: entra,</text><text x="564" y="532" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">gira, y no significa nada.</text><text x="790" y="558" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">trampa vigesimoquinta, declarada antes de calcular</text><rect x="20" y="588" width="1020" height="76" fill="#121a16" stroke="#2a5a40"/><text x="530" y="614" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">Lo que SÍ vale: el CONTROL. Sin las nueve constantes al lado, cualquiera de estos números habría parecido interesante.</text><text x="530" y="640" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">El experimento se pidió, se hizo completo, y dio negativo. Eso también se registra. Todavía no.</text></svg>