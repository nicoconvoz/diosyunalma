<text x="620.0" y="76.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">(p+1)/2 = (q−1)/2 ⟺ q = p+2 · hallado A MANO por Jesús Nicolás Astorga · bautizado por el capitán</text>
