<text x="70.0" y="308.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">los gemelos (11,13) y (17,19) se vuelven enteros CONSECUTIVOS abajo, y el ancla compartida c = m/2 queda anillada.</text>
<text x="70.0" y="328.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">T(n) = (n−1)/2 es la biyección impares→enteros: divide todo gap por 2. Los ±1/2 son esa coordenada — nada más, nada menos.</text>
<text x="620.0" y="366.0" font-size="14.0" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="middle">FORMA GENERAL:  (p,q) = (m−g/2, m+g/2)   ·   a⁻(q) − a⁺(p) = g/2 − 1   ·   3 | m ⟺ 6 ∤ g</text>
<text x="620.0" y="388.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">verificadas con CERO fallas: ~25 millones de pares impares · 17 982 pares consecutivos de primos · TODOS los 304 590 pares en (3, 6000]</text>
<text x="70.0" y="426.0" font-size="13.0" font-family="Georgia,serif" fill="#7fb2ff" text-anchor="start">LA RUEDA DE LOS CENTROS — la clase del gap se LEE en el residuo del centro mod 6 (período 6 en g)</text>
