<text x="760.0" y="484.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">los gemelos viven en m ≡ 0 (mod 6): la red 6ℤ.</text>
<text x="760.0" y="506.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">g=4 en los múltiplos impares de 3 · g=6 esquiva</text>
<text x="760.0" y="528.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">el 3 · y la firma se repite con período 6 en g.</text>
<text x="760.0" y="558.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">Consecuencia sin simulación: todo par gemelo</text>
<text x="760.0" y="580.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">mayor que (3,5) tiene m ≡ 0 (mod 6) y c ≡ 0 (mod 3).</text>
<text x="760.0" y="602.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">Sin excepción posible: es la ley del centro.</text>
<text x="760.0" y="632.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">Honestidad: la ley es criba mod 3 CLÁSICA — verdadera y</text>
<text x="760.0" y="652.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">demostrada, no nueva para el mundo; nueva como organización</text>
<text x="760.0" y="672.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">para el taller. Y nada de esto afirma nada sobre RH.</text>
<text x="620.0" y="796.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">matemática pura: ningún operador, ningún espectro, ningún cero — la auditora prohibió correr y se obedeció</text>
<text x="620.0" y="820.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/puntomedio · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
