<text x="700.0" y="736.0" font-size="13.0" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="middle">H = D + Σ_{a=1..K} g_a |v_a⟩⟨v_a|      con    v_a(p) ∝ Λ(p)/√p · cos(2π·a·ind(p)/K)</text>
<text x="700.0" y="762.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">R6 LIMPIO: las únicas entradas son Λ(n) y los restos módulo q. Ningún parámetro se tocó mirando los γₙ.</text>
<text x="700.0" y="784.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">ninguna ley de potencia describe la caída: el mejor ajuste da exponente 0,012 con residuo 0,72 — lo reportamos igual.</text>
<text x="700.0" y="806.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="middle">lo que falta ahora tiene forma: una estructura que dé ALCANCE sin DILUIR la fuerza.</text>
<text x="700.0" y="856.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">la intuición del fluido es de Jesús Nicolás Astorga · la ruta de fases, de la auditora · las mediciones, de este taller</text>
<text x="700.0" y="900.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/muchosmodos · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
