<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="1060" height="720"><rect width="1060" height="720" fill="#0d1017"/><text x="530.0" y="40.0" font-family="Georgia,serif" font-size="24" fill="#e8e2d0" text-anchor="middle">EL PRODUCTO DE LOS BORDES</text><text x="530.0" y="66.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="middle">«¿y el logaritmo del borde derecho por el logaritmo del borde izquierdo, qué da?»</text><rect x="20" y="88" width="500" height="200" fill="#131826" stroke="#2a3040"/><text x="270.0" y="114.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">el borde izquierdo es NEGATIVO</text><text x="270.0" y="146.0" font-family="Georgia,serif" font-size="16" fill="#e8e2d0" text-anchor="middle">ln(−a) = ln(a) + iπ</text><text x="270.0" y="168.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">Euler, 1748</text><text x="270.0" y="202.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">así que su pregunta OBLIGA a los complejos a aparecer,</text><text x="270.0" y="220.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">y aparecen por la puerta de Euler</text><text x="270.0" y="254.0" font-family="Georgia,serif" font-size="14" fill="#6ee7a0" text-anchor="middle">ln²(n/2) + iπ·ln(n/2)</text><text x="270.0" y="276.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">el 2 da CERO exacto — su borde derecho cae justo en 1</text><rect x="540" y="88" width="500" height="200" fill="#131826" stroke="#2a3040"/><text x="790.0" y="114.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">el lugar geométrico: una PARÁBOLA exacta</text><path d="M 1056.8 288.4 L 1030.3 285.8 L 1004.6 283.2 L 979.7 280.6 L 955.6 278.0 L 932.3 275.4 L 909.8 272.8 L 888.1 270.2 L 867.1 267.6 L 847.0 265.0 L 827.6 262.4 L 809.0 259.8 L 791.3 257.2 L 774.3 254.6 L 758.1 252.0 L 742.7 249.4 L 728.0 246.8 L 714.2 244.2 L 701.2 241.6 L 688.9 239.0 L 677.4 236.4 L 666.8 233.8 L 656.9 231.2 L 647.8 228.6 L 639.5 226.0 L 632.0 223.4 L 625.3 220.8 L 619.4 218.2 L 614.2 215.6 L 609.9 213.0 L 606.3 210.4 L 603.6 207.8 L 601.6 205.2 L 600.4 202.6 L 600.0 200.0 L 600.4 197.4 L 601.6 194.8 L 603.6 192.2 L 606.3 189.6 L 609.9 187.0 L 614.2 184.4 L 619.4 181.8 L 625.3 179.2 L 632.0 176.6 L 639.5 174.0 L 647.8 171.4 L 656.9 168.8 L 666.8 166.2 L 677.4 163.6 L 688.9 161.0 L 701.2 158.4 L 714.2 155.8 L 728.0 153.2 L 742.7 150.6 L 758.1 148.0 L 774.3 145.4 L 791.3 142.8 L 809.0 140.2 L 827.6 137.6 L 847.0 135.0 L 867.1 132.4 L 888.1 129.8 L 909.8 127.2 L 932.3 124.6 L 955.6 122.0 L 979.7 119.4 L 1004.6 116.8 L 1030.3 114.2 L 1056.8 111.6" fill="none" stroke="#f2c14e" stroke-width="1.8"/><line x1="600" y1="200" x2="1010" y2="200" stroke="#5a6070" stroke-dasharray="3,3"/><circle cx="600" cy="200" r="4" fill="#6ee7a0"/><text x="596.0" y="216.0" font-family="Georgia,serif" font-size="10" fill="#6ee7a0" text-anchor="end">el 2</text><text x="790.0" y="262.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">Re = Im² / π²</text><text x="790.0" y="280.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">desvío medido: precisión de máquina</text><rect x="20" y="304" width="1020" height="86" fill="#0f1a14" stroke="#2a5a40"/><text x="530.0" y="332.0" font-family="Georgia,serif" font-size="13" fill="#6ee7a0" text-anchor="middle">Y MIRE DÓNDE TERMINAMOS</text><text x="530.0" y="358.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">el capitán abrió esta campaña en F391 preguntando por DOS PARÁBOLAS que se tocan en el cero</text><text x="530.0" y="380.0" font-family="Georgia,serif" font-size="12" fill="#f2c14e" text-anchor="middle">su dibujo de bolitas vuelve a la parábola — y los dos bordes son las DOS ramas de la misma</text><rect x="20" y="406" width="500" height="180" fill="#1a1216" stroke="#5a2a30"/><text x="270.0" y="432.0" font-family="Georgia,serif" font-size="13" fill="#ff6b6b" text-anchor="middle">trampa 29, declarada antes de calcular</text><text x="270.0" y="458.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">el producto depende SOLO del tamaño de n,</text><text x="270.0" y="476.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">nunca de cómo se factoriza</text><text x="270.0" y="508.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">control en 148.765 primos contra 2 millones</text><text x="270.0" y="530.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">de números cualesquiera:</text><text x="270.0" y="558.0" font-family="Georgia,serif" font-size="16" fill="#ff6b6b" text-anchor="middle">señal / silencio = 0.9991</text><text x="270.0" y="578.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">uno = NADA. No sabe de primalidad. Enterrada.</text><rect x="540" y="406" width="500" height="180" fill="#131826" stroke="#2a3040"/><text x="790.0" y="432.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">pero la parte real, ln², SÍ importa</text><text x="790.0" y="462.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">a · la cota de la Hipótesis:  √x · ln²x / (8π)</text><text x="790.0" y="486.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">b · el denominador de los gemelos:  2C₂ / ln²x</text><text x="790.0" y="510.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">c · una ventana de largo ln²x atrapa ln x primos</text><text x="790.0" y="544.0" font-family="Georgia,serif" font-size="12" fill="#6ee7a0" text-anchor="middle">medido cerca de un millón: 13,7198 primos</text><text x="790.0" y="566.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">contra ln x = 13,8155. La ventana natural.</text><rect x="20" y="602" width="1020" height="102" fill="#131826" stroke="#2a3040"/><text x="530.0" y="628.0" font-family="Georgia,serif" font-size="13" fill="#e8e2d0" text-anchor="middle">LA RESPUESTA CORTA</text><text x="530.0" y="654.0" font-family="Georgia,serif" font-size="12" fill="#f2c14e" text-anchor="middle">da un número COMPLEJO, obligado por el borde izquierdo; parte real ln²(n/2), parte imaginaria π·ln(n/2), y juntas una parábola</text><text x="530.0" y="678.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">el ln² que queda es la forma de la cota de Riemann. Pero el producto en sí no distingue un primo de su vecino, y eso también se dice.</text><text x="530.0" y="698.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">Todavía no.</text></svg>