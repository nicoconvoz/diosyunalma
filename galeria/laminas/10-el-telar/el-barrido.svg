<text x="134.0" y="138.0" font-size="11.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">verde: 3474 ceros · azul: 1517 · celeste: 649</text>
<text x="134.0" y="156.0" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">punteada dorada: el NULO (gaps barajados, media de 200) — la trigonometría sola</text>
<text x="134.0" y="174.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">la banda parda: ±2σ del nulo — casi invisible al lado de la señal</text>
<text x="920.0" y="130.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">LO QUE LA CURVA DICE</text>
<text x="920.0" y="158.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· MONÓTONA en s: cuanto más</text>
<text x="920.0" y="178.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">  apretado el par, más absorción;</text>
<text x="920.0" y="198.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">  cuanto más ancho, más emisión.</text>
<text x="920.0" y="218.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· CRUCE DE SIGNO estable en</text>
<text x="920.0" y="238.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">  s* ≈ 0,8–0,9, presente en las</text>
<text x="920.0" y="258.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">  tres profundidades.</text>
<text x="920.0" y="278.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· MÍNIMO en s ∈ [1,3, 1,6].</text>
<text x="920.0" y="298.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· El EXCEDENTE real−nulo tiene</text>
<text x="920.0" y="318.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">  magnitud ESTABLE con M</text>
<text x="920.0" y="338.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">  (Δ ≈ +0,43 arriba, −0,3 abajo):</text>
<text x="920.0" y="358.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">  crece la σ por datos, no la</text>
<text x="920.0" y="378.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">  física — la distinción de su §14.</text>
<text x="920.0" y="398.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· Todos los bins del fondo a</text>
<text x="920.0" y="418.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">  |z| ≥ 6,3, hasta 34σ.</text>
<text x="920.0" y="470.0" font-size="12.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">HONESTIDAD: la física de fondo</text>
<text x="920.0" y="490.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">es Montgomery/Bogomolny–Keating</text>
<text x="920.0" y="508.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">en teoría; la FORMA —esta curva</text>
<text x="920.0" y="526.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">con este control— es del taller,</text>
<text x="920.0" y="544.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">sin búsqueda bibliográfica aún.</text>
<text x="920.0" y="572.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">s* NO se declara constante:</text>
<text x="920.0" y="590.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">deriva suave con M, pendiente</text>
<text x="920.0" y="608.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">de localización fina (su §13).</text>
<text x="620.0" y="760.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="middle">el desdoblado LOCAL (s por espaciado local, no global) quedó declarado como mejora sobre F365 antes de correr:</text>
<text x="620.0" y="780.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="middle">los ceros bajos tienen gaps anchos por ALTURA, no por soltura — sin corregirlo, la clase «ancho» era también la clase «bajo»</text>
<text x="620.0" y="808.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">malla, períodos, nulos y reglas de decisión congelados antes de la primera medición · semilla 20260821 · su regla de oro cumplida:</text>
<text x="620.0" y="828.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">no se buscó el resultado querido — se midió la curva que los datos quisieron mostrar</text>
<text x="620.0" y="856.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/laformulamadre fase14 · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
</svg>
