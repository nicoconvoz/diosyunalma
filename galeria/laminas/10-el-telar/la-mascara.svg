<text x="600.0" y="50.0" font-size="22.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">🧵🌌 LA MÁSCARA — la geometría de los gemelos, del papel al operador</text>
<text x="600.0" y="76.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">la relación (p+1)/2 = (q−1)/2 la encontró Jesús Nicolás Astorga A MANO, haciendo cuentas con primos</text>
<text x="90.0" y="122.0" font-size="13.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">LAS ANCLAS: a±(p) = (p±1)/2 — y el diccionario entero se vuelve identidad</text>
