<text x="90.0" y="212.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">g=2 comparte el ancla (oro) · g=4 anclas vecinas que se tocan · g&gt;4 deja (g−4)/2 enteros de hueco</text>
<text x="90.0" y="236.0" font-size="12.5" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="start">VERIFICADO sobre los 9590 pares de primos consecutivos ≤ 100000: 1224/1224 · 1215 · 7151 · CERO fallas</text>
<text x="90.0" y="258.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">⟹ la igualdad del capitán es un TEOREMA chico y verdadero: identidad aritmética, no coincidencia visual.</text>
<text x="90.0" y="310.0" font-size="13.0" font-family="Georgia,serif" fill="#7fb2ff" text-anchor="start">LA MÁSCARA RALA (regla congelada antes de todo espectro): signo −1 donde |p_i − p_j| = g</text>
<text x="90.0" y="336.0" font-size="12.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="start">clase                   enlaces    vivos     Σ²(10)      vs azar   vs permutada</text>
<text x="90.0" y="358.0" font-size="12.0" font-family="Consolas,monospace" fill="#dce8f7" text-anchor="start">gemelos g=2                  62      181     15.497       +3,50σ         +0,24σ</text>
<text x="90.0" y="380.0" font-size="12.0" font-family="Consolas,monospace" fill="#dce8f7" text-anchor="start">g=4                          66      185     15.491       +0,03σ         +0,80σ</text>
<text x="90.0" y="402.0" font-size="12.0" font-family="Consolas,monospace" fill="#dce8f7" text-anchor="start">g=6                         114      185     15.738       +0,06σ         +0,15σ</text>
<text x="90.0" y="424.0" font-size="12.0" font-family="Consolas,monospace" fill="#dce8f7" text-anchor="start">S0 sin máscara                0      187     18.335</text>
<text x="90.0" y="458.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">El matiz que la auditora anticipó textualmente: los gemelos le ganan al azar crudo (+3,5σ) pero NO a su</text>
<text x="90.0" y="478.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">permutada por distancia (+0,24σ). Lo que aporta la máscara es EN QUÉ DISTANCIAS caen los gemelos —</text>
<text x="90.0" y="498.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">log p casi iguales ⟹ armónicos vecinos, k ∈ [3,80] — y esa distribución, copiada sin aritmética, rinde igual.</text>
<text x="90.0" y="528.0" font-size="12.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">VEREDICTO: nulo limpio A ESTE TAMAÑO. Con 400 modos la máscara marca 62 de 40740 enlaces (0,15%):</text>
<text x="90.0" y="548.0" font-size="12.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">existe pero casi no toca al operador. La pregunta no muere: queda «NO DECIDIBLE a N=400» — decidirla</text>
<text x="90.0" y="568.0" font-size="12.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">pide un medio más grande (más gemelos adentro), no otra regla. El eco no se corrió, por regla.</text>
<text x="600.0" y="756.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">el hallazgo es del capitán, a mano · la formalización por anclas y los controles emparejados, del taller · R6 absoluto</text>
<text x="600.0" y="780.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/lamascara · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
