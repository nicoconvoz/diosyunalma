<circle cx="380.0" cy="400.0" r="132.0" fill="#05080f" stroke="#ffd98a" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="380.0" y="370.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">acá vive</text>
<text x="380.0" y="390.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">lo que falta</text>
<text x="380.0" y="416.0" font-size="10.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">no-local · determinista</text>
<text x="380.0" y="432.0" font-size="10.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">relacional · densidad viva</text>
<text x="380.0" y="448.0" font-size="10.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">Lyapunov = 1 · sin azar</text>
<text x="380.0" y="474.0" font-size="10.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="middle">adeles · no-local de Suzuki · xp con frontera</text>
<text x="760.0" y="130.0" font-size="15.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">LA PARED DE FUERZA — medida hoy</text>
<text x="760.0" y="160.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Para mover la escalera del Telar</text>
<text x="760.0" y="180.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">(400 modos) hasta los 400 ceros</text>
<text x="760.0" y="200.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">reales, CUALQUIER perturbación</text>
<text x="760.0" y="220.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">necesita, como mínimo matemático:</text>
<text x="760.0" y="258.0" font-size="15.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">‖P‖_F ≥ 7496</text>
<text x="760.0" y="282.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">y el Telar siempre usó F = 30: faltaba un factor 250.</text>
<text x="760.0" y="306.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">El techo de 19× que perseguimos fase tras fase</text>
<text x="760.0" y="324.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">no era del ingenio: era de la CAJA.</text>
<text x="760.0" y="356.0" font-size="13.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">Y separando geometría de estructura fina:</text>
<text x="760.0" y="382.0" font-size="13.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">la fina sola pide ‖P‖_F ≥ 91.4 — TRES veces el presupuesto.</text>
<text x="760.0" y="408.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">⟹ la guitarra no es una caja perturbada:</text>
<text x="760.0" y="428.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">la geometría pedía 250× el presupuesto, y</text>
<text x="760.0" y="448.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">hasta la estructura fina pedía 3× — el</text>
<text x="760.0" y="468.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">mismo factor 3 que persiguió toda la</text>
<text x="760.0" y="488.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">campaña del espejo. Queda como bandera.</text>
<text x="760.0" y="520.0" font-size="13.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">LA SILUETA, EN SEIS TRAZOS</text>
<text x="760.0" y="548.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· la aritmética ES la caja, no la decora</text>
<text x="760.0" y="570.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· densidad que crece con la altura</text>
<text x="760.0" y="592.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· no-local, relacional (enlaces, no sitios)</text>
<text x="760.0" y="614.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· determinista: ni una gota de azar</text>
<text x="760.0" y="636.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· órbitas que no se pegan · Lyapunov 1</text>
<text x="760.0" y="658.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">· el 1/2 sale de la forma, no del decreto</text>
<text x="640.0" y="830.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">cada rayo azul es una hipótesis que entró; cada trazo rosa, su rebote medido con control — el hueco punteado es el molde del nivel C</text>
<text x="640.0" y="856.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/lasilueta · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
</svg>
