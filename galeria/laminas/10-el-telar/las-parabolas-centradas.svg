ddle" font-family="Georgia,serif">el reloj leído de la forma: L medido vs log(γ/2π)</text><line x1="700" y1="460" x2="1010" y2="120" stroke="#3a4050" stroke-dasharray="3,3"/><circle cx="745.0" cy="410.6" r="4" fill="#5ec8ff"/><circle cx="767.1" cy="386.4" r="4" fill="#5ec8ff"/><circle cx="776.7" cy="375.9" r="4" fill="#5ec8ff"/><circle cx="787.6" cy="363.9" r="4" fill="#5ec8ff"/><circle cx="792.0" cy="359.1" r="4" fill="#5ec8ff"/><circle cx="799.4" cy="351.1" r="4" fill="#5ec8ff"/><circle cx="804.1" cy="345.9" r="4" fill="#5ec8ff"/><circle cx="807.3" cy="342.4" r="4" fill="#5ec8ff"/><circle cx="813.0" cy="336.2" r="4" fill="#5ec8ff"/><circle cx="815.0" cy="334.0" r="4" fill="#5ec8ff"/><circle cx="981.6" cy="151.9" r="4" fill="#5ec8ff"/><circle cx="981.6" cy="151.9" r="4" fill="#5ec8ff"/><circle cx="981.7" cy="151.8" r="4" fill="#5ec8ff"/><circle cx="981.8" cy="151.7" r="4" fill="#5ec8ff"/><circle cx="981.8" cy="151.6" r="4" fill="#5ec8ff"/><text x="850" y="488" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">eje x: log(γ/2π) · eje y: −b/a del ajuste cúbico · la diagonal es razón 1</text><text x="30" y="530" font-size="11" fill="#e8e2d0" text-anchor="start" font-family="Georgia,serif">V1 (trampa #11): la separación vertical entre las dos curvas es par por construcción — 0.0e+00, sin mérito.</text><text x="30" y="548" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">V2: la asimetría entre las dos mitades de la MISMA parábola es −2aLx³, y L es el reloj: medido al 1%.</text><text x="30" y="566" font-size="11" fill="#5ec8ff" text-anchor="start" font-family="Georgia,serif">V3: a igual altura, x₊ + x₋ = L·y/a — el eje se inclina con pendiente L/(2a), el único ángulo intrínseco del par.</text><text x="30" y="584" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">V4: con la altura, β se queda en ½ y a vaga cero a cero; lo que crece es la inclinación. Todavía no.</text></svg>