<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 740" width="1060" height="740"><rect width="1060" height="740" fill="#0d1017"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2c14e"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e07a5f"/></marker></defs><text x="530.0" y="40.0" font-family="Georgia,serif" font-size="24" fill="#e8e2d0" text-anchor="middle">EL SIETE DEL CAPITÁN</text><text x="530.0" y="66.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="middle">«2 = 2+2 = 4, 4+4 = 8, 8+8 = 16, 1+6 = 7 · todos dan 7» — y al 3 que se escapaba, le abrió el 12 en dos ramas</text><text x="530.0" y="92.0" font-family="Georgia,serif" font-size="13" fill="#6ee7a0" text-anchor="middle">duplicar una cifra, sumar las de dos: ¿por qué todo primo cae en el 7?</text><rect x="20" y="112" width="500" height="360" fill="#131826" stroke="#2a3040"/><text x="270.0" y="138.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">1 · EL RELOJ DEL 9</text><circle cx="270" cy="300" r="120" fill="none" stroke="#2a3040" stroke-dasharray="3 5"/><line x1="357.1" y1="225.4" x2="377.2" y2="260.1" stroke="#f2c14e" stroke-width="2" marker-end="url(#f)"/><line x1="378.2" y1="296.5" x2="322.0" y2="393.7" stroke="#f2c14e" stroke-width="2" marker-end="url(#f)"/><line x1="301.0" y1="395.4" x2="203.9" y2="227.1" stroke="#f2c14e" stroke-width="2" marker-end="url(#f)"/><line x1="182.9" y1="225.4" x2="162.8" y2="260.1" stroke="#f2c14e" stroke-width="2" marker-end="url(#f)"/><line x1="161.8" y1="296.5" x2="218.0" y2="393.7" stroke="#f2c14e" stroke-width="2" marker-end="url(#f)"/><line x1="239.0" y1="395.4" x2="336.1" y2="227.1" stroke="#f2c14e" stroke-width="2" marker-end="url(#f)"/><line x1="353.9" y1="360.0" x2="188.1" y2="360.0" stroke="#e07a5f" stroke-width="2" marker-end="url(#c)"/><line x1="186.1" y1="360.0" x2="351.9" y2="360.0" stroke="#e07a5f" stroke-width="2" marker-end="url(#c)"/><circle cx="347.1" cy="208.1" r="17" fill="#131826" stroke="#f2c14e"/><text x="347.1" y="214.1" font-family="Georgia,serif" font-size="17" fill="#e8e2d0" text-anchor="middle">1</text><circle cx="388.2" cy="279.2" r="17" fill="#131826" stroke="#f2c14e"/><text x="388.2" y="285.2" font-family="Georgia,serif" font-size="17" fill="#e8e2d0" text-anchor="middle">2</text><circle cx="373.9" cy="360.0" r="17" fill="#131826" stroke="#e07a5f"/><text x="373.9" y="366.0" font-family="Georgia,serif" font-size="17" fill="#e07a5f" text-anchor="middle">3</text><circle cx="311.0" cy="412.8" r="17" fill="#131826" stroke="#f2c14e"/><text x="311.0" y="418.8" font-family="Georgia,serif" font-size="17" fill="#e8e2d0" text-anchor="middle">4</text><circle cx="229.0" cy="412.8" r="17" fill="#131826" stroke="#f2c14e"/><text x="229.0" y="418.8" font-family="Georgia,serif" font-size="17" fill="#e8e2d0" text-anchor="middle">5</text><circle cx="166.1" cy="360.0" r="17" fill="#131826" stroke="#e07a5f"/><text x="166.1" y="366.0" font-family="Georgia,serif" font-size="17" fill="#e07a5f" text-anchor="middle">6</text><circle cx="151.8" cy="279.2" r="17" fill="#6ee7a0" stroke="#f2c14e"/><text x="151.8" y="285.2" font-family="Georgia,serif" font-size="17" fill="#0d1017" text-anchor="middle">7</text><circle cx="192.9" cy="208.1" r="17" fill="#131826" stroke="#f2c14e"/><text x="192.9" y="214.1" font-family="Georgia,serif" font-size="17" fill="#e8e2d0" text-anchor="middle">8</text><circle cx="270.0" cy="180.0" r="17" fill="#131826" stroke="#e07a5f"/><text x="270.0" y="186.0" font-family="Georgia,serif" font-size="17" fill="#e07a5f" text-anchor="middle">9</text><text x="270.0" y="158.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="middle">sumar cifras = el resto por 9 · duplicar = r → 2r</text><text x="270.0" y="450.0" font-family="Georgia,serif" font-size="12" fill="#f2c14e" text-anchor="middle">el 2 recorre las seis caras: 1 → 2 → 4 → 8 → 7 → 5 → 1</text><text x="270.0" y="466.0" font-family="Georgia,serif" font-size="11" fill="#e07a5f" text-anchor="middle">el 3, el 6 y el 9: la cárcel de los múltiplos de 3</text><rect x="540" y="112" width="500" height="360" fill="#131826" stroke="#2a3040"/><text x="790.0" y="138.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">2 · EL TEOREMA (demostrado para todo número)</text><text x="560.0" y="170.0" font-family="Georgia,serif" font-size="14" fill="#e8e2d0" text-anchor="start">(1) Sin ramas, n llega al 7 ⟺ 3 no divide a n.</text><text x="560.0" y="194.0" font-family="Georgia,serif" font-size="14" fill="#e8e2d0" text-anchor="start">(2) Todo primo llega al 7, salvo el 3.</text><text x="560.0" y="218.0" font-family="Georgia,serif" font-size="14" fill="#e8e2d0" text-anchor="start">(3) El 7 no es especial: el 1, 2, 4, 5 y 8, igual.</text><text x="560.0" y="242.0" font-family="Georgia,serif" font-size="14" fill="#6ee7a0" text-anchor="start">(4) Con las ramas del capitán, TODO n ≥ 1 llega.</text><text x="560.0" y="266.0" font-family="Georgia,serif" font-size="14" fill="#e8e2d0" text-anchor="start">(5) En base b, el reloj está completo ⟺</text><text x="560.0" y="290.0" font-family="Georgia,serif" font-size="14" fill="#e8e2d0" text-anchor="start">      el 2 es raíz primitiva módulo b − 1.</text><text x="560.0" y="314.0" font-family="Georgia,serif" font-size="14" fill="#8a8676" text-anchor="start"></text><text x="560.0" y="338.0" font-family="Georgia,serif" font-size="14" fill="#c9c3b0" text-anchor="start">Prueba: 10 = 9 + 1, así que sumar cifras guarda</text><text x="560.0" y="362.0" font-family="Georgia,serif" font-size="14" fill="#c9c3b0" text-anchor="start">el resto por 9, y duplicar lo multiplica por 2.</text><text x="560.0" y="386.0" font-family="Georgia,serif" font-size="14" fill="#c9c3b0" text-anchor="start">Una cifra ES su resto. El 2 genera el reloj del 9;</text><text x="560.0" y="410.0" font-family="Georgia,serif" font-size="14" fill="#c9c3b0" text-anchor="start">el {0, 3, 6} se cierra sobre sí mismo (2·3 = 6, 2·6 ≡ 3).</text><text x="560.0" y="434.0" font-family="Georgia,serif" font-size="14" fill="#e07a5f" text-anchor="start">No es de los primos: lo cumple todo no múltiplo de 3.</text><rect x="20" y="490" width="500" height="230" fill="#131826" stroke="#2a3040"/><text x="270.0" y="516.0" font-family="Georgia,serif" font-size="13" fill="#6ee7a0" text-anchor="middle">3 · LA LLAVE DEL CAPITÁN: LAS RAMAS</text><text x="270.0" y="552.0" font-family="Georgia,serif" font-size="16" fill="#e8e2d0" text-anchor="middle">3 → 6 → 12</text><text x="270.0" y="576.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="middle">el 12 se abre en dos ramas, una por cifra:</text><text x="270.0" y="600.0" font-family="Georgia,serif" font-size="15" fill="#6ee7a0" text-anchor="middle">rama 1: 1 → 2 → 4 → 8 → 16 → 7</text><text x="270.0" y="624.0" font-family="Georgia,serif" font-size="15" fill="#6ee7a0" text-anchor="middle">rama 2: 2 → 4 → 8 → 16 → 7</text><text x="270.0" y="652.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="middle">sumar las cifras del 12 da 3: respeta el resto, no sale de la cárcel</text><text x="270.0" y="672.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="middle">abrirlas en 1 y 2 NO lo respeta: esa es la llave, y es suya</text><text x="270.0" y="700.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="middle">el 6 abre el 12, el 9 abre el 18 (1 y 8): nadie queda preso</text><rect x="540" y="490" width="500" height="230" fill="#131826" stroke="#2a3040"/><text x="790.0" y="516.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">4 · EL EXPERIMENTO, LITERAL, DE 1 A 10.000.000</text><text x="560.0" y="546.0" font-family="Georgia,serif" font-size="13" fill="#e8e2d0" text-anchor="start">0 excepciones al teorema · primos: 664.579, escapa solo [3]</text><text x="560.0" y="568.0" font-family="Georgia,serif" font-size="13" fill="#e8e2d0" text-anchor="start">con ramas llegan todos (a lo sumo 8 pasos; sin ramas, 10)</text><text x="560.0" y="590.0" font-family="Georgia,serif" font-size="13" fill="#e8e2d0" text-anchor="start">reloj completo en las bases [4 6 10 12 14 20 26 28 30 38]</text><text x="560.0" y="618.0" font-family="Georgia,serif" font-size="12" fill="#6ee7a0" text-anchor="start">el puente: ¿en qué parte de los primos p el 2 es raíz primitiva?</text><text x="560.0" y="634.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="start">la conjetura de Artin (abierta; Hooley 1967, si vale Riemann generalizada)</text><line x1="590" y1="659.1" x2="960" y2="659.1" stroke="#f2c14e" stroke-dasharray="4 3"/><text x="964.0" y="663.1" font-family="Georgia,serif" font-size="11" fill="#f2c14e" text-anchor="start">0,37396</text><rect x="610.0" y="655.9" width="60" height="48.1" fill="#6ee7a0" opacity="0.8"/><text x="640.0" y="651.9" font-family="Georgia,serif" font-size="11" fill="#e8e2d0" text-anchor="middle">0,40120</text><text x="640.0" y="716.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">hasta 1.000</text><rect x="730.0" y="658.9" width="60" height="45.1" fill="#6ee7a0" opacity="0.8"/><text x="760.0" y="654.9" font-family="Georgia,serif" font-size="11" fill="#e8e2d0" text-anchor="middle">0,37566</text><text x="760.0" y="716.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">hasta 100.000</text><rect x="850.0" y="659.1" width="60" height="44.9" fill="#6ee7a0" opacity="0.8"/><text x="880.0" y="655.1" font-family="Georgia,serif" font-size="11" fill="#e8e2d0" text-anchor="middle">0,37391</text><text x="880.0" y="716.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">hasta 10.000.000</text></svg>