<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
<rect width="1400" height="950" fill="#0b1526"/>
<rect x="14" y="14" width="1372" height="922" rx="16" fill="none" stroke="#7ee0c0" stroke-width="2" opacity="0.55"/>
<text x="700.0" y="50.0" font-size="25.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">🧵⏳ HILADO FINO — el chequeo de robustez tumbó nuestro propio hallazgo</text>
<text x="700.0" y="76.0" font-size="13.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="middle">la «fase rígida» de la Fase VI era la banda vaciándose. Se retira. Y el reloj de arena sobrevive donde ella no.</text>
<rect x="36.0" y="96.0" width="700.0" height="380.0" rx="10" fill="#0d1830" stroke="#ff9aa8"/>
<text x="51.0" y="121.0" font-size="15.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">A · LA RETRACTACIÓN — cuántos niveles quedan realmente dentro de la banda</text>
<line x1="100.00" y1="400.00" x2="690.00" y2="400.00" stroke="#1d3a63" stroke-width="1.40"/>
<line x1="100.00" y1="160.00" x2="100.00" y2="400.00" stroke="#1d3a63" stroke-width="1.40"/>
<rect x="140.00" y="328.00" width="76.00" height="72.00" fill="#7ee0c0" stroke="#7ee0c0" opacity="0.55"/>
<text x="178.0" y="320.0" font-size="12.5" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="middle">120</text>
<text x="178.0" y="418.0" font-size="11.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">A=15</text>
<rect x="250.00" y="361.60" width="76.00" height="38.40" fill="#7ee0c0" stroke="#7ee0c0" opacity="0.55"/>
<text x="288.0" y="353.6" font-size="12.5" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="middle">64</text>
<text x="288.0" y="418.0" font-size="11.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">A=22</text>
<rect x="360.00" y="383.20" width="76.00" height="16.80" fill="#ff9aa8" stroke="#ff9aa8" opacity="0.55"/>
<text x="398.0" y="375.2" font-size="12.5" font-family="Consolas,monospace" fill="#ff9aa8" text-anchor="middle">28</text>
<text x="398.0" y="418.0" font-size="11.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">A=30</text>
<rect x="470.00" y="394.00" width="76.00" height="6.00" fill="#ff9aa8" stroke="#ff9aa8" opacity="0.55"/>
<text x="508.0" y="386.0" font-size="12.5" font-family="Consolas,monospace" fill="#ff9aa8" text-anchor="middle">10</text>
<text x="508.0" y="418.0" font-size="11.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">A=42</text>
<rect x="580.00" y="396.40" width="76.00" height="3.60" fill="#ff9aa8" stroke="#ff9aa8" opacity="0.55"/>
<text x="618.0" y="388.4" font-size="12.5" font-family="Consolas,monospace" fill="#ff9aa8" text-anchor="middle">6</text>
<text x="618.0" y="418.0" font-size="11.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">A=60</text>
<line x1="100.00" y1="160.00" x2="690.00" y2="160.00" stroke="#7fb2ff" stroke-width="1.40" stroke-dasharray="6 5"/>
<text x="108.0" y="152.0" font-size="11.5" font-family="Georgia,serif" fill="#7fb2ff" text-anchor="start">400 modos: el espectro completo</text>
<line x1="100.00" y1="364.00" x2="690.00" y2="364.00" stroke="#ff9aa8" stroke-width="1.40" stroke-dasharray="4 4"/>
<text x="108.0" y="380.0" font-size="11.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">abajo de acá no hay nada que medir</text>
<text x="56.0" y="436.0" font-size="13.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">en (A,B) = (30,32) sobreviven 28 de 400: el 93% del espectro se fue. El α = 0,313 de la Fase VI</text>
<text x="56.0" y="458.0" font-size="13.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">se midió sobre esas migas. No era una fase del medio — era una banda vaciándose. Queda RETIRADO.</text>
<rect x="752.0" y="96.0" width="612.0" height="380.0" rx="10" fill="#0d1830" stroke="#7fb2ff"/>
<text x="767.0" y="121.0" font-size="15.0" font-family="Georgia,serif" fill="#7fb2ff" text-anchor="start">B · LO QUE SÍ SE PUEDE MEDIR — y ahí no hay rigidez</text>
<text x="780.0" y="150.0" font-size="12.5" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="start">de 15 puntos del mapa, sólo 6 dejan espectro.</text>
<text x="780.0" y="176.0" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7" text-anchor="start">mejor de los medibles: A=15 B=64 → Σ²(10)=46,82</text>
<text x="780.0" y="200.0" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7" text-anchor="start">más rígido medible:   A=22 B=32 → α=1,579</text>
<text x="780.0" y="234.0" font-size="13.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">entre los medibles, α nunca baja de 1,5.</text>
<text x="780.0" y="256.0" font-size="13.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">α = 1 ya es «sin rigidez». No hay fase rígida.</text>
<text x="780.0" y="292.0" font-size="13.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Y hay una lección de método:</text>
<text x="780.0" y="314.0" font-size="12.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">medir Σ² sin contar cuántos niveles quedaron</text>
<text x="780.0" y="334.0" font-size="12.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">es medir la forma del recorte, no la del medio.</text>
<text x="780.0" y="356.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">La Fase VI no reportaba ese número. Ahora sí.</text>
<rect x="780.00" y="382.00" width="552.00" height="62.00" fill="#0d1830" stroke="#7ee0c0" opacity="0.40"/>
<text x="1056.0" y="404.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="middle">el chequeo de robustez que pidió la auditora</text>
<text x="1056.0" y="424.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="middle">es exactamente lo que destapó esto.</text>
<rect x="36.0" y="492.0" width="700.0" height="320.0" rx="10" fill="#0d1830" stroke="#ffd98a"/>
<text x="51.0" y="517.0" font-size="15.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">C · EL RELOJ DE ARENA — c(k) = A·(1 − k/k₀)/k^s, dibujado y medido</text>
<line x1="100.00" y1="620.00" x2="680.00" y2="620.00" stroke="#1d3a63" stroke-width="1.40"/>
<text x="90.0" y="625.0" font-size="11.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="end">0</text>
<path d="M100.00 566.67 L114.87 591.72 L129.74 604.60 L144.62 613.33 L159.49 620.00 L174.36 625.44 L189.23 630.08 L204.10 634.14 L218.97 637.78 L233.85 641.08 L248.72 644.12 L263.59 646.94 L278.46 649.58 L293.33 652.07 L308.21 654.43 L323.08 656.67 L337.95 658.81 L352.82 660.86 L367.69 662.82 L382.56 664.72 L397.44 666.55 L412.31 668.33 L427.18 670.04 L442.05 671.71 L456.92 673.33 L471.79 674.91 L486.67 676.45 L501.54 677.95 L516.41 679.42 L531.28 680.86 L546.15 682.26 L561.03 683.64 L575.90 684.99 L590.77 686.31 L605.64 687.61 L620.51 688.89 L635.38 690.14 L650.26 691.38 L665.13 692.59 L680.00 693.79" fill="none" stroke="#ffd98a" stroke-width="2.60"/>
<circle cx="100.00" cy="566.67" r="3.40" fill="#ffd98a"/>
<circle cx="144.62" cy="613.33" r="3.40" fill="#ffd98a"/>
<circle cx="189.23" cy="630.08" r="3.40" fill="#ffd98a"/>
<circle cx="233.85" cy="641.08" r="3.40" fill="#ffd98a"/>
