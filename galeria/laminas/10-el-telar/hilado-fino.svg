<line x1="159.49" y1="560.00" x2="159.49" y2="680.00" stroke="#ff9aa8" stroke-width="1.60" stroke-dasharray="4 4"/>
<text x="159.5" y="552.0" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="middle">el nodo k₀</text>
<text x="390.0" y="702.0" font-size="11.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">distancia k entre niveles</text>
<text x="56.0" y="722.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">mejor de la familia: k₀=3 s=0.5 → Σ²(10) = 5,304 contra 7,144 sin acoplar (una mejora del 26%)</text>
<text x="56.0" y="744.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">y es el ÚNICO de los dos modelos que deja espectro medible en TODOS sus puntos: la cola larga</text>
<text x="56.0" y="764.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">no vacía la banda. Eso, que no era el objetivo, es lo más sólido que trajo el dibujo del capitán.</text>
<text x="56.0" y="790.0" font-size="12.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">pero el NODO en sí: gana a su gemelo de un solo signo en 2 de 10, y su mejor ganancia es 1.15×.</text>
<rect x="752.0" y="492.0" width="612.0" height="320.0" rx="10" fill="#0d1830" stroke="#7ee0c0"/>
<text x="767.0" y="517.0" font-size="15.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">D · SU ADVERTENCIA (§6): ¿cancela, o sólo alterna?</text>
<text x="780.0" y="546.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">«que c(k) cambie de signo no demuestra que haya</text>
<text x="780.0" y="566.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">cancelación útil». Tenía razón, y lo medimos:</text>
<text x="780.0" y="598.0" font-size="12.5" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="start">Σ c(k) en el mejor caso: -34,63</text>
<text x="780.0" y="620.0" font-size="12.5" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="start">correlación |Σ c(k)| ↔ ganancia: -0,716</text>
<text x="780.0" y="652.0" font-size="12.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">la correlación es fuerte y negativa: cuanto menos</text>
<text x="780.0" y="672.0" font-size="12.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">suma el núcleo, más gana el nodo. Eso apunta a que</text>
<text x="780.0" y="692.0" font-size="12.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">la cancelación global SÍ es el mecanismo.</text>
<text x="780.0" y="722.0" font-size="12.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">PERO gana sólo en 2 de 10 configuraciones. Con esa</text>
<text x="780.0" y="742.0" font-size="12.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">muestra, la correlación sugiere y no demuestra.</text>
<rect x="780.00" y="766.00" width="552.00" height="56.00" fill="#0d1830" stroke="#ffd98a" opacity="0.40"/>
<text x="1056.0" y="788.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">ÉXITO PARCIAL para la familia de cola larga.</text>
<text x="1056.0" y="808.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">El nodo: PENDIENTE, no descartado.</text>
<text x="700.0" y="852.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">R6 limpio · 400 modos · única entrada aritmética Λ(p)/√p · los dos núcleos comparados a igual fuerza total · los ceros: 0,3364</text>
<text x="700.0" y="878.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">el dibujo del reloj de arena es de Jesús Nicolás Astorga · el pedido de hilar fino, de la auditora · las mediciones y la retractación, de este taller</text>
<text x="700.0" y="916.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/hiladofino · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
</svg>
