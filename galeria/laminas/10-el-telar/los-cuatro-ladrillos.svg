<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="34" font-size="21" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LOS CUATRO LADRILLOS — el 2, el 3, el 5 y el 7 partidos</text><text x="530" y="58" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">en el molde del capitán: (a + √d)(a − √d) · dos aceptan el √2 y dos lo rechazan · F402</text><rect x="20" y="86" width="240" height="330" rx="6" fill="#131826" stroke="#6ee7a0" stroke-width="2"/><line x1="20" y1="152" x2="260" y2="152" stroke="#6ee7a0" opacity="0.13"/><line x1="20" y1="218" x2="260" y2="218" stroke="#6ee7a0" opacity="0.13"/><line x1="20" y1="284" x2="260" y2="284" stroke="#6ee7a0" opacity="0.13"/><line x1="20" y1="350" x2="260" y2="350" stroke="#6ee7a0" opacity="0.13"/><text x="140" y="162" font-size="62" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">2</text><text x="140" y="210" font-size="17" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">(2 + √2)</text><text x="140" y="236" font-size="17" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">(2 − √2)</text><line x1="44" y1="256" x2="236" y2="256" stroke="#6ee7a0" opacity="0.3"/><text x="140" y="282" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">3.414213562</text><text x="140" y="302" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">×</text><text x="140" y="322" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">0.585786438</text><text x="140" y="344" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">=</text><text x="140" y="366" font-size="15" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">2.000000</text><text x="140" y="396" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">EL ÁTOMO</text><text x="140" y="412" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">raíz propia y multiplicador 1</text><rect x="276" y="86" width="240" height="330" rx="6" fill="#131826" stroke="#5ec8ff" stroke-width="2"/><line x1="276" y1="152" x2="516" y2="152" stroke="#5ec8ff" opacity="0.13"/><line x1="276" y1="218" x2="516" y2="218" stroke="#5ec8ff" opacity="0.13"/><line x1="276" y1="284" x2="516" y2="284" stroke="#5ec8ff" opacity="0.13"/><line x1="276" y1="350" x2="516" y2="350" stroke="#5ec8ff" opacity="0.13"/><text x="396" y="162" font-size="62" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">3</text><text x="396" y="210" font-size="17" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">(3 + √6)</text><text x="396" y="236" font-size="17" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">(3 − √6)</text><line x1="300" y1="256" x2="492" y2="256" stroke="#5ec8ff" opacity="0.3"/><text x="396" y="282" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">5.449489743</text><text x="396" y="302" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">×</text><text x="396" y="322" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">0.550510257</text><text x="396" y="344" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">=</text><text x="396" y="366" font-size="15" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">3.000000</text><text x="396" y="396" font-size="12" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">RECHAZA el √2</text><text x="396" y="412" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">3 ≡ 3 (mod 8) · pidió √6</text><rect x="532" y="86" width="240" height="330" rx="6" fill="#131826" stroke="#c58bff" stroke-width="2"/><line x1="532" y1="152" x2="772" y2="152" stroke="#c58bff" opacity="0.13"/><line x1="532" y1="218" x2="772" y2="218" stroke="#c58bff" opacity="0.13"/><line x1="532" y1="284" x2="772" y2="284" stroke="#c58bff" opacity="0.13"/><line x1="532" y1="350" x2="772" y2="350" stroke="#c58bff" opacity="0.13"/><text x="652" y="162" font-size="62" fill="#c58bff" text-anchor="middle" font-family="Georgia,serif">5</text><text x="652" y="210" font-size="17" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">(5 + 2√5)</text><text x="652" y="236" font-size="17" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">(5 − 2√5)</text><line x1="556" y1="256" x2="748" y2="256" stroke="#c58bff" opacity="0.3"/><text x="652" y="282" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">9.472135955</text><text x="652" y="302" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">×</text><text x="652" y="322" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">0.527864045</text><text x="652" y="344" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">=</text><text x="652" y="366" font-size="15" fill="#c58bff" text-anchor="middle" font-family="Georgia,serif">5.000000</text><text x="652" y="396" font-size="12" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">RECHAZA el √2</text><text x="652" y="412" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">5 ≡ 5 (mod 8) · pidió √5</text><rect x="788" y="86" width="240" height="330" rx="6" fill="#131826" stroke="#f2c14e" stroke-width="2"/><line x1="788" y1="152" x2="1028" y2="152" stroke="#f2c14e" opacity="0.13"/><line x1="788" y1="218" x2="1028" y2="218" stroke="#f2c14e" opacity="0.13"/><line x1="788" y1="284" x2="1028" y2="284" stroke="#f2c14e" opacity="0.13"/><line x1="788" y1="350" x2="1028" y2="350" stroke="#f2c14e" opacity="0.13"/><text x="908" y="162" font-size="62" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">7</text><text x="908" y="210" font-size="17" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">(3 + √2)</text><text x="908" y="236" font-size="17" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">(3 − √2)</text><line x1="812" y1="256" x2="1004" y2="256" stroke="#f2c14e" opacity="0.3"/><text x="908" y="282" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">4.414213562</text><text x="908" y="302" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">×</text><text x="908" y="322" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">1.585786438</text><text x="908" y="344" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">=</text><text x="908" y="366" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">7.000000</text><text x="908" y="396" font-size="12" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">acepta el √2</text><text x="908" y="412" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">7 ≡ 7 (mod 8)</text><rect x="20" y="436" width="1020" height="184" fill="#131826" stroke="#2a3040"/><text x="530" y="464" font-size="14" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">por qué dos aceptan y dos rechazan</text><text x="70" y="500" font-size="12" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">el 2 y el 7 entran en el molde de √2</text><text x="70" y="522" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">el 2 ramifica (usa su propia raíz), el 7 deja resto 7 al dividir por 8</text><text x="70" y="556" font-size="12" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">el 3 y el 5 NO pueden entrar — y no es que no buscamos</text><text x="70" y="578" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">se barrieron 2.000 valores sin un acierto: a² − 2b² jamás da ≡ 3 o 5 (mod 8)</text><text x="70" y="600" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">tuvieron que pedir prestada otra raíz, y cada uno pidió la suya</text><text x="1000" y="556" font-size="11" fill="#6ee7a0" text-anchor="end" font-family="Georgia,serif">El 2 es el único con raíz propia Y multiplicador 1.</text><text x="1000" y="578" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">El 5 también usa la suya, pero necesita un b = 2.</text><text x="1000" y="604" font-size="10" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">Gauss 1832 · Todavía no.</text></svg>