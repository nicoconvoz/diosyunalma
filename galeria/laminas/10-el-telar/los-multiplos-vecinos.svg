<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LOS MÚLTIPLOS VECINOS — lo que vio el capitán</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">los dos números del par son múltiplos del mismo primo, con cofactores pegados · F404</text><rect x="20" y="76" width="1020" height="186" fill="#121a16" stroke="#2a5a40"/><text x="530" y="102" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">SU OBSERVACIÓN</text><text x="150" y="140" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">4  y  2</text><text x="150" y="168" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">2×2    y    2×1</text><text x="150" y="196" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">cofactores 2 y 1</text><text x="150" y="216" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">vecinos ✓</text><text x="395" y="140" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">9  y  6</text><text x="395" y="168" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">3×3    y    3×2</text><text x="395" y="196" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">cofactores 3 y 2</text><text x="395" y="216" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">vecinos ✓</text><text x="640" y="140" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">25  y  20</text><text x="640" y="168" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">5×5    y    5×4</text><text x="640" y="196" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">cofactores 5 y 4</text><text x="640" y="216" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">vecinos ✓</text><text x="885" y="140" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">49  y  56</text><text x="885" y="168" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">7×7    y    7×8</text><text x="885" y="196" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">cofactores 7 y 8</text><text x="885" y="216" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">vecinos ✓</text><text x="530" y="246" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">los dos son múltiplos del mismo primo, y sus cofactores están pegados — siempre</text><rect x="20" y="278" width="500" height="180" fill="#131826" stroke="#2a3040"/><text x="270" y="304" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">por qué funciona: sacar el primo afuera</text><text x="270" y="348" font-size="17" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">p·k − p·(k−1)</text><text x="270" y="378" font-size="15" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">= p · [k − (k−1)]</text><text x="270" y="408" font-size="17" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">= p · 1 = p</text><text x="270" y="440" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">dos múltiplos vecinos se llevan p de diferencia</text><rect x="540" y="278" width="500" height="180" fill="#1a1216" stroke="#5a2a30"/><text x="790" y="304" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">y por eso la trampa de ayer</text><text x="790" y="338" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">el 100 % contra el 100 % no era misterio:</text><text x="790" y="364" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">la identidad es LA DEFINICIÓN DE MÚLTIPLO</text><text x="790" y="398" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">y el 4, el 6 y el 100 tienen múltiplos</text><text x="790" y="420" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">vecinos igual que cualquier primo</text><text x="790" y="446" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">ahora la trampa tiene su porqué adentro</text><rect x="20" y="474" width="1020" height="166" fill="#131826" stroke="#2a3040"/><text x="530" y="500" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LO QUE NO HABÍAMOS MEDIDO: no hay UNA forma, hay INFINITAS</text><text x="530" y="528" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">si la clave son dos múltiplos vecinos, se pueden elegir otros — y funciona igual</text><text x="120" y="560" font-size="14" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">el 2</text><text x="220" y="560" font-size="13" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">(2 ± √2)   ·   (4 ± √14)   ·   (6 ± √34)   ·   (8 ± √62)   ·   …</text><text x="120" y="592" font-size="14" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">el 7</text><text x="220" y="592" font-size="13" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">(7 ± √42)  ·   (14 ± √189) ·   (21 ± √434) ·   (28 ± √777) ·   …</text><text x="530" y="626" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">un patrón que le da infinitas formas a cada entero no puede señalar a ninguno. Todavía no.</text></svg>