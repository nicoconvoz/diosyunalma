<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 740" width="1060" height="740"><rect width="1060" height="740" fill="#0d1017"/><text x="530.0" y="40.0" font-family="Georgia,serif" font-size="24" fill="#e8e2d0" text-anchor="middle">EL ZOOM DEL MURCIÉLAGO</text><text x="530.0" y="66.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="middle">«comprimí, y después ensanchá con la inversa sobre un punto donde el murciélago detecte un barrio — y ahí sí hallaremos cosas»</text><text x="530.0" y="92.0" font-family="Georgia,serif" font-size="13" fill="#6ee7a0" text-anchor="middle">¿puede un atlas comprimido y de baja resolución APUNTAR a un blanco que él mismo no puede resolver?</text><rect x="20" y="112" width="333" height="150" fill="#131826" stroke="#2a3040"/><text x="186.0" y="140.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">1 · COMPRIMIR</text><text x="186.0" y="176.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">4508 ceros → TRES constantes</text><text x="186.0" y="206.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">el ajuste ciego de F214, base t·ln(t/2π), t, 1</text><text x="360.0" y="190.0" font-family="Georgia,serif" font-size="20" fill="#5a6070" text-anchor="middle">→</text><rect x="367" y="112" width="333" height="150" fill="#131826" stroke="#2a3040"/><text x="533.0" y="140.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">2 · EL MURCIÉLAGO</text><text x="533.0" y="176.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">donde el conteo CAE bajo la ley</text><text x="533.0" y="206.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">no ve el objeto: oye que FALTA algo</text><text x="707.0" y="190.0" font-family="Georgia,serif" font-size="20" fill="#5a6070" text-anchor="middle">→</text><rect x="714" y="112" width="333" height="150" fill="#131826" stroke="#2a3040"/><text x="880.0" y="140.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">3 · ENSANCHAR</text><text x="880.0" y="176.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">la inversa N⁻¹(n) da la dirección</text><text x="880.0" y="206.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">zoom fino solo en el barrio cantado</text><rect x="20" y="278" width="500" height="182" fill="#131826" stroke="#2a3040"/><text x="270.0" y="304.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">el objeto comprimido: 24 bytes · ajuste CIEGO</text><text x="70.0" y="336.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="start">constante</text><text x="330.0" y="336.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="end">a ciegas</text><text x="480.0" y="336.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="end">teórica</text><text x="70.0" y="362.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="start">a</text><text x="330.0" y="362.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">0.159155</text><text x="480.0" y="362.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">0,159155</text><text x="70.0" y="388.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="start">b</text><text x="330.0" y="388.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">-0.159154</text><text x="480.0" y="388.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">−0,159155</text><text x="70.0" y="414.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="start">c</text><text x="330.0" y="414.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">0.874955</text><text x="480.0" y="414.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">0,875000</text><text x="270.0" y="444.0" font-family="Georgia,serif" font-size="11" fill="#6ee7a0" text-anchor="middle">razón 1502 a 1 sobre 4520 ceros · el 7/8 sale a 4,5×10⁻⁵ (F214 lo tenía a 0,032)</text><rect x="540" y="278" width="500" height="182" fill="#0f1a14" stroke="#2a5a40"/><text x="790.0" y="304.0" font-family="Georgia,serif" font-size="13" fill="#6ee7a0" text-anchor="middle">RECUPERACIÓN Y ENRIQUECIMIENTO</text><text x="790.0" y="338.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="middle">barrios cantados por el murciélago: 0.333 ceros perdidos c/u</text><text x="790.0" y="364.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="middle">barrios al azar, mismo ancho:       0.000</text><text x="790.0" y="406.0" font-family="Georgia,serif" font-size="24" fill="#f2c14e" text-anchor="middle">enriquecimiento = 46.2×</text><text x="790.0" y="438.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">10 de 12 ceros perdidos, mirando el 1,81 % del rango</text><rect x="20" y="476" width="500" height="140" fill="#131826" stroke="#2a3040"/><text x="270.0" y="502.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">el ahorro, que es lo único que hace valer un atlas</text><text x="270.0" y="546.0" font-family="Georgia,serif" font-size="30" fill="#6ee7a0" text-anchor="middle">9× menos trabajo</text><text x="270.0" y="580.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">crudo + zooms dirigidos, contra barrer todo fino</text><text x="270.0" y="602.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">y encontrando los mismos pares apretados</text><rect x="540" y="476" width="500" height="140" fill="#131826" stroke="#2a3040"/><text x="790.0" y="502.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">¿y qué hay adentro del barrio?</text><text x="790.0" y="532.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">los pares más apretados del tramo (espaciado normalizado):</text><text x="790.0" y="560.0" font-family="Georgia,serif" font-size="13" fill="#6ee7a0" text-anchor="middle">0.0890   0.0946   0.1105   0.1112   0.1249   </text><text x="790.0" y="588.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">pares de Lehmer: ceros que casi se tocan —</text><text x="790.0" y="606.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">los que el crudo perdía y el murciélago mandó a buscar</text><rect x="20" y="632" width="1020" height="90" fill="#1a1216" stroke="#5a2a30"/><text x="530.0" y="658.0" font-family="Georgia,serif" font-size="12" fill="#ff6b6b" text-anchor="middle">trampa 30: sería circular marcar con un detector que YA vio el par. Acá el detector se arma solo con el barrido crudo, que por construcción NO puede resolverlos.</text><text x="530.0" y="682.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">la parte suave es Riemann-von Mangoldt; el ajuste ciego es Weyl vía F214; el zoom multi-resolución es de manual. Lo propio es medirlo con un control que podía fallar.</text><text x="530.0" y="708.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">y esto no demuestra nada de la Hipótesis: es CARTOGRAFÍA. Todavía no.</text></svg>