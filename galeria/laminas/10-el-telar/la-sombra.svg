<text x="850.0" y="192.0" font-size="11.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">beta(A/log p) = 0.387</text>
<text x="850.0" y="218.0" font-size="11.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">S0 · purificado</text>
<text x="850.0" y="234.0" font-size="11.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">eco -1.3 σ · niveles 128</text>
<text x="850.0" y="250.0" font-size="11.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">beta(A/log p) = 0.412</text>
<text x="850.0" y="276.0" font-size="11.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">ORDENADO 3× (q=0,02)</text>
<text x="850.0" y="292.0" font-size="11.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">eco -1.2 σ · niveles 170</text>
<text x="850.0" y="308.0" font-size="11.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">beta(A/log p) = 0.409</text>
<text x="850.0" y="334.0" font-size="11.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">ORDENADO · purificado</text>
<text x="850.0" y="350.0" font-size="11.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">eco -1.3 σ · niveles 161</text>
<text x="850.0" y="366.0" font-size="11.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">beta(A/log p) = 0.404</text>
<text x="850.0" y="400.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">la relación 1/2 exige beta = 0,500</text>
<text x="600.0" y="716.0" font-size="11.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">el eco en los primos existe en TODOS los brazos: es el esqueleto (tautológico desde la Fase IV), no un hallazgo.</text>
<text x="600.0" y="736.0" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/lasombra · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
