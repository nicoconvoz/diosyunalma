<text x="118.0" y="136.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">azul: esqueleto sin ordenar · verde: el patrón que ordena 3×</text>
<text x="850.0" y="130.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">LO MEDIDO</text>
<text x="850.0" y="160.0" font-size="11.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">S0 · sin ordenar</text>
