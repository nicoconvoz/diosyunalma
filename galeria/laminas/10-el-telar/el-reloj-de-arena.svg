<text x="56.0" y="768.0" font-size="13.0" font-family="Georgia,serif" fill="#7fb2ff" text-anchor="start">azul y verde: los dos puntos. Se acercan, se TOCAN en R5, y siguen — ahora cada uno del otro lado.</text>
<text x="56.0" y="790.0" font-size="13.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">la flecha de R6 apunta al revés porque los roles se INTERCAMBIARON, no porque se haya elegido un signo.</text>
<rect x="756.0" y="104.0" width="608.0" height="706.0" rx="10" fill="#0d1830" stroke="#7ee0c0"/>
<text x="772.0" y="130.0" font-size="15.0" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">CÓMO LO LEEMOS ACÁ (lectura nuestra, no afirmación suya)</text>
<text x="778.0" y="150.0" font-size="14.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">1 · Eso es un NODO.</text>
<text x="778.0" y="174.0" font-size="13.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">Una cantidad que se hace exactamente cero y CAMBIA DE SIGNO.</text>
<text x="778.0" y="194.0" font-size="13.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">El vuelco de R6 no es una elección: es lo que pasa después de un cero.</text>
<line x1="800.00" y1="307.00" x2="1320.00" y2="307.00" stroke="#1d3a63" stroke-width="1.40"/>
<text x="792.0" y="312.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="end">0</text>
<path d="M800.00 240.00 L865.00 256.49 L930.00 272.47 L995.00 287.93 L1060.00 307.00 L1125.00 326.07" fill="none" stroke="#ffd98a" stroke-width="2.60"/>
<path d="M1125.00 326.07 L1190.00 341.53 L1255.00 357.51 L1320.00 374.00" fill="none" stroke="#ffd98a" stroke-width="1.80" stroke-dasharray="7 6"/>
<circle cx="800.00" cy="240.00" r="4.60" fill="#ffd98a"/>
<text x="800.0" y="400.0" font-size="10.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">R1</text>
<circle cx="865.00" cy="256.49" r="4.60" fill="#ffd98a"/>
<text x="865.0" y="400.0" font-size="10.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">R2</text>
<circle cx="930.00" cy="272.47" r="4.60" fill="#ffd98a"/>
<text x="930.0" y="400.0" font-size="10.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">R3</text>
<circle cx="995.00" cy="287.93" r="4.60" fill="#ffd98a"/>
<text x="995.0" y="400.0" font-size="10.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">R4</text>
<circle cx="1060.00" cy="307.00" r="4.60" fill="#ffd98a"/>
<text x="1060.0" y="400.0" font-size="10.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">R5</text>
<circle cx="1125.00" cy="326.07" r="4.60" fill="#ffd98a"/>
<text x="1125.0" y="400.0" font-size="10.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">R6</text>
<circle cx="1190.00" cy="341.53" r="4.60" fill="#8fb4d9"/>
<text x="1190.0" y="400.0" font-size="10.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">R7</text>
<circle cx="1255.00" cy="357.51" r="4.60" fill="#8fb4d9"/>
<text x="1255.0" y="400.0" font-size="10.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">R8</text>
<circle cx="1320.00" cy="374.00" r="4.60" fill="#8fb4d9"/>
<text x="1320.0" y="400.0" font-size="10.5" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">R9</text>
<circle cx="1060.00" cy="307.00" r="8.00" fill="none" stroke="#ff9aa8" stroke-width="2.40"/>
<text x="1060.0" y="226.0" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="middle">el nodo</text>
<text x="778.0" y="428.0" font-size="14.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">2 · Y su forma hace una PREDICCIÓN.</text>
<text x="778.0" y="452.0" font-size="13.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">Si de verdad es un reloj de arena, la mitad que falta no es libre:</text>
<text x="798.0" y="478.0" font-size="13.0" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="start">R7 espeja a R3   ·   R8 espeja a R2   ·   R9 espeja a R1</text>
<text x="778.0" y="504.0" font-size="13.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">Eso se puede dibujar, y se puede desmentir. Un dibujo que predice</text>
<text x="778.0" y="524.0" font-size="13.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">es mucho más que un dibujo.</text>
<text x="778.0" y="566.0" font-size="14.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">3 · Por qué nos importa acá.</text>
<text x="778.0" y="590.0" font-size="13.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">La Fase VI dejó pidiendo un núcleo que dé ALCANCE sin diluir la fuerza.</text>
<text x="778.0" y="610.0" font-size="13.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">Un núcleo con un NODO hace justo eso: las contribuciones lejanas se</text>
<text x="778.0" y="630.0" font-size="13.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">CANCELAN en vez de sumarse, así que el alcance no cuesta empuje.</text>
<rect x="778" y="654" width="564" height="132" rx="9" fill="#0d1830" stroke="#7fb2ff" opacity="0.45"/>
<text x="1060.0" y="682.0" font-size="13.0" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="middle">c_k  con  c_5 = 0  y  c_k&gt;5 de signo opuesto</text>
<text x="1060.0" y="708.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">un núcleo de alcance con un cero en el medio: eso es su reloj de arena</text>
<text x="1060.0" y="730.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">traducido a la única cosa que la Fase VI todavía no probó.</text>
<text x="1060.0" y="756.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="middle">No está medido. Es lo próximo que hay que medir, y sale de su dibujo.</text>
<text x="1060.0" y="776.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">(y el nodo en el MEDIO, no en el primer vecino: eso era mi lectura equivocada)</text>
<text x="700.0" y="848.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">el dibujo y su descripción son de Jesús Nicolás Astorga · la copia limpia y la lectura, de este taller · la lectura queda como pregunta, no como hallazgo</text>
<text x="700.0" y="892.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/eldibujodelcapitan · Todavía no.</text>
</svg>
