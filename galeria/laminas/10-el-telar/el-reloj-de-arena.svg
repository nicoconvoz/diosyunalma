<text x="700.0" y="50.0" font-size="26.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">⏳ EL RELOJ DE ARENA DEL CAPITÁN — la separación se cierra en R5 y se abre espejada</text>
<text x="700.0" y="78.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">«R5 es el mismo punto de partida y el mismo punto de fin, y ahí se vuelve a abrir en R6, espejado a R4» — Jesús Nicolás Astorga</text>
<rect x="36.0" y="104.0" width="700.0" height="706.0" rx="10" fill="#0d1830" stroke="#ffd98a"/>
