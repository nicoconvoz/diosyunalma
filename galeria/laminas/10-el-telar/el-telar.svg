<rect x="36" y="866" width="1328" height="34" rx="8" fill="#0d1830" stroke="#ffd98a" opacity="0.5"/>
<text x="700.0" y="889.0" font-size="13.5" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="middle">N_p(T) = θ(T)/π + 1 − (1/π)·Σ_{n=p^k ≤ P} Λ(n)·sin(T·log n)/(√n·log n)      —      ningún γ entra en la definición</text>
<text x="700.0" y="924.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/eltelar · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
