<text x="124.0" y="130.0" font-size="11.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">verde: REAL (3474 ceros)</text>
<text x="124.0" y="148.0" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">dorado: N = 99991 (la formula mas completa)</text>
<text x="124.0" y="166.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">rosa: N = 9973</text>
<text x="124.0" y="184.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">celeste: N = 97 (donde arranco la campana)</text>
<text x="450.0" y="610.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">s = gap / espaciado medio local</text>
<text x="820.0" y="130.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">LA ESCALERA DE LA CAMPANA</text>
<text x="820.0" y="158.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">XVI: mover tamanos - un tercio</text>
<text x="820.0" y="178.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">XVII: mover posiciones - menos</text>
<text x="820.0" y="198.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">XVIII: juntos - el doble</text>
<text x="820.0" y="218.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">XIX: rigidez externa - muerta</text>
<text x="820.0" y="238.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">XX: quitar todo el ruido y</text>
<text x="820.0" y="258.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">completar la formula.</text>
<text x="820.0" y="300.0" font-size="13.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">LAS TRES CONVERGENCIAS BUSCADAS</text>
<text x="820.0" y="328.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">amplitud: 0,285 hacia 0,346</text>
<text x="820.0" y="348.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">cruce: 0,94 hacia 0,862</text>
<text x="820.0" y="368.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">espaciados: quietos en 0,42</text>
<text x="820.0" y="388.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">mas T4 hacia 0,267.</text>
<text x="820.0" y="408.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Los numeros por escalon estan</text>
<text x="820.0" y="428.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">en el acta. Y la regla del 16:</text>
<text x="820.0" y="448.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">si las tres convergen, FRENAR</text>
<text x="820.0" y="468.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">y AUDITAR - no interpretar.</text>
<text x="620.0" y="710.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">esta fase no agrega una teoria: quita ruido y deja hablar a la formula - la auditora</text>
<text x="620.0" y="736.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/laformulamadre fase20 - estructura cerrada no es hipotesis demostrada - Todavia no.</text>
