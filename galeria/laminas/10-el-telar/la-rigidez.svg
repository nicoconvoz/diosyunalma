<text x="124.0" y="130.0" font-size="11.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">verde: REAL (3474 ceros)</text>
<text x="124.0" y="148.0" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">dorado: RIGIDO + campo (la hipotesis de esta fase)</text>
<text x="124.0" y="166.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">rosa: paseo + campo (Fase XVIII)</text>
<text x="124.0" y="184.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">celeste: rigido + campo con FASE ROTA (control asesino)</text>
<text x="450.0" y="620.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">s = gap / espaciado medio local</text>
<text x="820.0" y="130.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">EL MATERIAL NUEVO</text>
<text x="820.0" y="158.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">ensamble tridiagonal de Hermite</text>
<text x="820.0" y="178.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">(beta = 2): autovalores GUE</text>
<text x="820.0" y="198.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">EXACTOS, desplegados por la</text>
<text x="820.0" y="218.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">semicircular, solo el interior.</text>
<text x="820.0" y="238.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Varianza de conteo en L=10:</text>
<text x="820.0" y="258.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">paseo ~1,8 - rigido ~0,6 - la</text>
<text x="820.0" y="278.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">rigidez de largo alcance que el</text>
<text x="820.0" y="298.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">paseo browniano no tenia.</text>
<text x="820.0" y="350.0" font-size="13.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">EL JUICIO</text>
<text x="820.0" y="378.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">cruce rigido: 0.91/0.87/0.85</text>
<text x="820.0" y="398.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">cruce real: 0.862</text>
<text x="820.0" y="418.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">amplitudes, T4, espaciados,</text>
<text x="820.0" y="438.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">residuo y veredicto: en el acta.</text>
<text x="820.0" y="470.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">la brujula de la auditora:</text>
<text x="820.0" y="490.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">no aumentar la fuerza -</text>
<text x="820.0" y="510.0" font-size="12.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">cambiar la dinamica.</text>
<text x="620.0" y="730.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">XVI tamanos - XVII posiciones - XVIII juntos - XIX el material: la pregunta ya no es la fuerza, es que recibe la fuerza</text>
<text x="620.0" y="756.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/laformulamadre fase19 - estructura cerrada no es hipotesis demostrada - Todavia no.</text>
</svg>
