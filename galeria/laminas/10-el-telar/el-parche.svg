<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="620" viewBox="0 0 1060 620"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="34" font-size="21" fill="#e8e2d4" text-anchor="middle" font-family="Georgia,serif">EL PARCHE — el tambor sometido a los controles de la relojera</text><text x="530" y="56" font-size="12" fill="#8a93a6" text-anchor="middle" font-family="Georgia,serif">Prueba 10: tres señales · Prueba 11: conjuntos falsos · la amplitud no es ajuste: es Λ(m)/(2√m·ln m), producto de Euler</text><text x="260" y="100" font-size="14" fill="#e8e2d4" text-anchor="middle" font-family="Georgia,serif">Prueba 10 · R² de reconstrucción</text><rect x="60" y="140" width="330.4" height="42" fill="#6aa9ff" opacity="0.85"/><text x="60" y="132" font-size="12" fill="#c7cdd9" text-anchor="start" font-family="Georgia,serif">todos los enteros (39 tonos)</text><text x="400" y="167" font-size="14" fill="#e8e2d4" text-anchor="start" font-family="Georgia,serif">0.4990</text><rect x="60" y="230" width="330.6" height="42" fill="#c9b458" opacity="0.85"/><text x="60" y="222" font-size="12" fill="#c7cdd9" text-anchor="start" font-family="Georgia,serif">primos y potencias (19)</text><text x="401" y="257" font-size="14" fill="#e8e2d4" text-anchor="start" font-family="Georgia,serif">0.4993</text><rect x="60" y="320" width="306.8" height="42" fill="#7ee0c0" opacity="0.85"/><text x="60" y="312" font-size="12" fill="#c7cdd9" text-anchor="start" font-family="Georgia,serif">solo primos (12)</text><text x="377" y="347" font-size="14" fill="#e8e2d4" text-anchor="start" font-family="Georgia,serif">0.4632</text><text x="260" y="430" font-size="12" fill="#8a93a6" text-anchor="middle" font-family="Georgia,serif">duplicar tonos con TODOS los compuestos</text><text x="260" y="448" font-size="12" fill="#8a93a6" text-anchor="middle" font-family="Georgia,serif">suma apenas -0.0003 de R²</text><rect x="560" y="110" width="440" height="360" fill="#11151f" stroke="#232a3a"/><text x="7