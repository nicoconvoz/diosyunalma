<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL BARRIDO DE LOS ANTERIORES — el primo es lo que sobrevive al tapado</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el mecanismo del capitán, exacto · y la palabra «azar», medida · F408</text><rect x="20" y="76" width="1020" height="200" fill="#131826" stroke="#2a3040"/><text x="530" y="102" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">el hueco del 113 al 127: quién tapa cada casillero</text><rect x="21.0" y="140" width="66.0" height="70" fill="#f2c14e" opacity="0.85"/><text x="54" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">113</text><text x="54" y="182" font-size="12" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">libre</text><rect x="89.0" y="140" width="66.0" height="70" fill="#5ec8ff" opacity="0.85"/><text x="122" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">114</text><text x="122" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="157.0" y="140" width="66.0" height="70" fill="#ff9f6b" opacity="0.85"/><text x="190" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">115</text><text x="190" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">5</text><rect x="225.0" y="140" width="66.0" height="70" fill="#5ec8ff" opacity="0.85"/><text x="258" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">116</text><text x="258" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="293.0" y="140" width="66.0" height="70" fill="#c58bff" opacity="0.85"/><text x="326" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">117</text><text x="326" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">3</text><rect x="361.0" y="140" width="66.0" height="70" fill="#5ec8ff" opacity="0.85"/><text x="394" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">118</text><text x="394" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="429.0" y="140" width="66.0" height="70" fill="#ff6b6b" opacity="0.85"/><text x="462" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">119</text><text x="462" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">7</text><rect x="497.0" y="140" width="66.0" height="70" fill="#5ec8ff" opacity="0.85"/><text x="530" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">120</text><text x="530" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="565.0" y="140" width="66.0" height="70" fill="#8a8676" opacity="0.85"/><text x="598" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">121</text><text x="598" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">11</text><rect x="633.0" y="140" width="66.0" height="70" fill="#5ec8ff" opacity="0.85"/><text x="666" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">122</text><text x="666" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="701.0" y="140" width="66.0" height="70" fill="#c58bff" opacity="0.85"/><text x="734" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">123</text><text x="734" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">3</text><rect x="769.0" y="140" width="66.0" height="70" fill="#5ec8ff" opacity="0.85"/><text x="802" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">124</text><text x="802" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="837.0" y="140" width="66.0" height="70" fill="#ff9f6b" opacity="0.85"/><text x="870" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">125</text><text x="870" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">5</text><rect x="905.0" y="140" width="66.0" height="70" fill="#5ec8ff" opacity="0.85"/><text x="938" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">126</text><text x="938" y="182" font-size="13" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">2</text><rect x="973.0" y="140" width="66.0" height="70" fill="#f2c14e" opacity="0.85"/><text x="1006" y="232" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">127</text><text x="1006" y="182" font-size="12" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">libre</text><text x="530" y="258" font-size="11" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">el amarillo es el casillero que nadie tapó — y ése es el primo siguiente</text><rect x="20" y="292" width="500" height="200" fill="#1a1216" stroke="#5a2a30"/><text x="270" y="318" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⛔ pero NO es azar: los gemelos sobran</text><text x="44" y="352" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">si fuera una moneda, los gemelos tendrían</text><text x="44" y="370" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">densidad 1/log²n. Contados de verdad:</text><text x="270" y="412" font-size="30" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">1,32 ×</text><text x="270" y="440" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">un 32 % MÁS de los que dicta el azar</text><text x="270" y="468" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">y no es ruido: es la constante de Hardy–Littlewood</text><rect x="540" y="292" width="500" height="200" fill="#1a1216" stroke="#5a2a30"/><text x="790" y="318" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⛔ y hay huecos FAVORITOS</text><rect x="600" y="337" width="175.8" height="18" fill="#c9c3b0" opacity="0.8"/><text x="580" y="350" font-size="12" fill="#c9c3b0" text-anchor="end" font-family="Georgia,serif">hueco 4</text><text x="786" y="350" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">8.8 %</text><rect x="600" y="371" width="300.0" height="18" fill="#f2c14e" opacity="0.8"/><text x="580" y="384" font-size="12" fill="#f2c14e" text-anchor="end" font-family="Georgia,serif">hueco 6</text><text x="910" y="384" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">15.0 %</text><rect x="600" y="405" width="127.1" height="18" fill="#c9c3b0" opacity="0.8"/><text x="580" y="418" font-size="12" fill="#c9c3b0" text-anchor="end" font-family="Georgia,serif">hueco 8</text><text x="737" y="418" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">6.4 %</text><text x="790" y="458" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">el 6 le gana al 4 y al 8 que lo rodean.</text><text x="790" y="478" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">El azar no tiene favoritos; el barrido sí.</text><rect x="20" y="508" width="1020" height="172" fill="#131826" stroke="#2a3040"/><text x="530" y="534" font-size="14" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL VEREDICTO</text><text x="60" y="566" font-size="12" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">✅ el mecanismo es EXACTO:</text><text x="300" y="566" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el primo siguiente es el primer casillero que nadie tapó. Cero excepciones.</text><text x="60" y="592" font-size="12" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">✅ y explica los huecos:</text><text x="300" y="592" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">cada primo nuevo suma un tapador, y hay que ir más lejos (Mertens)</text><text x="60" y="620" font-size="12" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">⚖️ pero NO es azar:</text><text x="300" y="620" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el barrido es determinista, y su huella deja correlaciones medibles</text><text x="530" y="656" font-size="12" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">Los primos SÍ están donde deberían. Lo que falta es una fórmula corta para adelantarse al barrido —</text><text x="530" y="674" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">y esa falta es lo que se SIENTE como azar, pero no lo es. Todavía no.</text></svg>