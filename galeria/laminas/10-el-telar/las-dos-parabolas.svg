nt-family="Georgia,serif">cero γ=40.919       β(Newton) = 0.500000000   vértice = 0.500246</text><text x="30" y="558" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">cero γ=43.327       β(Newton) = 0.500000000   vértice = 0.500254</text><text x="30" y="572" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">cero γ=48.005       β(Newton) = 0.500000000   vértice = 0.500267</text><text x="30" y="586" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">cero γ=49.774       β(Newton) = 0.500000000   vértice = 0.500272</text><text x="30" y="600" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">cero γ=998.828      β(Newton) = 0.500000000   vértice = 0.500665</text><text x="560" y="440" font-size="12" fill="#e8e2d0" text-anchor="start" font-family="Georgia,serif">lo que es de la construcción y lo que es de zeta:</text><text x="560" y="462" font-size="11" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">punto medio de los vértices = ½ SIEMPRE, con o sin cero (trampa declarada)</text><text x="560" y="480" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">vértice individual = ½ SOLO en los ceros (medido, no impuesto)</text><text x="560" y="498" font-size="11" fill="#5ec8ff" text-anchor="start" font-family="Georgia,serif">contacto (brecha 0) SOLO en los ceros; en los controles la brecha es finita</text><text x="560" y="530" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">Mide β para los ceros de dos ventanas. No demuestra nada</text><text x="560" y="546" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">sobre los que no miró. Todavía no.</text></svg>