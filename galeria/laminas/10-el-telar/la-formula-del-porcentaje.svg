<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LA FÓRMULA DEL PORCENTAJE — te da el barrio, no la casa</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el porcentaje de primos ES 1/ln x, y de ahí sale una fórmula que funciona · F413</text><rect x="20" y="76" width="1020" height="146" fill="#121a16" stroke="#2a5a40"/><text x="530" y="102" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">LA FÓRMULA QUE PEDISTE, para usar</text><text x="530" y="152" font-size="24" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">p_n  ≈  n · ( ln n + ln ln n − 1 + (ln ln n − 2)/ln n )</text><text x="530" y="186" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">el primo número n, con error de menos del 0,05 % a partir de n = 10.000</text><text x="530" y="208" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">sale del porcentaje 1/ln x, que es el teorema del número primo (1896) afinado por Cipolla (1902)</text><rect x="20" y="238" width="500" height="232" fill="#131826" stroke="#2a3040"/><text x="270" y="264" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">y funciona: lo real contra lo predicho</text><text x="50" y="296" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">n</text><text x="200" y="296" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">el primo real</text><text x="370" y="296" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">la fórmula</text><text x="50" y="320" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">1000</text><text x="200" y="320" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">7919</text><text x="370" y="320" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">7840</text><text x="50" y="346" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">10000</text><text x="200" y="346" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">104729</text><text x="370" y="346" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">104307</text><text x="50" y="372" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">100000</text><text x="200" y="372" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">1299709</text><text x="370" y="372" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">1295640</text><text x="50" y="398" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">1000000</text><text x="200" y="398" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">15485863</text><text x="370" y="398" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">15441302</text><text x="50" y="424" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">1800000</text><text x="200" y="424" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">29005541</text><text x="370" y="424" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">28927358</text><text x="270" y="452" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el error relativo BAJA a medida que subís</text><rect x="540" y="238" width="500" height="232" fill="#1a1216" stroke="#5a2a30"/><text x="790" y="264" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⛔ pero NO predice un primo</text><text x="564" y="300" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">se tomó el entero que da la fórmula y se</text><text x="564" y="320" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">preguntó si es primo. Al lado, el control:</text><text x="564" y="340" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">un número al azar del mismo barrio.</text><text x="660" y="380" font-size="12" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">la fórmula</text><text x="660" y="406" font-size="20" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">6.626 %</text><text x="920" y="380" font-size="12" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">al azar</text><text x="920" y="406" font-size="20" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">6.233 %</text><text x="790" y="440" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">señal / silencio = 1.06</text><text x="790" y="460" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">una vez en el barrio, acertar es tirar a cualquier vecino</text><rect x="20" y="486" width="1020" height="176" fill="#131826" stroke="#2a3040"/><text x="530" y="512" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">¿y no hay una fórmula EXACTA? Sí hay — y por eso mismo no sirven</text><text x="60" y="546" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· existen fórmulas cerradas para el primo n-ésimo (Willans 1964, Minác). No son un mito.</text><text x="60" y="570" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· pero adentro llevan escondido un test de primalidad, corriéndolo sobre TODOS los números.</text><text x="60" y="594" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· el teorema de Wilson —n es primo ⟺ n divide a (n−1)!+1— es exacto y cuesta más que la criba.</text><text x="530" y="630" font-size="12" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">Son la criba disfrazada de fórmula: exactas, y más caras que dividir.</text><text x="530" y="652" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">La densidad te dice cuántos hay por metro cuadrado; no te dice cuál de las baldosas. Todavía no.</text></svg>