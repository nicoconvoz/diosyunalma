<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL ANTERIOR Y EL SIGUIENTE — cada divisor de p−1 veta un hueco</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">si q divide a p−1, el primo siguiente no puede estar a distancia q−1 · F395</text><rect x="20" y="76" width="500" height="230" fill="#121a16" stroke="#2a5a40"/><text x="270" y="100" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">LA REGLA, en un renglón</text><text x="48" y="134" font-size="13" fill="#e8e2d0" text-anchor="start" font-family="Georgia,serif">q | (p−1)  ⟹  p ≡ 1 (mod q)</text><text x="48" y="158" font-size="13" fill="#e8e2d0" text-anchor="start" font-family="Georgia,serif">⟹  p + (q−1) ≡ 0 (mod q)  ⟹  compuesto</text><text x="48" y="182" font-size="13" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">⟹  el hueco NO puede valer q − 1</text><line x1="48" y1="200" x2="492" y2="200" stroke="#2a5a40"/><text x="48" y="226" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el 3 veta el hueco 2</text><text x="48" y="248" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el 5 veta el hueco 4</text><text x="48" y="270" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el 7 veta el hueco 6</text><text x="300" y="226" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">p = 7 · p−1 = 6 = 2·3</text><text x="300" y="244" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">el 3 veta el hueco 2 → 9 es compuesto</text><text x="300" y="262" font-size="11" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">siguiente: 11, hueco 4 ✓</text><rect x="540" y="76" width="500" height="230" fill="#131826" stroke="#2a3040"/><text x="790" y="100" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">cuánto corre el veto al hueco medio</text><rect x="590.0" y="234.7" width="28" height="21.3" fill="#f2c14e" opacity="0.85"/><rect x="620.0" y="248.0" width="28" height="8.0" fill="#5ec8ff" opacity="0.85"/><text x="620" y="274" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">q=3</text><text x="620" y="288" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">+0.95</text><rect x="680.0" y="245.3" width="28" height="10.7" fill="#f2c14e" opacity="0.85"/><rect x="710.0" y="240.0" width="28" height="16.0" fill="#5ec8ff" opacity="0.85"/><text x="710" y="274" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">q=5</text><text x="710" y="288" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">-0.38</text><rect x="770.0" y="228.8" width="28" height="27.2" fill="#f2c14e" opacity="0.85"/><rect x="800.0" y="243.8" width="28" height="12.2" fill="#5ec8ff" opacity="0.85"/><text x="800" y="274" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">q=7</text><text x="800" y="288" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">+1.08</text><rect x="860.0" y="242.2" width="28" height="13.8" fill="#f2c14e" opacity="0.85"/><rect x="890.0" y="241.2" width="28" height="14.8" fill="#5ec8ff" opacity="0.85"/><text x="890" y="274" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">q=11</text><text x="890" y="288" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">-0.07</text><rect x="950.0" y="235.4" width="28" height="20.6" fill="#f2c14e" opacity="0.85"/><rect x="980.0" y="241.9" width="28" height="14.1" fill="#5ec8ff" opacity="0.85"/><text x="980" y="274" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">q=13</text><text x="980" y="288" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">+0.46</text><text x="590" y="124" font-size="10" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">■ con q | p−1</text><text x="690" y="124" font-size="10" fill="#5ec8ff" text-anchor="start" font-family="Georgia,serif">■ con q ∤ p−1</text><text x="790" y="300" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">(barras desde 14; el hueco medio global es ~15,5)</text><rect x="20" y="322" width="1020" height="240" fill="#131826" stroke="#2a3040"/><text x="530" y="346" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">cuantos más primos chicos dividen a p−1, más lejos queda el siguiente</text><rect x="140.0" y="501.1" width="80" height="10.9" fill="#6ee7a0" opacity="0.8"/><text x="180" y="495" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">14.97</text><text x="180" y="530" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">0 divisores</text><text x="180" y="546" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">135148 primos</text><rect x="290.0" y="504.1" width="80" height="7.9" fill="#6ee7a0" opacity="0.8"/><text x="330" y="498" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">14.78</text><text x="330" y="530" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">1 divisores</text><text x="330" y="546" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">267272 primos</text><rect x="440.0" y="499.6" width="80" height="12.4" fill="#6ee7a0" opacity="0.8"/><text x="480" y="494" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">15.07</text><text x="480" y="530" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">2 divisores</text><text x="480" y="546" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">184507 primos</text><rect x="590.0" y="488.2" width="80" height="23.8" fill="#6ee7a0" opacity="0.8"/><text x="630" y="482" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">15.79</text><text x="630" y="530" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">3 divisores</text><text x="630" y="546" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">63513 primos</text><rect x="740.0" y="469.0" width="80" height="43.0" fill="#6ee7a0" opacity="0.8"/><text x="780" y="463" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">17.01</text><text x="780" y="530" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">4 divisores</text><text x="780" y="546" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">12536 primos</text><rect x="890.0" y="450.2" width="80" height="61.8" fill="#6ee7a0" opacity="0.8"/><text x="930" y="444" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">18.21</text><text x="930" y="530" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">5 divisores</text><text x="930" y="546" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">1462 primos</text><rect x="1040.0" y="389.9" width="80" height="122.1" fill="#6ee7a0" opacity="0.8"/><text x="1080" y="384" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">22.05</text><text x="1080" y="530" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">6 divisores</text><text x="1080" y="546" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">128 primos</text><text x="1010" y="372" font-size="11" fill="#ff6b6b" text-anchor="end" font-family="Georgia,serif">pero solo explica el 0.12 % de la variación</text><text x="1010" y="390" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">vetar no es predecir</text><text x="1010" y="408" font-size="10" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">elemental y conocido: es el argumento de</text><text x="1010" y="424" font-size="10" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">admisibilidad de Hardy–Littlewood</text><text x="530" y="600" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">⚠️ «p−1 es par» quedó excluido: es la definición de impar (decimocuarta trampa). Todavía no.</text></svg>