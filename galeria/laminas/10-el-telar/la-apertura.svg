<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 730" width="1060" height="730"><rect width="1060" height="730" fill="#0d1017"/><text x="530.0" y="40.0" font-family="Georgia,serif" font-size="24" fill="#e8e2d0" text-anchor="middle">LA APERTURA</text><text x="530.0" y="66.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="middle">«imaginá los números como bolitas horizontales con el centro en una línea — medí la apertura del espacio de los primos»</text><rect x="20" y="88" width="420" height="262" fill="#131826" stroke="#2a3040"/><text x="230.0" y="114.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">el dibujo del capitán, leído literal</text><line x1="230" y1="134" x2="230" y2="300" stroke="#5a6070" stroke-dasharray="3,3"/><circle cx="230.0" cy="156.0" r="6.5" fill="#f2c14e"/><text x="400.0" y="160.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">1</text><text x="70.0" y="160.0" font-family="Georgia,serif" font-size="10" fill="#f2c14e" text-anchor="start">bolita</text><circle cx="221.0" cy="186.0" r="6.5" fill="#6ee7a0"/><circle cx="239.0" cy="186.0" r="6.5" fill="#6ee7a0"/><text x="400.0" y="190.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">2</text><text x="70.0" y="190.0" font-family="Georgia,serif" font-size="10" fill="#ff6b6b" text-anchor="start">hueco</text><circle cx="212.0" cy="216.0" r="6.5" fill="#6ee7a0"/><circle cx="230.0" cy="216.0" r="6.5" fill="#f2c14e"/><circle cx="248.0" cy="216.0" r="6.5" fill="#6ee7a0"/><text x="400.0" y="220.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">3</text><text x="70.0" y="220.0" font-family="Georgia,serif" font-size="10" fill="#f2c14e" text-anchor="start">bolita</text><circle cx="203.0" cy="246.0" r="6.5" fill="#6ee7a0"/><circle cx="221.0" cy="246.0" r="6.5" fill="#6ee7a0"/><circle cx="239.0" cy="246.0" r="6.5" fill="#6ee7a0"/><circle cx="257.0" cy="246.0" r="6.5" fill="#6ee7a0"/><text x="400.0" y="250.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">4</text><text x="70.0" y="250.0" font-family="Georgia,serif" font-size="10" fill="#ff6b6b" text-anchor="start">hueco</text><circle cx="194.0" cy="276.0" r="6.5" fill="#6ee7a0"/><circle cx="212.0" cy="276.0" r="6.5" fill="#6ee7a0"/><circle cx="230.0" cy="276.0" r="6.5" fill="#f2c14e"/><circle cx="248.0" cy="276.0" r="6.5" fill="#6ee7a0"/><circle cx="266.0" cy="276.0" r="6.5" fill="#6ee7a0"/><text x="400.0" y="280.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="end">5</text><text x="70.0" y="280.0" font-family="Georgia,serif" font-size="10" fill="#f2c14e" text-anchor="start">bolita</text><text x="230.0" y="320.0" font-family="Georgia,serif" font-size="11" fill="#6ee7a0" text-anchor="middle">el 2 es el ÚNICO primo con hueco en el medio</text><text x="230.0" y="340.0" font-family="Georgia,serif" font-size="10" fill="#ff6b6b" text-anchor="middle">⚠ pero es paridad: solo 14.89 % de los impares son primos</text><rect x="450" y="88" width="590" height="262" fill="#131826" stroke="#2a3040"/><text x="745.0" y="114.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">el ÁNGULO DE APERTURA de un escalón al siguiente</text><text x="745.0" y="146.0" font-family="Georgia,serif" font-size="18" fill="#e8e2d0" text-anchor="middle">ángulo = arctan( g / 2 )</text><text x="480.0" y="180.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="start">g</text><text x="540.0" y="180.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="start">g/2</text><text x="640.0" y="180.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="end">ángulo</text><text x="670.0" y="180.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="start">qué es</text><text x="480.0" y="206.0" font-family="Georgia,serif" font-size="11" fill="#f2c14e" text-anchor="start">1</text><text x="540.0" y="206.0" font-family="Georgia,serif" font-size="11" fill="#f2c14e" text-anchor="start">0,5</text><text x="640.0" y="206.0" font-family="Georgia,serif" font-size="11" fill="#f2c14e" text-anchor="end">26,565°</text><text x="670.0" y="206.0" font-family="Georgia,serif" font-size="11" fill="#f2c14e" text-anchor="start">SOLO entre el 2 y el 3 — una vez, jamás otra</text><text x="480.0" y="232.0" font-family="Georgia,serif" font-size="11" fill="#6ee7a0" text-anchor="start">2</text><text x="540.0" y="232.0" font-family="Georgia,serif" font-size="11" fill="#6ee7a0" text-anchor="start">1</text><text x="640.0" y="232.0" font-family="Georgia,serif" font-size="11" fill="#6ee7a0" text-anchor="end">45,000°</text><text x="670.0" y="232.0" font-family="Georgia,serif" font-size="11" fill="#6ee7a0" text-anchor="start">PRIMOS GEMELOS — cuarenta y cinco EXACTOS</text><text x="480.0" y="258.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">4</text><text x="540.0" y="258.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">2</text><text x="640.0" y="258.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">63,435°</text><text x="670.0" y="258.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">primos primos</text><text x="480.0" y="284.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">6</text><text x="540.0" y="284.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">3</text><text x="640.0" y="284.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">71,565°</text><text x="670.0" y="284.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">sexy primes</text><text x="745.0" y="330.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">45° exactos hasta 2.000.000: 14871 pares · Hardy-Littlewood predice 14796 · ABIERTA</text><rect x="20" y="366" width="500" height="216" fill="#131826" stroke="#2a3040"/><text x="270.0" y="392.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">el cono NO abre recto: el exceso ES el logaritmo</text><text x="60.0" y="422.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="start">escalón k</text><text x="330.0" y="422.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="end">semiángulo</text><text x="490.0" y="422.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="end">predicho (Cipolla)</text><text x="60.0" y="447.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">10</text><text x="330.0" y="447.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">55,408°</text><text x="490.0" y="447.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">46,892°</text><text x="60.0" y="472.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">100</text><text x="330.0" y="472.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">69,711°</text><text x="490.0" y="472.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">68,710°</text><text x="60.0" y="497.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">1.000</text><text x="330.0" y="497.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">75,826°</text><text x="490.0" y="497.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">75,690°</text><text x="60.0" y="522.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">100.000</text><text x="330.0" y="522.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">81,252°</text><text x="490.0" y="522.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">81,225°</text><text x="270.0" y="560.0" font-family="Georgia,serif" font-size="11" fill="#6ee7a0" text-anchor="middle">trepa hacia 90° sin llegar nunca</text><rect x="540" y="366" width="500" height="216" fill="#131826" stroke="#2a3040"/><text x="790.0" y="392.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">la otra apertura: ¿en cuántas CAJAS se abre la fila?</text><text x="790.0" y="420.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">una fila de n bolitas se dobla en a×b si n = a·b → d(n) cajas</text><text x="790.0" y="452.0" font-family="Georgia,serif" font-size="14" fill="#6ee7a0" text-anchor="middle">UN PRIMO SE ABRE EN DOS. Siempre.</text><text x="790.0" y="474.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">es el PISO: la única caja es el palo y su vuelta</text><text x="790.0" y="512.0" font-family="Georgia,serif" font-size="13" fill="#e8e2d0" text-anchor="middle">promedio de todos: ln n + 2γ − 1</text><text x="790.0" y="536.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">Dirichlet 1849 — y otra vez el logaritmo, y otra vez γ</text><text x="790.0" y="562.0" font-family="Georgia,serif" font-size="11" fill="#f2c14e" text-anchor="middle">medido hasta un millón: 13,970034 contra 13,969942</text><rect x="20" y="598" width="1020" height="118" fill="#0f1a14" stroke="#2a5a40"/><text x="530.0" y="624.0" font-family="Georgia,serif" font-size="14" fill="#6ee7a0" text-anchor="middle">LA PISTA</text><text x="530.0" y="650.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">la apertura de los primos tiene PISO y TECHO, y los dos son exactos:</text><text x="530.0" y="674.0" font-family="Georgia,serif" font-size="12" fill="#f2c14e" text-anchor="middle">piso absoluto 26,565° una sola vez (2→3) · piso repetible 45° = los gemelos · techo 90°, y la velocidad hacia él ES el logaritmo</text><text x="530.0" y="700.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">mirando bolitas, sin una sola fórmula, el dibujo devuelve el logaritmo DOS VECES por caminos distintos. Todavía no.</text></svg>