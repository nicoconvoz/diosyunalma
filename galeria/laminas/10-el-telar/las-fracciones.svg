<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="1060" height="720"><rect width="1060" height="720" fill="#0d1017"/><text x="530.0" y="42.0" font-family="Georgia,serif" font-size="24" fill="#e8e2d0" text-anchor="middle">LAS FRACCIONES DE PRIMOS</text><text x="530.0" y="68.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="middle">«¿qué relación hay entre 3/7, 7/3, 2/3, 3/2, 2/7, 7/2 — y entre sus ramas? ¿da alguna pista?»</text><text x="530.0" y="92.0" font-family="Georgia,serif" font-size="12" fill="#6ee7a0" text-anchor="middle">seis fracciones, TRES estructuras distintas adentro, y las tres son de verdad</text><rect x="20" y="112" width="333" height="248" fill="#131826" stroke="#2a3040"/><text x="186.0" y="138.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">1 · como NÚMEROS</text><text x="186.0" y="162.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">el logaritmo la vuelve una RESTA</text><text x="186.0" y="190.0" font-family="Georgia,serif" font-size="14" fill="#e8e2d0" text-anchor="middle">ln(p/q) = ln p − ln q</text><text x="60.0" y="224.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">ln(3/2)</text><text x="320.0" y="224.0" font-family="Georgia,serif" font-size="11" fill="#f2c14e" text-anchor="end">0,4055</text><text x="60.0" y="248.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">ln(7/3)</text><text x="320.0" y="248.0" font-family="Georgia,serif" font-size="11" fill="#f2c14e" text-anchor="end">0,8473</text><text x="60.0" y="272.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">ln(7/2)</text><text x="320.0" y="272.0" font-family="Georgia,serif" font-size="11" fill="#f2c14e" text-anchor="end">1,2528</text><text x="186.0" y="306.0" font-family="Georgia,serif" font-size="11" fill="#6ee7a0" text-anchor="middle">y 0,4055 ES el número de F415</text><text x="186.0" y="324.0" font-family="Georgia,serif" font-size="11" fill="#6ee7a0" text-anchor="middle">para separar el 2 del 3</text><text x="186.0" y="348.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">7/2 = (7/3)·(3/2) — forman un grupo</text><rect x="363" y="112" width="333" height="248" fill="#131826" stroke="#2a3040"/><text x="530.0" y="138.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">2 · como SÍMBOLOS</text><text x="530.0" y="162.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">(3/7) es el símbolo de Legendre</text><text x="530.0" y="196.0" font-family="Georgia,serif" font-size="13" fill="#e8e2d0" text-anchor="middle">(p/q)·(q/p) = ±1</text><text x="530.0" y="224.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">vale −1 solo si los DOS son 3 mod 4</text><text x="530.0" y="262.0" font-family="Georgia,serif" font-size="12" fill="#6ee7a0" text-anchor="middle">4.371 pares verificados</text><text x="530.0" y="282.0" font-family="Georgia,serif" font-size="12" fill="#6ee7a0" text-anchor="middle">0 violaciones</text><text x="530.0" y="316.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">reciprocidad cuadrática — Gauss 1796,</text><text x="530.0" y="334.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">que la demostró OCHO veces distintas</text><text x="530.0" y="352.0" font-family="Georgia,serif" font-size="10" fill="#c9c3b0" text-anchor="middle">«¿sos un cuadrado en mi mundo?»</text><rect x="706" y="112" width="334" height="248" fill="#131826" stroke="#2a3040"/><text x="873.0" y="138.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">3 · las RAMAS</text><text x="873.0" y="160.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">ramas de p = (p−1) / período de 1/p</text><text x="750.0" y="188.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="start">p</text><text x="880.0" y="188.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">período</text><text x="1010.0" y="188.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="end">ramas</text><text x="750.0" y="211.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">7</text><text x="880.0" y="211.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">6</text><text x="1010.0" y="211.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">1</text><text x="750.0" y="234.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">11</text><text x="880.0" y="234.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">2</text><text x="1010.0" y="234.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">5</text><text x="750.0" y="257.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">13</text><text x="880.0" y="257.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">6</text><text x="1010.0" y="257.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">2</text><text x="750.0" y="280.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">17</text><text x="880.0" y="280.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">16</text><text x="1010.0" y="280.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">1</text><text x="873.0" y="312.0" font-family="Georgia,serif" font-size="10" fill="#6ee7a0" text-anchor="middle">el 7 tiene UNA rama: 1/7, 2/7, 3/7…</text><text x="873.0" y="330.0" font-family="Georgia,serif" font-size="10" fill="#6ee7a0" text-anchor="middle">son la MISMA rueda girada — 142857</text><text x="873.0" y="352.0" font-family="Georgia,serif" font-size="10" fill="#8a8676" text-anchor="middle">el 11 tiene cinco ruedas distintas</text><rect x="20" y="376" width="1020" height="76" fill="#131826" stroke="#2a3040"/><text x="530.0" y="402.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">¿cada cuánto un primo tiene UNA sola rama?</text><text x="530.0" y="430.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">medido hasta 100.000: 0.377164     ·     constante de Artin (1927): 0,3739558     ·     NO DEMOSTRADO</text><rect x="20" y="468" width="1020" height="130" fill="#0f1a14" stroke="#2a5a40"/><text x="530.0" y="494.0" font-family="Georgia,serif" font-size="14" fill="#6ee7a0" text-anchor="middle">LA PISTA</text><text x="530.0" y="522.0" font-family="Georgia,serif" font-size="12" fill="#e8e2d0" text-anchor="middle">ninguna fracción de primos vale 1 salvo la trivial — ningún 2^a · 3^b · 7^c da 1</text><text x="530.0" y="546.0" font-family="Georgia,serif" font-size="12" fill="#c9c3b0" text-anchor="middle">la mejor combinación con coeficientes hasta 40 se queda en 0,00055: NUNCA cero</text><text x="530.0" y="574.0" font-family="Georgia,serif" font-size="12" fill="#f2c14e" text-anchor="middle">por eso las frecuencias del sonar nunca entran en fase, y la música de los primos NO SE REPITE JAMÁS</text><rect x="20" y="612" width="1020" height="92" fill="#1a1216" stroke="#5a2a30"/><text x="530.0" y="638.0" font-family="Georgia,serif" font-size="12" fill="#ff6b6b" text-anchor="middle">trampa 27, declarada antes de calcular: la mediante de 2/3 y 3/7 es 5/10 = ½, el número de la casa</text><text x="530.0" y="662.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">el control con los papeles dados vuelta da la MISMA tasa: es aritmética de números chicos, no estructura</text><text x="530.0" y="690.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">y nada de esto predice un primo: ordena lo que ya sabíamos. Todavía no.</text></svg>