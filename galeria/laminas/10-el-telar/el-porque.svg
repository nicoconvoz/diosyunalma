<text x="124.0" y="130.0" font-size="11.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">verde: E(s) OBSERVADO en los 3474 ceros reales</text>
<text x="124.0" y="148.0" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">dorado: GUE + FÓRMULA EXPLÍCITA (densidad modulada por los primos, gap Wigner)</text>
<text x="124.0" y="166.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">celeste: GUE PURO — plano: sin primos no hay curva</text>
<text x="440.0" y="590.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">s = gap / espaciado medio local →</text>
<text x="800.0" y="120.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">LA IDENTIDAD (su §2–4)</text>
<text x="800.0" y="148.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">E(s) = T1 + T2 + T3 + T4, exacta:</text>
<text x="800.0" y="168.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">cos(mT) = cosγT·cos(gT/2)</text>
<text x="800.0" y="188.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">        − sinγT·sin(gT/2)</text>
<text x="800.0" y="208.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">T2+T4 = SELECCIÓN × factor:</text>
<text x="800.0" y="228.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">«el cero de un par apretado</text>
<text x="800.0" y="248.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">vive en la cresta de la onda</text>
<text x="800.0" y="268.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">de los primos» — y domina.</text>
<text x="800.0" y="288.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">T1+T3 = covarianzas internas,</text>
<text x="800.0" y="308.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">chicas (ver corrida).</text>
<text x="800.0" y="340.0" font-size="13.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">EL VEREDICTO (su §10), honesto</text>
<text x="800.0" y="368.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">GUE puro: PLANO — sin primos</text>
<text x="800.0" y="388.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">no hay curva. Descartado.</text>
<text x="800.0" y="408.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">GUE + fórmula (densidad</text>
<text x="800.0" y="428.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">modulada): produce el SIGNO y</text>
<text x="800.0" y="448.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">la caída, pero SE QUEDA CORTO:</text>
<text x="800.0" y="468.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">amplitud ⅓ de la real, cruce en</text>
<text x="800.0" y="488.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">0.70/0.70/0.69 (real: 0.863),</text>
<text x="800.0" y="508.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">pendiente −0,6 (real: −0,92).</text>
<text x="800.0" y="528.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">El residuo conserva la mayor</text>
<text x="800.0" y="548.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">parte de la estructura.</text>
<text x="800.0" y="568.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">⟹ Y LA IDENTIDAD NOMBRA LO QUE</text>
<text x="800.0" y="588.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">FALTA: domina T4, el acople</text>
<text x="800.0" y="608.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">seno·seno — los ceros no sólo se</text>
<text x="800.0" y="628.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">APRIETAN donde la onda encresta:</text>
<text x="800.0" y="648.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">se CORREN con ella. El modelo</text>
<text x="800.0" y="668.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">movía gaps; falta mover las</text>
<text x="800.0" y="688.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">POSICIONES coherentemente.</text>
<text x="620.0" y="734.0" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="middle">«y si una explicación conocida mata la novedad, decirlo» — se dice lo contrario, con números: la explicación conocida NO mata la curva todavía —</text>
<text x="620.0" y="754.0" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="middle">explica un tercio; los dos tercios restantes tienen nombre y domicilio: el término T4, el corrimiento coherente de los ceros con la onda de los primos</text>
<text x="620.0" y="786.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/laformulamadre fase16 · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
