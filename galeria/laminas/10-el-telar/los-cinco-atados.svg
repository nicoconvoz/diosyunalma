<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LOS CINCO ATADOS — el 1, el primo, el 2, el ½ y la raíz</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el nudo es la media geométrica, y la raíz es el pliegue de los divisores · F406</text><rect x="20" y="76" width="1020" height="150" fill="#121a16" stroke="#2a5a40"/><text x="530" y="102" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">EL NUDO: los cinco en una sola expresión</text><text x="530" y="156" font-size="32" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">√p   =   √(1 × p)   =   (1 × p)^½</text><text x="180" y="196" font-size="11" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">el 1 y el primo</text><text x="180" y="212" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">los dos latidos</text><text x="430" y="196" font-size="11" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">el 2</text><text x="430" y="212" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">los cuenta</text><text x="680" y="196" font-size="11" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">el ½</text><text x="680" y="212" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el exponente que promedia</text><text x="900" y="196" font-size="11" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">la raíz</text><text x="900" y="212" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el resultado</text><rect x="20" y="242" width="500" height="230" fill="#131826" stroke="#2a3040"/><text x="270" y="268" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">la raíz es EL PLIEGUE de los divisores</text><line x1="80" y1="350" x2="460" y2="350" stroke="#3a4050"/><line x1="270" y1="300" x2="270" y2="400" stroke="#f2c14e" stroke-dasharray="4,3"/><text x="270" y="292" font-size="11" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">√36 = 6</text><circle cx="244" cy="350" r="4" fill="#5ec8ff"/><circle cx="296" cy="350" r="4" fill="#5ec8ff"/><path d="M 244 350 Q 270 326 296 350" fill="none" stroke="#5ec8ff" opacity="0.4"/><text x="244" y="368" font-size="9" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">1</text><text x="296" y="368" font-size="9" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">36</text><circle cx="206" cy="350" r="4" fill="#5ec8ff"/><circle cx="334" cy="350" r="4" fill="#5ec8ff"/><path d="M 206 350 Q 270 319 334 350" fill="none" stroke="#5ec8ff" opacity="0.4"/><text x="206" y="368" font-size="9" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">2</text><text x="334" y="368" font-size="9" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">18</text><circle cx="168" cy="350" r="4" fill="#5ec8ff"/><circle cx="372" cy="350" r="4" fill="#5ec8ff"/><path d="M 168 350 Q 270 312 372 350" fill="none" stroke="#5ec8ff" opacity="0.4"/><text x="168" y="368" font-size="9" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">3</text><text x="372" y="368" font-size="9" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">12</text><circle cx="130" cy="350" r="4" fill="#5ec8ff"/><circle cx="410" cy="350" r="4" fill="#5ec8ff"/><path d="M 130 350 Q 270 305 410 350" fill="none" stroke="#5ec8ff" opacity="0.4"/><text x="130" y="368" font-size="9" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">4</text><text x="410" y="368" font-size="9" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">9</text><circle cx="270" cy="350" r="5" fill="#f2c14e"/><text x="270" y="368" font-size="9" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">6</text><text x="270" y="412" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">cada divisor se abraza con su pareja: d × (n/d) = n</text><text x="270" y="434" font-size="11" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">un primo tiene UN SOLO par: 1 × p</text><text x="270" y="456" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">por eso el test de primalidad se detiene en la raíz</text><rect x="540" y="242" width="500" height="230" fill="#131826" stroke="#2a3040"/><text x="790" y="268" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">qué separa y qué no</text><text x="564" y="302" font-size="11" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">⚠️ «la raíz de un primo es irracional»</text><text x="564" y="324" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">el 6, el 8 y el 10 también. Razón ≈ 1: no separa.</text><line x1="564" y1="342" x2="1016" y2="342" stroke="#2a3040"/><text x="564" y="368" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">✅ la distancia del pliegue al divisor más cercano</text><text x="564" y="390" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">para un primo ese divisor es el 1: lo más lejos posible</text><text x="790" y="424" font-size="20" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">separa ~6×</text><text x="790" y="452" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">⚖️ pero hallarlo ES dividir: circularidad declarada</text><rect x="20" y="488" width="1020" height="174" fill="#1a1216" stroke="#5a2a30"/><text x="530" y="514" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">el paralelo con la línea crítica — ANALOGÍA DE FORMA, no teorema</text><text x="140" y="548" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">los divisores</text><text x="420" y="548" font-size="13" fill="#e8e2d0" text-anchor="start" font-family="Georgia,serif">d  ↔  n/d</text><text x="760" y="548" font-size="12" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">punto fijo: √n</text><text x="140" y="576" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">la ecuación funcional</text><text x="420" y="576" font-size="13" fill="#e8e2d0" text-anchor="start" font-family="Georgia,serif">s  ↔  1 − s</text><text x="760" y="576" font-size="12" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">punto fijo: ½</text><text x="140" y="604" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el producto de Euler</text><text x="420" y="604" font-size="13" fill="#e8e2d0" text-anchor="start" font-family="Georgia,serif">p^(−s) ↔ p^(−(1−s))</text><text x="760" y="604" font-size="12" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">punto fijo: 1/√p</text><text x="530" y="640" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Que dos emparejamientos tengan la misma forma NO hace que uno implique al otro (la casa se comió esa lección en F401).</text><text x="530" y="660" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">La desigualdad de las medias es de Euclides. Todavía no.</text></svg>