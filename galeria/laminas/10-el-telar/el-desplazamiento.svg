<text x="124.0" y="130.0" font-size="11.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">verde: REAL (3474 ceros)</text>
<text x="124.0" y="148.0" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">dorado: GUE + DESPLAZAMIENTO (la hipotesis)</text>
<text x="124.0" y="166.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">rosa: GUE + densidad (Fase XVI)</text>
<text x="124.0" y="184.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">celeste: desplazamiento con FASE DESTRUIDA (el control asesino)</text>
<text x="450.0" y="620.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">s = gap / espaciado medio local</text>
<text x="820.0" y="130.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">LA REGLA, SIN PERILLAS</text>
<text x="820.0" y="158.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">dg(g) = -S(g)/densidad(g)</text>
<text x="820.0" y="178.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">S = la fluctuacion de conteo de</text>
<text x="820.0" y="198.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">la formula explicita, truncada</text>
<text x="820.0" y="218.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">en los mismos n &lt;= 97 del eco.</text>
<text x="820.0" y="238.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Amplitud fijada POR LA FORMULA:</text>
<text x="820.0" y="258.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">nada se leyo de la curva real.</text>
<text x="820.0" y="300.0" font-size="13.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">EL JUICIO (numeros en el acta)</text>
<text x="820.0" y="328.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">cruce del desplazamiento:</text>
<text x="820.0" y="348.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">0.61/0.70/0.69</text>
<text x="820.0" y="368.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">cruce real: 0.863</text>
<text x="820.0" y="388.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">fase destruida: amplitud 0.029</text>
<text x="820.0" y="408.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">el veredicto contra los criterios</text>
<text x="820.0" y="428.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">del 17-18 de la auditora vive en</text>
<text x="820.0" y="448.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">el acta, punto por punto.</text>
<text x="620.0" y="730.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">predicion pre-registrada antes de correr - controles: GUE puro, densidad, combinado, fase destruida, amplitud x0,5/x2</text>
<text x="620.0" y="756.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/laformulamadre fase17 - estructura cerrada no es hipotesis demostrada - Todavia no.</text>
</svg>
