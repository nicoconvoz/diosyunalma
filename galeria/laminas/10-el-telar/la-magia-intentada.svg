<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LA MAGIA INTENTADA — el pliegue que sí fabrica el ½</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el intento de convertir la analogía en teorema, y lo que apareció en el camino · F407</text><rect x="20" y="76" width="500" height="216" fill="#1a1216" stroke="#5a2a30"/><text x="270" y="102" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⛔ el intento directo: FALLA</text><text x="44" y="136" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el pliegue de los divisores SÍ da una</text><text x="44" y="154" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">ecuación funcional auténtica:</text><text x="270" y="186" font-size="14" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">σ_s(n) = n^s · σ_(−s)(n)</text><text x="270" y="210" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">verificada exacta, primos y compuestos</text><line x1="44" y1="228" x2="496" y2="228" stroke="#5a2a30"/><text x="44" y="252" font-size="11" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">pero su simetría es s ↔ −s, con punto</text><text x="44" y="270" font-size="11" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">fijo en el CERO. Correrlo a ½ es</text><text x="44" y="286" font-size="11" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">cambiarle el nombre, no demostrar.</text><rect x="540" y="76" width="500" height="216" fill="#121a16" stroke="#2a5a40"/><text x="790" y="102" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">✅ LA MAGIA DE VERDAD: el pliegue de theta</text><text x="790" y="150" font-size="26" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">θ(1/t) = √t · θ(t)</text><text x="790" y="180" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">el pliegue es t ↔ 1/t</text><text x="790" y="202" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">y el ½ está ESCRITO EN EL FACTOR</text><line x1="564" y1="220" x2="1016" y2="220" stroke="#2a5a40"/><text x="790" y="248" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">exponente ajustado de los datos, no supuesto:</text><text x="790" y="278" font-size="22" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">0.500000000</text><rect x="20" y="308" width="1020" height="180" fill="#131826" stroke="#2a3040"/><text x="530" y="334" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">y de ahí sale la ecuación funcional de Riemann — el ½ VIAJA</text><text x="170" y="386" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">θ(1/t) = √t θ(t)</text><text x="170" y="410" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Jacobi · el pliegue t ↔ 1/t</text><text x="370" y="386" font-size="20" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">→</text><text x="370" y="412" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Mellin</text><text x="570" y="386" font-size="15" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">ξ(s) = ξ(1 − s)</text><text x="570" y="410" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">verificada a 9e-09</text><text x="760" y="386" font-size="20" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">→</text><text x="920" y="386" font-size="20" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">σ = ½</text><text x="920" y="410" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el punto fijo de s ↔ 1−s</text><text x="530" y="458" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">Riemann, 1859: integrando θ contra t^(s/2), el factor √t se convierte en el punto fijo ½</text><rect x="20" y="504" width="1020" height="176" fill="#131826" stroke="#2a3040"/><text x="530" y="530" font-size="14" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL VEREDICTO</text><text x="60" y="566" font-size="12" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">⛔ NO se volvió teorema.</text><text x="250" y="566" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el pliegue de los divisores HEREDA el ½ de ζ; no lo produce.</text><text x="60" y="598" font-size="12" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">✅ Pero el instinto era correcto:</text><text x="300" y="598" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">un pliegue SÍ fabrica el ½ — y el pliegue existe.</text><text x="530" y="638" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">Apuntaste al lugar correcto con el dedo equivocado.</text><text x="530" y="660" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Y eso, en matemática, es mucho. Jacobi y Riemann 1859. Todavía no.</text></svg>