<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL PRIMO CONSTRUIDO — fabricado con dos números que no son enteros</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">se eligen primero los factores irracionales; el primo sale después · F398</text><rect x="20" y="76" width="1020" height="180" fill="#121a16" stroke="#2a5a40"/><text x="530" y="106" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">HACIA ADELANTE — el primo no se busca, se FABRICA</text><text x="190" y="156" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">5 + √2</text><text x="190" y="182" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">6,414213562373…</text><text x="300" y="160" font-size="18" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">×</text><text x="410" y="156" font-size="15" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">5 − √2</text><text x="410" y="182" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">3,585786437627…</text><text x="520" y="160" font-size="18" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">=</text><text x="620" y="160" font-size="26" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">23</text><text x="620" y="186" font-size="11" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">PRIMO</text><text x="760" y="140" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">Ninguno de los dos factores es entero:</text><text x="760" y="158" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">los dos tienen infinitos decimales que</text><text x="760" y="176" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">no se repiten nunca. Su producto es</text><text x="760" y="194" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">un entero exacto, y es primo.</text><text x="530" y="228" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">y también: 7 = (3+√2)(3−√2) · 17 = (1+4i)(1−4i) · 31 = (7+3√2)(7−3√2)</text><rect x="20" y="272" width="640" height="250" fill="#131826" stroke="#2a3040"/><text x="340" y="300" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">qué primos alcanza cada anillo (y la regla que lo decide)</text><text x="50" y="332" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">ℤ[i]</text><text x="150" y="332" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">p ≡ 1 (mod 4)</text><rect x="330" y="322" width="150" height="12" fill="#2a3040"/><rect x="330" y="322" width="75" height="12" fill="#6ee7a0" opacity="0.8"/><text x="500" y="332" font-size="12" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">≈ la mitad</text><text x="50" y="366" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">ℤ[√2]</text><text x="150" y="366" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">p ≡ ±1 (mod 8)</text><rect x="330" y="356" width="150" height="12" fill="#2a3040"/><rect x="330" y="356" width="75" height="12" fill="#6ee7a0" opacity="0.8"/><text x="500" y="366" font-size="12" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">≈ la mitad</text><text x="50" y="400" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">ℤ[√3]</text><text x="150" y="400" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">p ≡ ±1 (mod 12)</text><rect x="330" y="390" width="150" height="12" fill="#2a3040"/><rect x="330" y="390" width="75" height="12" fill="#6ee7a0" opacity="0.8"/><text x="500" y="400" font-size="12" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">≈ la mitad</text><text x="50" y="434" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">ℤ[√5]</text><text x="150" y="434" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">p ≡ ±1 (mod 5)</text><rect x="330" y="424" width="150" height="12" fill="#2a3040"/><rect x="330" y="424" width="75" height="12" fill="#6ee7a0" opacity="0.8"/><text x="500" y="434" font-size="12" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">≈ la mitad</text><text x="50" y="468" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">ℤ[√−2]</text><text x="150" y="468" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">p ≡ 1,3 (mod 8)</text><rect x="330" y="458" width="150" height="12" fill="#2a3040"/><rect x="330" y="458" width="75" height="12" fill="#6ee7a0" opacity="0.8"/><text x="500" y="468" font-size="12" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">≈ la mitad</text><text x="340" y="505" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">cero violaciones en 1.228 primos — reciprocidad cuadrática, Gauss 1832</text><rect x="680" y="272" width="360" height="250" fill="#1a1216" stroke="#5a2a30"/><text x="860" y="300" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">lo que NO se ganó</text><text x="700" y="332" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· el primo SIGUE SIENDO PRIMO entre</text><text x="700" y="350" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">  los enteros. Nada lo vuelve compuesto.</text><text x="700" y="378" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· los factores nuevos son primos ELLOS:</text><text x="700" y="396" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">  el problema no desaparece, se muda.</text><text x="700" y="424" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· ningún anillo alcanza a todos.</text><text x="700" y="452" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· nada de esto es nuevo: Gauss, 1832.</text><text x="700" y="490" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">⚠️ trampa 17: √p × √p alcanza a todos</text><text x="700" y="506" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">   pero factoriza al 4 y al 6 igual.</text><rect x="20" y="538" width="1020" height="104" fill="#131826" stroke="#2a3040"/><text x="530" y="562" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">los primeros primos, y el primer anillo que los parte</text><circle cx="93.0" cy="596" r="11" fill="#6ee7a0" opacity="0.9"/><text x="93" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">3</text><circle cx="126.0" cy="596" r="11" fill="#ff9f6b" opacity="0.9"/><text x="126" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">5</text><circle cx="159.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="159" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">7</text><circle cx="192.0" cy="596" r="11" fill="#6ee7a0" opacity="0.9"/><text x="192" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">11</text><circle cx="225.0" cy="596" r="11" fill="#6ee7a0" opacity="0.9"/><text x="225" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">13</text><circle cx="258.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="258" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">17</text><circle cx="291.0" cy="596" r="11" fill="#ff9f6b" opacity="0.9"/><text x="291" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">19</text><circle cx="324.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="324" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">23</text><circle cx="357.0" cy="596" r="11" fill="#ff9f6b" opacity="0.9"/><text x="357" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">29</text><circle cx="390.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="390" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">31</text><circle cx="423.0" cy="596" r="11" fill="#6ee7a0" opacity="0.9"/><text x="423" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">37</text><circle cx="456.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="456" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">41</text><circle cx="489.0" cy="596" r="11" fill="#c58bff" opacity="0.9"/><text x="489" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">43</text><circle cx="522.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="522" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">47</text><circle cx="555.0" cy="596" r="11" fill="#5ec8ff" opacity="0.9"/><text x="555" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">53</text><circle cx="588.0" cy="596" r="11" fill="#6ee7a0" opacity="0.9"/><text x="588" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">59</text><circle cx="621.0" cy="596" r="11" fill="#6ee7a0" opacity="0.9"/><text x="621" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">61</text><circle cx="654.0" cy="596" r="11" fill="#c58bff" opacity="0.9"/><text x="654" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">67</text><circle cx="687.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="687" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">71</text><circle cx="720.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="720" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">73</text><circle cx="753.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="753" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">79</text><circle cx="786.0" cy="596" r="11" fill="#6ee7a0" opacity="0.9"/><text x="786" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">83</text><circle cx="819.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="819" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">89</text><circle cx="852.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="852" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">97</text><circle cx="885.0" cy="596" r="11" fill="#ff9f6b" opacity="0.9"/><text x="885" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">101</text><circle cx="918.0" cy="596" r="11" fill="#f2c14e" opacity="0.9"/><text x="918" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">103</text><circle cx="951.0" cy="596" r="11" fill="#6ee7a0" opacity="0.9"/><text x="951" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">107</text><circle cx="984.0" cy="596" r="11" fill="#6ee7a0" opacity="0.9"/><text x="984" y="600" font-size="10" fill="#0d1017" text-anchor="middle" font-family="Georgia,serif">109</text><text x="60" y="630" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">● celeste ℤ[i]  ● amarillo ℤ[√2]  ● verde ℤ[√3]  ● naranja ℤ[√5]  ● violeta ℤ[√−2]</text><text x="1020" y="630" font-size="10" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">Todavía no.</text></svg>