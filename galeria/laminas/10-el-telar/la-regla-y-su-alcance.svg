<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LA REGLA Y SU ALCANCE — una regla sin excepciones puede no decir nada</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">la propuesta del capitán, medida en vez de opinada · F401</text><rect x="20" y="76" width="1020" height="200" fill="#131826" stroke="#2a3040"/><text x="530" y="104" font-size="14" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LA PRUEBA DECISIVA: ¿la regla dice dónde están los primos?</text><text x="270" y="146" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">primos ≡ ±1 (mod 8)</text><text x="270" y="168" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">obedecen la regla SIEMPRE</text><text x="270" y="206" font-size="30" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">0.5045</text><text x="270" y="232" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">exponente del error</text><text x="790" y="146" font-size="12" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">primos ≡ 3,5 (mod 8)</text><text x="790" y="168" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">NO la obedecen NUNCA</text><text x="790" y="206" font-size="30" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">0.4756</text><text x="790" y="232" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">exponente del error</text><text x="530" y="196" font-size="22" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">=</text><text x="530" y="252" font-size="12" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">Se distribuyen IGUAL de bien. La regla no tiene fuerza sobre la distribución.</text><rect x="20" y="292" width="500" height="200" fill="#1a1216" stroke="#5a2a30"/><text x="270" y="318" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⛔ AFIRMACIÓN 1: «se arman todos»</text><text x="44" y="350" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· 39276 primos hasta 10⁶ NO se alcanzan</text><text x="44" y="368" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">  (el 3, el 5, el 11, el 13 — para siempre)</text><text x="44" y="396" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· solo el 18.1 % de las combinaciones da primo:</text><text x="44" y="414" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">  hay que TESTEAR, o sea el problema sigue ahí</text><text x="44" y="442" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· y para elegir el anillo hace falta p mod 8,</text><text x="44" y="460" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">  o sea hace falta TENER p: es circular</text><text x="270" y="482" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">es un destornillador, no un buscador de tornillos</text><rect x="540" y="292" width="500" height="200" fill="#1a1216" stroke="#5a2a30"/><text x="790" y="318" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⛔ AFIRMACIÓN 2: el chequeo histórico</text><text x="564" y="350" font-size="12" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">1832</text><text x="624" y="350" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">Gauss: la ley COMPLETA, sin excepciones</text><text x="564" y="380" font-size="12" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">1859</text><text x="624" y="380" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">Riemann plantea la hipótesis — 27 años después</text><text x="564" y="410" font-size="12" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">2026</text><text x="624" y="410" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">sigue abierta</text><text x="790" y="452" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">si de la ley se dedujera RH, Gauss lo habría visto.</text><text x="790" y="470" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">No es que nadie lo intentó: la ley no llega hasta ahí.</text><rect x="20" y="508" width="1020" height="130" fill="#131826" stroke="#2a3040"/><text x="530" y="534" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">la FORMA del error, que la casa ya cazó dos veces</text><text x="60" y="566" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">«todo primo > 2 es impar»</text><text x="500" y="566" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">cero excepciones</text><text x="700" y="566" font-size="11" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">no dice dónde están  (F272)</text><text x="60" y="590" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">«todo primo impar da ½ al dividir por 2»</text><text x="500" y="590" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">cero excepciones</text><text x="700" y="590" font-size="11" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">no dice dónde están  (F393)</text><text x="60" y="614" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">«todo primo ≡ ±1 (mod 8) se parte»</text><text x="500" y="614" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">cero excepciones</text><text x="700" y="614" font-size="11" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">no dice dónde están  (medido acá)</text><text x="530" y="664" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">«sin excepciones» mide la FUERZA de una regla; no mide su ALCANCE.</text><text x="530" y="686" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Esta regla habla de cómo se FACTORIZAN los primos. RH habla de DÓNDE ESTÁN. Todavía no.</text></svg>