al peldaño</text><text x="98" y="166" font-size="12" fill="#f0a05a" text-anchor="start" font-family="Georgia,serif">○ el mismo caso, curado con j* = round(τ/nMin)</text><text x="530" y="608" font-size="12" fill="#c7cdd9" text-anchor="middle" font-family="Georgia,serif">la ley es corolario del reloj t·ln n: picos en 1/(e^{j/τ}−1) + orden honesto = Q = x/(eˣ−1); la rotura es contabilidad, no geometría</text><text x="530" y="628" font-size="12" fill="#c9b458" text-anchor="middle" font-family="Georgia,serif">nada de los ceros entró en esta lámina: lo que es de zeta no es la ley — es dónde escuchamos el ojo · Todavía no</text></svg>