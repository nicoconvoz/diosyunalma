<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL CERO QUE NO SE ALCANZA — el universo tiene un piso, y no es cero</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">tiempo, espacio, materia y temperatura: un solo número · F411</text><rect x="20" y="76" width="1020" height="120" fill="#121a16" stroke="#2a5a40"/><text x="530" y="102" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">LA RELACIÓN, EXACTA</text><text x="280" y="148" font-size="22" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">T × a = constante</text><text x="280" y="174" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">espacio y temperatura, el mismo número</text><text x="780" y="148" font-size="22" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">β = ħ / (k·T)</text><text x="780" y="174" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">la temperatura ES una vuelta de tiempo imaginario</text><rect x="20" y="212" width="620" height="280" fill="#131826" stroke="#2a3040"/><text x="330" y="236" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">el enfriamiento, y dónde se detiene</text><line x1="70" y1="432" x2="610" y2="432" stroke="#6ee7a0" stroke-dasharray="5,4" stroke-width="2"/><text x="606" y="424" font-size="11" fill="#6ee7a0" text-anchor="end" font-family="Georgia,serif">EL PISO: 2.7e-30 K</text><polyline points="80.0,272.6 88.7,275.3 97.3,278.0 106.0,280.7 114.7,283.4 123.3,286.1 132.0,288.8 140.7,291.5 149.3,294.2 158.0,296.9 166.7,299.6 175.3,302.3 184.0,305.0 192.7,307.7 201.3,310.4 210.0,313.1 218.7,315.8 227.3,318.5 236.0,321.2 244.7,323.9 253.3,326.6 262.0,329.3 270.7,332.0 279.3,334.7 288.0,337.4 296.7,340.1 305.3,342.8 314.0,345.5 322.7,348.2 331.3,350.9 340.0,353.6 348.7,356.3 357.3,359.0 366.0,361.7 374.7,364.4 383.3,367.1 392.0,369.8 400.7,372.5 409.3,375.2 418.0,377.9 426.7,380.6 435.3,383.3 444.0,386.0 452.7,388.7 461.3,391.4 470.0,394.1 478.7,396.8 487.3,399.5 496.0,402.2 504.7,404.9 513.3,407.6 522.0,410.3 530.7,413.0 539.3,415.7 548.0,418.4 556.7,421.1 565.3,423.8 574.0,426.5 582.7,429.2 591.3,431.9 600.0,432.0" fill="none" stroke="#f2c14e" stroke-width="2.5"/><text x="90" y="282" font-size="12" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">hoy: 2,725 K</text><text x="330" y="468" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el tiempo →   (treinta órdenes de magnitud de enfriamiento, y después nada)</text><rect x="660" y="212" width="380" height="280" fill="#131826" stroke="#2a3040"/><text x="850" y="236" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">y ζ está en el cielo</text><text x="684" y="274" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">la energía del fondo lleva adentro:</text><text x="850" y="304" font-size="20" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">ζ(4) = 1.082323</text><text x="850" y="326" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">= π⁴/90</text><text x="684" y="364" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">y contar los fotones necesita:</text><text x="850" y="394" font-size="20" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">ζ(3) = 1.202057</text><text x="850" y="416" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">la constante de Apéry, irracional</text><line x1="684" y1="438" x2="1016" y2="438" stroke="#2a3040"/><text x="850" y="464" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">4.1e+08 fotones</text><text x="850" y="484" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">por metro cúbico, ahora mismo, acá</text><rect x="20" y="508" width="1020" height="176" fill="#1a1216" stroke="#5a2a30"/><text x="530" y="534" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">lo que hay que declarar</text><text x="60" y="566" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· nada de esto es nuestro: Nernst 1912 (tercera ley) · Planck 1900 · Gibbons y Hawking 1977 (el piso)</text><text x="60" y="590" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· y todo depende de que la energía oscura sea una CONSTANTE de verdad. Si evoluciona, el piso se mueve.</text><text x="60" y="614" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· esto es FÍSICA, no matemática: se mide con telescopios y una medición nueva puede refutarlo mañana.</text><text x="530" y="650" font-size="12" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">Lo que sí es del laboratorio: haber encontrado a ζ esperándonos en la temperatura del cielo.</text><text x="530" y="672" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Todavía no.</text></svg>