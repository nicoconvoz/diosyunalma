<text x="600.0" y="730.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">«no persigas el 34,3σ — perseguí la forma que produce ese 34,3σ» — la auditora · zoom, nulos y reglas congelados antes de medir</text>
