<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL SONAR EXACTO — donde la aproximación se vuelve IGUALDAD</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">la profundidad, el logaritmo y el eco del murciélago, alineados · F415</text><rect x="20" y="76" width="1020" height="122" fill="#121a16" stroke="#2a5a40"/><text x="530" y="102" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">EL NÚMERO EXACTO QUE PEDISTE: no lleva «aproximadamente»</text><text x="530" y="146" font-size="22" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">ψ(x)  =  x  −  Σ x^ρ/ρ  −  ln(2π)  −  ½·ln(1 − 1/x²)</text><text x="300" y="178" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">↑ la aproximación de siempre</text><text x="620" y="178" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">↑ EL ECO DEL MURCIÉLAGO, que la vuelve exacta</text><rect x="20" y="214" width="620" height="280" fill="#131826" stroke="#2a3040"/><text x="330" y="238" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">ψ(30): la curva suave caminando a la escalera exacta</text><line x1="80" y1="175.4" x2="610" y2="175.4" stroke="#6ee7a0" stroke-dasharray="5,4" stroke-width="2"/><text x="606" y="167" font-size="11" fill="#6ee7a0" text-anchor="end" font-family="Georgia,serif">el valor EXACTO: 28.4765</text><circle cx="100.0" cy="194.2" r="5" fill="#f2c14e"/><text x="100" y="466" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">0</text><circle cx="166.0" cy="155.3" r="5" fill="#f2c14e"/><line x1="100.0" y1="194.2" x2="166.0" y2="155.3" stroke="#f2c14e" opacity="0.5"/><text x="166" y="466" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">1</text><circle cx="232.0" cy="176.0" r="5" fill="#f2c14e"/><line x1="166.0" y1="155.3" x2="232.0" y2="176.0" stroke="#f2c14e" opacity="0.5"/><text x="232" y="466" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">2</text><circle cx="298.0" cy="154.5" r="5" fill="#f2c14e"/><line x1="232.0" y1="176.0" x2="298.0" y2="154.5" stroke="#f2c14e" opacity="0.5"/><text x="298" y="466" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">5</text><circle cx="364.0" cy="180.6" r="5" fill="#f2c14e"/><line x1="298.0" y1="154.5" x2="364.0" y2="180.6" stroke="#f2c14e" opacity="0.5"/><text x="364" y="466" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">10</text><circle cx="430.0" cy="171.4" r="5" fill="#f2c14e"/><line x1="364.0" y1="180.6" x2="430.0" y2="171.4" stroke="#f2c14e" opacity="0.5"/><text x="430" y="466" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">20</text><circle cx="496.0" cy="169.8" r="5" fill="#f2c14e"/><line x1="430.0" y1="171.4" x2="496.0" y2="169.8" stroke="#f2c14e" opacity="0.5"/><text x="496" y="466" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">40</text><circle cx="562.0" cy="172.7" r="5" fill="#f2c14e"/><line x1="496.0" y1="169.8" x2="562.0" y2="172.7" stroke="#f2c14e" opacity="0.5"/><text x="562" y="466" font-size="10" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">79</text><text x="330" y="488" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">cuántos ecos del murciélago entraron en la cuenta</text><rect x="660" y="214" width="380" height="280" fill="#131826" stroke="#2a3040"/><text x="850" y="238" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">TU NÚMERO CLAVE, calculable</text><text x="850" y="284" font-size="19" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">γ_max ≈ 2π / |ln p − ln p'|</text><text x="850" y="312" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">cuánta orquesta hace falta</text><text x="850" y="330" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">para separar dos primos vecinos</text><line x1="684" y1="350" x2="1016" y2="350" stroke="#2a3040"/><text x="690" y="376" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">2 y 3</text><text x="810" y="376" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">0,4055</text><text x="1000" y="376" font-size="12" fill="#f2c14e" text-anchor="end" font-family="Georgia,serif">15,5</text><text x="690" y="406" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">11 y 13</text><text x="810" y="406" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">0,1671</text><text x="1000" y="406" font-size="12" fill="#f2c14e" text-anchor="end" font-family="Georgia,serif">37,6</text><text x="690" y="436" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">97 y 101</text><text x="810" y="436" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">0,0404</text><text x="1000" y="436" font-size="12" fill="#f2c14e" text-anchor="end" font-family="Georgia,serif">155,5</text><text x="850" y="460" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">más juntos los primos,</text><text x="850" y="478" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">más alto hay que escuchar</text><rect x="20" y="510" width="1020" height="172" fill="#1a1216" stroke="#5a2a30"/><text x="530" y="536" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">el precio, y por qué importa la Hipótesis</text><text x="60" y="570" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· NO hay una constante única: la exactitud la da la ORQUESTA ENTERA, infinitos ceros.</text><text x="60" y="594" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">· cambiaste una aproximación simple por una igualdad con una suma infinita adentro.</text><text x="60" y="626" font-size="12" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">· y el √x de la fórmula es el TAMAÑO MÁXIMO de cada eco — si todos los ceros están en la línea.</text><text x="530" y="660" font-size="12" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">La Hipótesis de Riemann es, literalmente, que ningún eco del murciélago suena más fuerte que √x.</text></svg>