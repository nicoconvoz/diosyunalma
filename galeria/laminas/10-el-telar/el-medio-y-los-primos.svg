<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL MEDIO Y LOS PRIMOS — dividir por dos no dice nada; dividir por la raíz lo dice todo</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">la trampa y el puente, separados con números · F393</text><rect x="20" y="76" width="500" height="240" fill="#1a1216" stroke="#5a2a30"/><text x="270" y="100" font-size="14" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⚠️ LA TRAMPA (duodécima) — p/2 da fracción</text><text x="44" y="132" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">primos impares con frac(p/2) = ½ exacto:</text><text x="496" y="132" font-size="13" fill="#f2c14e" text-anchor="end" font-family="Georgia,serif">100,0000 %</text><text x="44" y="158" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">COMPUESTOS impares, mismo test:</text><text x="496" y="158" font-size="13" fill="#f2c14e" text-anchor="end" font-family="Georgia,serif">100,0000 %</text><line x1="44" y1="176" x2="496" y2="176" stroke="#5a2a30"/><text x="44" y="202" font-size="13" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">señal / silencio = 1.0000</text><text x="44" y="228" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">No es de los primos: es la definición de impar.</text><text x="44" y="246" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">Todo primo salvo el 2 es impar porque si fuera par</text><text x="44" y="264" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">lo dividiría el 2. Ya cazada en F272 como la séptima.</text><text x="44" y="290" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">Y p/q entero solo en p/p = 1: la definición de primo.</text><rect x="540" y="76" width="500" height="240" fill="#121a16" stroke="#2a5a40"/><text x="790" y="100" font-size="14" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">⚡ LA RELACIÓN REAL — σ = ½ es dividir por la raíz</text><text x="564" y="130" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">ζ(s) = ∏ₚ (1 − p^(−s))^(−1) · cada primo pesa p^(−σ)</text><text x="564" y="158" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">σ = 1</text><text x="620" y="158" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">cada primo pesa 1/p — el borde donde Σ1/p diverge (Euler 1737)</text><text x="564" y="182" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">σ = 0</text><text x="620" y="182" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">su espejo bajo s ↦ 1−s</text><text x="564" y="206" font-size="12" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">σ = ½</text><text x="620" y="206" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">cada primo pesa 1/√p — el punto fijo del espejo</text><text x="564" y="240" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">el 2 → 1/√2 = 0,7071 · el 3 → 0,5774 · el 97 → 0,1015</text><text x="564" y="266" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">el 1 lo ponen los primos · el 0 lo pone la simetría</text><text x="564" y="284" font-size="12" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">el ½ = (0 + 1) / 2</text><rect x="20" y="336" width="1020" height="300" fill="#131826" stroke="#2a3040"/><text x="530" y="360" font-size="14" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">EL PUENTE HONDO: el ½ leído en los primos, sin mirar un solo cero</text><text x="530" y="382" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Von Koch 1901: RH ⟺ el error al contar primos es √x · el exponente del error ES el borde de los ceros</text><line x1="80" y1="590" x2="640" y2="590" stroke="#3a4050"/><line x1="80" y1="400" x2="80" y2="590" stroke="#3a4050"/><circle cx="80.0" cy="590.0" r="3.5" fill="#5ec8ff"/><circle cx="125.7" cy="578.1" r="3.5" fill="#5ec8ff"/><circle cx="171.4" cy="565.7" r="3.5" fill="#5ec8ff"/><circle cx="217.1" cy="544.4" r="3.5" fill="#5ec8ff"/><circle cx="262.8" cy="525.8" r="3.5" fill="#5ec8ff"/><circle cx="308.5" cy="505.3" r="3.5" fill="#5ec8ff"/><circle cx="354.2" cy="504.8" r="3.5" fill="#5ec8ff"/><circle cx="399.9" cy="482.8" r="3.5" fill="#5ec8ff"/><circle cx="445.6" cy="461.7" r="3.5" fill="#5ec8ff"/><circle cx="491.3" cy="453.8" r="3.5" fill="#5ec8ff"/><circle cx="537.0" cy="436.8" r="3.5" fill="#5ec8ff"/><circle cx="582.7" cy="411.1" r="3.5" fill="#5ec8ff"/><circle cx="628.4" cy="401.7" r="3.5" fill="#5ec8ff"/><circle cx="640.0" cy="400.0" r="3.5" fill="#5ec8ff"/><polyline points="80.0,590.0 125.7,578.1 171.4,565.7 217.1,544.4 262.8,525.8 308.5,505.3 354.2,504.8 399.9,482.8 445.6,461.7 491.3,453.8 537.0,436.8 582.7,411.1 628.4,401.7 640.0,400.0" fill="none" stroke="#5ec8ff" stroke-width="1" opacity="0.5"/><text x="360" y="616" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">log x  →  (bloques diádicos hasta 10⁷)</text><text x="70" y="495" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">log |ψ−x|</text><text x="90" y="416" font-size="12" fill="#5ec8ff" text-anchor="start" font-family="Georgia,serif">pendiente cruda θ = 0.4809</text><text x="90" y="436" font-size="12" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">corrigiendo log²x  θ = 0.3091</text><text x="680" y="416" font-size="12" fill="#e8e2d0" text-anchor="start" font-family="Georgia,serif">calibración del instrumento:</text><text x="680" y="440" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">sesgo x^0,70 plantado → mide 0,70</text><text x="680" y="458" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">sesgo x^0,90 plantado → mide 0,90</text><text x="680" y="476" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">moneda de Cramér → también ½</text><text x="680" y="504" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">√x es lo que da una moneda:</text><text x="680" y="522" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">el ½ dice que los primos cancelan</text><text x="680" y="540" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">como si tiraran al azar.</text><text x="680" y="572" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">A 10⁷ la asintótica es floja. Esto NO</text><text x="680" y="588" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">demuestra θ = ½ — eso ES la Hipótesis.</text><text x="530" y="626" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Todavía no.</text></svg>