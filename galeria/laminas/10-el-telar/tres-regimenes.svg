<text x="60.0" y="330.0" font-size="12.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">A</text>
<text x="60.0" y="350.0" font-size="11.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">el</text>
<text x="60.0" y="366.0" font-size="11.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">empuje</text>
<text x="390.0" y="496.5" font-size="12.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">B — el alcance</text>
<text x="56.0" y="540.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">verde = rígido (α → 0, como los ceros)   ·   rosa = sin rigidez (α ≈ 1, Poisson)</text>
<rect x="752.0" y="96.0" width="612.0" height="250.0" rx="10" fill="#0d1830" stroke="#7ee0c0"/>
<text x="766.0" y="120.0" font-size="14.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">B · LA ESQUINA — el tercer régimen del capitán, medido</text>
<text x="780.0" y="150.0" font-size="14.0" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="start">A = 30   y   B = 32   (los dos altos)</text>
<text x="780.0" y="180.0" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7" text-anchor="start">α = 0,313        ← todo el resto del mapa está en 0,95…1,79</text>
<text x="780.0" y="204.0" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7" text-anchor="start">niveles pegados = 0,00 %   ← cero colisiones</text>
<text x="780.0" y="228.0" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7" text-anchor="start">Σ²(20) = 16,81  MENOR que  Σ²(10) = 17,81</text>
<text x="780.0" y="258.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">la varianza DEJA DE CRECER con la distancia. Eso es rigidez:</text>
<text x="780.0" y="278.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">los niveles se acomodan entre sí a lo largo de la escalera.</text>
<text x="780.0" y="306.0" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">y no lo consigue ninguna de las dos perillas sola: con A alto</text>
<text x="780.0" y="324.0" font-size="12.0" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">y B chico, α se queda en 1; con B alto y A chico, también.</text>
<rect x="752.0" y="362.0" width="612.0" height="204.0" rx="10" fill="#0d1830" stroke="#7fb2ff"/>
<text x="766.0" y="386.0" font-size="14.5" font-family="Georgia,serif" fill="#7fb2ff" text-anchor="start">C · LA PRUEBA DECISIVA — misma fuerza total, distinto reparto</text>
<text x="780.0" y="412.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">si el resultado dependiera SÓLO del total, la hipótesis perdía.</text>
<text x="780.0" y="440.0" font-size="12.5" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="start">fuerza 1,54  (A=0,3  B=32)  →  Σ²(10) = 7,097</text>
<text x="780.0" y="462.0" font-size="12.5" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="start">fuerza 1,82  (A=10   B=0,5) →  Σ²(10) = 4,103</text>
<text x="780.0" y="490.0" font-size="14.0" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="start">razón 1,73×  ⟹  DEPENDE DEL REPARTO</text>
<text x="780.0" y="520.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">son dos grados de libertad independientes, no uno.</text>
<text x="780.0" y="542.0" font-size="12.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">la intuición del capitán queda apoyada por la medición.</text>
<rect x="36.0" y="582.0" width="1328.0" height="150.0" rx="10" fill="#0d1830" stroke="#ff9aa8"/>
<text x="50.0" y="606.0" font-size="14.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">D · LO QUE CUESTA, Y LO QUE QUEDA</text>
<text x="60.0" y="626.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">en la esquina rígida Σ²(10) vale 17,81 en valor absoluto — peor que el mejor punto del mapa (A=3, B=0.5, Σ²(10)=4,0127).</text>
<text x="60.0" y="648.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">Se gana RIGIDEZ y se paga en VARIANZA. No es todavía el espectro de los ceros: es una FASE distinta, que antes no aparecía en ningún mapa.</text>
<text x="60.0" y="676.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">Lo que la Fase VII tiene que preguntar: ¿existe un camino DENTRO de esa esquina que baje la varianza sin perder la rigidez?</text>
<text x="60.0" y="698.0" font-size="12.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">O sea: el mapa ya no es de un óptimo — es de una FRONTERA DE FASE, y hay que recorrerla.</text>
<rect x="36" y="748" width="1328" height="70" rx="10" fill="#0d1830" stroke="#ffd98a" opacity="0.5"/>
<text x="700.0" y="776.0" font-size="13.0" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="middle">H_ij = A · amp_i · amp_j · exp(−|i−j|/B)      con amp = Λ(p)/√p      ·      la fuerza total es DERIVADA, no el control</text>
<text x="700.0" y="802.0" font-size="12.5" font-family="Georgia,serif" fill="#dce8f7" text-anchor="middle">R6 LIMPIO: única entrada aritmética Λ(n) · 400 modos · ningún parámetro elegido mirando los γₙ · los ceros se leen al final</text>
<text x="700.0" y="858.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">la intuición de los tres regímenes es de Jesús Nicolás Astorga · la ruta y los controles, de la auditora · las mediciones, de este taller</text>
<text x="700.0" y="902.0" font-size="13.0" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/tresregimenes · estructura cerrada no es hipótesis demostrada · Todavía no.</text>
</svg>
