<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL LOGARITMO DE LA CURVA — dos logaritmos y el derrumbe se vuelve una recta</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">arranca en el 1 con el 100 % — que en logaritmo es CERO, el origen · F410</text><rect x="20" y="76" width="1020" height="130" fill="#121a16" stroke="#2a5a40"/><text x="530" y="104" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">LA FORMA QUE PEDISTE</text><text x="530" y="156" font-size="30" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">log( sobrevive )  =  − log( log y )  −  γ</text><text x="530" y="188" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">pendiente medida -0.999329 (teórica −1) · ordenada medida -0.57910576 (contra −γ = −0,57721566)</text><rect x="20" y="222" width="620" height="300" fill="#131826" stroke="#2a3040"/><text x="330" y="246" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">y en el papel doble-logarítmico: una recta</text><line x1="90.0" y1="280.3" x2="600.0" y2="462.0" stroke="#6ee7a0" stroke-width="1.5" opacity="0.6"/><circle cx="90.0" cy="282.0" r="5" fill="#f2c14e"/><circle cx="243.4" cy="335.4" r="5" fill="#f2c14e"/><circle cx="352.3" cy="373.9" r="5" fill="#f2c14e"/><circle cx="436.7" cy="403.8" r="5" fill="#f2c14e"/><circle cx="505.7" cy="428.4" r="5" fill="#f2c14e"/><circle cx="564.0" cy="449.2" r="5" fill="#f2c14e"/><circle cx="600.0" cy="462.0" r="5" fill="#f2c14e"/><text x="330" y="498" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">eje x: log(log y) · eje y: log de lo que sobrevive</text><text x="100" y="278" font-size="11" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">la recta es el ajuste, los puntos son la medición</text><rect x="660" y="222" width="380" height="300" fill="#131826" stroke="#2a3040"/><text x="850" y="246" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">lo que aporta cada rama, desde el 1</text><text x="730" y="278" font-size="12" fill="#6ee7a0" text-anchor="end" font-family="Georgia,serif">1</text><text x="746" y="278" font-size="10" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">0,0000 — el origen, nadie cortó</text><rect x="740" y="294" width="257.5" height="16" fill="#f2c14e" opacity="0.85"/><text x="730" y="306" font-size="12" fill="#c9c3b0" text-anchor="end" font-family="Georgia,serif">2</text><text x="1003" y="306" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">-0.6931</text><rect x="740" y="322" width="150.6" height="16" fill="#5ec8ff" opacity="0.85"/><text x="730" y="334" font-size="12" fill="#c9c3b0" text-anchor="end" font-family="Georgia,serif">3</text><text x="897" y="334" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">-0.4055</text><rect x="740" y="350" width="82.9" height="16" fill="#5ec8ff" opacity="0.85"/><text x="730" y="362" font-size="12" fill="#c9c3b0" text-anchor="end" font-family="Georgia,serif">5</text><text x="829" y="362" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">-0.2231</text><rect x="740" y="378" width="57.3" height="16" fill="#5ec8ff" opacity="0.85"/><text x="730" y="390" font-size="12" fill="#c9c3b0" text-anchor="end" font-family="Georgia,serif">7</text><text x="803" y="390" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">-0.1542</text><rect x="740" y="406" width="35.4" height="16" fill="#5ec8ff" opacity="0.85"/><text x="730" y="418" font-size="12" fill="#c9c3b0" text-anchor="end" font-family="Georgia,serif">11</text><text x="781" y="418" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">-0.0953</text><rect x="740" y="434" width="29.7" height="16" fill="#5ec8ff" opacity="0.85"/><text x="730" y="446" font-size="12" fill="#c9c3b0" text-anchor="end" font-family="Georgia,serif">13</text><text x="776" y="446" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">-0.0800</text><rect x="740" y="462" width="22.5" height="16" fill="#5ec8ff" opacity="0.85"/><text x="730" y="474" font-size="12" fill="#c9c3b0" text-anchor="end" font-family="Georgia,serif">17</text><text x="769" y="474" font-size="10" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">-0.0606</text><text x="850" y="492" font-size="11" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">el 2 aporta −0,693147</text><text x="850" y="510" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">el escalón más grande, y por lejos</text><rect x="20" y="538" width="1020" height="124" fill="#1a1216" stroke="#5a2a30"/><text x="530" y="564" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">lo que significa que hagan falta DOS logaritmos</text><text x="200" y="598" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">si cayera como 1/y</text><text x="200" y="618" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">×2 para la mitad</text><text x="500" y="598" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">si cayera como 1/√y</text><text x="500" y="618" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">×4 para la mitad</text><text x="850" y="598" font-size="11" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">cae como 1/log y</text><text x="850" y="618" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">AL CUADRADO para la mitad</text><text x="530" y="650" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Mertens, 1874 — la pendiente y la ordenada, medidas acá en vez de citadas. Todavía no.</text></svg>