<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LA PROFUNDIDAD — el porcentaje de primos cae como 1 sobre las CIFRAS</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">la pieza que faltaba, y la palabra del capitán resultó la exacta · F414</text><rect x="20" y="76" width="1020" height="290" fill="#131826" stroke="#2a3040"/><text x="530" y="102" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">cuántos primos hay, por profundidad</text><rect x="70.0" y="106.0" width="76" height="224.0" fill="#f2c14e" opacity="0.88"/><text x="108" y="96" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">40.0%</text><text x="108" y="348" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">10^1</text><text x="108" y="364" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">1 cifras</text><rect x="192.0" y="190.0" width="76" height="140.0" fill="#f2c14e" opacity="0.88"/><text x="230" y="180" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">25.0%</text><text x="230" y="348" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">10^2</text><text x="230" y="364" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">2 cifras</text><text x="168" y="158" font-size="10" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">×0.62</text><rect x="314.0" y="235.9" width="76" height="94.1" fill="#f2c14e" opacity="0.88"/><text x="352" y="226" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">16.8%</text><text x="352" y="348" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">10^3</text><text x="352" y="364" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">3 cifras</text><text x="290" y="204" font-size="10" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">×0.67</text><rect x="436.0" y="261.2" width="76" height="68.8" fill="#f2c14e" opacity="0.88"/><text x="474" y="251" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">12.3%</text><text x="474" y="348" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">10^4</text><text x="474" y="364" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">4 cifras</text><text x="412" y="229" font-size="10" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">×0.73</text><rect x="558.0" y="276.3" width="76" height="53.7" fill="#f2c14e" opacity="0.88"/><text x="596" y="266" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">9.6%</text><text x="596" y="348" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">10^5</text><text x="596" y="364" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">5 cifras</text><text x="534" y="244" font-size="10" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">×0.78</text><rect x="680.0" y="286.0" width="76" height="44.0" fill="#f2c14e" opacity="0.88"/><text x="718" y="276" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">7.8%</text><text x="718" y="348" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">10^6</text><text x="718" y="364" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">6 cifras</text><text x="656" y="254" font-size="10" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">×0.82</text><rect x="802.0" y="292.8" width="76" height="37.2" fill="#f2c14e" opacity="0.88"/><text x="840" y="283" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">6.6%</text><text x="840" y="348" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">10^7</text><text x="840" y="364" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">7 cifras</text><text x="778" y="261" font-size="10" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">×0.85</text><rect x="924.0" y="297.7" width="76" height="32.3" fill="#f2c14e" opacity="0.88"/><text x="962" y="288" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">5.8%</text><text x="962" y="348" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">10^8</text><text x="962" y="364" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">8 cifras</text><text x="900" y="266" font-size="10" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">×0.87</text><text x="530" y="356" font-size="11" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">los números verdes son la caída de un escalón al siguiente — y valen k/(k+1)</text><rect x="20" y="382" width="500" height="150" fill="#121a16" stroke="#2a5a40"/><text x="270" y="408" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">LA LEY DE LA PROFUNDIDAD</text><text x="270" y="452" font-size="20" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">porcentaje ≈ 1 / (2,3026 × cifras)</text><text x="270" y="484" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">de 3 cifras a 4 se multiplica por 3/4</text><text x="270" y="506" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">de 7 a 8, por 7/8 — cada cifra cuesta menos</text><rect x="540" y="382" width="500" height="150" fill="#1a1216" stroke="#5a2a30"/><text x="790" y="408" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⛔ y la puntería NO mejora</text><text x="660" y="444" font-size="11" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">fórmula afinada</text><text x="660" y="470" font-size="18" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">8.27 %</text><text x="920" y="444" font-size="11" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">al azar</text><text x="920" y="470" font-size="18" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">8.17 %</text><text x="790" y="508" font-size="11" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">el problema nunca fue llegar al lugar</text><rect x="20" y="548" width="1020" height="134" fill="#121a16" stroke="#2a5a40"/><text x="530" y="576" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">⚡ LO QUE LA PROFUNDIDAD SÍ COMPRA: el camino</text><text x="530" y="606" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">desde el lugar que señala la fórmula, hacen falta unos POCOS PASOS para pisar un primo</text><text x="530" y="632" font-size="12" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">y así es exactamente como el mundo fabrica los primos grandes de las claves de tu banco</text><text x="530" y="660" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">se elige un número del tamaño correcto y se camina probando. Poco romántico, y enorme. Todavía no.</text></svg>