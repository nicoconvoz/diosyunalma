<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700"><rect width="1060" height="700" fill="#0d1017"/><text x="530.0" y="42.0" font-family="Georgia,serif" font-size="24" fill="#e8e2d0" text-anchor="middle">EL AFINADOR</text><text x="530.0" y="68.0" font-family="Georgia,serif" font-size="12" fill="#8a8676" text-anchor="middle">«igualá la fórmula a raíz de x, y en el cambiaformas poné todos los números en una variable, a ver si alguno desentona»</text><rect x="20" y="92" width="500" height="250" fill="#131826" stroke="#2a3040"/><text x="270.0" y="118.0" font-family="Georgia,serif" font-size="13" fill="#6ee7a0" text-anchor="middle">A · dividida por √x, la x queda en un solo lugar</text><text x="270.0" y="156.0" font-family="Georgia,serif" font-size="16" fill="#f2c14e" text-anchor="middle">ψ(x) − x</text><line x1="170" y1="164" x2="370" y2="164" stroke="#f2c14e" stroke-width="1.5"/><text x="270.0" y="186.0" font-family="Georgia,serif" font-size="16" fill="#f2c14e" text-anchor="middle">√x</text><text x="270.0" y="216.0" font-family="Georgia,serif" font-size="13" fill="#e8e2d0" text-anchor="middle">= − Σ  2 · cos(γ · ln x + φ) / |ρ|</text><text x="270.0" y="248.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">la amplitud 2/|ρ| YA NO DEPENDE DE x</text><text x="270.0" y="268.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">la x sobrevive adentro del coseno, como ln x</text><text x="270.0" y="300.0" font-family="Georgia,serif" font-size="12" fill="#6ee7a0" text-anchor="middle">esa es la única variable: u = ln x</text><text x="270.0" y="322.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">todo número del mundo es un punto de esa recta</text><rect x="540" y="92" width="500" height="250" fill="#131826" stroke="#2a3040"/><text x="790.0" y="118.0" font-family="Georgia,serif" font-size="13" fill="#6ee7a0" text-anchor="middle">B · el cambiaformas manda la línea al círculo</text><circle cx="790" cy="230" r="78" fill="none" stroke="#f2c14e" stroke-width="1.6"/><circle cx="868.0" cy="230.0" r="2.6" fill="#6ee7a0"/><circle cx="865.7" cy="248.7" r="2.6" fill="#6ee7a0"/><circle cx="859.1" cy="266.2" r="2.6" fill="#6ee7a0"/><circle cx="848.4" cy="281.7" r="2.6" fill="#6ee7a0"/><circle cx="834.3" cy="294.2" r="2.6" fill="#6ee7a0"/><circle cx="817.7" cy="302.9" r="2.6" fill="#6ee7a0"/><circle cx="799.4" cy="307.4" r="2.6" fill="#6ee7a0"/><circle cx="780.6" cy="307.4" r="2.6" fill="#6ee7a0"/><circle cx="762.3" cy="302.9" r="2.6" fill="#6ee7a0"/><circle cx="745.7" cy="294.2" r="2.6" fill="#6ee7a0"/><circle cx="731.6" cy="281.7" r="2.6" fill="#6ee7a0"/><circle cx="720.9" cy="266.2" r="2.6" fill="#6ee7a0"/><circle cx="714.3" cy="248.7" r="2.6" fill="#6ee7a0"/><circle cx="712.0" cy="230.0" r="2.6" fill="#6ee7a0"/><circle cx="714.3" cy="211.3" r="2.6" fill="#6ee7a0"/><circle cx="720.9" cy="193.8" r="2.6" fill="#6ee7a0"/><circle cx="731.6" cy="178.3" r="2.6" fill="#6ee7a0"/><circle cx="745.7" cy="165.8" r="2.6" fill="#6ee7a0"/><circle cx="762.3" cy="157.1" r="2.6" fill="#6ee7a0"/><circle cx="780.6" cy="152.6" r="2.6" fill="#6ee7a0"/><circle cx="799.4" cy="152.6" r="2.6" fill="#6ee7a0"/><circle cx="817.7" cy="157.1" r="2.6" fill="#6ee7a0"/><circle cx="834.3" cy="165.8" r="2.6" fill="#6ee7a0"/><circle cx="848.4" cy="178.3" r="2.6" fill="#6ee7a0"/><circle cx="859.1" cy="193.8" r="2.6" fill="#6ee7a0"/><circle cx="865.7" cy="211.3" r="2.6" fill="#6ee7a0"/><circle cx="766.5" cy="262.3" r="3.4" fill="#ff6b6b"/><text x="758.5" y="280.3" font-family="Georgia,serif" font-size="10" fill="#ff6b6b" text-anchor="middle">σ&gt;½</text><text x="660.0" y="168.0" font-family="Georgia,serif" font-size="11" fill="#e8e2d0" text-anchor="start">w(s) = 1 − 1/s</text><text x="660.0" y="186.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">|w(½+iγ)| = 1 exacto</text><text x="940.0" y="330.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="end">una variable por cero: el radio</text><rect x="20" y="356" width="500" height="196" fill="#131826" stroke="#2a3040"/><text x="270.0" y="382.0" font-family="Georgia,serif" font-size="13" fill="#e8e2d0" text-anchor="middle">C · el control que PUEDE fallar — y falla arriba</text><text x="70.0" y="412.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="start">σ</text><text x="190.0" y="412.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="start">γ</text><text x="470.0" y="412.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="end">1 − |w|</text><text x="70.0" y="438.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">0,60</text><text x="190.0" y="438.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">14,13</text><text x="470.0" y="438.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">5,0 × 10⁻⁴</text><text x="70.0" y="464.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">0,60</text><text x="190.0" y="464.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">100</text><text x="470.0" y="464.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">1,0 × 10⁻⁵</text><text x="70.0" y="490.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">0,60</text><text x="190.0" y="490.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">500</text><text x="470.0" y="490.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">4,0 × 10⁻⁷</text><text x="270.0" y="534.0" font-family="Georgia,serif" font-size="11" fill="#ff6b6b" text-anchor="middle">el desvío muere como 1/γ²: el afinador se queda SORDO en altura</text><rect x="540" y="356" width="500" height="196" fill="#131826" stroke="#2a3040"/><text x="790.0" y="382.0" font-family="Georgia,serif" font-size="13" fill="#e8e2d0" text-anchor="middle">D · el eco desentonado, dividido por √x</text><text x="790.0" y="412.0" font-family="Georgia,serif" font-size="13" fill="#f2c14e" text-anchor="middle">x^(σ − ½)</text><text x="600.0" y="442.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="start">x</text><text x="790.0" y="442.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">σ=0,51</text><text x="980.0" y="442.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="end">σ=0,6</text><text x="600.0" y="468.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">10⁶</text><text x="790.0" y="468.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">1,15</text><text x="980.0" y="468.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">3,98</text><text x="600.0" y="494.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">10³⁰</text><text x="790.0" y="494.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">2,00</text><text x="980.0" y="494.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">1000</text><text x="600.0" y="520.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="start">10¹⁰⁰</text><text x="790.0" y="520.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">10,0</text><text x="980.0" y="520.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="end">10¹⁰</text><text x="790.0" y="534.0" font-family="Georgia,serif" font-size="11" fill="#8a8676" text-anchor="middle">un solo desafinado termina tapando a toda la orquesta</text><rect x="20" y="566" width="1020" height="116" fill="#1a1216" stroke="#5a2a30"/><text x="530.0" y="592.0" font-family="Georgia,serif" font-size="12" fill="#ff6b6b" text-anchor="middle">honesto: |w| = 1 en la línea es geometría de Möbius — una REESCRITURA exacta de la Hipótesis, no una demostración</text><text x="530.0" y="618.0" font-family="Georgia,serif" font-size="11" fill="#c9c3b0" text-anchor="middle">y solo juzga ceros que ya encontramos: de los que faltan no dice nada, y arriba pierde el oído como 1/γ²</text><text x="530.0" y="656.0" font-family="Georgia,serif" font-size="13" fill="#6ee7a0" text-anchor="middle">estar afinado es estar en el círculo. La Hipótesis es que NINGUNO desentona.</text></svg>