<text x="124.0" y="148.0" font-size="11.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">dorado: ACOPLADO auto-consistente (la hipotesis)</text>
<text x="124.0" y="166.0" font-size="11.5" font-family="Georgia,serif" fill="#ff9aa8" text-anchor="start">rosa: desplazamiento A POSTERIORI (Fase XVII)</text>
<text x="124.0" y="184.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="start">celeste: acoplado con FASE DESTRUIDA (control asesino)</text>
<text x="450.0" y="620.0" font-size="11.5" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">s = gap / espaciado medio local</text>
<text x="820.0" y="130.0" font-size="13.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="start">LA CONSTRUCCION, SIN PERILLAS</text>
<text x="820.0" y="158.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">u_k = puntos GUE desplegados</text>
<text x="820.0" y="178.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">g_k resuelve:</text>
<text x="820.0" y="198.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">N_liso(g) + S(g) = u_k</text>
<text x="820.0" y="218.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">el campo entra ADENTRO del</text>
<text x="820.0" y="238.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">clavado: tamanos y posiciones</text>
<text x="820.0" y="258.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">emergen JUNTOS - la hipotesis</text>
<text x="820.0" y="278.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">de la fase, hecha ecuacion.</text>
<text x="820.0" y="298.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">(el gas de Coulomb queda</text>
<text x="820.0" y="318.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">declarado y diferido: necesita</text>
<text x="820.0" y="338.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">temperatura = perilla)</text>
<text x="820.0" y="380.0" font-size="13.5" font-family="Georgia,serif" fill="#7ee0c0" text-anchor="start">EL JUICIO</text>
<text x="820.0" y="408.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">cruce acoplado: 0.96/0.90/0.88</text>
<text x="820.0" y="428.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">cruce real: 0.865</text>
<text x="820.0" y="448.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">amplitudes, T1-T4, residuo y</text>
<text x="820.0" y="468.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">el veredicto contra los criterios</text>
<text x="820.0" y="488.0" font-size="12.0" font-family="Georgia,serif" fill="#dce8f7" text-anchor="start">del 16-17 de la auditora: en el acta.</text>
<text x="620.0" y="730.0" font-size="12.0" font-family="Georgia,serif" fill="#8fb4d9" text-anchor="middle">XVI: no basta mover tamanos - XVII: no basta mover posiciones despues - XVIII: probar si emergen juntos</text>
<text x="620.0" y="756.0" font-size="12.5" font-family="Georgia,serif" fill="#ffd98a" text-anchor="middle">go run ./cmd/laformulamadre fase18 - estructura cerrada no es hipotesis demostrada - Todavia no.</text>
