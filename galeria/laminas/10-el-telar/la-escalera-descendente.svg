<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">LA ESCALERA DESCENDENTE — baja, cruza el cero sin pisarlo, y toca fondo en ±1</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">agregarle una raíz más a cada factor · el fondo es la ecuación de Pell · F399</text><rect x="20" y="76" width="620" height="300" fill="#131826" stroke="#2a3040"/><text x="330" y="100" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">la escalera del 5, escalón por escalón</text><line x1="60" y1="251" x2="610" y2="251" stroke="#ff6b6b" stroke-dasharray="4,3"/><text x="606" y="245" font-size="11" fill="#ff6b6b" text-anchor="end" font-family="Georgia,serif">el cero — nunca se pisa</text><rect x="57.0" y="215.3" width="46" height="35.7" fill="#f2c14e" opacity="0.85"/><text x="80" y="207" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">23</text><text x="80" y="360" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">b=1</text><rect x="125.0" y="224.7" width="46" height="26.3" fill="#f2c14e" opacity="0.85"/><text x="148" y="217" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">17</text><text x="148" y="360" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">b=2</text><rect x="193.0" y="240.2" width="46" height="10.8" fill="#f2c14e" opacity="0.85"/><text x="216" y="232" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">7</text><text x="216" y="360" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">b=3</text><rect x="261.0" y="251.0" width="46" height="10.9" fill="#6ee7a0" opacity="0.85"/><text x="284" y="276" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">-7</text><text x="284" y="360" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">b=4</text><rect x="329.0" y="251.0" width="46" height="38.8" fill="#5ec8ff" opacity="0.85"/><text x="352" y="304" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">-25</text><text x="352" y="360" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">b=5</text><rect x="397.0" y="251.0" width="46" height="72.9" fill="#6ee7a0" opacity="0.85"/><text x="420" y="338" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">-47</text><text x="420" y="360" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">b=6</text><rect x="465.0" y="251.0" width="46" height="113.1" fill="#6ee7a0" opacity="0.85"/><text x="488" y="378" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">-73</text><text x="488" y="360" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">b=7</text><rect x="533.0" y="251.0" width="46" height="159.6" fill="#6ee7a0" opacity="0.85"/><text x="556" y="425" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">-103</text><text x="556" y="360" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">b=8</text><text x="70" y="124" font-size="10" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">■ primo positivo</text><text x="190" y="124" font-size="10" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">■ primo en valor absoluto</text><text x="360" y="124" font-size="10" fill="#5ec8ff" text-anchor="start" font-family="Georgia,serif">■ compuesto</text><rect x="660" y="76" width="380" height="300" fill="#121a16" stroke="#2a5a40"/><text x="850" y="100" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">EL FONDO: ±1, y quién lo toca</text><text x="684" y="134" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">3 / 2</text><text x="770" y="134" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">9 − 8 = +1</text><text x="1016" y="134" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">1,500000000</text><text x="684" y="164" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">7 / 5</text><text x="770" y="164" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">49 − 50 = −1</text><text x="1016" y="164" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">1,400000000</text><text x="684" y="194" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">17 / 12</text><text x="770" y="194" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">289 − 288 = +1</text><text x="1016" y="194" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">1,416666667</text><text x="684" y="224" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">41 / 29</text><text x="770" y="224" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">1681 − 1682 = −1</text><text x="1016" y="224" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">1,413793103</text><text x="684" y="254" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">99 / 70</text><text x="770" y="254" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">9801 − 9800 = +1</text><text x="1016" y="254" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">1,414285714</text><text x="684" y="284" font-size="13" fill="#f2c14e" text-anchor="start" font-family="Georgia,serif">169 / 119</text><text x="770" y="284" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">28561 − 28562 = −1</text><text x="1016" y="284" font-size="11" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">1,414285714</text><line x1="684" y1="306" x2="1016" y2="306" stroke="#2a5a40"/><text x="850" y="330" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">√2 = 1,414213562373…</text><text x="850" y="352" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">son los convergentes de √2: ecuación de Pell</text><rect x="20" y="392" width="1020" height="130" fill="#131826" stroke="#2a3040"/><text x="530" y="418" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">qué primos puede alcanzar la escalera, y cuáles nunca</text><text x="60" y="452" font-size="12" fill="#6ee7a0" text-anchor="start" font-family="Georgia,serif">SÍ aparecen (≡ ±1 mod 8):</text><text x="320" y="452" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">2 · 7 · 17 · 23 · 31 · 41 · 47 · 71 · 73 · 79 · 89 · 97 · 103 · 113 · 127 · 137 …</text><text x="60" y="486" font-size="12" fill="#ff6b6b" text-anchor="start" font-family="Georgia,serif">NUNCA aparecen (≡ 3, 5 mod 8):</text><text x="320" y="486" font-size="12" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">3 · 5 · 11 · 13 · 19 · 29 · 37 · 43 · 53 · 59 · 61 · 67 · 83 · 101 · 107 · 109 …</text><text x="1000" y="508" font-size="10" fill="#8a8676" text-anchor="end" font-family="Georgia,serif">cero violaciones — la ley de F398</text><rect x="20" y="538" width="1020" height="124" fill="#1a1216" stroke="#5a2a30"/><text x="530" y="564" font-size="13" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⚠️ la trampa decimoctava, declarada</text><text x="530" y="592" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">Que la escalera NUNCA pise el cero no lo medimos nosotros: si a² − 2b² fuera 0, √2 sería a/b.</text><text x="530" y="614" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">Es la demostración más vieja de la matemática, de los griegos. Verificarlo prueba el código, no descubre nada.</text><text x="530" y="644" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Y el fondo tampoco es nuestro: ecuación de Pell, Brahmagupta siglo VII, Lagrange 1768. Todavía no.</text></svg>