<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680"><rect width="100%" height="100%" fill="#0d1017"/><text x="530" y="32" font-size="20" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">EL DESCENSO AL MÍNIMO — y el mínimo es el 2, que se reproduce a sí mismo</text><text x="530" y="54" font-size="12" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">partirle al 5 lo mismo que se le partió al 23, una y otra vez · F400</text><rect x="20" y="76" width="620" height="330" fill="#131826" stroke="#2a3040"/><text x="330" y="100" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">el descenso desde el 5, escalón por escalón</text><line x1="60" y1="356.0" x2="610" y2="356.0" stroke="#6ee7a0" stroke-dasharray="5,4"/><text x="606" y="374" font-size="12" fill="#6ee7a0" text-anchor="end" font-family="Georgia,serif">el 2 — el fondo</text><circle cx="90.0" cy="146.0" r="6" fill="#f2c14e"/><line x1="90.0" y1="146.0" x2="152.0" y2="310.8" stroke="#f2c14e" stroke-width="1.4" opacity="0.6"/><text x="90" y="132" font-size="11" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">5.0000</text><circle cx="152.0" cy="310.8" r="6" fill="#f2c14e"/><line x1="152.0" y1="310.8" x2="214.0" y2="345.1" stroke="#f2c14e" stroke-width="1.4" opacity="0.6"/><text x="152" y="297" font-size="11" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">2.6458</text><circle cx="214.0" cy="345.1" r="6" fill="#f2c14e"/><line x1="214.0" y1="345.1" x2="276.0" y2="353.3" stroke="#f2c14e" stroke-width="1.4" opacity="0.6"/><text x="214" y="331" font-size="11" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">2.1554</text><circle cx="276.0" cy="353.3" r="6" fill="#f2c14e"/><line x1="276.0" y1="353.3" x2="338.0" y2="355.3" stroke="#f2c14e" stroke-width="1.4" opacity="0.6"/><text x="276" y="339" font-size="11" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">2.0385</text><circle cx="338.0" cy="355.3" r="6" fill="#f2c14e"/><line x1="338.0" y1="355.3" x2="400.0" y2="355.8" stroke="#f2c14e" stroke-width="1.4" opacity="0.6"/><text x="338" y="341" font-size="11" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">2.0096</text><circle cx="400.0" cy="355.8" r="6" fill="#f2c14e"/><line x1="400.0" y1="355.8" x2="462.0" y2="356.0" stroke="#f2c14e" stroke-width="1.4" opacity="0.6"/><circle cx="462.0" cy="356.0" r="6" fill="#f2c14e"/><line x1="462.0" y1="356.0" x2="524.0" y2="356.0" stroke="#f2c14e" stroke-width="1.4" opacity="0.6"/><circle cx="524.0" cy="356.0" r="6" fill="#f2c14e"/><line x1="524.0" y1="356.0" x2="586.0" y2="356.0" stroke="#f2c14e" stroke-width="1.4" opacity="0.6"/><circle cx="586.0" cy="356.0" r="6" fill="#f2c14e"/><text x="330" y="390" font-size="10" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">5 → √7 → √(2+√7) → … cada paso parte el ángulo al medio</text><rect x="660" y="76" width="380" height="330" fill="#121a16" stroke="#2a5a40"/><text x="850" y="102" font-size="13" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">EL MÍNIMO SE REPRODUCE</text><text x="850" y="152" font-size="17" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">(2 + √2)(2 − √2)</text><text x="850" y="184" font-size="15" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">= 4 − 2 =</text><text x="850" y="224" font-size="34" fill="#6ee7a0" text-anchor="middle" font-family="Georgia,serif">2</text><line x1="690" y1="256" x2="1010" y2="256" stroke="#2a5a40"/><text x="850" y="284" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">el mismo 2 con el que empezó</text><text x="690" y="318" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">x² − 2 = x  ⟹  (x−2)(x+1) = 0</text><text x="690" y="340" font-size="11" fill="#c9c3b0" text-anchor="start" font-family="Georgia,serif">⟹  x = 2, y no hay otro</text><text x="690" y="372" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">abajo del 2 se desbarranca</text><text x="690" y="390" font-size="11" fill="#8a8676" text-anchor="start" font-family="Georgia,serif">arriba del 2 se dispara</text><rect x="20" y="422" width="1020" height="118" fill="#131826" stroke="#2a3040"/><text x="530" y="448" font-size="13" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">el porqué: la operación DUPLICA UN ÁNGULO</text><text x="530" y="480" font-size="14" fill="#5ec8ff" text-anchor="middle" font-family="Georgia,serif">n = 2·cosh(t)   ⟹   n² − 2 = 2·cosh(2t)</text><text x="530" y="508" font-size="12" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">subir duplica t · bajar lo parte al medio · el fondo es t = 0, donde 2·cosh(0) = 2</text><text x="530" y="530" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">es la recurrencia de Chebyshev; con ángulos reales, 4cos²θ − 2 = 2cos(2θ)</text><rect x="20" y="556" width="500" height="106" fill="#131826" stroke="#2a3040"/><text x="270" y="580" font-size="12" fill="#e8e2d0" text-anchor="middle" font-family="Georgia,serif">y para arriba, desde el 3:</text><text x="270" y="608" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Georgia,serif">3 → 7 → 47 → 2207 → 4870847 → …</text><text x="270" y="632" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">los números de Lucas en las potencias de dos</text><text x="270" y="650" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">L(2) · L(4) · L(8) · L(16) · L(32)</text><rect x="540" y="556" width="500" height="106" fill="#1a1216" stroke="#5a2a30"/><text x="790" y="580" font-size="12" fill="#ff6b6b" text-anchor="middle" font-family="Georgia,serif">⚠️ trampa decimonovena, declarada</text><text x="790" y="606" font-size="13" fill="#c9c3b0" text-anchor="middle" font-family="Georgia,serif">2 = √(2 + √(2 + √(2 + …)))</text><text x="790" y="630" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">identidad clásica de cualquier libro de análisis.</text><text x="790" y="648" font-size="11" fill="#8a8676" text-anchor="middle" font-family="Georgia,serif">Chebyshev y Lucas tampoco son nuestros. Todavía no.</text></svg>