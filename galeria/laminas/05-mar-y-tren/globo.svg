<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820"><rect width="100%" height="100%" fill="#0b1526"/><text x="620" y="44" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">El Globo del Oceano — la esfera de Riemann</text><text x="620" y="68" font-size="14" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">el plano infinito mas el punto del infinito = una esfera; girar el mundo = una transformacion de Moebius</text><circle cx="360" cy="440" r="280" fill="#12305e" stroke="#7fb2ff" stroke-width="2"/><ellipse cx="360" cy="440" rx="280" ry="84" fill="none" stroke="#3a5f96" stroke-width="1" stroke-dasharray="6,5"/><ellipse cx="360" cy="286" rx="232" ry="56" fill="none" stroke="#2c4a78" stroke-width="1" stroke-dasharray="4,6"/><line x1="360" y1="160" x2="360" y2="720" stroke="#ffd166" stroke-width="3"/><text x="344" y="440" font-size="14" font-family="Georgia" fill="#ffd166" transform="rotate(-90 344 440)" text-anchor="middle">el meridiano critico — Re s = 1/2</text><circle cx="360" cy="160" r="7" fill="#ff5d73" stroke="#fff"/><text x="360" y="144" font-size="16" font-family="Georgia" fill="#ff9eae" text-anchor="middle">&#8734;  el punto del infinito — un lugar del mapa</text><circle cx="360" cy="720" r="5" fill="#9dc1ee"/><text x="360" y="740" font-size="13" font-family="Georgia" fill="#9dc1ee" text-anchor="middle">t = 1</text><circle cx="360" cy="717.1" r="5" fill="#7fd7a8" stroke="#fff" stroke-width="1"/><line x1="366" y1="717.1" x2="672" y2="146.0" stroke="#44608c" stroke-width="1"/><text x="680" y="150" font-size="14" font-family="Georgia" fill="#dce8f7">gamma_1 (14.13)</text><circle cx="360" cy="666.5" r="5" fill="#7fd7a8" stroke="#fff" stroke-width="1"/><line x1="366" y1="666.5" x2="672" y2="182.0" stroke="#44608c" stroke-width="1"/><text x="680" y="186" font-size="14" font-family="Georgia" fill="#dce8f7">puerta 10^5</text><circle cx="360" cy="600.9" r="5" fill="#7fd7a8" stroke="#fff" stroke-width="1"/><line x1="366" y1="600.9" x2="672" y2="218.0" stroke="#44608c" stroke-width="1"/><text x="680" y="222" font-size="14" font-family="Georgia" fill="#dce8f7">cero #10^8</text><circle cx="360" cy="443.9" r="5" fill="#ff5d73" stroke="#fff" stroke-width="1"/><line x1="366" y1="443.9" x2="672" y2="254.0" stroke="#44608c" stroke-width="1"/><text x="680" y="258" font-size="14" font-family="Georgia" fill="#dce8f7">Playa I</text><circle cx="360" cy="326.4" r="5" fill="#ff5d73" stroke="#fff" stroke-width="1"/><line x1="366" y1="326.4" x2="672" y2="290.0" stroke="#44608c" stroke-width="1"/><text x="680" y="294" font-size="14" font-family="Georgia" fill="#dce8f7">Playa II</text><circle cx="360" cy="234.8" r="5" fill="#ff5d73" stroke="#fff" stroke-width="1"/><line x1="366" y1="234.8" x2="672" y2="326.0" stroke="#44608c" stroke-width="1"/><text x="680" y="330" font-size="14" font-family="Georgia" fill="#dce8f7">Playa III</text><circle cx="360" cy="189.0" r="5" fill="#ff5d73" stroke="#fff" stroke-width="1"/><line x1="366" y1="189.0" x2="672" y2="362.0" stroke="#44608c" stroke-width="1"/><text x="680" y="366" font-size="14" font-family="Georgia" fill="#dce8f7">Playa IV</text><circle cx="360" cy="172.1" r="5" fill="#ff5d73" stroke="#fff" stroke-width="1"/><line x1="366" y1="172.1" x2="672" y2="398.0" stroke="#44608c" stroke-width="1"/><text x="680" y="402" font-size="14" font-family="Georgia" fill="#dce8f7">Playa V</text><circle cx="360" cy="162.0" r="5" fill="#e6a53a" stroke="#fff" stroke-width="1"/><line x1="366" y1="162.0" x2="672" y2="434.0" stroke="#44608c" stroke-width="1"/><text x="680" y="438" font-size="14" font-family="Georgia" fill="#dce8f7">Playa VI (en camino)</text><rect x="780" y="500" width="420" height="250" fill="#0f1e38" stroke="#44608c" rx="10"/><text x="798" y="532" font-size="17" font-family="Georgia" fill="#ffd166">EL GIRO — asi se navega el globo</text><text x="798" y="558" font-size="13" font-family="Georgia" fill="#c9d8ec">1. zoom afuera: el oceano entero entra en la esfera,</text><text x="798" y="575" font-size="13" font-family="Georgia" fill="#c9d8ec">   el infinito incluido, como un punto mas.</text><text x="798" y="592" font-size="13" font-family="Georgia" fill="#c9d8ec">2. girar el mundo: una transformacion de Moebius trae</text><text x="798" y="609" font-size="13" font-family="Georgia" fill="#c9d8ec">   cualquier region — por lejana que sea — al frente.</text><text x="798" y="626" font-size="13" font-family="Georgia" fill="#c9d8ec">3. zoom adentro: la direccion postal es el numero de cero.</text><text x="798" y="643" font-size="13" font-family="Georgia" fill="#c9d8ec"></text><text x="798" y="660" font-size="13" font-family="Georgia" fill="#c9d8ec">   go run ./cmd/starship -zero 1e8</text><text x="798" y="677" font-size="13" font-family="Georgia" fill="#c9d8ec">   > zero #1e8 vive en t = 42,653,500 — verificado (+/-2)</text><text x="798" y="694" font-size="13" font-family="Georgia" fill="#c9d8ec"></text><text x="798" y="711" font-size="13" font-family="Georgia" fill="#c9d8ec">la Hipotesis, dicha en el globo: TODOS los ceros del</text><text x="798" y="728" font-size="13" font-family="Georgia" fill="#c9d8ec">oceano viven sobre un unico meridiano.</text><text x="620" y="800" font-size="13" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">los mapas planos (nuestro cuaderno log, Mercator) distorsionan por necesidad: la esfera es el territorio</text></svg>