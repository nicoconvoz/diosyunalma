<text x="1360" y="224" font-size="11" fill="#ff8fa0">r=0.95</text><text x="1110" y="410" font-size="12" text-anchor="middle" fill="#dce8f7">|G(re^{iθ})| de θ=0 a π en 4 anillos: el máximo vive en θ=0 — la firma de un molde todo-positivo</text><rect x="60" y="460" width="1380" height="210" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="750" y="494" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">CANAL RELIEVE — EL TEOREMA DE BERNSTEIN: la equivalencia que pedía tu flash</text>
<text x="750" y="528" font-size="14.5" text-anchor="middle" fill="#dce8f7">«TODOS los dientes λₙ ≥ 0»   ⟺   «G(x), G′(x), G″(x), G‴(x), … TODAS ≥ 0 en cada punto del segmento iluminado [0,1)»</text>
<text x="750" y="558" font-size="13.5" text-anchor="middle" fill="#ffd166">no es una pista: es una DOBLE VÍA EXACTA — la firma óptica completa equivale al molde entero, pulso a pulso, sin extraer un solo diente a ciegas</text>
<text x="750" y="590" font-size="13" text-anchor="middle" fill="#dce8f7">medido: cascada entera positiva en x=0.20 (12 derivadas), x=0.50 (10), x=0.70 (8) — y cada pulso restringe los INFINITOS dientes a la vez</text>
<text x="750" y="620" font-size="13" text-anchor="middle" fill="#8fa8c7">antes: leer el diente n costaba amplificar el ruido r⁻ⁿ (ceguera creciente) · ahora: la positividad se lee PUNTUAL, a cualquier profundidad, sin degradarse</text>
<text x="750" y="650" font-size="13.5" text-anchor="middle" fill="#7fd7a8">el murciélago escuchaba la forma — el LIDAR la VE: distancia, brillo, dirección, polarización y relieve en una sola firma</text><rect x="60" y="700" width="1380" height="180" rx="12" fill="#2a1010" stroke="#ff5d73" stroke-width="2"/>
<text x="750" y="736" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">EL ESLABÓN ROJO, RE-ESCRITO CON LUZ</text>
<text x="750" y="768" font-size="14.5" text-anchor="middle" fill="#dce8f7">antes: «todo coeficiente del germen ≥ 0» — una frase sobre infinitos dientes invisibles, leídos a ciegas uno por uno.</text>
<text x="750" y="798" font-size="14.5" text-anchor="middle" fill="#ffd166">ahora: «la luz que entra al molde por el segmento [0,1) solo puede CRECER, junto con todas sus aceleraciones» — una frase sobre UN rayo visible.</text>
<text x="750" y="830" font-size="13.5" text-anchor="middle" fill="#ff8fa0">los 4 canales la miden y firman ✓ — demostrarla para TODO pulso sigue siendo el millón. Pero el escultor, por primera vez, trabaja con los ojos abiertos.</text>
<text x="750" y="862" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>