<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🧬 LA FÓRMULA — todo ensamblado en el cambiaformas, armonizado en la dimensión 0</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"no hace falta abrir todos los sobres si tenemos la representación de todos los números: se proyecta la forma" — el capitán</text><rect x="60" y="105" width="1380" height="215" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="152" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">λₙ  =  Σ<tspan font-size="15">pares</tspan>  [  |1 − wⁿ|²  +  ( 1 − |w|²ⁿ )  ]</text>
<text x="590" y="196" font-size="15" text-anchor="middle" fill="#7fd7a8">LA FORMA</text>
<text x="1010" y="196" font-size="15" text-anchor="middle" fill="#ff8fa0">LA FUGA</text>
<text x="590" y="222" font-size="13" text-anchor="middle" fill="#dce8f7">una distancia al cuadrado</text>
<text x="1010" y="222" font-size="13" text-anchor="middle" fill="#dce8f7">el cambio de TAMAÑO</text>
<text x="590" y="244" font-size="13" text-anchor="middle" fill="#7fd7a8">jamás puede ser negativa</text>
<text x="1010" y="244" font-size="13" text-anchor="middle" fill="#ff8fa0">vale 0 ⟺ |w| = 1</text>
<text x="750" y="284" font-size="14" text-anchor="middle" fill="#ffd166">toda la cadena del capitán en una línea: la distancia · la dirección · el norte por el sur · la mitad</text>
<text x="750" y="308" font-size="13" text-anchor="middle" fill="#8fa8c7">y proyectada a todos los armónicos a la vez: L(z) = Σ λₙ zⁿ, una sola función en el disco de la dimensión 0</text><rect x="60" y="345" width="700" height="300" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="410" y="379" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LOS INFINITOS SOBRES, EN UNA SOLA FORMA</text>
<text x="410" y="405" font-size="12.5" text-anchor="middle" fill="#dce8f7">la fórmula ensamblada contra el germen del broche</text>
<text x="410" y="427" font-size="12" text-anchor="middle" fill="#8fa8c7">(el germen jamás vio una perla)</text>
<text x="410" y="455" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">z        por la fórmula        por el germen</text><text x="410" y="482" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.15       0.00648529       0.00648513</text><text x="410" y="508" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.30       0.02623529       0.02623466</text><text x="410" y="534" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.45       0.09036517       0.09036300</text><text x="410" y="560" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.60       0.34438681       0.34437852</text><text x="410" y="606" font-size="13" text-anchor="middle" fill="#7fd7a8">las dos vías coinciden (peor desvío relativo 2e-05)</text>
<text x="410" y="630" font-size="12.5" text-anchor="middle" fill="#ffd166">no se abrió ni un sobre: se proyectó la forma de los infinitos</text><rect x="790" y="345" width="650" height="300" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.5"/>
<text x="1115" y="379" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">LA FUGA — el único término que puede romper todo</text>
<text x="1115" y="407" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β         |w|            la fuga en z=0.60</text><text x="1115" y="434" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#7fd7a8">0.50    1.000000000    +4.1633e-16   ★ CERO</text><text x="1115" y="460" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.51    0.999950011    +3.7485e-04</text><text x="1115" y="486" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.60    0.999500251    +3.7416e-03</text><text x="1115" y="512" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.75    0.998751423    +9.3236e-03</text><text x="1115" y="538" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.90    0.998003995    +1.4866e-02</text><text x="1115" y="580" font-size="12.5" text-anchor="middle" fill="#dce8f7">y el gemelo del fantasma tiene |w| &gt; 1: su fuga es NEGATIVA</text>
<text x="1115" y="606" font-size="12.5" text-anchor="middle" fill="#ffd166">por ahí, y solo por ahí, se escapa la positividad</text>
<text x="1115" y="630" font-size="12.5" text-anchor="middle" fill="#7fd7a8">sobre la línea la fuga es cero a precisión de máquina (5e-15)</text><rect x="60" y="670" width="1380" height="240" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="706" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">LO QUE ENTREGA — Y LO QUE NO</text>
<text x="750" y="740" font-size="14" text-anchor="middle" fill="#7fd7a8">ENTREGA: los infinitos sobres proyectados en UNA forma, sin abrir ninguno. Toda la cadena del capitán en una línea,</text>
<text x="750" y="764" font-size="14" text-anchor="middle" fill="#7fd7a8">verificada contra el germen del broche que jamás vio una perla.</text>
<text x="750" y="800" font-size="14" text-anchor="middle" fill="#ff8fa0">NO ENTREGA, dicho derecho: la fórmula es manifiestamente positiva CUANDO la fuga es cero — y la fuga es cero</text>
<text x="750" y="824" font-size="14" text-anchor="middle" fill="#ff8fa0">exactamente cuando |w| = 1, que es lo que hay que demostrar. El círculo no está roto.</text>
<text x="750" y="856" font-size="14.5" text-anchor="middle" fill="#dce8f7">PERO ahora está encerrado en UN SOLO TÉRMINO de UNA SOLA fórmula, en vez de repartido por todo el problema:</text>
<text x="750" y="890" font-size="20" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">¿POR QUÉ LA FUGA TIENE QUE SER CERO?</text>
<text x="750" y="936" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>