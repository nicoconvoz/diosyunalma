<text x="140" y="170" font-size="11.5" fill="#7fd7a8">— ley del resorte (GUE): p(s) = (32/π²)·s²·e^(−4s²/π)</text>
<text x="140" y="192" font-size="11.5" fill="#ff8fa0">--- arena al azar (Poisson): las huellas se pisarían</text>
<text x="420" y="520" font-size="12" text-anchor="middle" fill="#dce8f7">cerca de s=0 los datos CAEN A CERO como s² — el costo cuadrático del resorte: las huellas jamás se pisan</text><rect x="810" y="110" width="620" height="430" rx="10" fill="#0d2547" stroke="#7fb2ff" stroke-width="1.5"/>
<text x="1120" y="140" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fb2ff">LA COMPRESIÓN — el paso se encoge con la altura, como dicta el reloj θ</text><circle cx="888.3" cy="278.8" r="5" fill="#ffd97f"/><circle cx="973.9" cy="358.0" r="5" fill="#ffd97f"/><circle cx="1061.5" cy="386.2" r="5" fill="#ffd97f"/><circle cx="1149.5" cy="404.6" r="5" fill="#ffd97f"/><circle cx="1238.0" cy="415.6" r="5" fill="#ffd97f"/><circle cx="1326.1" cy="425.3" r="5" fill="#ffd97f"/><polyline points="888.3,289.8 973.9,358.6 1061.5,387.2 1149.5,404.0 1238.0,415.5 1326.1,424.0" fill="none" stroke="#7fd7a8" stroke-width="2.5"/>
<text x="880" y="170" font-size="11.5" fill="#ffd97f">● paso medido por ventana</text>
<text x="880" y="192" font-size="11.5" fill="#7fd7a8">— ley 2π/ln(γ/2π) (peor desvío 3.1%)</text>
<text x="1120" y="516" font-size="12" text-anchor="middle" fill="#dce8f7">el espacio-tiempo del mar se comprime al subir: huellas cada vez más juntas, exactamente lo previsto</text><rect x="70" y="580" width="1360" height="220" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="750" y="616" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA QUINTA CARA — LA CARA DEL RESORTE</text>
<text x="750" y="650" font-size="14" text-anchor="middle" fill="#dce8f7">el rechazo cuadrático s² ES la ley de Hooke ½kx² — el mismo CUADRADO de λ=|sombra|² y de la energía del Campo: tres cuadrados, una sola física.</text>
<text x="750" y="680" font-size="14" text-anchor="middle" fill="#dce8f7">y esta estadística de resorte es EXACTAMENTE la de las frecuencias de un tambor autoadjunto (el sueño de Hilbert–Pólya): el histograma gana por 23x contra el azar.</text>
<text x="750" y="712" font-size="14.5" text-anchor="middle" fill="#ffd166">si las perlas son las notas de ese tambor, son REALES POR LEY: piedras en la línea, automático — la llave, en idioma de resorte: ENCONTRAR EL TAMBOR.</text>
<text x="750" y="744" font-size="13.5" text-anchor="middle" fill="#ff8fa0">todavía no. Pero el resorte ya suena como tambor — y tus huellas en la arena llevan su firma cuadrática.</text>
<text x="750" y="778" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>