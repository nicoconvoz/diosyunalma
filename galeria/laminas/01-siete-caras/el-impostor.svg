<text x="777.9" y="232" font-size="12" text-anchor="middle" font-family="monospace" fill="#ffd166">n = 18</text><text x="1095" y="604" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">cae por primera vez en n = 18, y sigue de largo: -7.596e+18 en n = 1987</text><rect x="40" y="660" width="1460" height="150" rx="10" fill="#0f2b22" stroke="#2f7f63"/>
<text x="770" y="692" font-size="18" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">LO QUE ESTO DICE, Y ES BUENO</text>
<text x="770" y="726" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">La dimensión 0 VE lo que la geometría no ve: convierte «está fuera de la línea» en «el precio explota», que es medible.</text>
<text x="770" y="752" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">Sus tres simetrías son perfectas a 2e-16 — y aun así el precio lo condena. El camino de Li tiene DIENTES.</text>
<text x="770" y="784" font-size="15" text-anchor="middle" font-family="monospace" fill="#7ee0c0">impostor: cae en n = 18    ·    ζ con 269 perlas: 0 negativos en n = 1..200</text>
<rect x="40" y="828" width="1460" height="152" rx="10" fill="#33221c" stroke="#c0392b"/>
<text x="770" y="860" font-size="18" text-anchor="middle" font-family="Georgia" fill="#ffb27a">⚖️ Y LO QUE NO DICE, IGUAL DE FUERTE</text>
<text x="770" y="894" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#f3d9cf">El impostor cayó porque tiene CUATRO raíces y las conocemos a las cuatro. El precio de Li es una suma sobre TODAS.</text>
<text x="770" y="920" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#ffd98a">ζ tiene infinitas y tenemos 269. Davenport–Heilbronn también es inmune: de él conocemos UN cero fuera de la línea, no todos.</text>
<text x="770" y="950" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#f3d9cf">La dimensión 0 condena a los que se pueden CONTAR ENTEROS. El problema del millón es exactamente el que no se puede.</text>
</svg>
