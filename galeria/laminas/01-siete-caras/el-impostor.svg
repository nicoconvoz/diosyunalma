<rect width="100%" height="100%" fill="#0b1526"/>
<text x="770" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🎭 EL IMPOSTOR, ARMONIZADO EN LA DIMENSIÓN 0</text>
<text x="770" y="76" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">tiene todas las simetrías del libro y la geometría no lo ve — pero el precio de Li lo canta</text>
<text x="770" y="112" font-size="19" text-anchor="middle" font-family="monospace" fill="#ffd98a">P(s) = (s−a)(s−ā)(s−(1−a))(s−(1−ā))   ·   a = 0.7 + 3i</text>
<rect x="40" y="140" width="620" height="500" rx="10" fill="#101f36" stroke="#26456e"/>
<text x="350" y="172" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd98a">AL DISCO: LAS CUATRO SE SALEN DE LA PIEL</text>
<circle cx="350" cy="380" r="175" fill="none" stroke="#3d6fa8" stroke-width="2"/>
<text x="350" y="195" font-size="12" text-anchor="middle" font-family="monospace" fill="#4fa3d1">la piel |w| = 1</text>
<circle cx="512.09" cy="324.68" r="7" fill="#ff5d73"/><text x="523.09" y="316.68" font-size="11" font-family="monospace" fill="#ff8fa0">|w|=0.9787</text><circle cx="512.09" cy="435.32" r="7" fill="#ff5d73"/><text x="523.09" y="427.32" font-size="11" font-family="monospace" fill="#ff8fa0">|w|=0.9787</text><circle cx="519.22" cy="437.76" r="7" fill="#ff5d73"/><text x="530.22" y="429.76" font-size="11" font-family="monospace" fill="#ff8fa0">|w|=1.0218</text><circle cx="519.22" cy="322.24" r="7" fill="#ff5d73"/><text x="530.22" y="314.24" font-size="11" font-family="monospace" fill="#ff8fa0">|w|=1.0218</text><text x="350" y="592" font-size="14" text-anchor="middle" font-family="monospace" fill="#7ee0c0">|w₁|·|w₂| = 1.000000000000  —  el norte × sur = 1 de F225</text>
<text x="350" y="616" font-size="13" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">si uno se hunde el otro se levanta, y el que sube crece como rⁿ</text>
<rect x="690" y="140" width="810" height="500" rx="10" fill="#161a3a" stroke="#5a4fa8"/>
<text x="1095" y="172" font-size="16" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">⚡ EL PRECIO DE LI, Y DÓNDE SE HUNDE</text>
<text x="1095" y="206" font-size="17" text-anchor="middle" font-family="monospace" fill="#dce8f7">λₙ = Σ [ 2 − 2·Re(wⁿ) ]</text>
