<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1120" viewBox="0 0 1560 1120">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="780" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🔗 EL CENTRO COMPARTIDO — la relación que vio el capitán</text>
<text x="780" y="76" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">dos primos comparten un centro ⟺ son gemelos · y ese centro es siempre múltiplo de 3</text>
<rect x="40" y="102" width="1480" height="300" rx="10" fill="#161a3a" stroke="#5a4fa8"/>
<text x="780" y="134" font-size="18" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">CADA PRIMO ES UN INTERVALO DE DOS CENTROS — y los gemelos SE PISAN</text>
<line x1="120.0" y1="180" x2="120.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="120.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">4</text><line x1="182.0" y1="180" x2="182.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="182.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">5</text><line x1="244.0" y1="180" x2="244.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="244.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">6</text><line x1="306.0" y1="180" x2="306.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="306.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">7</text><line x1="368.0" y1="180" x2="368.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="368.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">8</text><line x1="430.0" y1="180" x2="430.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="430.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">9</text><line x1="492.0" y1="180" x2="492.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="492.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">10</text><line x1="554.0" y1="180" x2="554.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="554.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">11</text><line x1="616.0" y1="180" x2="616.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="616.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">12</text><line x1="678.0" y1="180" x2="678.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="678.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">13</text><line x1="740.0" y1="180" x2="740.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="740.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">14</text><line x1="802.0" y1="180" x2="802.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="802.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">15</text><line x1="864.0" y1="180" x2="864.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="864.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">16</text><line x1="926.0" y1="180" x2="926.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="926.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">17</text><line x1="988.0" y1="180" x2="988.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="988.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">18</text><line x1="1050.0" y1="180" x2="1050.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="1050.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">19</text><line x1="1112.0" y1="180" x2="1112.0" y2="320" stroke="#26456e" stroke-width="1"/><text x="1112.0" y="342" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">20</text><rect x="166.0" y="192.0" width="94.0" height="26" rx="13" fill="#7ee0c0" opacity="0.85"/><text x="213.0" y="210.0" font-size="14" text-anchor="middle" font-family="monospace" fill="#0b1526">11</text><rect x="228.0" y="226.0" width="94.0" height="26" rx="13" fill="#7ee0c0" opacity="0.85"/><text x="275.0" y="244.0" font-size="14" text-anchor="middle" font-family="monospace" fill="#0b1526">13</text><rect x="352.0" y="260.0" width="94.0" height="26" rx="13" fill="#ffd98a" opacity="0.85"/><text x="399.0" y="278.0" font-size="14" text-anchor="middle" font-family="monospace" fill="#0b1526">17</text><rect x="414.0" y="294.0" width="94.0" height="26" rx="13" fill="#ffd98a" opacity="0.85"/><text x="461.0" y="312.0" font-size="14" text-anchor="middle" font-family="monospace" fill="#0b1526">19</text><text x="780" y="372" font-size="15" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">11 = [5,6] y 13 = [6,7] comparten el 6 · 17 = [8,9] y 19 = [9,10] comparten el 9</text><rect x="40" y="422" width="730" height="250" rx="10" fill="#0f2b22" stroke="#2f7f63"/>
<text x="405" y="454" font-size="18" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">⚡ COMPARTIR CENTRO ES SER GEMELOS</text>
<text x="405" y="496" font-size="19" text-anchor="middle" font-family="monospace" fill="#ffd98a">(p+1)/2 = (q−1)/2  ⟺  q = p + 2</text>
<text x="80" y="540" font-size="15.5" font-family="monospace" fill="#cfe6ff">con centro compartido ... 26860</text>
<text x="80" y="566" font-size="15.5" font-family="monospace" fill="#cfe6ff">pares gemelos ........... 26860</text>
<text x="80" y="592" font-size="15.5" font-family="monospace" fill="#ffd98a">desacuerdos ............. 0</text>
<text x="405" y="630" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#9aa8c4">⚠️ ese cero no es evidencia: sale del álgebra. Pero acá la</text>
<text x="405" y="652" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#9aa8c4">tautología es un CAMBIO DE COORDENADA, no un callejón.</text>
<rect x="790" y="422" width="730" height="250" rx="10" fill="#101f36" stroke="#26456e"/>
<text x="1155" y="454" font-size="18" text-anchor="middle" font-family="Georgia" fill="#ffd98a">⚡ Y LA PARIDAD QUE VIO TAMPOCO ES ADORNO</text>
<text x="1155" y="490" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">2m = p + q ⟹ m es la MITAD del centro del par gemelo</text>
<text x="1155" y="520" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">y F264 probó que ese centro es múltiplo de 6, entonces:</text>
<text x="1155" y="556" font-size="19" text-anchor="middle" font-family="monospace" fill="#7ee0c0">m es SIEMPRE múltiplo de 3</text>
<text x="820" y="596" font-size="15" font-family="monospace" fill="#cfe6ff">(11,13) → m = 6 = 3×2 → PAR</text>
<text x="820" y="620" font-size="15" font-family="monospace" fill="#cfe6ff">(17,19) → m = 9 = 3×3 → impar</text>
<text x="1155" y="654" font-size="14" text-anchor="middle" font-family="Georgia" fill="#ffd98a">la alternancia que notó ES la paridad de m/3 · 1 excepciones</text>
<rect x="40" y="692" width="730" height="210" rx="10" fill="#1a1030" stroke="#5a4fa8"/>
<text x="405" y="724" font-size="17" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">EL DICCIONARIO: DE LA DISTANCIA AL DIBUJO</text>
<text x="80" y="764" font-size="15.5" font-family="monospace" fill="#7ee0c0">g = 2  →  SE PISAN en un punto   (gemelos)</text>
<text x="80" y="792" font-size="15.5" font-family="monospace" fill="#ffd98a">g = 4  →  se TOCAN, sin pisarse</text>
<text x="80" y="820" font-size="15.5" font-family="monospace" fill="#ff8fa0">g &gt; 4  →  hueco de (g−4)/2 centros</text>
<text x="405" y="864" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#9aa8c4">la distancia entre primos se vuelve una figura que se puede ver</text><rect x="790" y="692" width="730" height="210" rx="10" fill="#101f36" stroke="#26456e"/>
<text x="1155" y="724" font-size="17" text-anchor="middle" font-family="Georgia" fill="#ffd98a">CADA ENTERO, POR CUÁNTOS PRIMOS CENTRA</text>
<text x="820" y="764" font-size="15" font-family="monospace" fill="#8fb4d9">centran 0 .......  1460569  (73.03%)</text>
<text x="820" y="792" font-size="15" font-family="monospace" fill="#cfe6ff">centran 1 .......   512569  (25.63%)</text>
<text x="820" y="820" font-size="15" font-family="monospace" fill="#7ee0c0">centran 2 .......    26860  (1.343%)</text>
<text x="1155" y="864" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#9aa8c4">la clase de los DOBLES es exactamente la de los gemelos</text>
<rect x="40" y="922" width="1480" height="170" rx="10" fill="#33221c" stroke="#c0392b"/>
<text x="780" y="954" font-size="18" text-anchor="middle" font-family="Georgia" fill="#ffb27a">⚖️ Y EL LÍMITE, QUE HAY QUE DECIRLO</text>
<text x="780" y="990" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#f3d9cf">En esta coordenada, la Conjetura de los Primos Gemelos se lee: «hay infinitos m que centran DOS primos».</text>
<text x="780" y="1016" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#f3d9cf">Es el mismo problema con ropa nueva. Más lindo de mirar, exactamente igual de abierto.</text>
<text x="780" y="1054" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd98a">Pero la relación que vio es REAL y es EXACTA — y la ley que la explica es la suya, la de F264.</text>
</svg>
