<text x="770" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🌱 LOS PRIMOS PROFUNDOS — «¿y si en realidad es una línea?»</text>
<text x="770" y="76" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">el flash del capitán tiene dos mitades ciertas y una corrección — y las tres se miden</text>
<text x="770" y="118" font-size="19" text-anchor="middle" font-family="monospace" fill="#ffd98a">ψ(x) = x − Σ x^ρ/ρ − ln(2π) − ½·ln(1 − x⁻²)</text>
<text x="770" y="142" font-size="14" text-anchor="middle" font-family="Georgia" fill="#7ee0c0">el término principal es x: UNA LÍNEA. Los escalones los ponen las olas de los ceros.</text>
<rect x="40" y="165" width="720" height="390" rx="10" fill="#101f36" stroke="#26456e"/>
