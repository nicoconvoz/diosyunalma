<text x="86" y="216" font-size="13" font-family="monospace" fill="#7fb2ff">ψ(x) — la escalera de los primos</text>
<text x="86" y="240" font-size="13" font-family="monospace" fill="#ffd166">x — la línea, sin los ceros</text>
<text x="400" y="540" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">sin ceros no hay escalera: hay recta</text><rect x="780" y="165" width="720" height="390" rx="10" fill="#161a3a" stroke="#5a4fa8"/>
<text x="1140" y="188" font-size="15" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">⚡ EL PUNTO DE EMERGENCIA: x^(β−½) = ln²x</text>
<text x="1140" y="212" font-size="13" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">cuánto hay que ir de profundo para que una ola corrida se note</text><line x1="850" y1="490" x2="1440" y2="490" stroke="#8fa8c7" stroke-width="1.2"/>
<line x1="850" y1="240" x2="850" y2="490" stroke="#8fa8c7" stroke-width="1.2"/><line x1="850" y1="377.5" x2="1440" y2="377.5" stroke="#7ee0c0" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="856" y="371.5" font-size="11.5" font-family="monospace" fill="#7ee0c0">hasta acá se contaron los primos: 10^27</text><polyline points="850.66,240.00 853.60,240.00 856.55,240.00 859.50,240.00 862.44,240.00 865.39,240.00 868.34,240.00 871.28,240.00 874.23,240.00 877.18,240.00 880.12,240.00 883.07,240.00 886.02,240.00 888.96,240.00 891.91,240.00 894.86,240.00 897.80,240.00 900.75,240.00 903.70,240.00 906.64,240.00 909.59,240.00 912.54,240.00 915.48,240.00 918.43,240.00 921.38,240.00 924.32,240.00 927.27,240.00 930.22,240.00 933.16,240.00 936.11,240.00 939.06,240.00 942.00,240.00 944.95,244.65 947.90,253.89 950.84,262.55 953.79,270.67 956.74,278.30 959.68,285.48 962.63,292.25 965.58,298.64 968.52,304.68 971.47,310.40 974.42,315.82 977.36,320.97 980.31,325.86 983.26,330.52 986.20,334.95 989.15,339.17 992.10,343.21 995.04,347.06 997.99,350.74 1000.94,354.27 1003.89,357.64 1006.83,360.88 1009.78,363.98 1012.73,366.96 1015.67,369.82 1018.62,372.58 1021.57,375.22 1024.51,377.77 1027.46,380.23 1030.41,382.59 1033.35,384.88 1036.30,387.08 1039.25,389.20 1042.19,391.26 1045.14,393.24 1048.09,395.16 1051.03,397.02 1053.98,398.82 1056.93,400.56 1059.87,402.24 1062.82,403.88 1065.77,405.46 1068.71,407.00 1071.66,408.49 1074.61,409.94 1077.55,411.34 1080.50,412.71 1083.45,414.04 1086.39,415.33 1089.34,416.58 1092.29,417.81 1095.23,418.99 1098.18,420.15 1101.13,421.28 1104.07,422.38 1107.02,423.45 1109.97,424.49 1112.91,425.51 1115.86,426.50 1118.81,427.46 1121.75,428.41 1124.70,429.33 1127.65,430.23 1130.59,431.11 1133.54,431.96 1136.49,432.80 1139.43,433.62 1142.38,434.42 1145.33,435.20 1148.27,435.97 1151.22,436.72 1154.17,437.45 1157.11,438.16 1160.06,438.86 1163.01,439.55 1165.95,440.22 1168.90,440.88 1171.85,441.52 1174.80,442.16 1177.74,442.77 1180.69,443.38 1183.64,443.98 1186.58,444.56 1189.53,445.13 1192.48,445.69 1195.42,446.24 1198.37,446.78 1201.32,447.31 1204.26,447.83 1207.21,448.33 1210.16,448.83 1213.10,449.33 1216.05,449.81 1219.00,450.28 1221.94,450.75 12