<text x="535" y="362" font-size="11.5" text-anchor="middle" fill="#ffd166">el broche</text>
<text x="340" y="612" font-size="12.5" text-anchor="middle" fill="#dce8f7">tras 2000 pasos el tamaño sigue siendo 1 (desvío 8e-14)</text>
<text x="340" y="636" font-size="12.5" text-anchor="middle" fill="#7fd7a8">el punto camina y camina — y nunca se aleja del anillo</text><rect x="650" y="110" width="790" height="300" rx="10" fill="#102a10" stroke="#ffd166" stroke-width="1.5"/>
<text x="1045" y="144" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL NORTE Y EL SUR SON RECÍPROCOS · |w(ρ)| · |w(1−ρ)| = 1</text>
<text x="1045" y="174" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β        norte          sur          producto</text><text x="1045" y="202" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#7fd7a8">0.50   1.0000000   1.0000000   1.0000000000  ★ la línea: los dos igual</text><text x="1045" y="228" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.55   0.9997501   1.0002500   1.0000000000</text><text x="1045" y="254" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.60   0.9995003   1.0005000   1.0000000000</text><text x="1045" y="280" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.75   0.9987514   1.0012501   1.0000000000</text><text x="1045" y="306" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.90   0.9980040   1.0020000   1.0000000000</text><text x="1045" y="332" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.95   0.9977552   1.0022498   1.0000000000</text><text x="1045" y="378" font-size="13" text-anchor="middle" fill="#ffd166">lo que gana el norte lo pierde el sur — y el único empate es |w| = 1</text><rect x="650" y="430" width="790" height="240" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.5"/>
<text x="1045" y="464" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">EL TECHO DEL DIÁMETRO — y dónde lo rompe cada fantasma</text>
<text x="1045" y="492" font-size="12.5" text-anchor="middle" fill="#dce8f7">sobre la línea: máxima distancia 2.000000 · techo 2 (el diámetro, F219) ✓</text>
<text x="1045" y="518" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β        crece por paso        rompe el techo en</text><text x="1045" y="542" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.95      ×1.002249801          n ≈ 489</text><text x="1045" y="564" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.90      ×1.001999997          n ≈ 550</text><text x="1045" y="586" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.75      ×1.001250138          n ≈ 880</text><text x="1045" y="608" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.60      ×1.000499999          n ≈ 2198</text><text x="1045" y="630" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.55      ×1.000249978          n ≈ 4396</text><text x="1045" y="652" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.51      ×1.000049991          n ≈ 21977</text><text x="1045" y="684" font-size="12.5" text-anchor="middle" fill="#dce8f7">todo fantasma rompe el techo a alguna altura: su tamaño SÍ cambia</text><rect x="60" y="700" width="1380" height="180" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2"/>
<text x="750" y="736" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA HIPÓTESIS, DICHA CON LOS PUNTOS CARDINALES</text>
<text x="750" y="772" font-size="15" text-anchor="middle" fill="#dce8f7">«La distancia siempre crece; lo único que cambia es la dirección» — y en el anillo eso ES la hipótesis:</text>
<text x="750" y="800" font-size="15" text-anchor="middle" fill="#7fd7a8">cada paso del libro debe ser PURO CAMBIO DE DIRECCIÓN, jamás de tamaño.</text>
<text x="750" y="832" font-size="14" text-anchor="middle" fill="#ff8fa0">Un fantasma no puede esconderse: si una de sus caras encoge, la otra crece — y la que crece termina pasando el diámetro. Todavía no.</text>
<text x="750" y="864" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>