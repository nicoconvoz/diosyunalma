<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🧭 LOS PUNTOS CARDINALES — la distancia siempre crece; solo cambia la dirección</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">el flash del capitán, medido: el norte y el sur son recíprocos, y la línea crítica es el único lugar donde los dos cuestan lo mismo</text><rect x="60" y="110" width="560" height="560" rx="10" fill="#0d2547" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="340" y="144" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA BRÚJULA — el paso gira, nunca crece</text>
