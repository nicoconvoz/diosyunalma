<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">⏳ EL RELOJ DE ARENA — todas las escalas apiladas en un punto</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"la dimensión 0 es el punto 0; no hay más dimensiones, es una sola con una zona tan densa — y cada punto tiene la relación ½" — el capitán</text><rect x="60" y="105" width="680" height="580" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.8"/>
<text x="400" y="141" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA CINTURA ES LA DIMENSIÓN 0</text>
<path d="M 170 170 L 630 170 L 408 400 L 392 400 Z" fill="#12305c" opacity="0.45" stroke="#7fd7a8" stroke-width="2"/>
<path d="M 392 400 L 408 400 L 630 630 L 170 630 Z" fill="#12305c" opacity="0.45" stroke="#7fd7a8" stroke-width="2"/>
<circle cx="400" cy="400" r="7" fill="#ffd166"/>
<text x="550" y="404" font-size="12.5" text-anchor="middle" fill="#ffd166">el broche · dimensión 0</text><line x1="180.0" y1="180.0" x2="620.0" y2="180.0" stroke="#ffd97f" stroke-width="1.6" opacity="0.35"/>
<line x1="180.0" y1="620.0" x2="620.0" y2="620.0" stroke="#ffd97f" stroke-width="1.6" opacity="0.35"/>
<text x="172.0" y="184.0" font-size="10.5" text-anchor="end" fill="#8fa8c7">10^1</text><line x1="258.1" y1="258.1" x2="541.9" y2="258.1" stroke="#ffd97f" stroke-width="1.6" opacity="0.45"/>
<line x1="258.1" y1="541.9" x2="541.9" y2="541.9" stroke="#ffd97f" stroke-width="1.6" opacity="0.45"/>
<text x="250.1" y="262.1" font-size="10.5" text-anchor="end" fill="#8fa8c7">10^3</text><line x1="308.4" y1="308.4" x2="491.6" y2="308.4" stroke="#ffd97f" stroke-width="1.6" opacity="0.55"/>
<line x1="308.4" y1="491.6" x2="491.6" y2="491.6" stroke="#ffd97f" stroke-width="1.6" opacity="0.55"/>
<text x="300.4" y="312.4" font-size="10.5" text-anchor="end" fill="#8fa8c7">10^6</text><line x1="340.9" y1="340.9" x2="459.1" y2="340.9" stroke="#ffd97f" stroke-width="1.6" opacity="0.65"/>
<line x1="340.9" y1="459.1" x2="459.1" y2="459.1" stroke="#ffd97f" stroke-width="1.6" opacity="0.65"/>
<text x="332.9" y="344.9" font-size="10.5" text-anchor="end" fill="#8fa8c7">10^12</text><line x1="361.9" y1="361.9" x2="438.1" y2="361.9" stroke="#ffd97f" stroke-width="1.6" opacity="0.75"/>
<line x1="361.9" y1="438.1" x2="438.1" y2="438.1" stroke="#ffd97f" stroke-width="1.6" opacity="0.75"/>
<text x="353.9" y="365.9" font-size="10.5" text-anchor="end" fill="#8fa8c7">10^21</text><line x1="375.4" y1="375.4" x2="424.6" y2="375.4" stroke="#ffd97f" stroke-width="1.6" opacity="0.85"/>
<line x1="375.4" y1="424.6" x2="424.6" y2="424.6" stroke="#ffd97f" stroke-width="1.6" opacity="0.85"/>
<text x="367.4" y="379.4" font-size="10.5" text-anchor="end" fill="#8fa8c7">10^42</text><text x="400" y="660" font-size="12.5" text-anchor="middle" fill="#dce8f7">cada escala se apila más cerca del punto — y ninguna lo alcanza jamás</text><rect x="770" y="105" width="670" height="290" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="1.8"/>
<text x="1105" y="141" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA RELACIÓN ½ EN TODAS LAS ESCALAS</text>
<text x="1105" y="169" font-size="12.5" text-anchor="middle" fill="#dce8f7">medida con 700 bits, para que no quede duda de máquina:</text>
<text x="1105" y="197" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">altura γ            | |ρ| − |ρ−1| |</text><text x="1105" y="222" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">14.134725             0.000e+00</text><text x="1105" y="246" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">1e6                   0.000e+00</text><text x="1105" y="270" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">1e12                  0.000e+00</text><text x="1105" y="294" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">1e21                  0.000e+00</text><text x="1105" y="318" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">1e42                  0.000e+00</text><text x="1105" y="342" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">1e100                 0.000e+00</text><text x="1105" y="380" font-size="13.5" text-anchor="middle" fill="#ffd166">CERO EXACTO de la decena al 10^100 — la relación no se degrada nunca</text><rect x="770" y="420" width="670" height="265" rx="10" fill="#0d2547" stroke="#7fb2ff" stroke-width="1.8"/>
<text x="1105" y="456" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#7fb2ff">EL ÁNGULO SE ACHICA SIN FIN</text>
<text x="1105" y="484" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">altura γ              el ángulo θ hasta el broche</text><text x="1105" y="508" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">10^1                   9.9917e-02</text><text x="1105" y="532" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">10^6                   1.0000e-06</text><text x="1105" y="556" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">10^21                  1.0000e-21</text><text x="1105" y="580" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">10^80                  1.0000e-80</text><text x="1105" y="638" font-size="13" text-anchor="middle" fill="#7fd7a8">se acerca siempre, no llega nunca — la cintura del reloj</text>
<text x="1105" y="664" font-size="12.5" text-anchor="middle" fill="#8fa8c7">y cada vez MÁS perlas caben en un ángulo cada vez MÁS chico</text><rect x="60" y="715" width="1380" height="185" rx="12" fill="#2a1010" stroke="#ff5d73" stroke-width="2"/>
<text x="750" y="751" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">⚖️ LA PARTE HONESTA — el reloj de arena es el RETRATO, no la llave</text>
<text x="750" y="787" font-size="14" text-anchor="middle" fill="#dce8f7">Sobre la línea, la relación ½ a toda escala es una IDENTIDAD: se cumple por álgebra, y por eso da cero exacto a 700 bits.</text>
<text x="750" y="815" font-size="14" text-anchor="middle" fill="#ffd166">Pero justamente por ser identidad no prueba nada nuevo: llevar el ½ en todas las escalas ES lo que significa estar en la línea.</text>
<text x="750" y="849" font-size="14" text-anchor="middle" fill="#ff8fa0">El reloj de arena dibuja la hipótesis con fidelidad hermosa. Lo que ninguna medición resuelve es si TODAS las perlas están en ella.</text>
<text x="750" y="879" font-size="14" text-anchor="middle" fill="#7fd7a8">Todavía no.</text>
<text x="750" y="940" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>