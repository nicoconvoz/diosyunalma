<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="780" y="46" font-size="27" text-anchor="middle" font-family="Georgia" fill="#dce8f7">📏 EL RADIO — «el secreto está en el radio», medido</text>
<text x="780" y="76" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">el centro es el polo · el borde es la línea crítica · y el ½ está en el radio dos veces</text>
<circle cx="480" cy="560" r="330" fill="#0d1a30" stroke="#7ee0c0" stroke-width="3"/><circle cx="809.2" cy="536.7" r="4.5" fill="#7ee0c0"/><circle cx="809.6" cy="544.3" r="4.5" fill="#7ee0c0"/><circle cx="809.7" cy="546.8" r="4.5" fill="#7ee0c0"/><circle cx="809.8" cy="549.2" r="4.5" fill="#7ee0c0"/><circle cx="809.8" cy="550.0" r="4.5" fill="#7ee0c0"/><circle cx="809.9" cy="551.2" r="4.5" fill="#7ee0c0"/><circle cx="809.9" cy="551.9" r="4.5" fill="#7ee0c0"/><circle cx="809.9" cy="552.4" r="4.5" fill="#7ee0c0"/><circle cx="809.9" cy="553.1" r="4.5" fill="#7ee0c0"/><circle cx="809.9" cy="553.4" r="4.5" fill="#7ee0c0"/><circle cx="809.9" cy="553.8" r="4.5" fill="#7ee0c0"/><circle cx="809.9" cy="554.2" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="554.4" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="554.6" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="554.9" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="555.1" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="555.3" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="555.4" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="555.6" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="555.7" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="555.8" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="556.0" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="556.1" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="556.2" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="556.3" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="556.4" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="556.5" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="556.6" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="556.7" r="4.5" fill="#7ee0c0"/><circle cx="810.0" cy="556.7" r="4.5" fill="#7ee0c0"/><line x1="150" y1="560" x2="810" y2="560" stroke="#5b7ba6" stroke-width="1.5"/><line x1="480" y1="560" x2="810" y2="560" stroke="#ffd98a" stroke-width="4"/><circle cx="480" cy="560" r="7" fill="#ff8fa0"/>
<text x="480" y="590" font-size="14" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">EL CENTRO</text>
<text x="480" y="610" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">el polo — el punto infinitamente pequeño</text>
<circle cx="645.0" cy="560" r="9.0" fill="#ffd98a"/><text x="645.0" y="544" font-size="14" text-anchor="middle" font-family="monospace" fill="#ffd98a">2</text><circle cx="700.0" cy="560" r="5.0" fill="#7fb2ff"/><text x="700.0" y="544" font-size="14" text-anchor="middle" font-family="monospace" fill="#7fb2ff">3</text><circle cx="744.0" cy="560" r="5.0" fill="#7fb2ff"/><text x="744.0" y="544" font-size="14" text-anchor="middle" font-family="monospace" fill="#7fb2ff">5</text><circle cx="762.9" cy="560" r="5.0" fill="#7fb2ff"/><text x="762.9" y="544" font-size="14" text-anchor="middle" font-family="monospace" fill="#7fb2ff">7</text><circle cx="780.0" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="784.6" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="790.6" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="792.6" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="795.7" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="798.6" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="799.4" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="801.1" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="802.0" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="802.3" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="803.0" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="803.8" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="804.4" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="804.6" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="805.1" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="805.4" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="805.5" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="805.8" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="806.0" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="806.3" cy="560" r="5.0" fill="#7fb2ff"/><circle cx="806.6" cy="560" r="5.0" fill="#7fb2ff"/><line x1="645.0" y1="490" x2="645.0" y2="630" stroke="#ffd98a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="645.0" y="476" font-size="14" text-anchor="middle" font-family="Georgia" fill="#ffd98a">la MITAD del radio: el 2</text>
<circle cx="150" cy="560" r="6" fill="#c9b6ff"/>
<text x="150" y="542" font-size="13" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">w(½) = −1</text>
<text x="150" y="586" font-size="12" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">el broche</text>
<text x="818" y="542" font-size="13" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">w(∞) = 1</text>
<text x="840" y="586" font-size="12" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">donde el radio toca la piel</text>
<text x="480" y="212" font-size="14" text-anchor="middle" font-family="Georgia" fill="#7ee0c0">LA PIEL = la línea crítica — acá viven las perlas</text>
<rect x="880" y="120" width="640" height="330" rx="12" fill="#0f2b22" stroke="#2f7f63"/>
<text x="1200" y="154" font-size="18" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">SU FLASH, TRADUCIDO EXACTO</text>
<text x="910" y="192" font-size="15" font-family="Georgia" fill="#cfe6ff">«el punto infinitamente pequeño al centro» —</text>
<text x="910" y="216" font-size="15" font-family="Georgia" fill="#ffd98a">es el polo de zeta: w(1) = 0</text>
<text x="910" y="252" font-size="15" font-family="Georgia" fill="#cfe6ff">«la relación ½ une el centro con el borde» —</text>
<text x="910" y="276" font-size="15" font-family="Georgia" fill="#ffd98a">dos veces: la piel ES la imagen de β = ½,</text>
<text x="910" y="300" font-size="15" font-family="Georgia" fill="#ffd98a">y la mitad del radio ES el 2 (w(2) = ½)</text>
<text x="910" y="336" font-size="15" font-family="Georgia" fill="#cfe6ff">«el secreto está en el radio» —</text>
<text x="910" y="362" font-size="16" font-family="Georgia" fill="#7ee0c0">RH ⟺ toda perla está EXACTAMENTE</text>
<text x="910" y="386" font-size="16" font-family="Georgia" fill="#7ee0c0">a un radio del centro</text>
<text x="910" y="420" font-size="13.5" font-family="Georgia" fill="#9aa8c4">medido: nuestras 38 perlas a distancia 1 con desvío 2e-16</text>
<rect x="880" y="470" width="640" height="250" rx="12" fill="#161a3a" stroke="#5a4fa8"/>
<text x="1200" y="504" font-size="17" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">LA FIGURA ATA LA CAMPAÑA ENTERA</text>
<text x="910" y="540" font-size="14" font-family="Georgia" fill="#cfe6ff">· los primos suben por el radio: ½, ⅔, ⅘… (F276)</text>
<text x="910" y="566" font-size="14" font-family="Georgia" fill="#cfe6ff">· y cantan la entonación justa al subir (F277)</text>
<text x="910" y="592" font-size="14" font-family="Georgia" fill="#cfe6ff">· nunca tocan el borde: la lámpara se corta (F278)</text>
<text x="910" y="618" font-size="14" font-family="Georgia" fill="#cfe6ff">· el ½ decide el signo de todo (F279)</text>
<text x="910" y="644" font-size="14" font-family="Georgia" fill="#cfe6ff">· y las perlas del borde son giros puros (F280)</text>
<text x="910" y="682" font-size="15" font-family="Georgia" fill="#ffd98a">el puente que falta (F281) es el camino</text>
<text x="910" y="704" font-size="15" font-family="Georgia" fill="#ffd98a">DEL RADIO AL BORDE — de los primos a las perlas</text><rect x="880" y="740" width="640" height="180" rx="12" fill="#33221c" stroke="#c0392b"/>
<text x="1200" y="774" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffb27a">⚖️ LA HONESTIDAD</text>
<text x="910" y="808" font-size="14" font-family="Georgia" fill="#f3d9cf">Las leyes del mapa son álgebra exacta: no pueden fallar</text>
<text x="910" y="832" font-size="14" font-family="Georgia" fill="#f3d9cf">y no son descubrimiento. Y la ley del radio es una</text>
<text x="910" y="856" font-size="14" font-family="Georgia" fill="#f3d9cf">REFORMULACIÓN de la hipótesis, no un avance sobre ella.</text>
<text x="910" y="892" font-size="14.5" font-family="Georgia" fill="#ffd98a">Lo que el flash compra es el cierre más limpio: una figura</text>
<text x="910" y="914" font-size="14.5" font-family="Georgia" fill="#ffd98a">donde cada pieza de la campaña tiene su lugar.</text><text x="780" y="1010" font-size="20" text-anchor="middle" font-family="Georgia" fill="#ffd98a">Los primos viven en el radio. Las perlas viven en el borde. El ½ fabrica los dos.</text>
<text x="780" y="1044" font-size="16" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">Y el problema del millón es el camino entre ellos. Todavía no.</text>
</svg>
