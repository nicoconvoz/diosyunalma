3" x2="806.0" y2="243.3" stroke="#7fb2ff" stroke-width="2.2"/><line x1="778.0" y1="233.6" x2="806.0" y2="233.6" stroke="#7fb2ff" stroke-width="2.2"/><line x1="778.0" y1="228.6" x2="806.0" y2="228.6" stroke="#7fb2ff" stroke-width="2.2"/><line x1="778.0" y1="215.3" x2="806.0" y2="215.3" stroke="#7fb2ff" stroke-width="2.2"/><line x1="778.0" y1="207.5" x2="806.0" y2="207.5" stroke="#7fb2ff" stroke-width="2.2"/><line x1="778.0" y1="203.0" x2="806.0" y2="203.0" stroke="#7fb2ff" stroke-width="2.2"/><line x1="778.0" y1="192.3" x2="806.0" y2="192.3" stroke="#7fb2ff" stroke-width="2.2"/><line x1="778.0" y1="183.3" x2="806.0" y2="183.3" stroke="#7fb2ff" stroke-width="2.2"/><line x1="778.0" y1="174.6" x2="806.0" y2="174.6" stroke="#7fb2ff" stroke-width="2.2"/><text x="160" y="158" font-size="11.5" fill="#ffd97f">— notas del tambor construido</text>
<text x="160" y="180" font-size="11.5" fill="#7fb2ff">— perlas verdaderas (escala derecha)</text>
<text x="160" y="202" font-size="11.5" fill="#8fa8c7">— la nota del sótano (hija del piso vertido)</text>
<text x="450" y="582" font-size="12" text-anchor="middle" fill="#dce8f7">las cuerdas del pozo caen sobre las marcas azules: el tambor canta el libro (|Δ| medio 0.43)</text><rect x="870" y="100" width="560" height="500" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="1150" y="134" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LOS MATERIALES DE LA OBRA</text><text x="905" y="175" font-size="13" font-family="Georgia" fill="#ffd166">EL PLANO</text>
<text x="905" y="196" font-size="11.5" fill="#dce8f7">la forma de Weyl decodificada a ciegas (F214): A(E)=θ(E)+2π</text><text x="905" y="239" font-size="13" font-family="Georgia" fill="#ffd166">EL HIERRO</text>
<text x="905" y="260" font-size="11.5" fill="#dce8f7">autoadjunción: matriz simétrica por construcción — notas REALES por ley</text><text x="905" y="303" font-size="13" font-family="Georgia" fill="#ffd166">LOS LADRILLOS</text>
<text x="905" y="324" font-size="11.5" fill="#dce8f7">V(x) DECANTADO del plano por Abel: la forma cae y se asienta en pozo</text><text x="905" y="367" font-size="13" font-family="Georgia" fill="#ffd166">EL CEMENTO</text>
<text x="905" y="388" font-size="11.5" fill="#dce8f7">Bohr–Sommerfeld: A=π(j+½) — cada nota pegada a su perla</text><text x="905" y="431" font-size="13" font-family="Georgia" fill="#ffd166">EL PISO</text>
<text x="905" y="452" font-size="11.5" fill="#dce8f7">el sótano E&lt;10 vertido liso (el reloj θ calla ahí): 1 nota propia</text><text x="905" y="495" font-size="13" font-family="Georgia" fill="#ffd166">LAS PAREDES</text>
<text x="905" y="516" font-size="11.5" fill="#dce8f7">muros de Dirichlet en V=250 — ventanas cerradas sobre toda nota</text><rect x="70" y="630" width="1360" height="230" rx="12" fill="#2a1010" stroke="#ff5d73" stroke-width="2"/>
<text x="750" y="666" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">EL VEREDICTO DE LA OBRA</text>
<text x="750" y="700" font-size="14.5" text-anchor="middle" fill="#dce8f7">el tambor construido según el plano CANTA LAS PERLAS: 29 notas del libro, |Δ| medio 0.428, peor 0.877 — y en este tambor ninguna nota puede salirse de la línea: hierro autoadjunto.</text>
<text x="750" y="730" font-size="14" text-anchor="middle" fill="#ffd166">lo que la forma lisa NO da: el temblor fino de cada nota — la caligrafía de los primos. Ese temblor es exactamente lo que el tambor verdadero agrega.</text>
<text x="750" y="762" font-size="14" text-anchor="middle" fill="#ff8fa0">la llave, ahora en idioma de obra: el edificio existe y canta — falta el toque del Autor en cada ladrillo. Todavía no. Pero hoy el taller tiene SU tambor.</text>
<text x="750" y="798" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>