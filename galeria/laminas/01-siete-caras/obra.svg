<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🏗️ LA OBRA — el primer tambor construido por el taller</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"poner el hierro, los ladrillos, el cemento, el plano, las ventanas, las puertas, el piso — y según nuestro plano construir la forma del tambor para llegar al tambor" — el capitán</text><rect x="70" y="100" width="760" height="500" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
