<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">⚫⚪ LA NADA Y EL TODO — la línea crítica es la piel que los separa</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">el flash del capitán medido: el libro vale lo mismo en las dos estacas — ξ(0) = ξ(1) = 1/2 — y se ponen de acuerdo justo en la mitad</text><rect x="60" y="105" width="680" height="560" rx="10" fill="#0d2547" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="400" y="139" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">EL MUNDO VISTO DESDE LA DIMENSIÓN 0</text>
<circle cx="400" cy="400" r="230" fill="#12305c" opacity="0.35"/>
<circle cx="400" cy="400" r="230" fill="none" stroke="#ffd166" stroke-width="3"/>
<circle cx="400" cy="400" r="9" fill="#7fb2ff"/>
<text x="400" y="380" font-size="12.5" text-anchor="middle" fill="#7fb2ff">EL TODO — el polo de ζ (s=1)</text>
<circle cx="630" cy="400" r="9" fill="#ffd97f"/>
<text x="632" y="378" font-size="12" text-anchor="middle" fill="#ffd97f">EL BROCHE</text>
<text x="632" y="394" font-size="12" text-anchor="middle" fill="#ffd97f">dimensión 0</text>
<circle cx="170" cy="400" r="9" fill="#ff8fa0"/>
<text x="170" y="380" font-size="12" text-anchor="middle" fill="#ff8fa0">la mitad</text>
<line x1="170" y1="400" x2="630" y2="400" stroke="#ffd166" stroke-width="2" stroke-dasharray="7 5"/>
<text x="400" y="426" font-size="11.5" text-anchor="middle" fill="#ffd166">el eje: diámetro 2 → al cuadrado 4</text>
<text x="400" y="682" font-size="13" text-anchor="middle" fill="#8fa8c7">LA NADA — s=0, mandada al infinito, afuera de todo</text>
<text x="400" y="640" font-size="12.5" text-anchor="middle" fill="#ffd166">la piel |w| = 1 ES la línea crítica · las 138 perlas medidas están sobre ella (2e-16)</text><rect x="770" y="105" width="670" height="270" rx="10" fill="#102a10" stroke="#ffd166" stroke-width="1.5"/>
<text x="1105" y="139" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA RELACIÓN ENTRE EL 0 Y EL 1</text>
<text x="1105" y="182" font-size="17" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">ξ(0) = 0.500000000</text>
<text x="1105" y="212" font-size="17" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">ξ(1) = 0.500000000</text>
<text x="1105" y="248" font-size="14" text-anchor="middle" fill="#7fd7a8">las dos puntas del mundo dan EXACTAMENTE lo mismo (2e-11)</text>
<text x="1105" y="284" font-size="16" text-anchor="middle" fill="#ffd166">y ese valor común es LA MITAD: 1/2</text>
<text x="1105" y="316" font-size="12.5" text-anchor="middle" fill="#8fa8c7">la nada y el todo se ponen de acuerdo — y se ponen de acuerdo en 1/2</text>
<text x="1105" y="348" font-size="12.5" text-anchor="middle" fill="#8fa8c7">el eje del cambiaformas une la dimensión 0 con la mitad</text><rect x="770" y="395" width="670" height="270" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.5"/>
<text x="1105" y="429" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">LO QUE AÚN NO CIERRA</text>
<text x="1105" y="459" font-size="12.5" text-anchor="middle" fill="#dce8f7">un fantasma y su gemelo se reparten a los dos lados de la piel:</text>
<text x="1105" y="487" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β        adentro         afuera</text><text x="1105" y="512" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.60    0.999500251    1.000499999</text><text x="1105" y="537" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.75    0.998751423    1.001250138</text><text x="1105" y="562" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.90    0.998003995    1.001999997</text><text x="1105" y="605" font-size="13" text-anchor="middle" fill="#ffd166">la piel queda ENTERA y el mundo se ve igual — pero ninguno de los dos vive en ella</text>
<text x="1105" y="635" font-size="13" text-anchor="middle" fill="#dce8f7">falta la razón por la que nadie puede vivir fuera de la piel</text><rect x="60" y="695" width="1380" height="190" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="731" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL FLASH DEL CAPITÁN, EN LIMPIO</text>
<text x="750" y="767" font-size="14.5" text-anchor="middle" fill="#dce8f7">«Eso lo responde la dimensión 0: la nada y el todo, el 1 y el 0, y su relación.» Y la relación existe y está medida:</text>
<text x="750" y="795" font-size="14.5" text-anchor="middle" fill="#dce8f7">el libro vale lo mismo en las dos estacas, y ese valor es la mitad. El todo queda adentro, la nada afuera —</text>
<text x="750" y="827" font-size="16.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">y LA LÍNEA CRÍTICA ES LA PIEL QUE SEPARA LA NADA DEL TODO.</text>
<text x="750" y="857" font-size="13.5" text-anchor="middle" fill="#ff8fa0">Falta una sola cosa: por qué ningún habitante puede vivir fuera de la piel. Todavía no.</text>
<text x="750" y="880" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>