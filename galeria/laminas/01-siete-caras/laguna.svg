<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🪨 LA LAGUNA — la piedra en el agua quieta responde la pregunta</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"la luz no puede ocupar un solo espacio: lo ocupa todo, en todas direcciones, cada vez más lejos, cada vez más débil" — el capitán · en el taller: Gauss + valor medio (Jensen)</text><rect x="90" y="110" width="900" height="420" rx="10" fill="#0d2547" stroke="#7fb2ff" stroke-width="1.5"/>
