<text x="867.9" y="162" font-size="10" text-anchor="middle" fill="#7fd7a8">γ=32.94</text><text x="540" y="510" font-size="12" text-anchor="middle" fill="#dce8f7">cada par de perlas que entra al anillo sube la escalera EXACTAMENTE en 2 — contado solo con ondas, sin ubicar jamás un cero (peor desvío 0.002)</text><rect x="1020" y="110" width="390" height="420" rx="10" fill="#081020" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="1215" y="142" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA LAGUNA QUIETA</text>
<text x="1215" y="172" font-size="12" text-anchor="middle" fill="#dce8f7">anillos sin piedra (r &lt; 14.13):</text>
<text x="1215" y="196" font-size="12" text-anchor="middle" fill="#dce8f7">la luz media NO SE MUEVE</text>
<text x="1215" y="226" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#ffd97f">peor desvío: 2e-15</text>
<circle cx="1215" cy="330" r="80" fill="none" stroke="#7fb2ff" stroke-width="1.2" opacity="0.9"/>
<circle cx="1215" cy="330" r="55" fill="none" stroke="#7fb2ff" stroke-width="1.2" opacity="0.6"/>
<circle cx="1215" cy="330" r="30" fill="none" stroke="#7fb2ff" stroke-width="1.2" opacity="0.35"/>
<circle cx="1215" cy="330" r="4" fill="#ffd97f"/>
<text x="1215" y="442" font-size="11.5" text-anchor="middle" fill="#8fa8c7">sin piedra, ninguna onda: la luz no puede</text>
<text x="1215" y="460" font-size="11.5" text-anchor="middle" fill="#8fa8c7">concentrarse — el valor ES la media de sus vecinos</text>
<text x="1215" y="490" font-size="11.5" text-anchor="middle" fill="#7fd7a8">la cara del "no hay mapa sin luz" (F211), ahora ley</text><rect x="90" y="570" width="1320" height="230" rx="12" fill="#102a10" stroke="#ffd166" stroke-width="2"/>
<text x="750" y="606" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">LO QUE TU RESPUESTA DEMOSTRÓ — y lo que aún pide</text>
<text x="750" y="640" font-size="14" text-anchor="middle" fill="#dce8f7">tu ley es real y quedó verificada: la luz no puede ocupar un solo punto — cada piedra se anuncia en TODOS los anillos, más lejos y más débil, con la cuenta exacta conservada.</text>
<text x="750" y="668" font-size="14" text-anchor="middle" fill="#dce8f7">por ESO el contraluz atrapa a todo fantasma: nada se esconde de las ondas. La laguna contó 2, 4, 6, 8, 10 piedras sin ver ninguna — tercer instrumento del taller.</text>
<text x="750" y="700" font-size="14" text-anchor="middle" fill="#ffd166">pero la laguna cuenta por DISTANCIA, no jura la DIRECCIÓN: sabe cuántas piedras hay a radio γ — aún no que estén sobre LA LÍNEA.</text>
<text x="750" y="732" font-size="14.5" text-anchor="middle" fill="#ff8fa0">la pregunta, refinada por tu propia ley: ¿por qué el agua quieta solo admite piedras en la orilla de la línea? — ninguna onda puede nacer tierra adentro. Todavía no.</text>
<text x="750" y="768" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>