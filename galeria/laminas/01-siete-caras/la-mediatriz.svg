<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">📐 LA MEDIATRIZ — dos estacas y una soga</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">la hipótesis del millón dicha como un replanteo de obra: todas las perlas plantadas a la misma distancia de las dos estacas</text><rect x="60" y="105" width="720" height="560" rx="10" fill="#0d2547" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="420" y="140" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">EL REPLANTEO</text>
<line x1="420" y1="180" x2="420" y2="640" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="420" y="172" font-size="12.5" text-anchor="middle" fill="#ffd166">la mediatriz — LA LÍNEA CRÍTICA</text>
<circle cx="270" cy="550" r="8" fill="#ff8fa0"/><text x="270" y="580" font-size="13" text-anchor="middle" fill="#ff8fa0">estaca 0</text>
<circle cx="570" cy="550" r="8" fill="#7fb2ff"/><text x="570" y="580" font-size="13" text-anchor="middle" fill="#7fb2ff">estaca 1</text><circle cx="420" cy="230.0" r="6" fill="#ffd97f"/>
<line x1="420" y1="230.0" x2="270" y2="550" stroke="#ff8fa0" stroke-width="1.2" opacity="0.75"/>
<line x1="420" y1="230.0" x2="570" y2="550" stroke="#7fb2ff" stroke-width="1.2" opacity="0.75"/><text x="436" y="222.0" font-size="11.5" fill="#ffd97f">una perla</text><circle cx="420" cy="310.0" r="6" fill="#ffd97f"/>
<line x1="420" y1="310.0" x2="270" y2="550" stroke="#ff8fa0" stroke-width="1.2" opacity="0.75"/>
<line x1="420" y1="310.0" x2="570" y2="550" stroke="#7fb2ff" stroke-width="1.2" opacity="0.75"/><circle cx="420" cy="390.0" r="6" fill="#ffd97f"/>
<line x1="420" y1="390.0" x2="270" y2="550" stroke="#ff8fa0" stroke-width="1.2" opacity="0.75"/>
<line x1="420" y1="390.0" x2="570" y2="550" stroke="#7fb2ff" stroke-width="1.2" opacity="0.75"/><circle cx="420" cy="470.0" r="6" fill="#ffd97f"/>
<line x1="420" y1="470.0" x2="270" y2="550" stroke="#ff8fa0" stroke-width="1.2" opacity="0.75"/>
<line x1="420" y1="470.0" x2="570" y2="550" stroke="#7fb2ff" stroke-width="1.2" opacity="0.75"/><text x="420" y="600" font-size="13" text-anchor="middle" fill="#dce8f7">las dos sogas miden IGUAL: eso es estar en la mediatriz</text>
<text x="420" y="626" font-size="12.5" text-anchor="middle" fill="#7fd7a8">medido en 138 perlas verdaderas: diferencia cero (peor caso 0e+00)</text><rect x="810" y="105" width="630" height="290" rx="10" fill="#102a10" stroke="#ffd166" stroke-width="1.5"/>
<text x="1125" y="139" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">SOLO EL MEDIO EMPATA</text>
<text x="1125" y="167" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β       a la estaca 0     a la estaca 1        |w|</text><text x="1125" y="194" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#7fd7a8">0.50     14.1435657     14.1435657    1.0000000  ★</text><text x="1125" y="221" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.51     14.1439228     14.1432157    0.9999500</text><text x="1125" y="248" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.55     14.1454215     14.1418864    0.9997501</text><text x="1125" y="275" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.60     14.1474539     14.1403837    0.9995003</text><text x="1125" y="302" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.75     14.1546088     14.1369357    0.9987514</text><text x="1125" y="329" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.90     14.1633489     14.1350787    0.9980040</text><text x="1125" y="368" font-size="12.5" text-anchor="middle" fill="#dce8f7">|w| es una soga dividida por la otra: vale 1 SOLO en el empate</text><rect x="810" y="415" width="630" height="250" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.5"/>
<text x="1125" y="449" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">POR QUÉ EL ESPEJO NO ALCANZA</text>
<text x="1125" y="477" font-size="12.5" text-anchor="middle" fill="#dce8f7">un fantasma viene con su gemelo: si uno se arrima a una estaca,</text>
<text x="1125" y="499" font-size="12.5" text-anchor="middle" fill="#dce8f7">el otro se arrima a la otra EXACTAMENTE lo mismo</text>
<text x="1125" y="527" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β      su |w|        el del gemelo      producto</text><text x="1125" y="552" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.60   0.99950025    1.00050000    1.0000000000</text><text x="1125" y="576" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.75   0.99875142    1.00125014    1.0000000000</text><text x="1125" y="600" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.90   0.99800399    1.00200000    1.0000000000</text><text x="1125" y="640" font-size="12.5" text-anchor="middle" fill="#ffd166">la PAREJA cierra en 1 y el espejo queda conforme — pero ninguno está en la raya</text><rect x="60" y="695" width="1380" height="185" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="731" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">LO QUE FALTA — y el atajo que lo vuelve una sola pregunta</text>
<text x="750" y="765" font-size="14" text-anchor="middle" fill="#dce8f7">Ya sabemos que el norte por el sur da 1. Si además supiéramos que el norte y el sur son IGUALES, cada uno valdría 1 —</text>
<text x="750" y="791" font-size="14" text-anchor="middle" fill="#dce8f7">porque el único número positivo que multiplicado por sí mismo da 1 es el 1. Y ahí las perlas caen solas en la mediatriz.</text>
<text x="750" y="828" font-size="19" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">¿POR QUÉ EL NORTE Y EL SUR TIENEN QUE SER IGUALES?</text>
<text x="750" y="862" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>