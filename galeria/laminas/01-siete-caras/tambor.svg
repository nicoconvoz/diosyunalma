<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🥁 EL TAMBOR ES EL LIBRO — su forma, decodificada a ciegas desde las notas</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"no tiene un número medible pero sí una forma medible" — el capitán · la ley de Weyl invertida: las 649 notas cuentan la forma del libro</text><rect x="70" y="100" width="700" height="430" rx="10" fill="#0d2547" stroke="#7fb2ff" stroke-width="1.5"/>
