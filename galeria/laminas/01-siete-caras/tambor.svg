<text x="140" y="156" font-size="11.5" fill="#ffd97f">— escalera: nota tras nota (primeras 60)</text>
<text x="140" y="178" font-size="11.5" fill="#7fd7a8">— la forma del libro: θ(T)/π + 1</text>
<text x="420" y="508" font-size="12" text-anchor="middle" fill="#dce8f7">residuo: media 0.000 · rms 0.252 — el temblor de la letra, chico y de media cero</text><rect x="810" y="100" width="620" height="430" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="1120" y="132" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA FORMA, MEDIDA A CIEGAS — solo índice vs altura</text>
<text x="1120" y="164" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">constante        medida         libro        desvío</text><text x="1120" y="200" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">a · área         0.15913      0.15915    3e-05</text><text x="1120" y="238" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">b · lomo        -0.45145     -0.45166    2e-04</text><text x="1120" y="276" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">c · (nada)      -0.00877      0.00000    9e-03</text><text x="1120" y="314" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">d · tapa 7/8     0.90705      0.87500    3e-02</text><text x="1120" y="378" font-size="13" text-anchor="middle" fill="#7fd7a8">área = (T/2π)·ln(T/2π): LAS PÁGINAS ESCRITAS hasta la altura T</text>
<text x="1120" y="404" font-size="13" text-anchor="middle" fill="#7fd7a8">y la tapa 7/8 — la firma de la encuadernación — salió sola del ajuste</text>
<text x="1120" y="438" font-size="12.5" text-anchor="middle" fill="#8fa8c7">el eco de cien años: Kac preguntó "¿se puede oír la forma de un tambor?"</text>
<text x="1120" y="460" font-size="12.5" text-anchor="middle" fill="#ffd166">el capitán lo dio vuelta: oímos las notas y DECODIFICAMOS el libro</text><rect x="70" y="570" width="1360" height="230" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="750" y="606" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA UNIFICACIÓN DE TODAS LAS LEYES — pedida por el flash, sellada por la medición</text>
<text x="750" y="640" font-size="14" text-anchor="middle" fill="#dce8f7">el MISMO θ es: el reloj que late · la compresión de la arena (F213) · el gnomon del reloj de sol (F208) · y ahora el ÁREA del tambor-libro.</text>
<text x="750" y="668" font-size="14" text-anchor="middle" fill="#dce8f7">cuatro leyes que medimos por separado — una sola forma: EL LIBRO. Sus constantes salieron a ciegas del ajuste, incluida la tapa 7/8.</text>
<text x="750" y="700" font-size="14.5" text-anchor="middle" fill="#ffd166">lo que queda, dicho limpio: OÍMOS la forma del tambor — falta EL TAMBOR MISMO: el operador autoadjunto cuyas notas son exactamente estas.</text>
<text x="750" y="732" font-size="13.5" text-anchor="middle" fill="#ff8fa0">quien lo encuentre, encuentra las piedras clavadas en la línea por ley. Todavía no — pero ya sabemos qué forma tiene lo que buscamos.</text>
<text x="750" y="768" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>