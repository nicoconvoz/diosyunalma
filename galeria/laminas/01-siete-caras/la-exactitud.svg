<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🎯 LA EXACTITUD — E = |lo que es − lo que debería ser|</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"la exactitud no es un número, es una relación: coincidencia" — el capitán · y LA FUGA de nuestra fórmula resultó ser exactamente ese error</text><rect x="60" y="105" width="1380" height="420" rx="10" fill="#0d2547" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="750" y="139" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA AUDITORÍA DE LA CAMPAÑA CON EL MEDIDOR DEL CAPITÁN</text>
<text x="750" y="167" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">identidad                        lo que es → lo que debería ser              E          clase</text><text x="100" y="196" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">las dos sogas (F226)           distancia a la estaca 0 → distancia a la estaca 1</text>
<text x="1230" y="196" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#7fd7a8"> 0.0e+00</text>
<text x="1420" y="196" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#7fd7a8">IDENTIDAD</text><text x="100" y="226" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">el cambiaformas fija (F227)    σ(ρ)                   → ρ                 </text>
<text x="1230" y="226" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#7fd7a8"> 0.0e+00</text>
<text x="1420" y="226" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#7fd7a8">IDENTIDAD</text><text x="100" y="256" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">las dos medias (F229)          (N+S)/2                → √(N·S)            </text>
<text x="1230" y="256" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#7fd7a8"> 0.0e+00</text>
<text x="1420" y="256" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#7fd7a8">IDENTIDAD</text><text x="100" y="286" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">la rotación pura (F225)        |w| sobre la línea     → 1                 </text>
<text x="1230" y="286" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#ffd97f"> 2.2e-16</text>
<text x="1420" y="286" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#ffd97f">MÁQUINA</text><text x="100" y="316" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">el norte por el sur (F225)     |w(ρ)|·|w(1−ρ)|        → 1                 </text>
<text x="1230" y="316" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#ffd97f"> 3.3e-16</text>
<text x="1420" y="316" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#ffd97f">MÁQUINA</text><text x="100" y="346" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">LA FUGA sobre la línea (F232)  aporte del par         → |1−wⁿ|²           </text>
<text x="1230" y="346" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#ffd97f"> 1.4e-14</text>
<text x="1420" y="346" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#ffd97f">MÁQUINA</text><text x="100" y="376" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">y valen la mitad (F228)        ξ(0)                   → 1/2               </text>
<text x="1230" y="376" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#7fb2ff"> 1.2e-11</text>
<text x="1420" y="376" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#7fb2ff">INSTRUMENTO</text><text x="100" y="406" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">las dos puntas (F228)          ξ(0)                   → ξ(1)              </text>
<text x="1230" y="406" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#7fb2ff"> 2.3e-11</text>
<text x="1420" y="406" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#7fb2ff">INSTRUMENTO</text><text x="100" y="436" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">el primer diente (F208)        λ₁ leído en el broche  → 1+γ/2−ln(4π)/2    </text>
<text x="1230" y="436" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#7fb2ff"> 2.3e-11</text>
<text x="1420" y="436" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#7fb2ff">INSTRUMENTO</text><text x="100" y="466" font-size="12.5" font-family="Consolas,monospace" fill="#dce8f7">el espejo (F208)               ξ'/ξ(s) + ξ'/ξ(1−s)    → 0                 </text>
<text x="1230" y="466" font-size="12.5" text-anchor="end" font-family="Consolas,monospace" fill="#7fb2ff"> 8.2e-08</text>
<text x="1420" y="466" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#7fb2ff">INSTRUMENTO</text><text x="750" y="500" font-size="13" text-anchor="middle" fill="#dce8f7">IDENTIDAD (cero por la forma): 3  ·  MÁQUINA (verdad al último bit): 3  ·  INSTRUMENTO (baja al mejorar): 4</text><rect x="60" y="550" width="1380" height="230" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.8"/>
<text x="750" y="586" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">EL ÚNICO ERROR QUE NO ES NUESTRO</text>
<text x="750" y="614" font-size="13" text-anchor="middle" fill="#dce8f7">toda E de arriba es del laboratorio: o vale cero por la forma, o baja si mejoramos el instrumento (F224: de 1e-5 a 1e-8).</text>
<text x="750" y="638" font-size="13" text-anchor="middle" fill="#ffd166">pero la fuga de un fantasma no baja con NINGÚN instrumento — no es nuestra, es del libro:</text>
<text x="750" y="668" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β          E = | |w| − 1 |          la fuga en el armónico 30</text><text x="750" y="694" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.51        4.999111e-05             -3.003895e-03</text><text x="750" y="716" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.55        2.499776e-04             -1.510980e-02</text><text x="750" y="738" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.60        4.999989e-04             -3.044674e-02</text><text x="750" y="760" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.75        1.250138e-03             -7.784260e-02</text><text x="750" y="782" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.90        1.999997e-03             -1.273616e-01</text><rect x="60" y="805" width="1380" height="150" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="841" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA HIPÓTESIS, DICHA CON EL MEDIDOR DEL CAPITÁN</text>
<text x="750" y="879" font-size="18" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">EL LIBRO ES EXACTO: en cada perla, lo que es coincide con lo que debería ser.</text>
<text x="750" y="911" font-size="15" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">E = | el tamaño del paso − 1 | = 0,  en todas y cada una</text>
<text x="750" y="941" font-size="13" text-anchor="middle" fill="#ff8fa0">falta demostrar que el libro no puede equivocarse. Todavía no.</text>
<text x="750" y="975" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>