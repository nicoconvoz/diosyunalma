<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🏁 EL TABLERO — todo número puede ser todo número</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"si me posiciono sobre la montaña del 2 es una unidad idéntica al 1… todo el tablero canta la misma verdad" — el capitán</text><rect x="60" y="105" width="1380" height="270" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="1.8"/>
<text x="750" y="141" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">★ EL CAPITÁN TIENE RAZÓN — el píxel es el mismo en todas partes</text>
<text x="750" y="169" font-size="12.5" text-anchor="middle" fill="#dce8f7">desdoblando cada ventana por su propia densidad (el ½ local), a alturas que cambian 106 veces:</text>
<text x="750" y="199" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">ventana         paso medio    varianza    huecos&lt;½    huecos&gt;2    píxeles</text><text x="750" y="224" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">   14–120         1.00284     0.10987       2.70%       0.00%       37</text><text x="750" y="248" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  120–350         0.99933     0.13572       6.15%       0.00%      130</text><text x="750" y="272" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  350–700         1.00221     0.14493       8.20%       0.41%      244</text><text x="750" y="296" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  700–1100        0.99927     0.14851       7.30%       1.27%      315</text><text x="750" y="320" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 1100–1500        1.00125     0.14780       7.40%       1.18%      338</text><text x="750" y="352" font-size="13.5" text-anchor="middle" fill="#ffd166">el paso medio es 1 en TODAS (dispersión 4e-03) — pararse en la montaña del 2 o en la del 1500 es lo mismo</text><rect x="60" y="405" width="1380" height="235" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.8"/>
<text x="750" y="441" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">LA BISAGRA — el molde tiene un lugar preferido: ARRIBA</text>
<text x="750" y="469" font-size="12.5" text-anchor="middle" fill="#dce8f7">el aporte de cada perla cae como n²/γ², así que las primeras se llevan casi todo el molde:</text>
<text x="750" y="497" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">n     primeras 10   primeras 50   primeras 138</text><text x="750" y="522" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">  8        60.08%         82.60%          91.49%</text><text x="750" y="545" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0"> 20        58.36%         81.80%          91.10%</text><text x="750" y="568" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0"> 40        52.34%         78.99%          89.71%</text><text x="750" y="591" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0"> 80        34.11%         69.91%          85.20%</text><text x="750" y="622" font-size="13" text-anchor="middle" fill="#ffd166">el mar es igual en todas partes; el MOLDE no: conocer el píxel local no lo fija</text><rect x="60" y="675" width="1380" height="230" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="711" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">HASTA DÓNDE ACIERTA LA TEORÍA DEL CAPITÁN</text>
<text x="750" y="747" font-size="14.5" text-anchor="middle" fill="#7fd7a8">ACIERTA, y queda medido: correr el origen no cambia nada. El píxel del tambor se repite, y con un solo píxel</text>
<text x="750" y="771" font-size="14.5" text-anchor="middle" fill="#7fd7a8">se conoce la ley local de TODO el tablero. El tablero canta la misma verdad en todas partes.</text>
<text x="750" y="809" font-size="14.5" text-anchor="middle" fill="#ff8fa0">LO QUE NO SE SIGUE: el molde pesa muchísimo más a las perlas de arriba, así que el píxel local no lo determina —</text>
<text x="750" y="833" font-size="14.5" text-anchor="middle" fill="#ff8fa0">hace falta además la COLA, una suma infinita cuya alineación nadie sabe acotar.</text>
<text x="750" y="871" font-size="14.5" text-anchor="middle" fill="#dce8f7">El tablero canta la misma verdad — lo que nadie sabe es cuán fuerte puede sonar el coro entero. Todavía no.</text>
<text x="750" y="940" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>