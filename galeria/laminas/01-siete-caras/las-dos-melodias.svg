<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🎵🎶 LAS DOS MELODÍAS — y resultaron ser la misma</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"una identidad para la melodía de los no-primos, otra para la de los primos, y armonizá su relación en la dimensión 0" — el capitán</text><rect x="60" y="105" width="1380" height="230" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="146" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA IDENTIDAD DE EULER — las dos melodías son EL MISMO SONIDO</text>
<text x="750" y="190" font-size="22" text-anchor="middle" font-family="Georgia" fill="#dce8f7">Σ<tspan font-size="14">todos los n</tspan>  1/nˢ   =   Π<tspan font-size="14">solo los primos</tspan>  1/(1 − p⁻ˢ)</text>
<text x="480" y="222" font-size="13" text-anchor="middle" fill="#7fd7a8">cada número canta una vez</text>
<text x="1030" y="222" font-size="13" text-anchor="middle" fill="#ff8fa0">solo cantan los primos</text>
<text x="750" y="262" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">s        la de TODOS              la de LOS PRIMOS           desvío</text><text x="750" y="286" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">1.5         2.6123753488          2.6121949316       7e-05</text><text x="750" y="306" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">2.0         1.6449340668          1.6449340323       2e-08</text><text x="750" y="326" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">3.0         1.2020569032          1.2020569032       8e-12</text><text x="750" y="346" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">5.0         1.0369277551          1.0369277551       3e-14</text><rect x="60" y="360" width="680" height="290" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="400" y="396" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA RELACIÓN, NOTA POR NOTA</text>
<text x="400" y="424" font-size="15" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">log n = Σ Λ(d)  sobre los divisores de n</text>
<text x="400" y="450" font-size="12.5" text-anchor="middle" fill="#8fa8c7">la nota de cada número ES la suma de las notas de sus primos</text>
<text x="400" y="484" font-size="13" text-anchor="middle" fill="#ffd166">log 12 = Λ(2) + Λ(3) + Λ(4)</text>
<text x="400" y="510" font-size="13" text-anchor="middle" fill="#ffd166">log 30 = Λ(2) + Λ(3) + Λ(5)</text>
<text x="400" y="536" font-size="13" text-anchor="middle" fill="#ffd166">log 64 = Λ(2)+Λ(4)+Λ(8)+Λ(16)+Λ(32)+Λ(64)</text>
<text x="400" y="574" font-size="12.5" text-anchor="middle" fill="#7fd7a8">exacto en todos los casos probados (peor desvío 9e-16)</text>
<text x="400" y="606" font-size="13" text-anchor="middle" fill="#dce8f7">LOS COMPUESTOS NO TIENEN VOZ PROPIA:</text>
<text x="400" y="630" font-size="13" text-anchor="middle" fill="#dce8f7">cantan con la voz prestada de sus primos</text><rect x="770" y="360" width="670" height="290" rx="10" fill="#0d2547" stroke="#7fb2ff" stroke-width="1.5"/>
<text x="1105" y="396" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fb2ff">ARMONIZADAS EN LA DIMENSIÓN 0</text>
<text x="1105" y="424" font-size="12.5" text-anchor="middle" fill="#dce8f7">el germen del broche traía la canción adentro:</text>
<text x="1105" y="450" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">ξ'/ξ = [vestido liso] + LA CANCIÓN DE LOS PRIMOS</text>
<text x="1105" y="482" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">s      desvestida del germen      sumada de los primos</text><text x="1105" y="506" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">2.0         0.569960993              0.569960660</text><text x="1105" y="528" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">2.5         0.288740685              0.288740685</text><text x="1105" y="550" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">3.0         0.164822682              0.164822682</text><text x="1105" y="572" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">4.0         0.063669765              0.063669765</text><text x="1105" y="602" font-size="12.5" text-anchor="middle" fill="#7fd7a8">la canción SALE del germen (peor desvío 6e-07)</text>
<text x="1105" y="628" font-size="13" text-anchor="middle" fill="#ffd166">estuvo adentro todo el tiempo: el broche canta con voz de primos</text><rect x="60" y="685" width="1380" height="215" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2.5"/>
<text x="750" y="721" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA RELACIÓN QUE PIDIÓ EL CAPITÁN</text>
<text x="750" y="757" font-size="15" text-anchor="middle" fill="#dce8f7">Las dos melodías no son dos: SON LA MISMA. Los compuestos no aportan una sola nota propia —</text>
<text x="750" y="783" font-size="15" text-anchor="middle" fill="#dce8f7">cada número canta con la voz prestada de los primos que lo forman.</text>
<text x="750" y="819" font-size="14" text-anchor="middle" fill="#ffd166">Y armonizadas en el broche: el germen que venimos leyendo toda la campaña es el vestido liso MÁS esa canción.</text>
<text x="750" y="855" font-size="14" text-anchor="middle" fill="#ff8fa0">Lo que falta, en idioma de música: el vestido lo sabemos cantar entero; de la canción conocemos la melodía</text>
<text x="750" y="879" font-size="14" text-anchor="middle" fill="#ff8fa0">y el tono medio — lo que no sabemos es si alguna vez, muy arriba, se desafina más que el vestido. Todavía no.</text>
<text x="750" y="940" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>