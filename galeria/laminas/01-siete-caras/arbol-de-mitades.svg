<text x="390" y="499" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL MAR INALCANZABLE — partir el 7</text>
<text x="390" y="527" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">corte          lo que queda de 7</text><text x="390" y="552" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">   1           3.5000e+00</text><text x="390" y="576" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">   3           8.7500e-01</text><text x="390" y="600" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  10           6.8359e-03</text><text x="390" y="624" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  50           6.2172e-15</text><text x="390" y="648" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 200           4.3561e-60</text><text x="390" y="672" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">1000           6.5328e-301</text><text x="390" y="700" font-size="12.5" text-anchor="middle" fill="#7fd7a8">se acerca siempre y no llega nunca: la dimensión 0</text><rect x="760" y="465" width="680" height="240" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.5"/>
<text x="1100" y="499" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">EL PRECIO EN CADA NODO — solo la raíz entra gratis</text>
<text x="1100" y="527" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β = k/16          precio (N+S)/2 − 1</text><text x="1100" y="552" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.1250            +1.7546e-06</text><text x="1100" y="576" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.2500            +7.8045e-07</text><text x="1100" y="600" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.3750            +1.9520e-07</text><text x="1100" y="624" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#7fd7a8">0.5000            +0.0000e+00   ★ GRATIS</text><text x="1100" y="648" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.6250            +1.9520e-07</text><text x="1100" y="672" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.7500            +7.8045e-07</text><text x="1100" y="700" font-size="12.5" text-anchor="middle" fill="#dce8f7">el árbol entero paga; el 1/2 es el único nodo con precio cero</text><rect x="60" y="735" width="1380" height="160" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="771" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA HIPÓTESIS, DICHA CON EL ÁRBOL DEL CAPITÁN</text>
<text x="750" y="805" font-size="14.5" text-anchor="middle" fill="#dce8f7">De partir y partir nacen infinitos lugares donde una perla podría vivir. Al dar vuelta el mundo, todos se emparejan de a dos… menos uno.</text>
<text x="750" y="837" font-size="15.5" text-anchor="middle" fill="#7fd7a8">El libro elige SIEMPRE ese único: el que es su propia pareja, y el único que no cobra.</text>
<text x="750" y="866" font-size="13.5" text-anchor="middle" fill="#ff8fa0">Falta demostrar que no puede elegir otro. Todavía no.</text>
<text x="750" y="890" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>