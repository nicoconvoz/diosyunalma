<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="700" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🔨 EL YUNQUE — la fábrica de cuadrados, construida y medida</text>
<text x="700" y="76" font-size="14" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">M[m,n] = λₘ + λₙ − λ|m−n| · positiva para todo N ⟺ RH · su Cholesky M = AᵀA, exhibido hasta donde el material aguanta</text>
<rect x="60" y="110" width="620" height="330" rx="12" fill="#101f36" stroke="#26456e"/>
<text x="370" y="142" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7ee0c0">LA ESCALERA DE PIVOTES — geométrica, hasta el piso de ruido</text>
<rect x="100.0" y="224.0" width="46" height="171.0" fill="#7ee0c0" opacity="0.85"/>
<text x="123.0" y="214.0" font-size="10.5" text-anchor="middle" font-family="monospace" fill="#9aa8c4" transform="rotate(-38 123.0 214.0)">4.6e-02</text>
<rect x="172.0" y="273.4" width="46" height="121.6" fill="#7ee0c0" opacity="0.85"/>
<text x="195.0" y="263.4" font-size="10.5" text-anchor="middle" font-family="monospace" fill="#9aa8c4" transform="rotate(-38 195.0 263.4)">7.4e-05</text>
<rect x="244.0" y="320.2" width="46" height="74.8" fill="#7ee0c0" opacity="0.85"/>
<text x="267.0" y="310.2" font-size="10.5" text-anchor="middle" font-family="monospace" fill="#9aa8c4" transform="rotate(-38 267.0 310.2)">1.7e-07</text>
<rect x="316.0" y="358.7" width="46" height="36.3" fill="#7ee0c0" opacity="0.85"/>
<text x="339.0" y="348.7" font-size="10.5" text-anchor="middle" font-family="monospace" fill="#9aa8c4" transform="rotate(-38 339.0 348.7)">1.1e-09</text>
<rect x="388.0" y="359.6" width="46" height="35.4" fill="#ff9aa8" opacity="0.85"/>
<text x="411.0" y="349.6" font-size="10.5" text-anchor="middle" font-family="monospace" fill="#9aa8c4" transform="rotate(-38 411.0 349.6)">1.0e-09</text>
<rect x="460.0" y="359.7" width="46" height="35.3" fill="#ff9aa8" opacity="0.85"/>
<text x="483.0" y="349.7" font-size="10.5" text-anchor="middle" font-family="monospace" fill="#9aa8c4" transform="rotate(-38 483.0 349.7)">9.9e-10</text>
<rect x="532.0" y="387.0" width="46" height="8.0" fill="#ff9aa8" opacity="0.85"/>
<text x="555.0" y="377.0" font-size="10.5" text-anchor="middle" font-family="monospace" fill="#9aa8c4" transform="rotate(-38 555.0 377.0)">-6.9e-10</text>
<text x="370" y="372" font-size="12" text-anchor="middle" font-family="Georgia" fill="#ff9aa8">rosa = hundido en el ruido del material (7e-06): ventana agotada, no negatividad — declarado</text>
<text x="370" y="424" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">4 cuadrados firmes · el coro canta casi al unísono (φ ≈ 1/γ ≤ 1/14 ⟹ 1−wⁿ ≈ n(1−w))</text>
<rect x="720" y="110" width="620" height="330" rx="12" fill="#0f2b22" stroke="#2f7f63"/>
<text x="1030" y="142" font-size="16" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">LA ESQUINA DE A — la fábrica: Q(c) = ||Ac||²</text>
<text x="750" y="185" font-size="14.5" font-family="monospace" fill="#ffd98a">  0.21492</text>
<text x="750" y="219" font-size="14.5" font-family="monospace" fill="#ffd98a">  0.42967  0.00861</text>
<text x="750" y="253" font-size="14.5" font-family="monospace" fill="#ffd98a">  0.64390  0.02581  0.00041</text>
<text x="750" y="287" font-size="14.5" font-family="monospace" fill="#ffd98a">  0.85728  0.05155  0.00164  0.00003</text>
<text x="750" y="400" font-size="13" font-family="Georgia" fill="#cfe6ff">a₁₁ = √(2λ₁) = 0.214922 — el primer golpe lo dan los primos solos (Mertens)</text>
<text x="750" y="424" font-size="13" font-family="Georgia" fill="#cfe6ff">autovalores de M₄₀: máximo 8.9e+02 · mínimo indistinguible de 0 al ruido</text>
<rect x="60" y="470" width="1280" height="160" rx="12" fill="#2b1020" stroke="#8a3557"/>
<text x="700" y="502" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ff9aa8">EL OÍDO DEL YUNQUE — medido con controles en la piel</text>
<text x="700" y="534" font-size="14" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">tupla sintética fuera de la piel (β=0.8, γ=2), aislada: la escalera de Li la oye en n = 12 — el yunque en N = 3</text>
<text x="700" y="562" font-size="14" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">la perla DH real (β=0.809, γ=85.7), aislada: la escalera necesita n = 537 (≈ 2π/φ, su primer nulo de fase — corrección F294) — el yunque la oye en N = 22</text>
<text x="700" y="590" font-size="13" text-anchor="middle" font-family="Georgia" fill="#ffd98a">los cuadrados se cancelan en las direcciones casi-unísono y la fuga radial queda al desnudo en los términos cruzados</text>
<text x="700" y="614" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#9aa8c4">caveat declarado: es la tupla SOLA — en un espectro completo el fondo de Gram del coro puede taparla; queda abierto</text>
<text x="700" y="672" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd98a">LO QUE FALTA: demostrar que el pivote de Cholesky nunca pisa territorio negativo — para TODO N, desde los primos.</text>
<text x="700" y="700" font-size="14" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">Ésa es la positividad de Weil (74 años abierta). La fábrica está construida en la ventana; falta el teorema que la sostenga entera.</text>
<text x="700" y="744" font-size="14" text-anchor="middle" font-family="Georgia" fill="#9aa8c4">Li 1997 · Bombieri–Lagarias 1999 · Weil 1952 — lo nuestro: la construcción medida, con su ruido y sus controles a la vista.</text>
<text x="700" y="776" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd98a">Todavía no.</text>
</svg>
