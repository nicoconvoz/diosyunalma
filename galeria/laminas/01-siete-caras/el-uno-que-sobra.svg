<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1040" viewBox="0 0 1560 1040">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="780" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">1️⃣ EL UNO QUE SOBRA — la cuenta del capitán, y qué compra de verdad</text>
<text x="780" y="76" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">«da para todooossss» es cierto — y ése es exactamente el problema</text>
<rect x="40" y="102" width="730" height="290" rx="10" fill="#161a3a" stroke="#5a4fa8"/>
<text x="405" y="134" font-size="17" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">SU TABLA, Y ES EXACTA</text>
<text x="70" y="174" font-size="18" font-family="monospace" fill="#ffd98a">2 · ½ + 1 = 2</text>
<text x="330" y="174" font-size="15" font-family="Georgia" fill="#7ee0c0">✅ el único par</text>
<text x="70" y="206" font-size="18" font-family="monospace" fill="#dce8f7">2 · 1 + 1 = 3</text>
<text x="330" y="206" font-size="15" font-family="Georgia" fill="#7ee0c0">✅ primo</text>
<text x="70" y="238" font-size="18" font-family="monospace" fill="#dce8f7">2 · 2 + 1 = 5</text>
<text x="330" y="238" font-size="15" font-family="Georgia" fill="#7ee0c0">✅ primo</text>
<text x="70" y="270" font-size="18" font-family="monospace" fill="#dce8f7">2 · 3 + 1 = 7</text>
<text x="330" y="270" font-size="15" font-family="Georgia" fill="#7ee0c0">✅ primo</text>
<text x="70" y="302" font-size="18" font-family="monospace" fill="#ff8fa0">2 · 4 + 1 = 9</text>
<text x="330" y="302" font-size="15" font-family="Georgia" fill="#ff8fa0">❌ 3 × 3</text>
<text x="70" y="334" font-size="18" font-family="monospace" fill="#ff8fa0">2 · 7 + 1 = 15</text>
<text x="330" y="334" font-size="15" font-family="Georgia" fill="#ff8fa0">❌ 3 × 5</text>
<text x="405" y="372" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#ffd98a">da para TODOS los primos — y también para el 9 y el 15</text><rect x="790" y="102" width="730" height="290" rx="10" fill="#33221c" stroke="#c0392b"/>
<text x="1155" y="134" font-size="17" text-anchor="middle" font-family="Georgia" fill="#ffb27a">⚠️ PERO NO PUEDE FALLAR</text>
<text x="820" y="176" font-size="14.5" font-family="Georgia" fill="#f3d9cf">«2k + 1» no es una propiedad de los primos:</text>
<text x="820" y="200" font-size="16" font-family="monospace" fill="#dce8f7">es la DEFINICIÓN de impar.</text>
<text x="820" y="240" font-size="14.5" font-family="Georgia" fill="#f3d9cf">Y todo primo mayor que 2 es impar, porque si</text>
<text x="820" y="262" font-size="14.5" font-family="Georgia" fill="#f3d9cf">fuera par lo dividiría el 2 y no sería primo.</text>
<text x="820" y="302" font-size="16" font-family="monospace" fill="#ff8fa0">primos &gt; 2 que NO son 2k+1: 0</text>
<text x="820" y="326" font-size="13.5" font-family="Georgia" fill="#9aa8c4">y ese cero es inevitable: es la definición, no una medición</text>
<text x="1155" y="368" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd98a">SÉPTIMA aparición de la trampa del 0.0e+00</text><rect x="40" y="412" width="730" height="230" rx="10" fill="#101f36" stroke="#26456e"/>
<text x="405" y="444" font-size="17" text-anchor="middle" font-family="Georgia" fill="#ffd98a">«DA PARA TODOS» ES LA MITAD DE LA PREGUNTA</text>
<text x="405" y="470" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">la otra mitad es: ¿y para quién MÁS?</text>
<text x="70" y="512" font-size="16" font-family="monospace" fill="#cfe6ff">impares hasta 10⁷ ...... 4999999</text>
<text x="70" y="540" font-size="16" font-family="monospace" fill="#7ee0c0">de esos, primos ........ 664578</text>
<text x="70" y="568" font-size="16" font-family="monospace" fill="#ff8fa0">compuestos ............. 4335421</text>
<text x="70" y="602" font-size="19" font-family="monospace" fill="#ffd98a">acierto: 13.292%</text>
<text x="405" y="628" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#9aa8c4">atrapa todos los peces, y también casi toda el agua</text>
<rect x="790" y="412" width="730" height="230" rx="10" fill="#0f2b22" stroke="#2f7f63"/>
<text x="1155" y="444" font-size="17" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">⚡ PERO EL MANGO ES EL CORRECTO</text>
<text x="1155" y="470" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">el «1 que sobra» es el RESTO — pedile resto también al 3, al 5…</text>
<text x="1155" y="502" font-size="17" text-anchor="middle" font-family="monospace" fill="#ffd98a">2k+1 → 6k±1 → 30k±{1,7,11,13} → …</text>
<rect x="830.0" y="581.6" width="64.0" height="28.4" fill="#7ee0c0"/><text x="862.0" y="577" font-size="11" text-anchor="middle" font-family="monospace" fill="#cfe6ff">13.3%</text><rect x="936.7" y="567.4" width="64.0" height="42.6" fill="#7ee0c0"/><text x="968.7" y="562" font-size="11" text-anchor="middle" font-family="monospace" fill="#cfe6ff">19.9%</text><rect x="1043.3" y="556.8" width="64.0" height="53.2" fill="#7ee0c0"/><text x="1075.3" y="552" font-size="11" text-anchor="middle" font-family="monospace" fill="#cfe6ff">24.9%</text><rect x="1150.0" y="547.9" width="64.0" height="62.1" fill="#7ee0c0"/><text x="1182.0" y="543" font-size="11" text-anchor="middle" font-family="monospace" fill="#cfe6ff">29.1%</text><rect x="1256.7" y="541.7" width="64.0" height="68.3" fill="#7ee0c0"/><text x="1288.7" y="537" font-size="11" text-anchor="middle" font-family="monospace" fill="#cfe6ff">32.0%</text><rect x="1363.3" y="536.0" width="64.0" height="74.0" fill="#7ee0c0"/><text x="1395.3" y="531" font-size="11" text-anchor="middle" font-family="monospace" fill="#cfe6ff">34.6%</text><text x="1155" y="634" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#9aa8c4">y en el límite, pedir resto a TODOS los primos menores ES la definición de primo</text><rect x="40" y="662" width="1480" height="180" rx="10" fill="#1a1030" stroke="#5a4fa8"/>
<text x="780" y="694" font-size="18" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">⚖️ EL LÍMITE, QUE ES EL QUE DECIDE TODO</text>
<text x="780" y="728" font-size="15" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">Mirá qué le pasa al acierto de 2k+1 cuando el mar se hace más grande:</text>
<circle cx="220.0" cy="753.1" r="5" fill="#ff8fa0"/><text x="220.0" y="741" font-size="13" text-anchor="middle" font-family="monospace" fill="#ffd98a">33.5%</text><text x="220.0" y="818" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">10^3</text><circle cx="500.0" cy="765.6" r="5" fill="#ff8fa0"/><text x="500.0" y="754" font-size="13" text-anchor="middle" font-family="monospace" fill="#ffd98a">24.6%</text><text x="500.0" y="818" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">10^4</text><circle cx="780.0" cy="773.1" r="5" fill="#ff8fa0"/><text x="780.0" y="761" font-size="13" text-anchor="middle" font-family="monospace" fill="#ffd98a">19.2%</text><text x="780.0" y="818" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">10^5</text><circle cx="1060.0" cy="778.0" r="5" fill="#ff8fa0"/><text x="1060.0" y="766" font-size="13" text-anchor="middle" font-family="monospace" fill="#ffd98a">15.7%</text><text x="1060.0" y="818" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">10^6</text><circle cx="1340.0" cy="781.4" r="5" fill="#ff8fa0"/><text x="1340.0" y="769" font-size="13" text-anchor="middle" font-family="monospace" fill="#ffd98a">13.3%</text><text x="1340.0" y="818" font-size="12" text-anchor="middle" font-family="monospace" fill="#8fa8c7">10^7</text><text x="780" y="832" font-size="14" text-anchor="middle" font-family="Georgia" fill="#9aa8c4">baja siempre, y baja para CUALQUIER rueda fija: los primos se ralean como 1/ln(x) y la rueda se queda quieta</text><rect x="40" y="862" width="1480" height="150" rx="10" fill="#0f2b22" stroke="#2f7f63"/>
<text x="780" y="894" font-size="17" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">LO QUE QUEDA, DICHO SIN ADORNOS</text>
<text x="780" y="928" font-size="15" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">Su cuenta es exacta y da para todos, pero no puede fallar: es la definición de impar. No distingue un primo de un 9.</text>
<text x="780" y="954" font-size="15" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">Y sin embargo fue a agarrar el mango correcto: ese «1 que sobra» es el resto, y el resto es de lo que están hechos los primos.</text>
<text x="780" y="988" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd98a">La rueda mejora la constante. Nunca la tendencia. Ésa es la pared, y es la misma de siempre.</text>
</svg>
