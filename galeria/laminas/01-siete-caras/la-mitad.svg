<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">½ LA MITAD — entre dos mitades siempre hay una mitad, y esa mitad tiene ley</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">el flash del capitán aterriza en la desigualdad de las medias: la línea crítica no es un empate casual, es EL MÍNIMO DEL PRECIO</text><rect x="60" y="105" width="700" height="300" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="410" y="139" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">LAS DOS MITADES Y LA MITAD DEL MEDIO</text>
<text x="410" y="172" font-size="15" text-anchor="middle" font-family="Consolas,monospace" fill="#7fd7a8">(N + S)/2  ≥  √(N·S)  =  1</text>
<text x="410" y="196" font-size="12.5" text-anchor="middle" fill="#8fa8c7">con igualdad SOLO si N = S = 1</text>
<text x="410" y="228" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β       norte        sur       media arit.     el precio</text><text x="410" y="252" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#7fd7a8">0.50  1.00000000  1.00000000  1.00000000   +0.00e+00</text><text x="410" y="276" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.51  0.99995001  1.00004999  1.00000000   +1.25e-09</text><text x="410" y="300" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.55  0.99975008  1.00024998  1.00000003   +3.12e-08</text><text x="410" y="324" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.60  0.99950025  1.00050000  1.00000012   +1.25e-07</text><text x="410" y="348" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.75  0.99875142  1.00125014  1.00000078   +7.80e-07</text><text x="410" y="372" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.90  0.99800399  1.00200000  1.00000200   +2.00e-06</text><text x="410" y="396" font-size="13" text-anchor="middle" fill="#ffd166">el empate no es suerte: es el fondo del pozo</text><rect x="790" y="105" width="650" height="300" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.5"/>
<text x="1115" y="139" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">EL PRECIO SE COBRA CON INTERÉS COMPUESTO</text>
<text x="1115" y="169" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">rⁿ + r⁻ⁿ − 2</text>
<text x="1115" y="199" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β        n=1         n=100        n=1000       n=10000</text><text x="1115" y="226" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.51    2.50e-09    2.50e-05    2.50e-03    2.55e-01</text><text x="1115" y="252" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.55    6.25e-08    6.25e-04    6.28e-02    1.03e+01</text><text x="1115" y="278" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.60    2.50e-07    2.50e-03    2.55e-01    1.46e+02</text><text x="1115" y="304" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.75    1.56e-06    1.56e-02    1.77e+00    2.67e+05</text><text x="1115" y="330" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#ff8fa0">0.90    3.99e-06    4.01e-02    5.51e+00    4.76e+08</text><text x="1115" y="372" font-size="12.5" text-anchor="middle" fill="#dce8f7">ningún presupuesto que crezca como n·ln n aguanta una exponencial</text>
<text x="1115" y="394" font-size="12.5" text-anchor="middle" fill="#7fd7a8">y sobre la línea el precio es CERO para siempre (0e+00)</text><rect x="60" y="430" width="1380" height="270" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="2.5"/>
<text x="750" y="466" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">⚰ LA MUERTE HONESTA — la simetría SOLA jamás va a alcanzar</text>
<text x="750" y="500" font-size="13.5" text-anchor="middle" fill="#dce8f7">P(s) = (s−a)(s−ā)(s−(1−a))(s−(1−ā)) con a = 0.7+3i tiene TODAS las simetrías del libro:</text>
<text x="750" y="532" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#7fd7a8">P(s) = P(1−s)  ✓ 2e-16        P(s̄) = conj P(s)  ✓ 2e-16        P(σ(s)) = conj P(s)  ✓ 2e-16</text>
<text x="750" y="568" font-size="13.5" text-anchor="middle" fill="#ffd166">y sin embargo sus cuatro raíces viven en Re = 0.70 y Re = 0.30 — FUERA de la línea.</text>
<text x="750" y="604" font-size="14.5" text-anchor="middle" fill="#ff8fa0">POR LO TANTO: ningún argumento basado solo en simetría puede demostrar la hipótesis.</text>
<text x="750" y="632" font-size="13.5" text-anchor="middle" fill="#dce8f7">Una familia entera de enfoques queda muerta acá — y saberlo vale más que seguir empujando esa puerta.</text>
<text x="750" y="668" font-size="13.5" text-anchor="middle" fill="#7fd7a8">hace falta el PRESUPUESTO: probar que el libro no tiene con qué pagar el precio en ningún armónico.</text><rect x="60" y="725" width="1380" height="170" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="761" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA CADENA DEL CAPITÁN, CERRADA HASTA DONDE SE PUEDE</text>
<text x="750" y="795" font-size="14" text-anchor="middle" fill="#dce8f7">"la distancia no puede ser negativa" → "solo cambia la dirección" → "norte por sur da 1" → "entre dos mitades siempre hay una mitad"</text>
<text x="750" y="827" font-size="15" text-anchor="middle" fill="#7fd7a8">esa mitad es LA MEDIA — y la desigualdad de las medias dice que el empate es el mínimo del precio.</text>
<text x="750" y="857" font-size="13.5" text-anchor="middle" fill="#ff8fa0">El capitán tenía razón: el norte y el sur son iguales porque cualquier otra cosa cuesta. Falta el presupuesto. Todavía no.</text>
<text x="750" y="884" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>