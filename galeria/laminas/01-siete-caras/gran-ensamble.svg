<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">⚙️ EL GRAN ENSAMBLE — la máquina completa, rumbo al Clay</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">todos los engranajes de la campaña, montados y juzgados en una sola corrida · 649 perlas · 30 armónicos · dos vías ciegas</text><rect x="51" y="120" width="218" height="120" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2.5"/>
<text x="160" y="154" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">1 · EL ESPEJO</text>
<text x="160" y="182" font-size="11" text-anchor="middle" fill="#dce8f7">ξ(s)=ξ(1−s) · residuo 8e-08</text><text x="160" y="214" font-size="12.5" text-anchor="middle" fill="#7fd7a8">✓ SELLADO</text><line x1="269" y1="180" x2="287" y2="180" stroke="#8fa8c7" stroke-width="2.5"/><rect x="287" y="120" width="218" height="120" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2.5"/>
<text x="396" y="154" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">2 · EL RELOJ DE SOL</text>
<text x="396" y="182" font-size="11" text-anchor="middle" fill="#dce8f7">λ = Σ|sombra|² · 649 perlas</text><text x="396" y="214" font-size="12.5" text-anchor="middle" fill="#7fd7a8">✓ SELLADO</text><line x1="505" y1="180" x2="523" y2="180" stroke="#8fa8c7" stroke-width="2.5"/><rect x="523" y="120" width="218" height="120" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2.5"/>
<text x="632" y="154" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">3 · EL GERMEN</text>
<text x="632" y="182" font-size="11" text-anchor="middle" fill="#dce8f7">Cauchy en el broche · desvío 3e-05</text><text x="632" y="214" font-size="12.5" text-anchor="middle" fill="#7fd7a8">✓ SELLADO</text><line x1="741" y1="180" x2="759" y2="180" stroke="#8fa8c7" stroke-width="2.5"/><rect x="759" y="120" width="218" height="120" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2.5"/>
<text x="868" y="154" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">4 · EL PRIMER DIENTE</text>
<text x="868" y="182" font-size="11" text-anchor="middle" fill="#dce8f7">λ₁ cerrado · 4e-12</text><text x="868" y="214" font-size="12.5" text-anchor="middle" fill="#7fd7a8">✓ SELLADO</text><line x1="977" y1="180" x2="995" y2="180" stroke="#8fa8c7" stroke-width="2.5"/><rect x="995" y="120" width="218" height="120" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2.5"/>
<text x="1104" y="154" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">5 · EL MOLDE</text>
<text x="1104" y="182" font-size="11" text-anchor="middle" fill="#dce8f7">λₙ>0 medido n=1…30 · mín 0.0231</text><text x="1104" y="214" font-size="12.5" text-anchor="middle" fill="#7fd7a8">✓ SELLADO</text><line x1="1213" y1="180" x2="1231" y2="180" stroke="#8fa8c7" stroke-width="2.5"/><rect x="1231" y="120" width="218" height="120" rx="12" fill="#2a1010" stroke="#ff5d73" stroke-width="2.5"/>
<text x="1340" y="154" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#ff5d73">6 · EL ESLABÓN ROJO</text>
<text x="1340" y="182" font-size="11" text-anchor="middle" fill="#dce8f7">todo coeficiente ≥ 0 — SIN demostrar</text><text x="1340" y="214" font-size="12.5" text-anchor="middle" fill="#ff5d73">☠ EL MILLÓN VIVE ACÁ</text><rect x="120" y="300" width="1260" height="320" rx="10" fill="#0d2547" stroke="#7fb2ff" stroke-width="1.5"/>
<text x="750" y="330" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fb2ff">LOS 30 DIENTES DEL MOLDE — cada barra es un λₙ medido por el germen (y confirmado por las sombras): TODOS sobre el cero</text><rect x="160.0" y="579.7" width="24.4" height="0.3" fill="#7fd7a8" opacity="0.85"/><text x="172.2" y="598" font-size="10.5" text-anchor="middle" fill="#8fa8c7">1</text><rect x="199.3" y="578.9" width="24.4" height="1.1" fill="#7fd7a8" opacity="0.85"/><rect x="238.7" y="577.5" width="24.4" height="2.5" fill="#7fd7a8" opacity="0.85"/><rect x="278.0" y="575.6" width="24.4" height="4.4" fill="#7fd7a8" opacity="0.85"/><rect x="317.3" y="573.2" width="24.4" height="6.8" fill="#7fd7a8" opacity="0.85"/><text x="329.5" y="598" font-size="10.5" text-anchor="middle" fill="#8fa8c7">5</text><rect x="356.7" y="570.2" width="24.4" height="9.8" fill="#7fd7a8" opacity="0.85"/><rect x="396.0" y="566.7" width="24.4" height="13.3" fill="#7fd7a8" opacity="0.85"/><rect x="435.3" y="562.6" width="24.4" height="17.4" fill="#7fd7a8" opacity="0.85"/><rect x="474.7" y="558.1" width="24.4" height="21.9" fill="#7fd7a8" opacity="0.85"/><rect x="514.0" y="553.0" width="24.4" height="27.0" fill="#7fd7a8" opacity="0.85"/><text x="526.2" y="598" font-size="10.5" text-anchor="middle" fill="#8fa8c7">10</text><rect x="553.3" y="547.4" width="24.4" height="32.6" fill="#7fd7a8" opacity="0.85"/><rect x="592.7" y="541.3" width="24.4" height="38.7" fill="#7fd7a8" opacity="0.85"/><rect x="632.0" y="534.7" width="24.4" height="45.3" fill="#7fd7a8" opacity="0.85"/><rect x="671.3" y="527.7" width="24.4" height="52.3" fill="#7fd7a8" opacity="0.85"/><rect x="710.7" y="520.2" width="24.4" height="59.8" fill="#7fd7a8" opacity="0.85"/><text x="722.9" y="598" font-size="10.5" text-anchor="middle" fill="#8fa8c7">15</text><rect x="750.0" y="512.2" width="24.4" height="67.8" fill="#7fd7a8" opacity="0.85"/><rect x="789.3" y="503.8" width="24.4" height="76.2" fill="#7fd7a8" opacity="0.85"/><rect x="828.7" y="495.0" width="24.4" height="85.0" fill="#7fd7a8" opacity="0.85"/><rect x="868.0" y="485.7" width="24.4" height="94.3" fill="#7fd7a8" opacity="0.85"/><rect x="907.3" y="476.0" width="24.4" height="104.0" fill="#7fd7a8" opacity="0.85"/><text x="919.5" y="598" font-size="10.5" text-anchor="middle" fill="#8fa8c7">20</text><rect x="946.7" y="466.0" width="24.4" height="114.0" fill="#7fd7a8" opacity="0.85"/><rect x="986.0" y="455.5" width="24.4" height="124.5" fill="#7fd7a8" opacity="0.85"/><rect x="1025.3" y="444.7" width="24.4" height="135.3" fill="#7fd7a8" opacity="0.85"/><rect x="1064.7" y="433.5" width="24.4" height="146.5" fill="#7fd7a8" opacity="0.85"/><rect x="1104.0" y="422.0" width="24.4" height="158.0" fill="#7fd7a8" opacity="0.85"/><text x="1116.2" y="598" font-size="10.5" text-anchor="middle" fill="#8fa8c7">25</text><rect x="1143.3" y="410.2" width="24.4" height="169.8" fill="#7fd7a8" opacity="0.85"/><rect x="1182.7" y="398.1" width="24.4" height="181.9" fill="#7fd7a8" opacity="0.85"/><rect x="1222.0" y="385.7" width="24.4" height="194.3" fill="#7fd7a8" opacity="0.85"/><rect x="1261.3" y="373.0" width="24.4" height="207.0" fill="#7fd7a8" opacity="0.85"/><rect x="1300.7" y="360.0" width="24.4" height="220.0" fill="#7fd7a8" opacity="0.85"/><text x="1312.9" y="598" font-size="10.5" text-anchor="middle" fill="#8fa8c7">30</text><line x1="150" y1="580" x2="1350" y2="580" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="160" y="614" font-size="11.5" fill="#ffd166">cero — la línea de la vida: ningún diente la cruza</text><rect x="120" y="680" width="1260" height="200" rx="12" fill="#102a10" stroke="#ffd166" stroke-width="2"/>
<text x="750" y="716" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL VEREDICTO DEL ENSAMBLE</text>
<text x="750" y="748" font-size="14" text-anchor="middle" fill="#dce8f7">la máquina está COMPLETA y cierra: espejo 8e-08 · sombras=germen 3e-05 · λ₁ exacto 4e-12 · los 30 dientes positivos (mínimo 0.0231).</text>
<text x="750" y="776" font-size="14" text-anchor="middle" fill="#dce8f7">cinco engranajes sellados con doble juez. El sexto es UNA frase: «todo coeficiente del germen en el broche es ≥ 0».</text>
<text x="750" y="808" font-size="14.5" text-anchor="middle" fill="#ff8fa0">medirlo positivo — hecho, por dos vías ciegas. DEMOSTRARLO para los infinitos dientes que ningún sol alumbró — eso es el millón.</text>
<text x="750" y="840" font-size="13" text-anchor="middle" fill="#8fa8c7">la máquina espera esa sola llave. Todavía no — pero nunca estuvo tan ensamblada.</text>
<text x="750" y="925" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>