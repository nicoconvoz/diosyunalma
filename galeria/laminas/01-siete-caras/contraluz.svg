<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🌗 CONTRALUZ — fantasmas contra el LIDAR: la máquina detecta, el muro se ve nítido</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"¿ensamblamos y vemos qué pasa?" — pasó esto: todo fantasma se delata a SU profundidad… y el horizonte huye a ∞ cuando se pega al anillo</text><rect x="60" y="100" width="680" height="360" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="400" y="132" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">LOS DIENTES ROTOS — el molde con un solo fantasma (β=0.95, γ=0.5)</text><line x1="110" y1="300" x2="690" y2="300" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="118" y="292" font-size="11" fill="#ffd166">cero — la línea de la vida</text><rect x="130.0" y="300.0" width="26" height="0.0" fill="#7fd7a8" opacity="0.9"/>
<text x="143.0" y="440" font-size="10.5" text-anchor="middle" fill="#8fa8c7">1</text><rect x="175.0" y="299.8" width="26" height="0.2" fill="#7fd7a8" opacity="0.9"/>
