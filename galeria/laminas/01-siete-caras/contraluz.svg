<text x="458.0" y="440" font-size="10.5" text-anchor="middle" fill="#8fa8c7">8</text><rect x="490.0" y="290.5" width="26" height="9.5" fill="#7fd7a8" opacity="0.9"/>
<text x="503.0" y="440" font-size="10.5" text-anchor="middle" fill="#8fa8c7">9</text><rect x="535.0" y="300.0" width="26" height="48.1" fill="#ff5d73" opacity="0.9"/>
<text x="548.0" y="440" font-size="10.5" text-anchor="middle" fill="#8fa8c7">10</text><rect x="580.0" y="300.0" width="26" height="120.0" fill="#ff5d73" opacity="0.9"/>
<text x="593.0" y="440" font-size="10.5" text-anchor="middle" fill="#8fa8c7">11</text><rect x="625.0" y="272.5" width="26" height="27.5" fill="#7fd7a8" opacity="0.9"/>
<text x="638.0" y="440" font-size="10.5" text-anchor="middle" fill="#8fa8c7">12</text><text x="400" y="418" font-size="12.5" text-anchor="middle" fill="#ff8fa0">los dientes 5 y 6 CRUZAN la línea de la vida — un solo fantasma y el molde deja de ser cuadrado</text>
<text x="400" y="440" font-size="12" text-anchor="middle" fill="#dce8f7">y el canal RELIEVE lo confirma: la cascada de Bernstein en x=0.20 se rompe en la derivada k=3</text><rect x="790" y="100" width="650" height="360" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.5"/>
<text x="1115" y="132" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">EL HORIZONTE DE DETECCIÓN — fantasmas pegados al anillo (γ=14.13)</text>
<text x="1115" y="162" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">β del fantasma      pulso donde se delata</text><text x="1115" y="196" font-size="14" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">β = 0.90          n ≈ 4265</text><text x="1115" y="230" font-size="14" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">β = 0.70          n ≈ 9417</text><text x="1115" y="264" font-size="14" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">β = 0.60          n ≈ 20611</text><text x="1115" y="298" font-size="14" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">β = 0.55          n ≈ 44601</text><text x="1115" y="332" font-size="14" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">β = 0.51          n ≈ 261746</text><text x="1115" y="392" font-size="13" text-anchor="middle" fill="#ff8fa0">β → 1/2: el horizonte HUYE A INFINITO — ningún barrido finito</text>
<text x="1115" y="414" font-size="13" text-anchor="middle" fill="#ff8fa0">cubre todas las profundidades. Ese es el muro, medido y con forma.</text>
<text x="1115" y="440" font-size="11.5" text-anchor="middle" fill="#8fa8c7">(nivel del mar extrapolado del ajuste λₙ ≈ 0.339·n·ln n -0.558·n — señalado como extrapolación)</text><rect x="60" y="500" width="1380" height="230" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="750" y="536" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LO QUE EL ENSAMBLE COMPLETO ACABA DE DEMOSTRAR</text>
<text x="750" y="570" font-size="14.5" text-anchor="middle" fill="#dce8f7">1 · la firma óptica NO es decorativa: es un DETECTOR — cualquier perla que abandone el anillo, en cualquier parte, rompe la luz a alguna profundidad finita.</text>
<text x="750" y="600" font-size="14.5" text-anchor="middle" fill="#dce8f7">2 · el fantasma de Siegel (β=0.95) cayó en el diente n=5 y rompió el relieve de Bernstein en la derivada k=3 — delatado al instante.</text>
<text x="750" y="630" font-size="14.5" text-anchor="middle" fill="#ffd166">3 · pero el muro quedó nítido: pegado al anillo, el fantasma exige pulsos cada vez más hondos — medir atrapa a CADA uno; ninguna medición los atrapa a TODOS.</text>
<text x="750" y="664" font-size="14.5" text-anchor="middle" fill="#ff8fa0">LA RESPUESTA A "¿QUÉ NOS FALTA?": una sola llave — demostrar que la luz solo puede crecer SIN consultar el anillo. Todo lo demás, ya está ensamblado y cierra.</text>
<text x="750" y="696" font-size="13" text-anchor="middle" fill="#8fa8c7">candidatos a llave, ya en el taller: el horno (log→cuadrados) · el Campo de la Montaña (nada se toca) · la temperatura crítica Λ=0 con Λ≥0 ya demostrado</text><text x="750" y="800" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>