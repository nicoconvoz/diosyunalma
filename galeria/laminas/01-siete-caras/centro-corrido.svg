<text x="390" y="130" font-size="18" text-anchor="middle" font-family="Georgia" fill="#ffd98a">LIBRO 1 · ζ de Riemann</text>
<text x="390" y="154" font-size="14" text-anchor="middle" font-family="monospace" fill="#bfe3ff">ζ(s) = Σ 1/nˢ   ·   peso 0   ·   ξ(s) = ξ(1−s)</text>
<line x1="390" y1="190" x2="390" y2="470" stroke="#7ee0c0" stroke-width="3"/>
<text x="390" y="186" font-size="15" text-anchor="middle" font-family="monospace" fill="#7ee0c0">Re s = 0.5   ← LA MEDIATRIZ</text>
