<text x="760" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🎯➜ EL CENTRO CORRIDO — el ½ es otro número en otra medición</text>
<text x="760" y="74" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">se construyó un SEGUNDO LIBRO (la Δ de Ramanujan) para probarlo: su centro es 6</text>
