<text x="760" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🎼 LA ARMONÍA DE LA SIMETRÍA — y es armónica de verdad</text>
<text x="760" y="76" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">un cero y su espejo cantan LA MISMA NOTA · lo que los separa no es el tono, es si se sostienen</text>
<text x="760" y="116" font-size="20" text-anchor="middle" font-family="monospace" fill="#ffd98a">precio del par = 4 − 2·(rⁿ + r⁻ⁿ)·cos(nφ)     con  rⁿ + r⁻ⁿ ≥ 2</text>
