<text x="141.8" y="852" font-size="13" text-anchor="middle" font-family="monospace" fill="#5b7ba6">0</text>
<text x="247.6" y="852" font-size="14" text-anchor="middle" font-family="monospace" fill="#7ee0c0">½</text>
<text x="353.5" y="852" font-size="13" text-anchor="middle" font-family="monospace" fill="#ffd98a">1</text>
<text x="417.1" y="200" font-size="13" text-anchor="middle" font-family="Georgia" fill="#ffd98a">acá hay luz</text>
<text x="417.1" y="220" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#ffd98a">y no hay perlas</text>
<text x="247.6" y="156" font-size="14" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">EL CABLE</text>
<text x="247.6" y="882" font-size="19" text-anchor="middle" font-family="Georgia" fill="#dce8f7">EL PASILLO</text>
<text x="247.6" y="130" font-size="13" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">y sigue subiendo para siempre ↑</text>
