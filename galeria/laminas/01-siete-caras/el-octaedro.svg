<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1140" viewBox="0 0 1560 1140">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="780" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🎲 EL OCTAEDRO — la esfera, los 6 cardinales, y qué proyectan</text>
<text x="780" y="76" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">todos los radios a la vez: el cable se vuelve ecuador · los 6 cardinales, un octaedro · los 3 ejes, los 3 espejos</text>
<circle cx="460" cy="480" r="300" fill="#0d1a30" stroke="#26456e" stroke-width="1.5"/><ellipse cx="460" cy="480" rx="300" ry="84" fill="none" stroke="#7ee0c0" stroke-width="2.5"/><circle cx="759.3" cy="485.9" r="4" fill="#7ee0c0"/><circle cx="759.7" cy="484.0" r="4" fill="#7ee0c0"/><circle cx="759.8" cy="483.4" r="4" fill="#7ee0c0"/><circle cx="759.8" cy="482.8" r="4" fill="#7ee0c0"/><circle cx="759.9" cy="482.5" r="4" fill="#7ee0c0"/><circle cx="759.9" cy="482.2" r="4" fill="#7ee0c0"/><circle cx="759.9" cy="482.1" r="4" fill="#7ee0c0"/><circle cx="759.9" cy="481.9" r="4" fill="#7ee0c0"/><circle cx="759.9" cy="481.7" r="4" fill="#7ee0c0"/><circle cx="759.9" cy="481.7" r="4" fill="#7ee0c0"/><circle cx="759.9" cy="481.6" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.5" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.4" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.4" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.3" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.3" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.2" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.2" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.1" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.1" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.1" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.0" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.0" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="481.0" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="480.9" r="4" fill="#7ee0c0"/><circle cx="760.0" cy="480.9" r="4" fill="#7ee0c0"/><line x1="460.0" y1="780.0" x2="760.0" y2="480.0" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="460.0" y1="780.0" x2="160.0" y2="480.0" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="460.0" y1="780.0" x2="512.5" y2="509.4" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="460.0" y1="780.0" x2="407.5" y2="450.6" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="460.0" y1="180.0" x2="760.0" y2="480.0" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="460.0" y1="180.0" x2="160.0" y2="480.0" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="460.0" y1="180.0" x2="512.5" y2="509.4" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="460.0" y1="180.0" x2="407.5" y2="450.6" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="760.0" y1="480.0" x2="512.5" y2="509.4" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="760.0" y1="480.0" x2="407.5" y2="450.6" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="160.0" y1="480.0" x2="512.5" y2="509.4" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="160.0" y1="480.0" x2="407.5" y2="450.6" stroke="#5a4fa8" stroke-width="1.3" opacity="0.7"/><line x1="760.0" y1="480.0" x2="160.0" y2="480.0" stroke="#ffd98a" stroke-width="3" stroke-dasharray="7 4"/><circle cx="460.0" cy="780.0" r="8" fill="#ff8fa0"/><text x="460.0" y="806.0" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">SUR · el polo de zeta</text><circle cx="460.0" cy="180.0" r="8" fill="#ff8fa0"/><text x="460.0" y="166.0" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">NORTE · su espejo (s = 0)</text><circle cx="760.0" cy="480.0" r="8" fill="#ffd98a"/><text x="760.0" y="466.0" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#ffd98a">ESTE · el infinito</text><circle cx="160.0" cy="480.0" r="8" fill="#ffd98a"/><text x="160.0" y="466.0" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#ffd98a">OESTE · el medio (½)</text><circle cx="512.5" cy="509.4" r="8" fill="#c9b6ff"/><text x="512.5" y="495.4" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">FRENTE · ½+½i, en la línea</text><circle cx="407.5" cy="450.6" r="8" fill="#c9b6ff"/><text x="407.5" y="476.6" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">FONDO · ½−½i, en la línea</text><text x="460" y="820" font-size="14" text-anchor="middle" font-family="Georgia" fill="#7ee0c0">el ECUADOR = la línea crítica — y las perlas marchan hacia el ESTE</text>
<text x="460" y="844" font-size="13" text-anchor="middle" font-family="Georgia" fill="#ffd98a">la raya punteada es el eje de la ecuación funcional: del medio al infinito</text>
<rect x="880" y="110" width="640" height="300" rx="12" fill="#0f2b22" stroke="#2f7f63"/>
<text x="1200" y="144" font-size="18" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">¿QUÉ FORMA OBTIENEN? UN OCTAEDRO</text>
<text x="910" y="182" font-size="14.5" font-family="Georgia" fill="#cfe6ff">Proyectá el radio a TODAS las direcciones y el disco se</text>
<text x="910" y="206" font-size="14.5" font-family="Georgia" fill="#cfe6ff">cierra en la esfera. El cable se vuelve el ECUADOR, y sus</text>
<text x="910" y="230" font-size="14.5" font-family="Georgia" fill="#cfe6ff">6 puntos cardinales caen en los vértices de un</text>
<text x="910" y="262" font-size="18" font-family="Georgia" fill="#ffd98a">OCTAEDRO REGULAR</text>
<text x="910" y="294" font-size="14" font-family="monospace" fill="#7ee0c0">12 aristas de √2 · peor desvío 0e+00</text>
<text x="910" y="330" font-size="14.5" font-family="Georgia" fill="#cfe6ff">La cruz de F245 más el arriba/abajo de F249, cerrada</text>
<text x="910" y="354" font-size="14.5" font-family="Georgia" fill="#cfe6ff">en la esfera, es el sólido de seis puntas más simétrico</text>
<text x="910" y="378" font-size="14.5" font-family="Georgia" fill="#cfe6ff">que existe.</text>
<rect x="880" y="430" width="640" height="300" rx="12" fill="#161a3a" stroke="#5a4fa8"/>
<text x="1200" y="464" font-size="18" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">¿QUÉ SENTIDO? LOS 3 EJES = LOS 3 ESPEJOS</text>
<text x="910" y="502" font-size="14.5" font-family="Georgia" fill="#ff8fa0">NORTE–SUR: el polo y su espejo — los cambia la</text>
<text x="910" y="524" font-size="14.5" font-family="Georgia" fill="#ff8fa0">ecuación funcional; el ecuador queda fijo</text>
<text x="910" y="558" font-size="14.5" font-family="Georgia" fill="#ffd98a">ESTE–OESTE: el infinito y el medio. La ecuación</text>
<text x="910" y="580" font-size="14.5" font-family="Georgia" fill="#ffd98a">funcional es w → 1/w (verificado a 6e-17): el medio</text>
<text x="910" y="602" font-size="14.5" font-family="Georgia" fill="#ffd98a">giro alrededor de ESTE eje — sus puntos fijos son</text>
<text x="910" y="624" font-size="14.5" font-family="Georgia" fill="#ffd98a">el medio y el infinito</text>
<text x="910" y="658" font-size="14.5" font-family="Georgia" fill="#c9b6ff">FRENTE–FONDO: los dos puntos de la línea, cambiados</text>
<text x="910" y="680" font-size="14.5" font-family="Georgia" fill="#c9b6ff">por el espejo de Schwarz</text>
<text x="910" y="712" font-size="13.5" font-family="Georgia" fill="#9aa8c4">y el grupo de Klein de F257 es el grupo de estos giros</text>
<rect x="880" y="750" width="640" height="180" rx="12" fill="#101f36" stroke="#26456e"/>
<text x="1200" y="784" font-size="18" text-anchor="middle" font-family="Georgia" fill="#ffd98a">¿QUÉ PROYECTAN? LAS PERLAS</text>
<text x="910" y="820" font-size="14.5" font-family="Georgia" fill="#cfe6ff">Todas en el ecuador — eso ES la hipótesis — y su ángulo</text>
<text x="910" y="844" font-size="14.5" font-family="Georgia" fill="#cfe6ff">se achica como 1/γ: marchan por el ecuador hacia el</text>
<text x="910" y="868" font-size="14.5" font-family="Georgia" fill="#cfe6ff">punto cardinal ESTE — la imagen del infinito, la punta</text>
<text x="910" y="892" font-size="14.5" font-family="Georgia" fill="#cfe6ff">del eje de la ecuación funcional. La misma esquina</text>
<text x="910" y="916" font-size="14.5" font-family="Georgia" fill="#ffd98a">adonde los primos suben por el radio (F282).</text><rect x="40" y="950" width="1480" height="150" rx="12" fill="#33221c" stroke="#c0392b"/>
<text x="780" y="984" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffb27a">⚖️ LA HONESTIDAD</text>
<text x="780" y="1016" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#f3d9cf">La esfera es de Riemann (1857), la proyección estereográfica es antigua, y que {0, ∞, ±1, ±i} forman un octaedro es clásico.</text>
<text x="780" y="1042" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#f3d9cf">Lo nuestro es el DICCIONARIO: cada vértice, eje y giro del octaedro es un objeto que este laboratorio ya tenía bajo otro nombre.</text>
<text x="780" y="1076" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#ffd98a">Es un mapa, no un teorema. Y en este mapa, RH se lee: todas las perlas en el ecuador. Todavía no.</text>
</svg>
