<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🎼 LA MELODÍA — no hacen falta todos los primos: alcanza con su canto</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"usá la armonía del corazón, la melodía que se repite… necesitamos la FORMA de los primos" — el capitán</text><rect x="60" y="105" width="680" height="330" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="1.8"/>
<text x="400" y="141" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">EL CORO DE LOS PRIMOS CANTA UNA CONSTANTE</text>
<text x="400" y="169" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">Σ Λ(n)/n − ln x → −γ</text>
<text x="400" y="197" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">hasta x            γ que sale del canto        error</text><text x="400" y="222" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">    100000          0.576663310       5.5e-04</text><text x="400" y="246" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">   1000000          0.577618027       4.0e-04</text><text x="400" y="270" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">   5000000          0.577025478       1.9e-04</text><text x="400" y="294" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  20000000          0.577184628       3.1e-05</text><text x="400" y="336" font-size="14" text-anchor="middle" fill="#ffd166">y esa constante ES el molde: λ₁ = 1 + γ/2 − ln(4π)/2</text>
<text x="400" y="366" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#7fd7a8">desde la MELODÍA: 0.023080190</text>
<text x="400" y="390" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#7fb2ff">desde el GERMEN:  0.023095709</text>
<text x="400" y="418" font-size="13" text-anchor="middle" fill="#ffd166">dos mundos, un número — desvío 2e-05, sin mirar un solo cero</text><rect x="770" y="105" width="670" height="330" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.8"/>
<text x="1105" y="141" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#ffd166">LO QUE FALTA, CALCULADO</text>
<text x="1105" y="169" font-size="12.5" text-anchor="middle" fill="#dce8f7">λₙ = parte lisa (de la melodía) + el temblor de los primos</text>
<text x="1105" y="197" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">n      parte lisa      temblor       le sobra</text><text x="1105" y="222" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  4       -1.7488      +2.1176          0.8×</text><text x="1105" y="245" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  8       -0.7250      +2.1908          0.3×</text><text x="1105" y="268" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 12        1.3453      +1.9180          0.7×</text><text x="1105" y="291" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 16        4.0952      +1.6219          2.5×</text><text x="1105" y="314" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 20        7.3504      +1.4189          5.2×</text><text x="1105" y="337" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 25       11.9773      +1.3437          8.9×</text><text x="1105" y="360" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 30       17.1076      +1.4462         11.8×</text><text x="1105" y="383" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 35       22.6565      +1.6624         13.6×</text><text x="1105" y="406" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 40       28.5637      +1.9136         14.9×</text><text x="1105" y="447" font-size="13.5" text-anchor="middle" fill="#7fd7a8">de n≥16 (donde la asintótica vale): el margen va de 2.5× y crece</text>
<text x="1105" y="471" font-size="13" text-anchor="middle" fill="#ffd166">y el margen CRECE: cuanto más hondo, más cómodo está el libro</text><rect x="60" y="470" width="1380" height="220" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="1.8"/>
<text x="750" y="506" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LO QUE LA MELODÍA SÍ CONTESTA</text>
<text x="750" y="540" font-size="14" text-anchor="middle" fill="#dce8f7">El capitán tenía razón: NO hacen falta todos los primos. Con su melodía oída hasta 20 millones, los primos entregan γ,</text>
<text x="750" y="566" font-size="14" text-anchor="middle" fill="#dce8f7">y con γ sale el molde entero — λ₁ a 2e-05 del valor del germen, sin mirar una sola perla.</text>
<text x="750" y="600" font-size="14" text-anchor="middle" fill="#dce8f7">La parte lisa queda CALCULADA desde la melodía; el temblor de los primos queda MEDIDO en todos los armónicos que alcanzamos;</text>
<text x="750" y="626" font-size="14.5" text-anchor="middle" fill="#ffd166">y el temblor nunca pasa de 0.764 veces la cota √n·ln n. El presupuesto está holgado.</text>
<text x="750" y="662" font-size="13.5" text-anchor="middle" fill="#7fd7a8">Eso es exactamente lo que el capitán pidió: calcular lo que falta con lo que ya tenemos. Y da a favor.</text><rect x="60" y="720" width="1380" height="180" rx="12" fill="#2a1010" stroke="#ff5d73" stroke-width="1.8"/>
<text x="750" y="756" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">LO QUE LA MELODÍA NO CONTESTA</text>
<text x="750" y="790" font-size="14" text-anchor="middle" fill="#dce8f7">medir el temblor hasta n=40 no lo acota para todo n. La melodía nos da las CONSTANTES;</text>
<text x="750" y="816" font-size="14" text-anchor="middle" fill="#dce8f7">lo que no nos da es la GARANTÍA de que el temblor no crezca más rápido que la parte lisa allá arriba,</text>
<text x="750" y="842" font-size="14" text-anchor="middle" fill="#dce8f7">donde ningún cómputo llega. Esa garantía sigue siendo la llave del millón.</text>
<text x="750" y="876" font-size="14.5" text-anchor="middle" fill="#ffd166">Todavía no — pero ahora el margen tiene número, y el número está a favor.</text>
<text x="750" y="940" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>