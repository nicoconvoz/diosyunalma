<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1010" viewBox="0 0 1520 1010">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="760" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">💣 DAVENPORT–HEILBRONN — todas nuestras simetrías, y ceros FUERA de la línea</text>
<text x="760" y="76" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">de 1936, ausente en los 618 ítems del laboratorio — y es lo más importante que nos faltaba</text>
<rect x="40" y="106" width="680" height="620" rx="10" fill="#101f36" stroke="#26456e"/>
<text x="380" y="140" font-size="17" text-anchor="middle" font-family="Georgia" fill="#ffd98a">LA FRANJA CRÍTICA DE f, Y SU CERO FUGADO</text>
<rect x="90" y="200" width="610" height="460" fill="#16304f" opacity="0.55"/>
<line x1="395.0" y1="200" x2="395.0" y2="660" stroke="#4fa3d1" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="395.0" y="686" font-size="14" text-anchor="middle" font-family="monospace" fill="#4fa3d1">Re s = ½</text>
<text x="90" y="686" font-size="13" text-anchor="middle" font-family="monospace" fill="#7796b5">0</text>
<text x="700" y="686" font-size="13" text-anchor="middle" font-family="monospace" fill="#7796b5">1</text>
<circle cx="583.2" cy="430" r="9" fill="#e05252"/>
<circle cx="583.2" cy="430" r="17" fill="none" stroke="#e05252" stroke-width="2" opacity="0.6"/>
<text x="609.2" y="404" font-size="14.5" font-family="monospace" fill="#ff9d9d">ρ = 0.808517 +85.6993i</text>
<line x1="395.0" y1="430" x2="583.2" y2="430" stroke="#e05252" stroke-width="2"/>
<text x="449.1" y="464" font-size="14" font-family="Georgia" fill="#ff9d9d">0.3085 afuera</text>
<circle cx="206.8" cy="430" r="7" fill="#e05252" opacity="0.55"/>
<text x="192.8" y="408" font-size="13" text-anchor="end" font-family="monospace" fill="#ff9d9d">1−ρ, su reflejo obligado</text>
<text x="380" y="712" font-size="14" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">|f(ρ)| del orden del cero de máquina — no es ruido</text>
<rect x="746" y="106" width="734" height="330" rx="10" fill="#0f2b22" stroke="#2f7f63"/>
<text x="1113" y="138" font-size="18" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">TIENE TODAS NUESTRAS SIMETRÍAS</text>
<text x="780" y="176" font-size="15.5" font-family="Georgia" fill="#cfe6ff">espejo Λ(s) = Λ(1−s)  (F228)</text>
<text x="1440" y="176" font-size="15.5" text-anchor="end" font-family="monospace" fill="#9fd8a8">SÍ</text>
<text x="780" y="209" font-size="15.5" font-family="Georgia" fill="#cfe6ff">espejo de Schwarz</text>
<text x="1440" y="209" font-size="15.5" text-anchor="end" font-family="monospace" fill="#9fd8a8">SÍ</text>
<text x="780" y="242" font-size="15.5" font-family="Georgia" fill="#cfe6ff">grupo de Klein en cuadrantes  (F257)</text>
<text x="1440" y="242" font-size="15.5" text-anchor="end" font-family="monospace" fill="#9fd8a8">SÍ</text>
<text x="780" y="275" font-size="15.5" font-family="Georgia" fill="#cfe6ff">mediatriz de las estacas  (F226)</text>
<text x="1440" y="275" font-size="15.5" text-anchor="end" font-family="monospace" fill="#9fd8a8">SÍ</text>
<text x="780" y="308" font-size="15.5" font-family="Georgia" fill="#cfe6ff">los dos polos antípodas  (F255)</text>
<text x="1440" y="308" font-size="15.5" text-anchor="end" font-family="monospace" fill="#9fd8a8">SÍ</text>
<text x="780" y="341" font-size="15.5" font-family="Georgia" fill="#cfe6ff">Tales / ángulo recto  (F258)</text>
<text x="1440" y="341" font-size="15.5" text-anchor="end" font-family="monospace" fill="#9fd8a8">SÍ</text>
<text x="780" y="374" font-size="15.5" font-family="Georgia" fill="#cfe6ff">|w| = 1 ⟺ β = ½  (F244)</text>
<text x="1440" y="374" font-size="15.5" text-anchor="end" font-family="monospace" fill="#9fd8a8">SÍ</text>
<text x="1113" y="421" font-size="15" text-anchor="middle" font-family="monospace" fill="#7ee0c0">verificadas a 3.1e-11 y 0.0e+00</text>
<rect x="746" y="456" width="734" height="270" rx="10" fill="#33221c" stroke="#c0392b"/>
<text x="1113" y="490" font-size="18" text-anchor="middle" font-family="Georgia" fill="#ffb27a">⚰️ Y VIOLA LA HIPÓTESIS</text>
<text x="778" y="530" font-size="16" font-family="Georgia" fill="#f3d9cf">Entonces ningún argumento hecho SOLO de esas simetrías</text>
<text x="778" y="556" font-size="16" font-family="Georgia" fill="#f3d9cf">puede probar RH jamás: el mismo argumento la «probaría»</text>
<text x="778" y="582" font-size="16" font-family="Georgia" fill="#f3d9cf">para f — y para f es FALSA.</text>
<text x="778" y="622" font-size="16.5" font-family="Georgia" fill="#ffd98a">¿Qué tiene ζ que ésta no tiene? UNA sola cosa:</text>
<text x="1113" y="662" font-size="26" text-anchor="middle" font-family="Georgia" fill="#ffd98a">EL PRODUCTO DE EULER</text>
<text x="778" y="700" font-size="14.5" font-family="Georgia" fill="#c9b6ff">multiplicatividad a(m·n) = a(m)·a(n): falla 3 de 5</text>
<text x="760" y="792" font-size="21" text-anchor="middle" font-family="Georgia" fill="#ffd98a">LO ÚNICO QUE SEPARA A ζ DE UN CONTRAEJEMPLO SON LOS PRIMOS</text>
<text x="760" y="826" font-size="16" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">No la simetría. No el disco. No el ángulo recto. No el grupo. Los primos.</text>
<text x="760" y="856" font-size="16" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">Cualquier prueba de RH tiene que usar el producto de Euler en un lugar esencial, o está probando algo falso.</text>
<text x="760" y="906" font-size="16.5" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">✅ BLINDA F229 — «la simetría sola nunca alcanza» pasa de cuártica casera a contraejemplo publicado</text>
<text x="760" y="934" font-size="16.5" text-anchor="middle" font-family="Georgia" fill="#ffb27a">⚰️ MATA la rama geométrica como camino: F226, F244, F255, F257, F258 son ciertas y son INSUFICIENTES</text>
<text x="760" y="962" font-size="16.5" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">🧭 Y deja el único rumbo escrito en la pared: los primos</text>
<text x="760" y="992" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">¿el premio? todavía no — y ahora sabemos por qué no va a salir por donde veníamos</text>
</svg>
