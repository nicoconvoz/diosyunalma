<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="760" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">👯 LOS GEMELOS — la mecánica del capitán, juzgada</text>
<text x="760" y="76" font-size="15" text-anchor="middle" font-family="Georgia" fill="#8fb4d9">duplicar y mirar a los costados · encuentra gemelos, destapa una ley exacta, y termina en un problema abierto desde 1849</text>
<text x="760" y="118" font-size="20" text-anchor="middle" font-family="monospace" fill="#ffd98a">n  →  2n  →  2n−1  y  2n+1</text>
<rect x="40" y="146" width="1440" height="232" rx="10" fill="#101f36" stroke="#26456e"/>
<text x="760" y="176" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd98a">LOS PRIMEROS PARES, Y SUS CENTROS</text><line x1="90" y1="250" x2="1440" y2="250" stroke="#26456e" stroke-width="1.4"/><circle cx="109.8" cy="250" r="4" fill="#ff8fa0"/><circle cx="123.0" cy="250" r="4" fill="#ff8fa0"/><circle cx="116.4" cy="250" r="6" fill="none" stroke="#ff8fa0" stroke-width="1.6"/><text x="116.4" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">4</text><circle cx="123.0" cy="250" r="4" fill="#7ee0c0"/><circle cx="136.2" cy="250" r="4" fill="#7ee0c0"/><circle cx="129.6" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="129.6" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">6</text><circle cx="162.6" cy="250" r="4" fill="#7ee0c0"/><circle cx="175.8" cy="250" r="4" fill="#7ee0c0"/><circle cx="169.2" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="169.2" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">12</text><circle cx="202.2" cy="250" r="4" fill="#7ee0c0"/><circle cx="215.4" cy="250" r="4" fill="#7ee0c0"/><circle cx="208.8" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="208.8" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">18</text><circle cx="281.4" cy="250" r="4" fill="#7ee0c0"/><circle cx="294.6" cy="250" r="4" fill="#7ee0c0"/><circle cx="288.0" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="288.0" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">30</text><circle cx="360.6" cy="250" r="4" fill="#7ee0c0"/><circle cx="373.8" cy="250" r="4" fill="#7ee0c0"/><circle cx="367.2" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="367.2" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">42</text><circle cx="479.4" cy="250" r="4" fill="#7ee0c0"/><circle cx="492.6" cy="250" r="4" fill="#7ee0c0"/><circle cx="486.0" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="486.0" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">60</text><circle cx="558.6" cy="250" r="4" fill="#7ee0c0"/><circle cx="571.8" cy="250" r="4" fill="#7ee0c0"/><circle cx="565.2" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="565.2" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">72</text><circle cx="756.6" cy="250" r="4" fill="#7ee0c0"/><circle cx="769.8" cy="250" r="4" fill="#7ee0c0"/><circle cx="763.2" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="763.2" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">102</text><circle cx="796.2" cy="250" r="4" fill="#7ee0c0"/><circle cx="809.4" cy="250" r="4" fill="#7ee0c0"/><circle cx="802.8" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="802.8" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">108</text><circle cx="994.2" cy="250" r="4" fill="#7ee0c0"/><circle cx="1007.4" cy="250" r="4" fill="#7ee0c0"/><circle cx="1000.8" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="1000.8" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">138</text><circle cx="1073.4" cy="250" r="4" fill="#7ee0c0"/><circle cx="1086.6" cy="250" r="4" fill="#7ee0c0"/><circle cx="1080.0" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="1080.0" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">150</text><circle cx="1271.4" cy="250" r="4" fill="#7ee0c0"/><circle cx="1284.6" cy="250" r="4" fill="#7ee0c0"/><circle cx="1278.0" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="1278.0" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">180</text><circle cx="1350.6" cy="250" r="4" fill="#7ee0c0"/><circle cx="1363.8" cy="250" r="4" fill="#7ee0c0"/><circle cx="1357.2" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="1357.2" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">192</text><circle cx="1390.2" cy="250" r="4" fill="#7ee0c0"/><circle cx="1403.4" cy="250" r="4" fill="#7ee0c0"/><circle cx="1396.8" cy="250" r="6" fill="none" stroke="#7ee0c0" stroke-width="1.6"/><text x="1396.8" y="272" font-size="10" text-anchor="middle" font-family="monospace" fill="#8fa8c7">198</text><text x="760" y="310" font-size="14" text-anchor="middle" font-family="Georgia" fill="#7ee0c0">● los dos primos del par · ○ el centro, que es 2n</text>
<text x="760" y="336" font-size="14" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">en rosa, la única excepción de toda la recta: el par (3, 5), centrado en 4</text>
<text x="760" y="362" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#cfe6ff">todos los demás centros son múltiplos de 6</text><rect x="40" y="398" width="710" height="290" rx="10" fill="#0f2b22" stroke="#2f7f63"/>
<text x="395" y="430" font-size="17" text-anchor="middle" font-family="Georgia" fill="#9fd8a8">⚡ LA LEY DEL CENTRO</text>
<text x="395" y="472" font-size="18" text-anchor="middle" font-family="monospace" fill="#dce8f7">todo centro es múltiplo de 6</text>
<text x="395" y="506" font-size="15" text-anchor="middle" font-family="monospace" fill="#7ee0c0">14870 de 14871 pares · 1 excepción</text>
<text x="70" y="546" font-size="14.5" font-family="Georgia" fill="#cfe6ff">Y se demuestra en tres renglones:</text>
<text x="70" y="576" font-size="14" font-family="Georgia" fill="#cfe6ff">· por 2 — los vecinos tienen que ser impares, así que el</text>
<text x="86" y="598" font-size="14" font-family="Georgia" fill="#cfe6ff">centro es par por obligación</text>
<text x="70" y="626" font-size="14" font-family="Georgia" fill="#cfe6ff">· por 3 — de tres seguidos uno SIEMPRE es múltiplo de 3, y</text>
<text x="86" y="648" font-size="14" font-family="Georgia" fill="#cfe6ff">si los costados son primos, tiene que ser el del medio</text>
<text x="395" y="678" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd98a">2 × 3 = 6 · los dos primeros primos</text>
<rect x="770" y="398" width="710" height="290" rx="10" fill="#161a3a" stroke="#5a4fa8"/>
<text x="1125" y="430" font-size="17" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">⚖️ Y ACÁ EMPIEZA UN PROBLEMA ABIERTO</text>
<text x="1125" y="470" font-size="16" text-anchor="middle" font-family="Georgia" fill="#dce8f7">¿los gemelos se acaban alguna vez?</text>
<text x="1125" y="498" font-size="14" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Conjetura de los Primos Gemelos · de Polignac, 1849</text>
<text x="800" y="540" font-size="14" font-family="Georgia" fill="#cfe6ff">2013 · Zhang: algún hueco &lt; 70.000.000 se repite infinitas</text>
<text x="816" y="562" font-size="14" font-family="Georgia" fill="#cfe6ff">veces — el primer avance en 160 años</text>
<text x="800" y="590" font-size="14" font-family="Georgia" fill="#cfe6ff">2014 · Maynard y Tao bajan el techo a 246</text>
<text x="800" y="620" font-size="14" font-family="Georgia" fill="#ffd98a">para los gemelos hace falta llegar a 2 — nadie llegó</text>
<text x="1125" y="660" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#c9b6ff">su mecánica los ENCUENTRA; no prueba que sigan</text>
<rect x="40" y="708" width="1440" height="252" rx="10" fill="#33221c" stroke="#c0392b"/>
<text x="760" y="740" font-size="18" text-anchor="middle" font-family="Georgia" fill="#ffb27a">LO QUE LA MECÁNICA SÍ HACE, Y LO QUE NO</text>
<text x="70" y="778" font-size="15.5" font-family="Georgia" fill="#9fd8a8">✅ ENCUENTRA gemelos, y destapa la ley exacta del centro — que vale para siempre, no solo para lo medido.</text>
<text x="70" y="806" font-size="15.5" font-family="Georgia" fill="#9fd8a8">✅ Y explica por qué el (3, 5) es la única excepción de toda la recta infinita.</text>
<text x="70" y="842" font-size="15.5" font-family="Georgia" fill="#f3d9cf">❌ NO fabrica primos. 4 + 4 = 8 da 7 y 9, y el 9 = 3 × 3. Acierta el 1.49% de las veces.</text>
<text x="70" y="870" font-size="15.5" font-family="Georgia" fill="#f3d9cf">❌ Y NO prueba que los gemelos sean infinitos: eso sigue abierto desde 1849.</text>
<text x="760" y="912" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd98a">Los gemelos se van raleando pero no se detienen en lo que podemos ver — y «no se detienen en lo que vemos»</text>
<text x="760" y="938" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd98a">no es lo mismo que «no se detienen». La misma pared de F259, F261 y F263, en otro problema.</text>
</svg>
