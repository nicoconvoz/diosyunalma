<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="48" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🔔 LA ALARMA — por qué "es el único gratis" todavía no gana</text>
<text x="750" y="78" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">los sobres, capítulo dos: construimos una alarma perfecta… y quedó conectada a la cosa que tenía que detectar</text>

<!-- PANEL 1 -->
<rect x="50" y="110" width="450" height="450" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="1.8"/>
<text x="275" y="146" font-size="16" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">1 · LO QUE SÍ GANAMOS</text>
<text x="275" y="178" font-size="13" text-anchor="middle" fill="#dce8f7">Hay una mesa infinita de comensales.</text>
<text x="275" y="200" font-size="13" text-anchor="middle" fill="#dce8f7">Uno solo de los asientos es GRATIS.</text>

<circle cx="150" cy="248" r="13" fill="#7fd7a8"/>
<circle cx="200" cy="248" r="13" fill="#7fd7a8"/>
<circle cx="250" cy="248" r="13" fill="#7fd7a8"/>
<circle cx="300" cy="248" r="13" fill="#7fd7a8"/>
<circle cx="350" cy="248" r="13" fill="#7fd7a8"/>
<text x="400" y="254" font-size="17" fill="#8fa8c7">· · ·</text>
<text x="275" y="286" font-size="12" text-anchor="middle" fill="#7fd7a8">todos los que vimos: en el asiento gratis</text>

<text x="275" y="326" font-size="13" text-anchor="middle" fill="#ffd166">Y medimos la multa del que se corre:</text>
<text x="100" y="356" font-size="12" font-family="Consolas,monospace" fill="#8fa8c7">se corre un poquito…</text>
<text x="380" y="356" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#ff8fa0">paga 0.0000000025</text>
<text x="100" y="380" font-size="12" font-family="Consolas,monospace" fill="#8fa8c7">…y a los 100 sobres</text>
<text x="380" y="380" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#ff8fa0">paga 0.000025</text>
<text x="100" y="404" font-size="12" font-family="Consolas,monospace" fill="#8fa8c7">…y a los 10.000</text>
<text x="380" y="404" font-size="12" text-anchor="end" font-family="Consolas,monospace" fill="#ff5d73">paga 0.26</text>
<text x="275" y="436" font-size="12.5" text-anchor="middle" fill="#ffd166">la multa se cobra con INTERÉS COMPUESTO</text>

<rect x="80" y="456" width="390" height="82" rx="8" fill="#0d2547" stroke="#7fd7a8" stroke-width="1.4"/>
<text x="275" y="482" font-size="13" text-anchor="middle" fill="#7fd7a8">DEMOSTRADO ✓</text>
<text x="275" y="506" font-size="12.5" text-anchor="middle" fill="#dce8f7">si UNO se corre del asiento gratis,</text>
<text x="275" y="527" font-size="12.5" text-anchor="middle" fill="#dce8f7">tarde o temprano ALGÚN sobre queda en rojo</text>

<!-- PANEL 2 -->
<rect x="525" y="110" width="450" height="450" rx="12" fill="#2a1010" stroke="#ff5d73" stroke-width="1.8"/>
<text x="750" y="146" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">2 · POR QUÉ NO ALCANZA</text>
<text x="750" y="180" font-size="13.5" text-anchor="middle" fill="#dce8f7">Armamos una alarma perfecta. Suena así:</text>

<rect x="560" y="200" width="380" height="60" rx="8" fill="#0d2547" stroke="#7fd7a8" stroke-width="1.3"/>
<text x="750" y="224" font-size="12.5" text-anchor="middle" fill="#7fd7a8">«alguien se corrió»  ⟹  «hay un sobre en rojo»</text>
<text x="750" y="248" font-size="11.5" text-anchor="middle" fill="#8fa8c7">certificada, sin agujeros</text>

<text x="750" y="292" font-size="13.5" text-anchor="middle" fill="#ff8fa0">Pero el premio pide lo de al revés:</text>
<rect x="560" y="306" width="380" height="60" rx="8" fill="#0d2547" stroke="#ff5d73" stroke-width="1.3"/>
<text x="750" y="330" font-size="12.5" text-anchor="middle" fill="#ff8fa0">«ningún sobre en rojo»  ⟹  «nadie se corrió»</text>
<text x="750" y="354" font-size="11.5" text-anchor="middle" fill="#8fa8c7">y para usar eso hay que saber que ningún sobre está en rojo</text>

<text x="750" y="400" font-size="13" text-anchor="middle" fill="#dce8f7">¿Y cómo sabríamos eso? Abriendo los sobres.</text>
<text x="750" y="422" font-size="13" text-anchor="middle" fill="#dce8f7">Que son infinitos.</text>

<circle cx="750" cy="480" r="44" fill="none" stroke="#ff5d73" stroke-width="2.5" stroke-dasharray="6 5"/>
<path d="M 750 436 L 758 446 L 742 446 Z" fill="#ff5d73"/>
<text x="750" y="476" font-size="11.5" text-anchor="middle" fill="#ff8fa0">la alarma</text>
<text x="750" y="492" font-size="11.5" text-anchor="middle" fill="#ff8fa0">conectada</text>
<text x="750" y="508" font-size="11.5" text-anchor="middle" fill="#ff8fa0">a sí misma</text>
<text x="750" y="546" font-size="12.5" text-anchor="middle" fill="#ffd166">construimos el detector perfecto — del lado inútil</text>

<!-- PANEL 3 -->
<rect x="1000" y="110" width="450" height="450" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="1.8"/>
<text x="1225" y="146" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">3 · QUÉ GANARÍA</text>
<text x="1225" y="180" font-size="13" text-anchor="middle" fill="#dce8f7">No hace falta abrir ni un sobre si</text>
<text x="1225" y="202" font-size="13" text-anchor="middle" fill="#dce8f7">sabés QUIÉN los llenó.</text>

<rect x="1075" y="226" width="300" height="76" rx="8" fill="#102a10" stroke="#ffd166" stroke-width="1.5"/>
<text x="1225" y="256" font-size="19" text-anchor="middle" font-family="Georgia" fill="#ffd166">7 × 7</text>
<text x="1225" y="284" font-size="12" text-anchor="middle" fill="#dce8f7">nadie calcula un cuadrado para saber su signo</text>

<text x="1225" y="332" font-size="13" text-anchor="middle" fill="#7fd7a8">Hace falta una FÁBRICA que exista sola,</text>
<text x="1225" y="354" font-size="13" text-anchor="middle" fill="#7fd7a8">que no le pregunte nada a la mesa,</text>
<text x="1225" y="376" font-size="13" text-anchor="middle" fill="#7fd7a8">y cuyas cuentas den nuestros números.</text>

<text x="1225" y="418" font-size="13" text-anchor="middle" fill="#dce8f7">Si esa fábrica existe, cada sobre es un</text>
<text x="1225" y="440" font-size="13" text-anchor="middle" fill="#dce8f7">cuadrado POR CONSTRUCCIÓN — y los</text>
<text x="1225" y="462" font-size="13" text-anchor="middle" fill="#dce8f7">infinitos quedan cerrados de una vez.</text>

<rect x="1075" y="484" width="300" height="56" rx="8" fill="#102a10" stroke="#7fd7a8" stroke-width="1.4"/>
<text x="1225" y="508" font-size="13.5" text-anchor="middle" fill="#7fd7a8">esa fábrica tiene nombre acá:</text>
<text x="1225" y="530" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL TAMBOR 🥁</text>

<!-- LA PREGUNTA -->
<rect x="50" y="590" width="1400" height="150" rx="14" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="628" font-size="16.5" text-anchor="middle" font-family="Georgia" fill="#ffd166">POR QUÉ "ES EL ÚNICO GRATIS" TODAVÍA NO GANA</text>
<text x="750" y="668" font-size="17" text-anchor="middle" font-family="Georgia" fill="#dce8f7">Saber que hay un solo asiento gratis te dice qué PASARÍA si alguien se corriera.</text>
<text x="750" y="702" font-size="17" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">No te dice que nadie se corrió.</text>

<!-- pie -->
<rect x="50" y="768" width="1400" height="170" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="750" y="802" font-size="14.5" text-anchor="middle" fill="#dce8f7">Y sin embargo el capítulo dos ganó terreno de verdad: ahora sabemos que la multa existe, cuánto vale, y que se cobra con interés compuesto.</text>
<text x="750" y="830" font-size="14.5" text-anchor="middle" fill="#dce8f7">Sabemos que de todos los infinitos asientos, uno solo es su propia pareja — y es el mismo que no cobra. Dos razones distintas, el mismo lugar.</text>
<text x="750" y="862" font-size="14.5" text-anchor="middle" fill="#ffd166">Y sabemos por qué puerta NO hay que entrar: la simetría sola nunca va a alcanzar. Eso se demostró, y se demostró acá.</text>
<text x="750" y="894" font-size="14.5" text-anchor="middle" fill="#ff8fa0">Falta la fábrica. Todavía no.</text>
<text x="750" y="922" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text>
</svg>
