<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🗜️ COMPRIMIR — corriendo la coma, todo el molde es el mismo número</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">el capitán corrigió al laboratorio: el molde SÍ se repite — había que leerlo comprimido</text><rect x="60" y="105" width="680" height="360" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.8"/>
