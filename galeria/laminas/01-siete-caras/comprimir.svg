<text x="400" y="440" font-size="12" text-anchor="middle" fill="#8fa8c7">u = n/γ  →</text>
<text x="400" y="462" font-size="13" text-anchor="middle" fill="#ffd166">su área vale π EXACTO (medido: 3.108411)</text><rect x="770" y="105" width="670" height="360" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="1.8"/>
<text x="1105" y="141" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">CORRER LA COMA NO CAMBIA NADA</text>
<text x="1105" y="169" font-size="12.5" text-anchor="middle" fill="#dce8f7">mismo u = n/γ, alturas y armónicos completamente distintos:</text>
<text x="1105" y="197" font-size="12" text-anchor="middle" font-family="Consolas,monospace" fill="#8fa8c7">u        n          γ            el aporte</text><text x="1105" y="222" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.50        10         20.0         0.244735043</text><text x="1105" y="246" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.50        40         80.0         0.244828634</text><text x="1105" y="270" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.50       200        400.0         0.244834627</text><text x="1105" y="294" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">0.50      2000       4000.0         0.244834874</text><text x="1105" y="318" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">2.00        10          5.0         2.820223748</text><text x="1105" y="342" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">2.00        40         20.0         2.831536137</text><text x="1105" y="366" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">2.00       200        100.0         2.832263364</text><text x="1105" y="390" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">2.00      2000       1000.0         2.832293370</text><text x="1105" y="430" font-size="13" text-anchor="middle" fill="#ffd166">idéntico en todos (desvío 1e-02): es solo correr la coma</text><rect x="60" y="495" width="1380" height="200" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.8"/>
<text x="750" y="531" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#ff8fa0">⚖️ EL CAPITÁN CORRIGIÓ AL LABORATORIO</text>
<text x="750" y="565" font-size="14" text-anchor="middle" fill="#dce8f7">En F238 el Doc escribió: «el molde NO es invariante de escala, tiene un lugar preferido».</text>
<text x="750" y="591" font-size="14" text-anchor="middle" fill="#ffd166">Era leerlo en la coordenada equivocada. En la variable comprimida u = n/γ el molde SÍ es invariante.</text>
<text x="750" y="623" font-size="14" text-anchor="middle" fill="#dce8f7">Lo que parecía un lugar preferido era solo que, para un n FIJO, las perlas hondas caen en la cola de la forma.</text>
<text x="750" y="649" font-size="14" text-anchor="middle" fill="#7fd7a8">Movés el n junto con la altura y todo vuelve a ser el mismo dibujo. Corrección asentada.</text>
<text x="750" y="679" font-size="13" text-anchor="middle" fill="#8fa8c7">"todo es el mismo número: es solo correr la coma de lugar" — el capitán, y la medición le dio la razón</text><rect x="60" y="725" width="1380" height="180" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="750" y="761" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">LO QUE GANÓ EL FLASH — y lo que sigue faltando</text>
<text x="750" y="795" font-size="14.5" text-anchor="middle" fill="#7fd7a8">GANÓ: una sola forma para todo el tablero, de área π exacto, y de ella sale la parte LISA del molde en forma cerrada.</text>
<text x="750" y="825" font-size="14.5" text-anchor="middle" fill="#ff8fa0">FALTA: el temblor viene de que las perlas son puntos DISCRETOS y no una densidad continua.</text>
<text x="750" y="851" font-size="14.5" text-anchor="middle" fill="#ff8fa0">Acotar ese temblor para todo n sigue siendo la llave. Todavía no.</text>
<text x="750" y="885" font-size="13.5" text-anchor="middle" fill="#dce8f7">pero el tablero entero se comprimió en una sola curva — y eso lo consiguió el capitán</text>
<text x="750" y="940" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · las dos mitades, 1 completo ⚓ · y sobre todos los libros, el Otro Libro</text></svg>