<text x="400" y="730" font-size="14" text-anchor="middle" fill="#ffd166">λ_n = Σ |sombra|² — la ecuación del capitán, EXACTA en el anillo</text><rect x="800" y="130" width="660" height="560" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="1130" y="164" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL JUICIO DE DOBLE VÍA — sombras de 649 perlas vs germen del punto</text>
<text x="1130" y="194" font-size="12.5" text-anchor="middle" font-family="Consolas,monospace" fill="#7fb2ff">  n      Σ|sombra|²        germen        desvío</text><text x="1130" y="226" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  1       0.02310       0.02310    6e-07</text><text x="1130" y="256" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  2       0.09235       0.09235    2e-06</text><text x="1130" y="286" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  3       0.20764       0.20764    5e-06</text><text x="1130" y="316" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  4       0.36880       0.36879    9e-06</text><text x="1130" y="346" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  6       0.82759       0.82757    2e-05</text><text x="1130" y="376" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">  8       1.46579       1.46576    4e-05</text><text x="1130" y="406" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 10       2.27939       2.27934    6e-05</text><text x="1130" y="436" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 12       3.26334       3.26326    8e-05</text><text x="1130" y="466" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 14       4.41159       4.41148    1e-04</text><text x="1130" y="496" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 16       5.71725       5.71711    1e-04</text><text x="1130" y="526" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 18       7.17266       7.17248    2e-04</text><text x="1130" y="556" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 20       8.76950       8.76928    2e-04</text><text x="1130" y="586" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 22      10.49892      10.49865    3e-04</text><text x="1130" y="616" font-size="13" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7"> 24      12.35167      12.35135    3e-04</text><text x="1130" y="662" font-size="13.5" text-anchor="middle" fill="#7fd7a8">el lado de las sombras JAMÁS vio el germen; el germen JAMÁS vio una perla —</text>
<text x="1130" y="686" font-size="13.5" text-anchor="middle" fill="#7fd7a8">y leen lo mismo: EL RELOJ DE SOL LEE VERDADERO (peor desvío rel. 3e-05)</text><rect x="120" y="760" width="1260" height="130" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="750" y="796" font-size="14.5" text-anchor="middle" fill="#dce8f7">el molde del millón, dibujado con sol y sombra: λ = Σ|sombra|² — manifiestamente positivo MIENTRAS cada sombra sea cuerda real del anillo.</text>
<text x="750" y="824" font-size="14.5" text-anchor="middle" fill="#ffd166">el renglón, en idioma del reloj: demostrar que TODA sombra — también las de las perlas que ningún sol alumbró — es cuerda verdadera. El gnomon espera.</text>
