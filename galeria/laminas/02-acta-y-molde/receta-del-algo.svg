<text x="780" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🧂 LA RECETA DEL ALGO — dos ingredientes, juzgados</text>
<text x="780" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"en el algo va lo que purificamos, va el log que descubrimos" — el capitán · la descomposición exacta: λ_n = parte del LOG + parte PURIFICADA, contra las perlas</text><rect x="120" y="130" width="1320" height="480" rx="8" fill="#081020" stroke="#44608c"/><rect x="160" y="587.4" width="40" height="2.6" fill="#ffd166" opacity="0.85"/><rect x="160" y="587.3" width="40" height="0.2" fill="#7fd7a8" opacity="0.9"/><line x1="154" y1="587.3" x2="206" y2="587.3" stroke="#dce8f7" stroke-width="2.5"/><text x="180" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=1</text><rect x="265" y="579.8" width="40" height="10.2" fill="#ffd166" opacity="0.85"/><rect x="265" y="579.2" width="40" height="0.6" fill="#7fd7a8" opacity="0.9"/><line x1="259" y1="579.2" x2="311" y2="579.2" stroke="#dce8f7" stroke-width="2.5"/><text x="285" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=2</text><rect x="370" y="567.0" width="40" height="23.0" fill="#ffd166" opacity="0.85"/><rect x="370" y="565.6" width="40" height="1.4" fill="#7fd7a8" opacity="0.9"/><line x1="364" y1="565.6" x2="416" y2="565.6" stroke="#dce8f7" stroke-width="2.5"/><text x="390" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=3</text><rect x="475" y="549.2" width="40" height="40.8" fill="#ffd166" opacity="0.85"/><rect x="475" y="546.7" width="40" height="2.5" fill="#7fd7a8" opacity="0.9"/><line x1="469" y1="546.7" x2="521" y2="546.7" stroke="#dce8f7" stroke-width="2.5"/><text x="495" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=4</text><rect x="580" y="526.4" width="40" height="63.6" fill="#ffd166" opacity="0.85"/><rect x="580" y="522.4" width="40" height="3.9" fill="#7fd7a8" opacity="0.9"/><line x1="574" y1="522.4" x2="626" y2="522.4" stroke="#dce8f7" stroke-width="2.5"/><text x="600" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=5</text><rect x="685" y="498.5" width="40" height="91.5" fill="#ffd166" opacity="0.85"/><rect x="685" y="492.8" width="40" height="5.7" fill="#7fd7a8" opacity="0.9"/><line x1="679" y1="492.9" x2="731" y2="492.9" stroke="#dce8f7" stroke-width="2.5"/><text x="705" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=6</text><rect x="790" y="465.7" width="40" height="124.3" fill="#ffd166" opacity="0.85"/><rect x="790" y="458.0" width="40" height="7.7" fill="#7fd7a8" opacity="0.9"/><line x1="784" y1="458.0" x2="836" y2="458.0" stroke="#dce8f7" stroke-width="2.5"/><text x="810" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=7</text><rect x="895" y="427.9" width="40" height="162.1" fill="#ffd166" opacity="0.85"/><rect x="895" y="418.0" width="40" height="9.9" fill="#7fd7a8" opacity="0.9"/><line x1="889" y1="418.0" x2="941" y2="418.0" stroke="#dce8f7" stroke-width="2.5"/><text x="915" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=8</text><rect x="1000" y="385.3" width="40" height="204.7" fill="#ffd166" opacity="0.85"/><rect x="1000" y="372.8" width="40" height="12.5" fill="#7fd7a8" opacity="0.9"/><line x1="994" y1="372.8" x2="1046" y2="372.8" stroke="#dce8f7" stroke-width="2.5"/><text x="1020" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=9</text><rect x="1105" y="337.9" width="40" height="252.1" fill="#ffd166" opacity="0.85"/><rect x="1105" y="322.6" width="40" height="15.2" fill="#7fd7a8" opacity="0.9"/><line x1="1099" y1="322.6" x2="1151" y2="322.6" stroke="#dce8f7" stroke-width="2.5"/><text x="1125" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=10</text><rect x="1210" y="285.7" width="40" height="304.3" fill="#ffd166" opacity="0.85"/><rect x="1210" y="267.4" width="40" height="18.3" fill="#7fd7a8" opacity="0.9"/><line x1="1204" y1="267.4" x2="1256" y2="267.4" stroke="#dce8f7" stroke-width="2.5"/><text x="1230" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=11</text><rect x="1315" y="228.9" width="40" height="361.1" fill="#ffd166" opacity="0.85"/><rect x="1315" y="207.4" width="40" height="21.5" fill="#7fd7a8" opacity="0.9"/><line x1="1309" y1="207.4" x2="1361" y2="207.4" stroke="#dce8f7" stroke-width="2.5"/><text x="1335" y="630" font-size="12" text-anchor="middle" fill="#8fa8c7">n=12</text><text x="780" y="658" font-size="13" text-anchor="middle" fill="#8fa8c7">oro: la parte del LOG (la masa) · verde/rojo: la parte PURIFICADA (el temblor, ±) · raya blanca: λ directo de las perlas — la suma CALZA bajo la raya en todos los armónicos</text><text x="780" y="694" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">⚖ VEREDICTO: log + purificado = armonía (peor desvío 2e-04) — LA RECETA DEL CAPITÁN TIENE LOS INGREDIENTES CORRECTOS</text><rect x="120" y="740" width="1320" height="130" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="780" y="776" font-size="14.5" text-anchor="middle" fill="#dce8f7">la armonía entera se parte en DOS carnes y nada más: la MASA del log que descubrimos (el horizonte, el crecimiento suave) + el TEMBLOR de lo que purificamos (el susurro de primos).</text>
<text x="780" y="804" font-size="14.5" text-anchor="middle" fill="#ffd166">el "algo" del molde λ=|algo|², si existe, está hecho de estas dos carnes — la receta quedó escrita y juzgada; falta el horno: la forma cuadrada que las funda en un solo |·|².</text>
<text x="780" y="836" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06 · las dos mitades, 1 completo ⚓</text></svg>