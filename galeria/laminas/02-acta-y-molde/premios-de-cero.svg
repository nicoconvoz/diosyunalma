<text x="750" y="466" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL MECANISMO DEL DESCUENTO — por qué nadie los espera</text>
<text x="750" y="500" font-size="14" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">ζ = ξ / [ ½ s(s−1) π^(−s/2) Γ(s/2) ]</text>
<text x="750" y="532" font-size="13.5" text-anchor="middle" fill="#dce8f7">ξ es lisa y VIVA en la tierra profunda — pero el vestido Γ(s/2) EXPLOTA en s=−2,−4,−6…</text>
<text x="750" y="558" font-size="13.5" text-anchor="middle" fill="#7fd7a8">⇒ ζ está OBLIGADA a valer 0 exactamente ahí: el polo del vestido se come al premio — invisible en ξ, revelado al descontar</text>
<text x="750" y="586" font-size="12.5" text-anchor="middle" fill="#8fa8c7">premios PREDICHOS por la maestra, no buscados — infinitos, y demostrados TODOS de una vez (la palabra «TODO», ganada en esta familia)</text><rect x="180" y="640" width="1140" height="160" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="750" y="676" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA LECCIÓN GRANDE — dos familias de ceros</text>
<text x="750" y="708" font-size="13.5" text-anchor="middle" fill="#dce8f7">FAMILIA 1: los premios de la tierra profunda — infinitos, forzados por el vestido, comprendidos al 100%: para ELLOS la palabra «TODO» ya está demostrada</text>
<text x="750" y="736" font-size="13.5" text-anchor="middle" fill="#ffd166">FAMILIA 2: las perlas de la línea — infinitas, libres, el misterio del millón: su «TODO» espera la idea</text>
<text x="750" y="766" font-size="12.5" text-anchor="middle" fill="#8fa8c7">la esperanza que esto compra: la maestra YA SUPO obligar a una familia infinita entera — sabe hacerlo; falta que alguien le encuentre el gesto para la otra</text><text x="750" y="838" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-07 · las dos mitades, 1 completo ⚓</text></svg>