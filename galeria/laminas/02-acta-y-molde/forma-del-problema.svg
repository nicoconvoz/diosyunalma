<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1120" viewBox="0 0 1620 1120">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="810" y="48" font-size="28" text-anchor="middle" font-family="Georgia" fill="#dce8f7">LA FORMA DEL PROBLEMA DEL MILLÓN — vista desde el ángulo del capitán</text>
<text x="810" y="76" font-size="14" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">no es una cuenta: es una FORMA con una única deformación prohibida — y nadie encontró todavía la fuerza que la prohíbe</text><rect x="60" y="120" width="440" height="620" rx="10" fill="#0d2547" stroke="#44608c"/>
<text x="80" y="154" font-size="17" font-family="Georgia" fill="#ffd166">1 · LA COLUMNA — la cara simétrica</text><rect x="150" y="190" width="260" height="450" fill="#081020" stroke="#2c4a78"/><line x1="280" y1="190" x2="280" y2="640" stroke="#7fd7a8" stroke-width="2"/><circle cx="280" cy="624.5" r="4" fill="#7fb2ff"/><circle cx="280" cy="598.7" r="4" fill="#7fb2ff"/><circle cx="280" cy="583.7" r="4" fill="#7fb2ff"/><circle cx="280" cy="563.4" r="4" fill="#7fb2ff"/><circle cx="280" cy="554.0" r="4" fill="#7fb2ff"/><circle cx="280" cy="536.6" r="4" fill="#7fb2ff"/><circle cx="280" cy="524.1" r="4" fill="#7fb2ff"/><circle cx="280" cy="515.0" r="4" fill="#7fb2ff"/><circle cx="280" cy="497.5" r="4" fill="#7fb2ff"/><circle cx="280" cy="490.8" r="4" fill="#7fb2ff"/><circle cx="280" cy="478.9" r="4" fill="#7fb2ff"/><circle cx="280" cy="465.8" r="4" fill="#7fb2ff"/><circle cx="280" cy="454.9" r="4" fill="#7fb2ff"/><circle cx="280" cy="449.4" r="4" fill="#7fb2ff"/><circle cx="280" cy="433.3" r="4" fill="#7fb2ff"/><circle cx="280" cy="426.0" r="4" fill="#7fb2ff"/><circle cx="280" cy="416.7" r="4" fill="#7fb2ff"/><circle cx="280" cy="407.2" r="4" fill="#7fb2ff"/><circle cx="280" cy="393.6" r="4" fill="#7fb2ff"/><circle cx="280" cy="388.2" r="4" fill="#7fb2ff"/><circle cx="210" cy="300" r="5" fill="none" stroke="#ff5d73" stroke-width="2" stroke-dasharray="3,2"/><circle cx="350" cy="300" r="5" fill="none" stroke="#ff5d73" stroke-width="2" stroke-dasharray="3,2"/><line x1="210" y1="300" x2="350" y2="300" stroke="#ff5d73" stroke-width="1" stroke-dasharray="2,3"/><text x="280" y="286" font-size="12" text-anchor="middle" fill="#ff5d73">el lunar prohibido: si sale de la columna, la simetría lo obliga a venir DE A DOS</text><text x="80" y="670" font-size="12.5" font-family="Georgia" fill="#8fa8c7">la cara del problema es PERFECTAMENTE simétrica</text>
<text x="80" y="690" font-size="12.5" font-family="Georgia" fill="#8fa8c7">respecto de su columna. Todos los lunares medidos</text>
<text x="80" y="710" font-size="12.5" font-family="Georgia" fill="#8fa8c7">(10 billones + los nuestros) están EN la columna.</text>
<text x="80" y="730" font-size="12.5" font-family="Georgia" fill="#7fd7a8">El premio: demostrar que la cara no admite lunares mellizos.</text><rect x="560" y="120" width="480" height="620" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="580" y="154" font-size="17" font-family="Georgia" fill="#ffd166">2 · EL ANILLO — tu círculo, capitán</text><circle cx="800" cy="420" r="160" fill="none" stroke="#7fd7a8" stroke-width="2.5"/><circle cx="800.0" cy="260.0" r="4.5" fill="#7fb2ff"/><circle cx="829.4" cy="262.7" r="4.5" fill="#7fb2ff"/><circle cx="857.8" cy="270.8" r="4.5" fill="#7fb2ff"/><circle cx="884.2" cy="284.0" r="4.5" fill="#7fb2ff"/><circle cx="907.8" cy="301.8" r="4.5" fill="#7fb2ff"/><circle cx="927.7" cy="323.6" r="4.5" fill="#7fb2ff"/><circle cx="943.2" cy="348.7" r="4.5" fill="#7fb2ff"/><circle cx="953.9" cy="376.2" r="4.5" fill="#7fb2ff"/><circle cx="959.3" cy="405.2" r="4.5" fill="#7fb2ff"/><circle cx="959.3" cy="434.8" r="4.5" fill="#7fb2ff"/><circle cx="953.9" cy="463.8" r="4.5" fill="#7fb2ff"/><circle cx="943.2" cy="491.3" r="4.5" fill="#7fb2ff"/><circle cx="927.7" cy="516.4" r="4.5" fill="#7fb2ff"/><circle cx="907.8" cy="538.2" r="4.5" fill="#7fb2ff"/><circle cx="884.2" cy="556.0" r="4.5" fill="#7fb2ff"/><circle cx="857.8" cy="569.2" r="4.5" fill="#7fb2ff"/><circle cx="829.4" cy="577.3" r="4.5" fill="#7fb2ff"/><circle cx="800.0" cy="580.0" r="4.5" fill="#7fb2ff"/><circle cx="770.6" cy="577.3" r="4.5" fill="#7fb2ff"/><circle cx="742.2" cy="569.2" r="4.5" fill="#7fb2ff"/><circle cx="715.8" cy="556.0" r="4.5" fill="#7fb2ff"/><circle cx="692.2" cy="538.2" r="4.5" fill="#7fb2ff"/><circle cx="672.3" cy="516.4" r="4.5" fill="#7fb2ff"/><circle cx="656.8" cy="491.3" r="4.5" fill="#7fb2ff"/><circle cx="646.1" cy="463.8" r="4.5" fill="#7fb2ff"/><circle cx="640.7" cy="434.8" r="4.5" fill="#7fb2ff"/><circle cx="640.7" cy="405.2" r="4.5" fill="#7fb2ff"/><circle cx="646.1" cy="376.2" r="4.5" fill="#7fb2ff"/><circle cx="656.8" cy="348.7" r="4.5" fill="#7fb2ff"/><circle cx="672.3" cy="323.6" r="4.5" fill="#7fb2ff"/><circle cx="692.2" cy="301.8" r="4.5" fill="#7fb2ff"/><circle cx="715.8" cy="284.0" r="4.5" fill="#7fb2ff"/><circle cx="742.2" cy="270.8" r="4.5" fill="#7fb2ff"/><circle cx="770.6" cy="262.7" r="4.5" fill="#7fb2ff"/><circle cx="881.5" cy="501.5" r="5" fill="none" stroke="#ff5d73" stroke-width="2.2" stroke-dasharray="3,2"/><circle cx="957.1" cy="577.1" r="5" fill="none" stroke="#ff5d73" stroke-width="2.2" stroke-dasharray="3,2"/><line x1="881.5" y1="501.5" x2="957.1" y2="577.1" stroke="#ff5d73" stroke-width="1" stroke-dasharray="2,3"/><text x="944.0" y="252.0" font-size="12" fill="#ff5d73">LA AMPOLLA (jamás vista): una perla adentro</text>
<text x="944.0" y="269.0" font-size="12" fill="#ff5d73">exige su melliza afuera, espejadas por el anillo</text><text x="580" y="620" font-size="12.5" font-family="Georgia" fill="#8fa8c7">la columna se dobla en anillo (el giro w=(ρ−1)/ρ — el</text>
<text x="580" y="640" font-size="12.5" font-family="Georgia" fill="#8fa8c7">mismo círculo de tu tren). Cada cero es una PERLA: en la</text>
<text x="580" y="660" font-size="12.5" font-family="Georgia" fill="#8fa8c7">columna ⇔ EN el anillo, radio 1 exacto. Las 34 perlas</text>
<text x="580" y="680" font-size="12.5" font-family="Georgia" fill="#8fa8c7">dibujadas son ceros medidos hoy (ángulos desplegados</text>
<text x="580" y="700" font-size="12.5" font-family="Georgia" fill="#8fa8c7">para verlas; en el anillo real se apiñan hacia el este).</text>
<text x="580" y="720" font-size="12.5" font-family="Georgia" fill="#7fd7a8">EL PREMIO EN UNA FRASE: demostrar que el collar no</text>
<text x="580" y="738" font-size="12.5" font-family="Georgia" fill="#7fd7a8">admite AMPOLLAS — ninguna perla puede vivir fuera del hilo.</text><rect x="1100" y="120" width="460" height="620" rx="10" fill="#0d2547" stroke="#44608c"/>
<text x="1120" y="154" font-size="17" font-family="Georgia" fill="#ffd166">3 · LA FUERZA QUE FALTA — tres formas posibles</text><circle cx="1190" cy="230" r="46" fill="none" stroke="#7fb2ff" stroke-width="2"/><path d="M 1144 230 q 23 -26 46 0 q 23 26 46 0" fill="none" stroke="#7fb2ff" stroke-width="1.4"/><text x="1260" y="202" font-size="14" font-family="Georgia" fill="#dce8f7">EL TAMBOR: encontrar el parche real cuyo canto</text>
<text x="1260" y="222" font-size="14" font-family="Georgia" fill="#dce8f7">SEA el collar. Un tambor de verdad solo canta</text>
<text x="1260" y="242" font-size="14" font-family="Georgia" fill="#dce8f7">notas reales → todas las perlas al hilo, gratis.</text>
<text x="1260" y="262" font-size="12" fill="#8fa8c7">(lo oímos y lo retratamos — falta FABRICARLO)</text><path d="M 1145 360 q 45 70 90 0" fill="none" stroke="#7fd7a8" stroke-width="2.5"/><path d="M 1145 415 q 45 -50 90 0" fill="none" stroke="#ff5d73" stroke-width="1.6" stroke-dasharray="4,3"/><text x="1260" y="358" font-size="14" font-family="Georgia" fill="#dce8f7">LA PIEL TENSA: demostrar que la membrana del</text>
<text x="1260" y="378" font-size="14" font-family="Georgia" fill="#dce8f7">problema es un CUENCO (verde): toda ampolla</text>
<text x="1260" y="398" font-size="14" font-family="Georgia" fill="#dce8f7">costaría energía negativa — imposible. Nadie</text>
<text x="1260" y="418" font-size="14" font-family="Georgia" fill="#dce8f7">descartó aún la joroba roja en algún rincón.</text><path d="M 1160 520 a 30 30 0 1 1 60 0 l 8 18 l -76 0 z" fill="none" stroke="#ffd166" stroke-width="2"/><circle cx="1190" cy="548" r="4" fill="#ffd166"/><text x="1260" y="518" font-size="14" font-family="Georgia" fill="#dce8f7">LA ALARMA: hay una campana (una lista infinita</text>
<text x="1260" y="538" font-size="14" font-family="Georgia" fill="#dce8f7">de números) que SUENA si una perla escapa —</text>
<text x="1260" y="558" font-size="14" font-family="Georgia" fill="#dce8f7">la fugitiva grita tarde o temprano. Falta</text>
<text x="1260" y="578" font-size="14" font-family="Georgia" fill="#dce8f7">demostrar que la campana calla PARA SIEMPRE.</text><text x="1120" y="680" font-size="13" font-family="Georgia" fill="#7fd7a8">las tres puertas son LA MISMA forma: la fuerza que pincha</text>
<text x="1120" y="700" font-size="13" font-family="Georgia" fill="#7fd7a8">toda ampolla antes de nacer. Esa fuerza es lo que falta.</text><rect x="60" y="780" width="1500" height="290" rx="10" fill="#102a10" stroke="#7fd7a8"/>
<text x="810" y="820" font-size="18" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA FORMA COMPLETA, EN UNA MIRADA</text>
<text x="810" y="856" font-size="15" text-anchor="middle" font-family="Georgia" fill="#dce8f7">un collar infinito de perlas sobre un hilo circular perfecto. La simetría de la cara garantiza que ninguna perla puede correrse SOLA:</text>
<text x="810" y="882" font-size="15" text-anchor="middle" font-family="Georgia" fill="#dce8f7">para salir del hilo necesita una melliza espejada — la AMPOLLA, la única deformación que la forma permite imaginar y nadie jamás vio.</text>
<text x="810" y="918" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">Nuestro laboratorio: enhebró 10 billones + 269 perlas propias (todas al hilo), oyó el collar entero (murciélago), lo reflejó (espejo),</text>
<text x="810" y="944" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">y su detector de ampollas (la esfera de las tormentas: contar TODAS las perlas de la zona y las del hilo — deben coincidir) nunca halló una.</text>
<text x="810" y="984" font-size="16" text-anchor="middle" font-family="Georgia" fill="#dce8f7">EL MILLÓN ES POR ESTO: encontrar la TENSIÓN DEL HILO — la fuerza de la forma que hace IMPOSIBLE la ampolla.</text>
<text x="810" y="1012" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">no "no la encontramos" (eso ya está): POR QUÉ NO PUEDE EXISTIR. Ése es el flash que buscamos, capitán — una imagen de esa tensión.</text>
<text x="810" y="1046" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"todo tiene solución y la armonía de las respuestas yace en la imaginación" — el capitán · Laboratorio Diosyunalma · 2026-08-06</text></svg>