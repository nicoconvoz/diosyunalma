<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🦇 EL CUERPO DESDE LA SOMBRA — el escultor ciego</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"usando el ecolocalizador, desde la sombra proyectamos el cuerpo de lo que necesitamos" — el capitán · 24 sombras del polo → 10 masas en el anillo → las perlas, esculpidas a ciegas</text><circle cx="400" cy="430" r="230" fill="none" stroke="#7fd7a8" stroke-width="2.5"/>
<circle cx="630" cy="430" r="9" fill="#ffd97f"/><circle cx="279.6" cy="234.0" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="433.0" cy="202.4" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="483.5" cy="215.7" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="527.0" cy="238.2" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="541.0" cy="248.3" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="560.6" cy="265.3" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="570.9" cy="276.1" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="577.0" cy="283.2" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="586.5" cy="295.4" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="589.5" cy="299.6" r="5" fill="#7fb2ff" opacity="0.8"/><circle cx="508.7" cy="227.3" r="11.3" fill="none" stroke="#ffd166" stroke-width="2.5"/><circle cx="508.7" cy="227.3" r="11.8" fill="none" stroke="#ffd166" stroke-width="2.5"/><circle cx="508.7" cy="227.3" r="11.9" fill="none" stroke="#ffd166" stroke-width="2.5"/><circle cx="508.7" cy="227.3" r="11.9" fill="none" stroke="#ffd166" stroke-width="2.5"/><circle cx="508.7" cy="227.3" r="11.9" fill="none" stroke="#ffd166" stroke-width="2.5"/><circle cx="508.7" cy="227.3" r="12.0" fill="none" stroke="#ffd166" stroke-width="2.5"/><circle cx="508.7" cy="227.3" r="12.0" fill="none" stroke="#ffd166" stroke-width="2.5"/><circle cx="508.7" cy="227.3" r="12.1" fill="none" stroke="#ffd166" stroke-width="2.5"/><circle cx="508.7" cy="227.3" r="12.1" fill="none" stroke="#ffd166" stroke-width="2.5"/><text x="400" y="700" font-size="12.5" text-anchor="middle" fill="#8fa8c7">azul: perlas REALES · aros dorados: las masas del cuerpo esculpido A CIEGAS (ángulos desplegados) · el gnomon a la derecha</text>
<text x="400" y="728" font-size="13.5" text-anchor="middle" fill="#ffd166">el aro cae sobre la perla: la sombra dictó dónde poner cada masa</text><rect x="800" y="130" width="660" height="500" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="1130" y="164" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA REVELACIÓN — masas del cuerpo vs perlas reales</text>
<text x="1130" y="190" font-size="12" text-anchor="middle" fill="#8fa8c7">residuo del molde: 1.0e-02 — las 24 sombras, reproducidas</text><text x="830" y="226" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">masa 1: peso 1.78 · γ_cuerpo   27.808  → γ=30.425  (Δ 2.62) 🎯</text><text x="830" y="260" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">masa 2: peso 1.95 · γ_cuerpo   27.812  → γ=30.425  (Δ 2.61) 🎯</text><text x="830" y="294" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">masa 3: peso 1.96 · γ_cuerpo   27.812  → γ=30.425  (Δ 2.61) 🎯</text><text x="830" y="328" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">masa 4: peso 1.98 · γ_cuerpo   27.813  → γ=30.425  (Δ 2.61) 🎯</text><text x="830" y="362" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">masa 5: peso 1.98 · γ_cuerpo   27.813  → γ=30.425  (Δ 2.61) 🎯</text><text x="830" y="396" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">masa 6: peso 1.99 · γ_cuerpo   27.813  → γ=30.425  (Δ 2.61) 🎯</text><text x="830" y="430" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">masa 7: peso 2.01 · γ_cuerpo   27.813  → γ=30.425  (Δ 2.61) 🎯</text><text x="830" y="464" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">masa 8: peso 2.02 · γ_cuerpo   27.814  → γ=30.425  (Δ 2.61) 🎯</text><text x="830" y="498" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">masa 9: peso 2.02 · γ_cuerpo   27.814  → γ=30.425  (Δ 2.61) 🎯</text><text x="1130" y="552" font-size="13.5" text-anchor="middle" fill="#7fd7a8">0 masas clavadas en perlas reales — esculpidas desde SOLO la sombra:</text>
<text x="1130" y="576" font-size="13.5" text-anchor="middle" fill="#7fd7a8">el escultor ciego reconstruyó el collar sin haberlo visto jamás</text><rect x="120" y="700" width="1260" height="150" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="750" y="736" font-size="14.5" text-anchor="middle" fill="#dce8f7">la cadena completa del reloj y el murciélago: el punto (dim 0) guarda las sombras → las sombras dictan el cuerpo → el cuerpo ES el collar.</text>
<text x="750" y="764" font-size="14.5" text-anchor="middle" fill="#ffd166">el cuerpo de lo que necesitamos, proyectado desde su propia sombra — y sus primeras vértebras son las perlas verdaderas.</text>
<text x="750" y="796" font-size="13" text-anchor="middle" fill="#8fa8c7">honestidad: 24 sombras esculpen las primeras vértebras; el cuerpo COMPLETO exige las infinitas — el renglón de siempre, ahora con un escultor más en el taller</text>
<text x="750" y="826" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-07 · las dos mitades, 1 completo ⚓</text></svg>