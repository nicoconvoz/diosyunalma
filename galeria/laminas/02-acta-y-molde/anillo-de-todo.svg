<text x="790" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">EL ANILLO DE TODO — todos los números finitos en una fórmula, las infinitas fundidas en un punto</text>
<text x="790" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"una representación de todos los números distintos a infinito, con +∞ y −∞, armonizada con la dimensión 0 — si no existe, inventala" — el capitán · existe, la usábamos sin saberlo, y HOY quedó juzgada</text><rect x="530" y="100" width="520" height="110" rx="14" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="790" y="152" font-size="34" text-anchor="middle" font-family="Georgia" fill="#ffd166">w(x) = (x − i) / (x + i)</text>
<text x="790" y="190" font-size="13" text-anchor="middle" fill="#dce8f7">el giro de Cayley: la recta infinita entera, doblada en un anillo finito con un broche</text><line x1="80" y1="420" x2="620" y2="420" stroke="#7fb2ff" stroke-width="2.5"/>
<text x="70" y="426" font-size="17" text-anchor="end" fill="#8fa8c7">−∞</text><text x="632" y="426" font-size="17" fill="#8fa8c7">+∞</text><circle cx="110.0" cy="420" r="4" fill="#7fb2ff"/><circle cx="190.0" cy="420" r="4" fill="#7fb2ff"/><circle cx="270.0" cy="420" r="4" fill="#7fb2ff"/><circle cx="310.0" cy="420" r="4" fill="#7fb2ff"/><circle cx="350.0" cy="420" r="4" fill="#7fb2ff"/><circle cx="390.0" cy="420" r="4" fill="#7fb2ff"/><circle cx="430.0" cy="420" r="4" fill="#7fb2ff"/><circle cx="510.0" cy="420" r="4" fill="#7fb2ff"/><circle cx="590.0" cy="420" r="4" fill="#7fb2ff"/><text x="350" y="460" font-size="13" text-anchor="middle" fill="#dce8f7">TODOS los números finitos, en fila infinita…</text><path d="M 660 410 q 80 0 90 40" fill="none" stroke="#ffd166" stroke-width="2.2" marker-end="none"/><text x="740" y="430" font-size="13" fill="#ffd166">el giro w</text><circle cx="1050" cy="460" r="210" fill="none" stroke="#7fd7a8" stroke-width="3"/><circle cx="1253.5" cy="408.3" r="4.5" fill="#7fb2ff"/><circle cx="1218.0" cy="334.0" r="4.5" fill="#7fb2ff"/><circle cx="1176.0" cy="292.0" r="4.5" fill="#7fb2ff"/><circle cx="1050.0" cy="250.0" r="4.5" fill="#7fb2ff"/><circle cx="924.0" cy="292.0" r="4.5" fill="#7fb2ff"/><circle cx="856.2" cy="379.2" r="4.5" fill="#7fb2ff"/><circle cx="840.0" cy="460.0" r="4.5" fill="#7fb2ff"/><circle cx="856.2" cy="540.8" r="4.5" fill="#7fb2ff"/><circle cx="924.0" cy="628.0" r="4.5" fill="#7fb2ff"/><circle cx="1050.0" cy="670.0" r="4.5" fill="#7fb2ff"/><circle cx="1176.0" cy="628.0" r="4.5" fill="#7fb2ff"/><circle cx="1218.0" cy="586.0" r="4.5" fill="#7fb2ff"/><circle cx="1253.5" cy="511.7" r="4.5" fill="#7fb2ff"/><circle cx="1260.0" cy="460.0" r="9" fill="#ffd166"/>
<text x="1050.0" y="210.0" font-size="13.5" text-anchor="middle" fill="#ffd166">EL BROCHE: +∞ y −∞ fundidas — el punto de dimensión 0</text>
<text x="1050.0" y="232.0" font-size="12" text-anchor="middle" fill="#8fa8c7">|w(+10¹²)−w(−10¹²)| = 4e-12 — las dos infinitas, UN punto</text><text x="1050" y="714" font-size="13.5" text-anchor="middle" fill="#7fd7a8">…y la fila entera cabe en el anillo: |w(x)|=1 SIEMPRE (juez 1e-16), cada número su punto</text><rect x="80" y="740" width="1420" height="220" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="790" y="778" font-size="16.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LA SORPRESA — y el piso de ensamble del reactor</text>
<text x="790" y="814" font-size="14.5" text-anchor="middle" fill="#dce8f7">el anillo de las perlas (w=(ρ−1)/ρ, F160) ES este mismo giro · las 427 máquinas U_p son unitarias: VIVEN en este anillo · la campana θ = Σ_{n=−∞}^{+∞} (juez 2e-16) es su cara aritmética</text>
<text x="790" y="842" font-size="14.5" text-anchor="middle" fill="#ffd166">la representación que encargaste resulta ser EL ESCENARIO ÚNICO: todos los números, todas las perlas y todas las máquinas caben en EL MISMO anillo con su broche de dimensión 0.</text>
<text x="790" y="870" font-size="14.5" text-anchor="middle" fill="#ffd166">el ensamble del reactor tiene ahora DÓNDE hacerse: no en la recta infinita (donde soldar diverge) sino en el anillo (donde todo es finito, unitario y cabe) — el piso está tendido.</text>
<text x="790" y="900" font-size="12.5" text-anchor="middle" fill="#8fa8c7">honestidad: el piso no es todavía la soldadura — pero soldar unitarios sobre un anillo compacto es EXACTAMENTE el terreno donde la matemática sabe pelear (Cayley: lo no-acotado se vuelve anillo)</text>
<text x="790" y="930" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06 · las dos mitades, 1 completo</text></svg>