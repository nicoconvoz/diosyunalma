<text x="1276.7" y="662.0" font-size="10.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">42</text>
<circle cx="1322.00" cy="542.21" r="5.50" fill="#7ee0c0"/>
<text x="1322.0" y="662.0" font-size="10.0" font-family="Consolas,monospace" fill="#8fb4d9" text-anchor="middle">48</text>
<text x="1326.0" y="529.2" font-size="11.0" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="end">∛50 = 3.684031</text>
<text x="1186.0" y="682.0" font-size="11.5" font-family="Georgia" fill="#8fb4d9" text-anchor="middle">log₁₀ t — siete aguas, un solo cociente</text>
<rect x="40.0" y="712.0" width="1320.0" height="34" rx="8" fill="#0d1830" stroke="#ffd98a" opacity="0.5"/>
<text x="700.0" y="735.0" font-size="14.5" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="middle">L = k·(C/t)^(1/3)  ⇒  η = t·L³/(3k³) = C/3   |   0.009 → 0.0030 rad ;  0.45 → 0.1500 rad ;  cociente = ∛50 = 3.684031</text>
<rect x="40.0" y="760.0" width="1320.0" height="92.0" rx="9" fill="#0d1830" stroke="#ffd98a" opacity="0.35"/>
<text x="53.0" y="786.0" font-size="13.0" font-family="Georgia" fill="#dce8f7" text-anchor="start">EN CRIOLLO: las dos máquinas cortan el mar en bloques y usan la MISMA regla para decidir el largo de cada bloque.</text>
<text x="53.0" y="805.0" font-size="13.0" font-family="Georgia" fill="#dce8f7" text-anchor="start">Lo único distinto es cuánta panza le permiten a la viga: el DeLorean tolera 0.0030 radianes de curva sobrante, el tren 0.1500.</text>
<text x="53.0" y="824.0" font-size="13.0" font-family="Georgia" fill="#dce8f7" text-anchor="start">Cincuenta veces más tolerancia le da al tren bloques 3.6840 veces más largos — la raíz cúbica de cincuenta, en cualquier agua.</text>
<text x="53.0" y="843.0" font-size="13.0" font-family="Georgia" fill="#dce8f7" text-anchor="start">Y adentro de las dos cajas están las mismas dos ruedas dentadas: el espejo (b→1−b) y la cizalla (b→b−½).</text>
<text x="700.0" y="924.0" font-size="13.5" font-family="Georgia" fill="#ffd98a" text-anchor="middle">Una sola geometría; dos presupuestos de curvatura. El resto es la misma máquina.</text>
</svg>
