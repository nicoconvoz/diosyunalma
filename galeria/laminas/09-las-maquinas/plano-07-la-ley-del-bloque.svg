<text x="120.0" y="654.0" font-size="12.0" font-family="Georgia" fill="#ffd98a" text-anchor="start">la comba η</text>
<text x="1302.0" y="654.0" font-size="12.0" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="end">η = 0,150000 rad — PLANA, agua por agua</text>
<text x="700.0" y="688.0" font-size="12.0" font-family="Consolas,monospace" fill="#7ee0c0" text-anchor="middle">L se multiplica por 31.623 · η se multiplica por 1,000000 (dispersión medida entre las 8 aguas: 8,3e-17)</text>
<rect x="46.0" y="712.0" width="1308.0" height="34" rx="8" fill="#0d1830" stroke="#ffd98a" opacity="0.5"/>
<text x="700.0" y="735.0" font-size="14.5" font-family="Consolas,monospace" fill="#ffd98a" text-anchor="middle">L = k₀·(0,45/t)^{1/3}  ⟹  η = t·L³/(3k₀³) = 0,45/3 = 0,15 rad, en TODA agua   ·   piezas = ⌈(η/0,04)^{1/3}⌉ = 2</text>
<rect x="46.0" y="762.0" width="1308.0" height="92.0" rx="9" fill="#0d1830" stroke="#7ee0c0" opacity="0.35"/>
<text x="59.0" y="788.0" font-size="13.0" font-family="Georgia" fill="#dce8f7" text-anchor="start">EN CRIOLLO: el tren no puede sumar el mar entero de una, así que lo corta en bloques. ¿De qué largo? El largo se elige para que la viga se combe</text>
<text x="59.0" y="807.0" font-size="13.0" font-family="Georgia" fill="#dce8f7" text-anchor="start">siempre lo mismo: no importa si el agua tiene veintiún ceros o cuarenta y ocho, el bloque se estira treinta mil veces pero la panza que hace es</text>
<text x="59.0" y="826.0" font-size="13.0" font-family="Georgia" fill="#dce8f7" text-anchor="start">idéntica. Esa es la ley: la regla no mide metros, mide comba. Y como esa comba pasa el presupuesto, la viga se parte al medio; cada mitad comba</text>
<text x="59.0" y="845.0" font-size="13.0" font-family="Georgia" fill="#dce8f7" text-anchor="start">ocho veces menos y queda derecha. La costura que las vuelve a unir se lleva en doble-doble, para que no se note el corte por ningún lado.</text>
<text x="700.0" y="924.0" font-size="13.5" font-family="Georgia" fill="#ffd98a" text-anchor="middle">go run ./cmd/losplanos · lámina ⑦ del recorrido de las máquinas · riel 7 del tren · Todavía no.</text>
</svg>
