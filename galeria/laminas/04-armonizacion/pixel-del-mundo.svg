<text x="330" y="538" font-size="12" text-anchor="middle" fill="#8fa8c7">cada número, medido este día con juez propio</text><text x="330" y="600" font-size="13" text-anchor="middle" fill="#ffd166">× el teselado: ⌊269.59⌋ = 269 pixeles hasta T=500 — la linterna contó 269 ✔</text><rect x="860" y="160" width="70" height="360" rx="6" fill="#5a3d12" stroke="#c9b06a" stroke-width="2.5"/>
