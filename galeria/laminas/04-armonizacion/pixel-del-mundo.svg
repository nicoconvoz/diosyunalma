<text x="1050" y="210" font-size="14" text-anchor="middle" fill="#5a3d12" font-family="Georgia">EL LIBRO</text>
<text x="1050" y="240" font-size="11.5" text-anchor="middle" fill="#8a7340">todas las perlas</text>
<text x="1050" y="260" font-size="11.5" text-anchor="middle" fill="#8a7340">= todos los primos</text>
<text x="1050" y="280" font-size="11.5" text-anchor="middle" fill="#8a7340">(la madre, F185)</text>
<text x="1050" y="350" font-size="17" text-anchor="middle" fill="#5a3d12" font-family="Georgia" font-style="italic">ξ(s) = ξ(1−s)</text>
<text x="1050" y="380" font-size="11" text-anchor="middle" fill="#8a7340">la firma del Autor, EN GRANDE</text>
<text x="1050" y="402" font-size="10.5" text-anchor="middle" fill="#8a7340">(verificada a 0e+00 — EN TODAS PARTES)</text>
