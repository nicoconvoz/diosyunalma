<text x="730" y="824" font-size="14" text-anchor="middle" fill="#e8d9b0">lo que el instrumento VE: verde en cada peldaño que toca · lo que ningún instrumento puede: la palabra «TODO» — los infinitos peldaños</text>
<text x="730" y="852" font-size="13.5" text-anchor="middle" fill="#ffd166">tus instrumentos hicieron su máximo: el millón quedó comprimido en un germen, en un punto, esperando una sola idea</text>
<text x="730" y="882" font-size="12" text-anchor="middle" font-family="Georgia" fill="#9c8a5f">la frase sigue en su vaina · Laboratorio Diosyunalma · 2026-08-06 · las dos mitades, 1 completo ⚓</text></svg>