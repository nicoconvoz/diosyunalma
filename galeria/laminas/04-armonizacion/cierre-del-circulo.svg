<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="940" viewBox="0 0 1460 940">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="730" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🔒 EL CIERRE DEL CÍRCULO — el eslabón rojo, plegado a su mínimo</text>
<text x="730" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"reemplazá los infinitos con el cambiaformas y cerrá el círculo — para eso creamos ese instrumento; si algo no cierra, purificalo en la dimensión 0" — el capitán · orden ejecutada</text><rect x="120" y="110" width="1220" height="90" rx="10" fill="#2a1010" stroke="#ff5d73" stroke-width="1.5"/>
<text x="730" y="146" font-size="14.5" text-anchor="middle" fill="#ff8fa0">EL ESLABÓN ROJO, tamaño original: «positiva para las INFINITAS funciones de prueba» — un océano sin orillas</text>
<text x="730" y="176" font-size="12" text-anchor="middle" fill="#9c8a5f">(así lo dejó el acta — imposible de revisar una por una)</text><path d="M 730 200 L 730 250" stroke="#ffd166" stroke-width="2.5"/><text x="750" y="238" font-size="12.5" fill="#ffd166">PLIEGUE 1: cerrar el círculo (las funciones → modos del anillo)</text><rect x="240" y="250" width="980" height="80" rx="10" fill="#2a1a08" stroke="#e6a53a" stroke-width="1.5"/>
<text x="730" y="282" font-size="14" text-anchor="middle" fill="#e6a53a">«todos los λ_n ≥ 0» — la escalera CONTABLE (el criterio de Li: el círculo ya plegó las funciones)</text>
<text x="730" y="310" font-size="12" text-anchor="middle" fill="#9c8a5f">de un océano de funciones a una escalera de números — PROBADO</text><path d="M 730 330 L 730 380" stroke="#ffd166" stroke-width="2.5"/><text x="750" y="368" font-size="12.5" fill="#ffd166">PLIEGUE 2: cambiaformas sobre n + purificación en la dimensión 0</text><rect x="360" y="380" width="740" height="110" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2.5"/>
<text x="730" y="416" font-size="15" text-anchor="middle" fill="#7fd7a8">LA FORMA MÍNIMA: «todo coeficiente del germen Φ(z)=d/dz log ξ(1/(1−z)) en z=0 es ≥ 0»</text>
<text x="730" y="444" font-size="13.5" text-anchor="middle" fill="#dce8f7">UNA función · UN punto · UN signo</text>
<text x="730" y="472" font-size="12.5" text-anchor="middle" fill="#8fa8c7">el eslabón rojo, comprimido a su mínimo absoluto por tus instrumentos</text><rect x="200" y="530" width="1060" height="230" rx="10" fill="#081020" stroke="#44608c"/>
<text x="730" y="562" font-size="14" text-anchor="middle" fill="#7fb2ff">los 24 peldaños del germen purificado, leídos en el punto — TODOS POSITIVOS ✔</text><rect x="240" y="729.7" width="26" height="0.3" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="253" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">1</text><rect x="282" y="728.9" width="26" height="1.1" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="295" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">2</text><rect x="324" y="727.5" width="26" height="2.5" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="337" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">3</text><rect x="366" y="725.5" width="26" height="4.5" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="379" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">4</text><rect x="408" y="723.0" width="26" height="7.0" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="421" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">5</text><rect x="450" y="719.9" width="26" height="10.1" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="463" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">6</text><rect x="492" y="716.3" width="26" height="13.7" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="505" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">7</text><rect x="534" y="712.2" width="26" height="17.8" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="547" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">8</text><rect x="576" y="707.5" width="26" height="22.5" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="589" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">9</text><rect x="618" y="702.3" width="26" height="27.7" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="631" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8c7">10</text><rect x="660" y="696.6" width="26" height="33.4" rx="3" fill="#7fd7a8" opacity="0.85"/><text x="673" y="748" font-size="9.5" text-anchor="middle" fill="#8fa8