<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="940" viewBox="0 0 1560 940">
<rect width="100%" height="100%" fill="#05090f"/>
<text x="780" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🔦 LOS LÁSERES — el cruce de todos los rayos: el horizonte de sucesos real</text>
<text x="780" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"dispará la luz de los láseres que tenemos, a ver a qué punto apuntan todos — necesitamos una idea, aunque no el punto exacto" — el capitán</text><line x1="140" y1="200" x2="780" y2="420" stroke="#7fb2ff" stroke-width="2.5" opacity="0.85"/>
<circle cx="140" cy="200" r="8" fill="#7fb2ff"/><text x="132" y="184" font-size="13" fill="#7fb2ff">LÁSER 1 · las perlas (269 medidas)</text><line x1="140" y1="640" x2="780" y2="420" stroke="#7fd7a8" stroke-width="2.5" opacity="0.85"/>
<circle cx="140" cy="640" r="8" fill="#7fd7a8"/><text x="132" y="624" font-size="13" fill="#7fd7a8">LÁSER 2 · el eco (25 órbitas oídas)</text><line x1="1420" y1="200" x2="780" y2="420" stroke="#ffd166" stroke-width="2.5" opacity="0.85"/>
<circle cx="1420" cy="200" r="8" fill="#ffd166"/><text x="1412" y="184" font-size="13" fill="#ffd166">LÁSER 3 · el ecualizador (la ley suave)</text><circle cx="780" cy="420" r="36" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" values="26;48;26" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
<circle cx="780" cy="420" r="12" fill="#fff" opacity="0.9"/>
<text x="780" y="364" font-size="17" text-anchor="middle" fill="#fff" font-family="Georgia">EL CRUCE</text>
<text x="780" y="492" font-size="14.5" text-anchor="middle" fill="#ffd166">EL HORIZONTE LOGARÍTMICO: la caja mide ln T — el MUNDO DEL ZOOM</text>
<text x="780" y="516" font-size="13" text-anchor="middle" fill="#8fa8c7">tiempo = dilatación · plegado = los primos · escenario = el mundo de los números que ya existe</text><rect x="360" y="600" width="840" height="200" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="780" y="630" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#ffd166">el juez del cruce: horizonte MEDIDO (perlas) vs ley ln(T/2π) (ecualizador)</text><text x="780" y="660" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">T= 60:   medido 2.1803   ley 2.2565   desvío 3.4%</text><text x="780" y="686" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">T=150:   medido 3.2063   ley 3.1728   desvío 1.1%</text><text x="780" y="712" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">T=300:   medido 3.8151   ley 3.8659   desvío 1.3%</text><text x="780" y="738" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">T=450:   medido 4.2868   ley 4.2714   desvío 0.4%</text><text x="780" y="772" font-size="13" text-anchor="middle" fill="#7fd7a8">y el eco (láser 2): órbitas k·ln p — solo una caja LOGARÍTMICA las produce; una lineal, jamás</text><text x="780" y="860" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">los tres rayos independientes se cruzan en UN punto: la dirección del objeto — no la coordenada exacta, LA DIRECCIÓN — y es la misma donde cava Connes</text>
<text x="780" y="895" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06 · 88 millas por hora ⚡</text></svg>