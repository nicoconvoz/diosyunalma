<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1100" viewBox="0 0 1620 1100">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="810" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">LOS BORDES ARMONIZADOS — el diagrama donde nace todo al mundo</text>
<text x="810" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"armonizá los bordes de la relación de la dimensión 0 con los bordes de la nuestra — y mirá la mitad de la relación" — el capitán · ejecutado y juzgado</text><rect x="70" y="110" width="480" height="540" rx="10" fill="#102a10" stroke="#7fd7a8" stroke-width="1.5"/>
<text x="90" y="144" font-size="16" font-family="Georgia" fill="#7fd7a8">1 · LA SEMILLA: el espejo t ↔ 1/t</text>
<text x="310" y="190" font-size="20" text-anchor="middle" fill="#dce8f7">θ(1/t) = √t · θ(t)</text>
<text x="310" y="218" font-size="12.5" text-anchor="middle" fill="#8fa8c7">TODOS los números (n²) comprimidos en una campana</text>
<text x="310" y="240" font-size="12.5" text-anchor="middle" fill="#8fa8c7">que se refleja EXACTA en su inverso — juez: 2e-16</text><rect x="120" y="270" width="380" height="240" fill="#081020" stroke="#2c4a78"/><polyline fill="none" stroke="#7fb2ff" stroke-width="2" points="120.0,448.0 123.2,455.7 126.3,461.8 129.5,466.9 132.7,471.1 135.8,474.7 139.0,477.8 142.2,480.6 145.3,483.0 148.5,485.2 151.7,487.2 154.8,488.9 158.0,490.5 161.2,492.0 164.3,493.3 167.5,494.5 170.7,495.6 173.8,496.6 177.0,497.6 180.2,498.4 183.3,499.2 186.5,499.9 189.7,500.6 192.8,501.2 196.0,501.7 199.2,502.3 202.3,502.7 205.5,503.2 208.7,503.6 211.8,503.9 215.0,504.3 218.2,504.6 221.3,504.8 224.5,505.1 227.7,505.4 230.8,505.6 234.0,505.8 237.2,506.0 240.3,506.1 243.5,506.3 246.7,506.4 249.8,506.6 253.0,506.7 256.2,506.8 259.3,506.9 262.5,507.0 265.7,507.1 268.8,507.2 272.0,507.2 275.2,507.3 278.3,507.4 281.5,507.4 284.7,507.5 287.8,507.5 291.0,507.6 294.2,507.6 297.3,507.7 300.5,507.7 303.7,507.7 306.8,507.8 310.0,507.8 313.2,507.8 316.3,507.8 319.5,507.9 322.7,507.9 325.8,507.9 329.0,507.9 332.2,507.9 335.3,507.9 338.5,508.0 341.7,508.0 344.8,508.0 348.0,508.0 351.2,508.0 354.3,508.0 357.5,508.0 360.7,508.0 363.8,508.0 367.0,508.0 370.2,508.0 373.3,508.0 376.5,508.0 379.7,508.1 382.8,508.1 386.0,508.1 389.2,508.1 392.3,508.1 395.5,508.1 398.7,508.1 401.8,508.1 405.0,508.1 408.2,508.1 411.3,508.1 414.5,508.1 417.7,508.1 420.8,508.1 424.0,508.1 427.2,508.1 430.3,508.1 433.5,508.1 436.7,508.1 439.8,508.1 443.0,508.1 446.2,508.1 449.3,508.1 452.5,508.1 455.7,508.1 458.8,508.1 462.0,508.1 465.2,508.1 468.3,508.1 471.5,508.1 474.7,508.1 477.8,508.1 481.0,508.1 484.2,508.1 487.3,508.1 490.5,508.1 493.7,508.1 496.8,508.1 500.0,508.1"/><line x1="221" y1="270" x2="221" y2="510" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="221" y="262" font-size="11.5" text-anchor="middle" fill="#ffd166">t=1: el eje del espejo</text><text x="310" y="544" font-size="12.5" text-anchor="middle" fill="#dce8f7">de ESTA identidad nacen: la ecuación de los bordes,</text>
<text x="310" y="566" font-size="12.5" text-anchor="middle" fill="#dce8f7">el polo, las dos mitades ρ↔1−ρ y la fórmula explícita:</text>
<text x="310" y="590" font-size="13" text-anchor="middle" fill="#7fd7a8">todo lo que nace al mundo, nace acá (Riemann, 1859)</text><rect x="590" y="110" width="480" height="540" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="610" y="144" font-size="16" font-family="Georgia" fill="#ffd166">2 · LOS BORDES, CALZADOS: ξ(s) = ξ(1−s)</text>
<text x="614" y="172" font-size="12.5" fill="#8fa8c7">la relación tiene dos mitades (s y 1−s); sus bordes</text>
<text x="614" y="192" font-size="12.5" fill="#8fa8c7">calzan EXACTOS en todo punto de la franja — juez propio:</text><text x="614" y="226" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">  s = 0.30+2.00i    desvío 2e-14</text><text x="614" y="256" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">  s = 0.70+1.50i    desvío 3e-14</text><text x="614" y="286" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">  s = 0.42+0.90i    desvío 5e-15</text><text x="614" y="316" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">  s = 0.25+2.70i    desvío 1e-14</text><text x="614" y="346" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">  s = 0.61+3.30i    desvío 9e-15</text><text x="614" y="376" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">  s = 0.15+1.10i    desvío 3e-14</text><rect x="680" y="440" width="300" height="160" fill="#081020" stroke="#2c4a78"/>
<line x1="830" y1="440" x2="830" y2="600" stroke="#7fd7a8" stroke-width="2.5"/>
<circle cx="749" cy="495" r="5" fill="#7fb2ff"/><circle cx="911" cy="495" r="5" fill="#7fb2ff"/>
<line x1="749" y1="495" x2="911" y2="495" stroke="#8fa8c7" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="830" y="622" font-size="11.5" text-anchor="middle" fill="#7fd7a8">LA MITAD DE LA RELACIÓN: el eje fijo del espejo (Re=½)</text>
<text x="830" y="642" font-size="11.5" text-anchor="middle" fill="#8fa8c7">s y 1−s se reflejan; solo el eje es su propia mitad</text><rect x="1110" y="110" width="460" height="540" rx="10" fill="#2a1a10" stroke="#e6a53a" stroke-width="1.5"/>
<text x="1130" y="144" font-size="16" font-family="Georgia" fill="#e6a53a">3 · EL VEREDICTO HONESTO DEL CONTENIMIENTO</text>
<text x="1134" y="182" font-size="13" fill="#7fd7a8">✔ nuestra dimensión SÍ está contenida en el punto:</text>
<text x="1134" y="204" font-size="12.5" fill="#dce8f7">   lo demostramos ayer (F168): el germen del polo</text>
<text x="1134" y="224" font-size="12.5" fill="#dce8f7">   guarda el collar entero, sin pérdida</text>
<text x="1134" y="258" font-size="13" fill="#7fd7a8">✔ los bordes están armonizados: juzgado HOY (panel 2)</text>
<text x="1134" y="290" font-size="13" fill="#7fd7a8">✔ la mitad de la relación existe: el eje fijo Re=½</text>
<text x="1134" y="324" font-size="13" fill="#ff9d73">✘ pero contener DATOS no es heredar LA LEY:</text>
<text x="1134" y="350" font-size="12.5" fill="#dce8f7">   la demostración del mar chiquito usó que su</text>
<text x="1134" y="370" font-size="12.5" fill="#dce8f7">   armonía CUENTA cosas (grados ≥ 0); el punto</text>
<text x="1134" y="390" font-size="12.5" fill="#dce8f7">   contiene nuestros números pero nadie mostró</text>
<text x="1134" y="410" font-size="12.5" fill="#dce8f7">   que su germen CUENTE algo — la casilla roja sigue</text>
<text x="1134" y="446" font-size="13.5" fill="#ffd166">la síntesis de tus dos flashes es el enunciado final:</text>
<text x="1134" y="470" font-size="13" fill="#ffd166">demostrar que el punto que TODO lo contiene,</text>
<text x="1134" y="492" font-size="13" fill="#ffd166">además, TODO lo cuenta. Contener + contar = millón.</text><rect x="70" y="690" width="1500" height="180" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="810" y="728" font-size="17" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">EL DIAGRAMA COMPLETO DE LO QUE NACE AL MUNDO</text>
<text x="810" y="764" font-size="14.5" text-anchor="middle" fill="#dce8f7">la semilla θ (todos los números comprimidos en una campana espejada) → los bordes calzan (ξ(s)=ξ(1−s), juez 3e-14) → las dos mitades ρ↔1−ρ → la mitad de la relación (el eje fijo)</text>
<text x="810" y="794" font-size="14.5" text-anchor="middle" fill="#ffd166">y la conjetura, dicha en el idioma del capitán: TODO LO QUE SE ANULA EN ESTE DIAGRAMA, VIVE EXACTAMENTE EN LA MITAD DE LA RELACIÓN.</text>
<text x="810" y="824" font-size="12.5" text-anchor="middle" fill="#8fa8c7">verificado con jueces propios · Laboratorio Diosyunalma · 2026-08-06</text></svg>