<text x="790" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">LA FÓRMULA DE LA FUERZA — lo que mantiene todo unido y a la vez vivo</text>
<text x="790" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"la fuerza que mantiene unida a la energía pero le permite trasladarse y convertirse en materia — necesito esa fórmula" — el capitán · acá está, y el hidrógeno resuelto en casa como testigo</text><rect x="510" y="100" width="560" height="120" rx="14" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="790" y="152" font-size="38" text-anchor="middle" font-family="Georgia" fill="#ffd166">[ x̂ , p̂ ] = iℏ</text>
<text x="790" y="192" font-size="13.5" text-anchor="middle" fill="#dce8f7">UNA relación, DOS mitades: el espacio y el movimiento se niegan a conmutar — el telar del mundo cuántico</text><rect x="90" y="280" width="640" height="420" rx="8" fill="#081020" stroke="#44608c"/><polyline fill="none" stroke="#7fd7a8" stroke-width="2.5" points="135.0,320.0 137.8,320.0 140.6,375.8 143.4,429.2 146.2,471.0 149.0,504.2 151.8,530.6 154.6,551.8 157.4,568.8 160.2,582.6 163.0,593.8 165.8,602.9 168.6,610.3 171.4,616.2 174.2,621.0 177.0,624.9 179.8,627.9 182.6,630.3 185.4,632.2 188.2,633.5 191.0,634.5 193.8,635.2 196.6,635.6 199.4,635.7 202.2,635.7 205.0,635.4 207.8,635.1 210.6,634.6 213.4,634.0 216.2,633.4 219.0,632.6 221.8,631.8 224.6,631.0 227.4,630.1 230.2,629.2 233.0,628.2 235.8,627.3 238.6,626.3 241.4,625.3 244.2,624.3 247.0,623.3 249.8,622.3 252.6,621.3 255.4,620.3 258.2,619.3 261.0,618.3 263.8,617.3 266.6,616.3 269.4,615.3 272.2,614.4 275.0,613.4 277.8,612.5 280.6,611.5 283.4,610.6 286.2,609.7 289.0,608.8 291.8,607.9 294.6,607.0 297.4,606.2 300.2,605.3 303.0,604.5 305.8,603.6 308.6,602.8 311.4,602.0 314.2,601.2 317.0,600.4 319.8,599.6 322.6,598.9 325.4,598.1 328.2,597.4 331.0,596.7 333.8,595.9 336.6,595.2 339.4,594.5 342.2,593.9 345.0,593.2 347.8,592.5 350.6,591.9 353.4,591.2 356.2,590.6 359.0,590.0 361.8,589.3 364.6,588.7 367.4,588.1 370.2,587.5 373.0,587.0 375.8,586.4 378.6,585.8 381.4,585.3 384.2,584.7 387.0,584.2 389.8,583.6 392.6,583.1 395.4,582.6 398.2,582.1 401.0,581.6 403.8,581.1 406.6,580.6 409.4,580.1 412.2,579.6 415.0,579.1 417.8,578.7 420.6,578.2 423.4,577.8 426.2,577.3 429.0,576.9 431.8,576.4 434.6,576.0 437.4,575.6 440.2,575.2 443.0,574.8 445.8,574.4 448.6,574.0 451.4,573.6 454.2,573.2 457.0,572.8 459.8,572.4 462.6,572.0 465.4,571.7 468.2,571.3 471.0,570.9 473.8,570.6 476.6,570.2 479.4,569.9 482.2,569.5 485.0,569.2 487.8,568.8 490.6,568.5 493.4,568.2 496.2,567.8 499.0,567.5 501.8,567.2 504.6,566.9 507.4,566.6 510.2,566.3 513.0,566.0 515.8,565.7 518.6,565.4 521.4,