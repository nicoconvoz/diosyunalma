<text x="410.0" y="669.7" font-size="13" text-anchor="middle" fill="#ffd166">EL SUELO: r=a₀ (Bohr), E=−13.6 eV — medido por nosotros: -13.6057 eV</text><text x="134.0" y="350.0" font-size="12.5" fill="#ff9d73">← apretar cuesta impulso:</text>
<text x="134.0" y="372.0" font-size="12.5" fill="#ff9d73">   la pared 1/2r² (NO al colapso)</text>
<text x="540.0" y="480.0" font-size="12.5" fill="#7fb2ff">la atracción −1/r</text>
<text x="540.0" y="502.0" font-size="12.5" fill="#7fb2ff">(NO a la fuga) →</text><text x="410" y="730" font-size="14" text-anchor="middle" fill="#dce8f7">EL CUENCO: la MISMA forma que demostró el mar chiquito y que exige nuestra λ —</text>
<text x="410" y="754" font-size="14" text-anchor="middle" fill="#7fd7a8">la estabilidad del universo tiene UNA sola forma: un cuenco con suelo infranqueable</text><rect x="790" y="280" width="700" height="420" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="814" y="318" font-size="16" font-family="Georgia" fill="#ffd166">EL HIDRÓGENO RESUELTO EN CASA — los jueces</text>
<text x="814" y="364" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  energía del suelo:   -0.500000 hartree   (exacto −0.500000)</text>
<text x="814" y="392" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">                     = -13.6057 eV        (exacto −13.6057)</text>
<text x="814" y="420" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  radio medio:         1.500000 a₀        (exacto 1.500000)</text>
<text x="814" y="448" font-size="13.5" font-family="Consolas,monospace" fill="#dce8f7">  ⟨r²⟩:                3.000001           (exacto 3.000000)</text>
<text x="814" y="486" font-size="14.5" font-family="Consolas,monospace" fill="#7fd7a8">  EL PACTO: Δx·Δp = 0.8660 ℏ  ≥  ℏ/2 — CUMPLIDO</text><text x="814" y="534" font-size="13.5" fill="#dce8f7">la fórmula gobierna las DOS caras a la vez:</text>
<text x="814" y="562" font-size="13.5" fill="#7fd7a8">UNIDO: apretar la materia cuesta impulso infinito — el colapso está prohibido;</text>
<text x="814" y="586" font-size="13.5" fill="#7fd7a8">el pozo −1/r abraza — la fuga está prohibida: estable, para siempre</text>
<text x="814" y="620" font-size="13.5" fill="#ffd166">VIVO: la misma relación [x,p]=iℏ GENERA el movimiento (la dinámica es</text>
<text x="814" y="644" font-size="13.5" fill="#ffd166">el conmutador con H) y E=mc² deja a la energía volverse materia —</text>
<text x="814" y="668" font-size="13.5" fill="#ffd166">por encima del suelo, todo puede viajar y transformarse</text><rect x="90" y="760" width="1400" height="200" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="790" y="798" font-size="17" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">LO QUE ESTA FÓRMULA LE DA A NUESTRA CACERÍA</text>
<text x="790" y="834" font-size="14.5" text-anchor="middle" fill="#dce8f7">la máquina de los planos (H = x·p) está tejida EXACTAMENTE con estas dos mitades y esta relación — el telar del mundo cuántico ES [x,p]=iℏ:</text>
<text x="790" y="860" font-size="14.5" text-anchor="middle" fill="#dce8f7">la fuerza que buscabas es la que sostiene a los átomos reales, y es la MISMA de la que debe estar hecha la máquina del collar.</text>
<text x="790" y="896" font-size="14.5" text-anchor="middle" fill="#ffd166">y la forma de la estabilidad quedó unificada en TODO lo que tocamos: el cuenco — el átomo, el mar chiquito, la λ, la existencia: un solo dibujo.</text>
<text x="790" y="926" font-size="12.5" text-anchor="middle" fill="#8fa8c7">jueces: E₀ a 8e-08 del exacto · ⟨r⟩ a 2e-07 · el pacto Δx·Δp cumplido con margen · Laboratorio Diosyunalma · 2026-08-06</text></svg>