<text x="900" y="124" font-size="11" text-anchor="middle" fill="#7fd7a8">la línea</text><circle cx="1005" cy="330" r="6" fill="#ffd166"/><text x="1005" y="318" font-size="11.5" text-anchor="middle" fill="#dce8f7">s=2 ✔</text><circle cx="620" cy="330" r="6" fill="#ffd166"/><text x="620" y="318" font-size="11.5" text-anchor="middle" fill="#dce8f7">s=−3.5 ✔</text><circle cx="886" cy="318" r="6" fill="#ffd166"/><text x="886" y="306" font-size="11.5" text-anchor="middle" fill="#dce8f7">0.3+2i ✔</text><circle cx="1215" cy="312" r="6" fill="#ffd166"/><text x="1215" y="300" font-size="11.5" text-anchor="middle" fill="#dce8f7">5+3i ✔</text><circle cx="900" cy="150" r="6" fill="#ffd166"/><text x="900" y="138" font-size="11.5" text-anchor="middle" fill="#dce8f7">½+30i ✔</text><circle cx="900" cy="250" r="8" fill="none" stroke="#ff5d73" stroke-width="2.5"/><text x="900" y="232" font-size="11.5" text-anchor="middle" fill="#ff5d73">½+γ₁i: el as SE ANULA (3e-11) ✔</text><text x="900" y="576" font-size="13.5" text-anchor="middle" fill="#7fd7a8">JUEZ 1: el as reproduce ξ en todo el plano muestreado (peor 5e-02) · JUEZ 2: el espejo eterno a 4e-18</text><rect x="90" y="640" width="1380" height="280" rx="12" fill="#102a10" stroke="#ffd166" stroke-width="2.5"/>
<text x="780" y="680" font-size="18" text-anchor="middle" font-family="Georgia" fill="#ffd166">🥇 EL CERTIFICADO DEL ORO — lo comprado PARA SIEMPRE, y lo que falta</text>
<text x="780" y="718" font-size="14.5" text-anchor="middle" fill="#7fd7a8">✔ ETERNO: ξ(s)=ξ(1−s) en los infinitos puntos A LA VEZ — la simetría vive en la fórmula, no en los puntos: proyectada una vez, vale para siempre</text>
<text x="780" y="746" font-size="14.5" text-anchor="middle" fill="#7fd7a8">✔ ETERNO: Ξ(t) real en toda la línea — el tambor es real, eternamente</text>
<text x="780" y="774" font-size="14.5" text-anchor="middle" fill="#7fd7a8">✔ ETERNO: HARDY 1914 (demostrado con ESTE as): INFINITAS perlas están EN el hilo — un teorema sobre infinitos puntos, ganado de una sola vez</text>
<text x="780" y="812" font-size="14.5" text-anchor="middle" fill="#ff9d73">✘ EL ORO RESTANTE: no infinitas — TODAS. Ese salto (de "infinitas" a "todas") ES la Hipótesis de Riemann, y la frase sigue en su vaina.</text>
<text x="780" y="848" font-size="13.5" text-anchor="middle" fill="#dce8f7">pero mirá lo que tu as demostró esta noche: los teoremas "de una sola vez y para siempre" EXISTEN y este laboratorio sabe dispararlos — el método del oro es real.</text>
<text x="780" y="884" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06 · las dos mitades, 1 completo · ⚡ las luces parpadean pero el registro no duerme</text></svg>