<text x="400" y="670" font-size="12.5" text-anchor="middle" fill="#ffd166">el desfile 1!, 2!, 3!… cae AL CENTRO en todos los estantes a la vez</text>
<text x="400" y="694" font-size="12" text-anchor="middle" fill="#7fd7a8">JUEZ 1 (exacto): |1000!|₂ = 2⁻⁹⁹⁴ · |1000!|₇ = 7⁻¹⁶⁴ — jamás toca un borde: no existen</text><rect x="900" y="140" width="600" height="250" rx="12" fill="#2a1010" stroke="#ff5d73" stroke-width="1.5"/>
<text x="920" y="176" font-size="15" font-family="Georgia" fill="#ff8fa0">LA RECTA CON EXTREMOS (los falsos bordes ±∞): EL ZUMBIDO</text><text x="930" y="210" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">L=10      separación de modos 9.9e-02 → se aplastan a CERO</text><text x="930" y="240" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">L=100     separación de modos 9.9e-04 → se aplastan a CERO</text><text x="930" y="270" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">L=1000    separación de modos 9.9e-06 → se aplastan a CERO</text><text x="930" y="330" font-size="12.5" fill="#ff8fa0">cuanto más grande la caja con bordes, más se funde el canto</text>
<text x="930" y="352" font-size="12.5" fill="#ff8fa0">en un zumbido continuo — sin notas: sin perlas</text><rect x="900" y="420" width="600" height="250" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="920" y="456" font-size="15" font-family="Georgia" fill="#7fd7a8">EL CÍRCULO (compacto, SIN borde): LAS CAMPANADAS</text>
<text x="930" y="490" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">modos: 0, 1, 4, 9, 16, 25… — separaciones 1, 3, 5, 7, 9…</text>
<text x="930" y="514" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">FIJAS. DISCRETAS. PARA SIEMPRE.</text>
<text x="930" y="550" font-size="13" fill="#7fd7a8">sin bordes no hay dónde aplastarse: cada nota es una</text>
<text x="930" y="572" font-size="13" fill="#7fd7a8">campanada suelta — el espectro discreto, garantizado</text>
<text x="930" y="608" font-size="13.5" fill="#ffd166">⇒ LA CONDICIÓN 2 DE LA SOLDADURA tiene causa: la ley</text>
<text x="930" y="630" font-size="13.5" fill="#ffd166">del capitán — enroscar sin bordes — ES la receta de campanas</text><rect x="90" y="720" width="1380" height="180" rx="12" fill="#0d2547" stroke="#ffd166" stroke-width="2"/>
<text x="780" y="758" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">LA LEY DE LOS BORDES, SELLADA</text>
<text x="780" y="794" font-size="14" text-anchor="middle" fill="#dce8f7">infinito falló como NÚMERO porque es un CONJUNTO — y el conjunto entero se representa sin tocar bordes: enroscado en una casa compacta donde cada punto es igual a cada punto.</text>
<text x="780" y="822" font-size="14" text-anchor="middle" fill="#7fd7a8">esa casa ya la tenemos: el anillo de todo, la biblioteca compacta — y ahora sabemos POR QUÉ es obligatoria: sin bordes = campanadas = las perlas pueden existir como notas sueltas.</text>
<text x="780" y="850" font-size="13" text-anchor="middle" fill="#8fa8c7">el pizarrón de la soldadura se actualiza: condición 2 (espectro discreto) ← causa geométrica: compacidad sin borde — la ley del capitán</text>
<text x="780" y="880" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06 · las dos mitades, 1 completo ⚓</text></svg>