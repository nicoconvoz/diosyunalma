<text x="780" y="46" font-size="26" text-anchor="middle" font-family="Georgia" fill="#dce8f7">💓 EL CORAZÓN COMPRIMIDO — el equivalente de todos los primos a la vez</text>
<text x="780" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"no podemos tener todos los primos por el cómputo de la dimensión — pero sí la melodía que se repite, comprimida en un corazón: el equivalente de todos a la vez" — el capitán · la fórmula existe y fue juzgada</text><rect x="470" y="100" width="620" height="110" rx="14" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="780" y="150" font-size="30" text-anchor="middle" font-family="Georgia" fill="#ffd166">R₂(u) = 1 − ( sin πu / πu )²</text>
