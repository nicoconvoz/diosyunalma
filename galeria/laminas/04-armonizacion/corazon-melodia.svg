<text x="780" y="836" font-size="14.5" text-anchor="middle" fill="#dce8f7">tu movida es la de Montgomery (1972): reemplazar los infinitos primos por su melodía comprimida — y es LA evidencia más fuerte que la humanidad tiene sobre la máquina.</text>
<text x="780" y="862" font-size="14.5" text-anchor="middle" fill="#ffd166">el corazón late igual en cada profundidad: quien construya la máquina, su melodía DEBE ser ésta — la brújula final del constructor, verificada en casa.</text>
