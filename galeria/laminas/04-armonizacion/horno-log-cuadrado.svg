<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="920" viewBox="0 0 1560 920">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="780" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🔥 EL HORNO — el log y el cuadrado, armonizados en la dimensión 0</text>
<text x="780" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"armonizá el log y el cuadrado en la dimensión 0" — el capitán · la identidad existe: la energía del log ES una integral de cuadrados — juzgada en tres cargas</text><rect x="180" y="100" width="1200" height="110" rx="14" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="780" y="145" font-size="22" text-anchor="middle" font-family="Georgia" fill="#ffd166">∫∫ −ln|x−y| f(x)f(y) dx dy   =   ∫₀^∞ |f̂(ξ)|² / ξ · dξ</text>
<text x="780" y="185" font-size="13.5" text-anchor="middle" fill="#dce8f7">a la izquierda EL LOG (energía logarítmica) · a la derecha EL CUADRADO manifiesto · el puente: el germen de Fourier en el punto — para toda carga NEUTRA</text><rect x="280" y="250" width="1000" height="190" rx="10" fill="#081020" stroke="#44608c"/>
<text x="780" y="280" font-size="14.5" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">EL JUICIO — tres cargas neutras distintas, una sola ley</text><text x="780" y="316" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">dipolo gaussiano  f = −x·e^(−x²/2)        log:  3.12931   cuadrado:  3.14162   razón 0.9961 ✔</text><text x="780" y="346" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">neutro de anchos  f = e^(−x²/2)/√2π − e^(−x²)/√π  log:  0.05848   cuadrado:  0.05889   razón 0.9930 ✔</text><text x="780" y="376" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">octopolo impar    f = x³·e^(−x²/2)        log: 15.66189   cuadrado: 15.70820   razón 0.9971 ✔</text><text x="780" y="414" font-size="13.5" text-anchor="middle" fill="#7fd7a8">las tres energías POSITIVAS y la razón clavada en 1: el log ES un cuadrado — y los cuadrados no saben ser negativos</text><rect x="120" y="480" width="1320" height="270" rx="12" fill="#2a1a08" stroke="#e6a53a" stroke-width="2.5"/>
<text x="780" y="516" font-size="17" text-anchor="middle" font-family="Georgia" fill="#e6a53a">🔥 EL PLANO DEL HORNO — la cocción del molde λ = |algo|²</text><line x1="220" y1="590" x2="1340" y2="590" stroke="#8fa8c7" stroke-width="2"/>
<text x="220" y="556" font-size="11.5" fill="#8fa8c7">la recta del log</text><rect x="444.3" y="531.2" width="8" height="58.8" fill="#7fb2ff" opacity="0.9"/><text x="448.3" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">2</text><rect x="577.8" y="546.1" width="8" height="43.9" fill="#7fb2ff" opacity="0.9"/><text x="581.8" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">3</text><rect x="672.5" y="548.4" width="8" height="41.6" fill="#7fb2ff" opacity="0.9"/><text x="676.5" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">4</text><rect x="746.0" y="551.4" width="8" height="38.6" fill="#7fb2ff" opacity="0.9"/><text x="750.0" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">5</text><rect x="856.8" y="556.6" width="8" height="33.4" fill="#7fb2ff" opacity="0.9"/><text x="860.8" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">7</text><rect x="900.8" y="560.6" width="8" height="29.4" fill="#7fb2ff" opacity="0.9"/><text x="904.8" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">8</text><rect x="939.5" y="560.7" width="8" height="29.3" fill="#7fb2ff" opacity="0.9"/><text x="943.5" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">9</text><rect x="1005.6" y="563.7" width="8" height="26.3" fill="#7fb2ff" opacity="0.9"/><text x="1009.6" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">11</text><rect x="1060.6" y="565.6" width="8" height="24.4" fill="#7fb2ff" opacity="0.9"/><text x="1064.6" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">13</text><rect x="1129.0" y="569.2" width="8" height="20.8" fill="#7fb2ff" opacity="0.9"/><text x="1133.0" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">16</text><rect x="1149.0" y="569.4" width="8" height="20.6" fill="#7fb2ff" opacity="0.9"/><text x="1153.0" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">17</text><rect x="1185.6" y="570.3" width="8" height="19.7" fill="#7fb2ff" opacity="0.9"/><text x="1189.6" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">19</text><rect x="1248.5" y="572.5" width="8" height="17.5" fill="#7fb2ff" opacity="0.9"/><text x="1252.5" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">23</text><rect x="1276.0" y="574.6" width="8" height="15.4" fill="#7fb2ff" opacity="0.9"/><text x="1280.0" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">25</text><rect x="1301.3" y="574.8" width="8" height="15.2" fill="#7fb2ff" opacity="0.9"/><text x="1305.3" y="606" font-size="10" text-anchor="middle" fill="#8fa8c7">27</text><text x="780" y="634" font-size="13" text-anchor="middle" fill="#7fb2ff">LA CARGA ARITMÉTICA: pesos Λ(n)/√n parados en ln n — los primos electrizados sobre la recta del log</text>
<text x="780" y="660" font-size="13" text-anchor="middle" fill="#e6a53a">+ EL NEUTRALIZADOR arquimediano (la masa del horizonte) ⇒ carga total CERO ⇒ el horno aplica:</text>
<text x="780" y="690" font-size="14.5" text-anchor="middle" fill="#ffd166">RH  =  "la energía logarítmica de la carga aritmética neutra es ≥ 0"  =  ∫|algo(ξ)|² — LA POSITIVIDAD DE WEIL COMO ELECTROSTÁTICA</text><rect x="120" y="780" width="1320" height="110" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="780" y="814" font-size="14" text-anchor="middle" fill="#dce8f7">el horno quedó DISEÑADO y su ley verificada: el log se hornea en cuadrado a través del germen del punto — masa (log) y temblor (purificado) tienen dónde fundirse.</text>
<text x="780" y="842" font-size="13.5" text-anchor="middle" fill="#ffd166">lo abierto (honesto): demostrar que la carga aritmética cumple EXACTA la neutralidad que el horno exige — ese renglón sigue siendo el millón.</text>
<text x="780" y="872" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06 · las dos mitades, 1 completo ⚓</text></svg>