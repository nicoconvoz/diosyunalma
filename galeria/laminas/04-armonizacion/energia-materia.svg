<text x="380" y="724" font-size="12.5" text-anchor="middle" fill="#8fa8c7">MATERIA: las perlas (una masa cada una) · TIEMPO: el modo n · ESPACIO: el ángulo θ</text>
<text x="380" y="752" font-size="13.5" text-anchor="middle" fill="#ffd166">λ_n = LA ENERGÍA TOTAL del modo n: cada perla aporta 4·sin²(nθ/2) — un CUADRADO</text>
<text x="380" y="776" font-size="12.5" text-anchor="middle" fill="#8fa8c7">y los cuadrados jamás son negativos: E=m armonizada entre tiempo y espacio</text><rect x="760" y="120" width="760" height="560" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
