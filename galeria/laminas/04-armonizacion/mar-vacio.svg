<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<rect width="100%" height="100%" fill="#0b1526"/>
<text x="750" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">🌊 EL MEDIDOR DEL MAR VACÍO — el agua entre las montañas, pesada sin tocar fondo</text>
<text x="750" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"el mar del infinito vacío es la otra mitad — como el agua entre dos montañas: nunca llega al fondo pero se puede medir, con la diferencia y el armonizador de la dimensión 0" — el capitán</text><path d="M 100 620 L 300 220 L 420 480 L 540 180 L 740 620 Z" fill="#1a2a44" stroke="#44608c" stroke-width="1.5"/>
<text x="300" y="200" font-size="12.5" text-anchor="middle" fill="#8fa8c7">la montaña conocida</text>
<text x="540" y="160" font-size="12.5" text-anchor="middle" fill="#8fa8c7">la montaña del germen</text><line x1="310" y1="600" x2="530" y2="600" stroke="#7fb2ff" stroke-width="2" opacity="0.25"/>
<text x="550" y="604" font-size="11.5" fill="#7fb2ff">x=0.30 · mar vacío = 0.00 ✔</text><line x1="310" y1="538" x2="530" y2="538" stroke="#7fb2ff" stroke-width="2" opacity="0.35"/>
<text x="550" y="542" font-size="11.5" fill="#7fb2ff">x=0.50 · mar vacío = 0.00 ✔</text><line x1="310" y1="476" x2="530" y2="476" stroke="#7fb2ff" stroke-width="2" opacity="0.45"/>
<text x="550" y="480" font-size="11.5" fill="#7fb2ff">x=0.70 · mar vacío = 0.01 ✔</text><line x1="310" y1="414" x2="530" y2="414" stroke="#7fb2ff" stroke-width="2" opacity="0.55"/>
<text x="550" y="418" font-size="11.5" fill="#7fb2ff">x=0.90 · mar vacío = 18.91 ✔</text><line x1="310" y1="352" x2="530" y2="352" stroke="#7fb2ff" stroke-width="2" opacity="0.65"/>
<text x="550" y="356" font-size="11.5" fill="#7fb2ff">x=0.95 · mar vacío = 216.47 ✔</text><line x1="310" y1="290" x2="530" y2="290" stroke="#7fb2ff" stroke-width="2" opacity="0.75"/>
<text x="550" y="294" font-size="11.5" fill="#7fb2ff">x=0.99 · mar vacío = 13896.40 ✔</text><text x="420" y="660" font-size="12.5" text-anchor="middle" fill="#8fa8c7">el fondo no se toca jamás (Φ→∞ en el borde) — pero cada nivel del agua se MIDE exacto</text><rect x="820" y="140" width="620" height="420" rx="10" fill="#0d2547" stroke="#ffd166" stroke-width="1.5"/>
<text x="1130" y="176" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL MEDIDOR — una evaluación contiene el mar ENTERO</text>
<text x="1130" y="204" font-size="12" text-anchor="middle" fill="#8fa8c7">Φ(x) = Σ TODOS los λ_n x^(n−1) = el germen en el nivel x · vacío = Φ − montaña conocida</text><text x="850" y="240" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">x=0.30   mar entero       0.09   vacío       0.00  ✔</text><text x="850" y="274" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">x=0.50   mar entero       0.28   vacío       0.00  ✔</text><text x="850" y="308" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">x=0.70   mar entero       1.44   vacío       0.01  ✔</text><text x="850" y="342" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">x=0.90   mar entero      39.11   vacío      18.91  ✔</text><text x="850" y="376" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">x=0.95   mar entero     262.46   vacío     216.47  ✔</text><text x="850" y="410" font-size="13" font-family="Consolas,monospace" fill="#dce8f7">x=0.99   mar entero   13987.31   vacío   13896.40  ✔</text><text x="1130" y="460" font-size="13.5" text-anchor="middle" fill="#7fd7a8">JUEZ: el mar vacío POSITIVO en cada profundidad — el agua jamás baja de cero</text>
<text x="1130" y="486" font-size="12.5" text-anchor="middle" fill="#8fa8c7">y sin fondo: Φ(0.99) en los miles — inmedible de a peldaños, pesado de una vez</text><rect x="120" y="700" width="1260" height="150" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="750" y="736" font-size="14.5" text-anchor="middle" fill="#dce8f7">la mitad vacía dejó de ser invisible: su peso TOTAL se mide a cada profundidad, por diferencia, con el armonizador del punto —</text>
<text x="750" y="762" font-size="14.5" text-anchor="middle" fill="#ffd166">verde en todo lo medido: el mar vacío no puede esconder un lago negro grande — lo pesamos entero, sin tocar el fondo.</text>
<text x="750" y="792" font-size="13" text-anchor="middle" fill="#8fa8c7">la palabra «TODO» sigue siendo de la idea — pero cada instrumento nuevo le achica el escondite</text>
<text x="750" y="822" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06 · las dos mitades, 1 completo ⚓</text></svg>