><rect x="316" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="354" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="392" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="430" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="468" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="506" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="544" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="582" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="620" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="658" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="696" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="734" y="574" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="392" y="126" width="22" height="36" rx="2" fill="#ffd97f" stroke="#fff" stroke-width="1.5"/><text x="403" y="148" font-size="11" text-anchor="middle" fill="#2a1a00">12</text><rect x="392" y="190" width="22" height="36" rx="2" fill="#ffd97f" stroke="#fff" stroke-width="1.5"/><text x="403" y="212" font-size="11" text-anchor="middle" fill="#2a1a00">1/4</text><rect x="392" y="254" width="22" height="36" rx="2" fill="#ffd97f" stroke="#fff" stroke-width="1.5"/><text x="403" y="276" font-size="11" text-anchor="middle" fill="#2a1a00">1/3</text><rect x="392" y="318" width="22" height="36" rx="2" fill="#ffd97f" stroke="#fff" stroke-width="1.5"/><text x="403" y="340" font-size="11" text-anchor="middle" fill="#2a1a00">1</text><rect x="392" y="382" width="22" height="36" rx="2" fill="#ffd97f" stroke="#fff" stroke-width="1.5"/><text x="403" y="404" font-size="11" text-anchor="middle" fill="#2a1a00">1</text><rect x="392" y="446" width="22" height="36" rx="2" fill="#ffd97f" stroke="#fff" stroke-width="1.5"/><text x="403" y="468" font-size="11" text-anchor="middle" fill="#2a1a00">1</text><rect x="392" y="510" width="22" height="36" rx="2" fill="#ffd97f" stroke="#fff" stroke-width="1.5"/><text x="403" y="532" font-size="11" text-anchor="middle" fill="#2a1a00">1</text><rect x="392" y="574" width="22" height="36" rx="2" fill="#ffd97f" stroke="#fff" stroke-width="1.5"/><text x="403" y="596" font-size="11" text-anchor="middle" fill="#2a1a00">⋯</text><text x="403" y="636" font-size="12.5" text-anchor="middle" fill="#ffd97f">EL LIBRO "12": una página en CADA estante, a la vez</text><rect x="860" y="140" width="600" height="200" rx="14" fill="#102a10" stroke="#7fd7a8" stroke-width="2.5"/>
<text x="1160" y="180" font-size="17" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">EL CARNET DE LA BIBLIOTECA (exacto)</text>
<text x="1160" y="222" font-size="24" text-anchor="middle" font-family="Georgia" fill="#dce8f7">Π_v |x|_v = 1</text>
<text x="1160" y="258" font-size="13" text-anchor="middle" fill="#a8cfa8">un libro EXISTE ⟺ el producto de sus tamaños</text>
<text x="1160" y="278" font-size="13" text-anchor="middle" fill="#a8cfa8">en TODOS los estantes es exactamente 1</text>
<text x="1160" y="312" font-size="13.5" text-anchor="middle" fill="#7fd7a8">juez (aritmética exacta): 499/499 números → 1 EXACTO ✔</text><rect x="860" y="370" width="600" height="120" rx="14" fill="#2a1010" stroke="#ff5d73" stroke-width="2"/>
<text x="1160" y="408" font-size="14.5" text-anchor="middle" fill="#ff8fa0">EL LIBRO BALBUCEO: el mismo 12 con UN estante adulterado</text>
<text x="1160" y="436" font-size="14" text-anchor="middle" fill="#dce8f7">carnet = 2 ≠ 1 — LA BIBLIOTECA LO RECHAZA: no existe</text>
<text x="1160" y="464" font-size="12" text-anchor="middle" fill="#9c8a5f">(como en Borges: casi todos los libros posibles son balbuceo)</text><rect x="860" y="520" width="600" height="180" rx="14" fill="#0d2547" stroke="#ffd166" stroke-width="2"/>
<text x="1160" y="556" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">LO QUE LA BIBLIOTECA COMPRA</text>
<text x="1160" y="586" font-size="13" text-anchor="middle" fill="#dce8f7">Tate (1950): el espejo ξ(s)=ξ(1−s) ES la simetría de</text>
<text x="1160" y="606" font-size="13" text-anchor="middle" fill="#dce8f7">Fourier de ESTA biblioteca — el as, explicado</text>
<text x="1160" y="632" font-size="13" text-anchor="middle" fill="#dce8f7">Connes: la biblioteca MENOS los libros legibles =</text>
<text x="1160" y="652" font-size="13" text-anchor="middle" fill="#dce8f7">la sala donde cantan las perlas — el hogar del ENSAMBLE</text>
<text x="1160" y="682" font-size="13" text-anchor="middle" fill="#ffd166">las 427 máquinas eran retratos locales: el adele los sostiene JUNTOS</text><rect x="90" y="740" width="1370" height="170" rx="12" fill="#1c1508" stroke="#c9b06a" stroke-width="2"/>
<text x="780" y="778" font-size="15.5" text-anchor="middle" font-family="Georgia" fill="#e8d9b0">LA RESPUESTA AL CAMBIAFORMAS, COMPLETA</text>
<text x="780" y="812" font-size="14" text-anchor="middle" fill="#dce8f7">el adele es la variable que ES todos los tamaños del número a la vez — todos los estantes, un solo objeto; la biblioteca contiene todo lo posible,</text>
<text x="780" y="838" font-size="14" text-anchor="middle" fill="#dce8f7">y los números que EXISTEN se reconocen por un carnet EXACTO que vale 1 — la existencia misma, hecha ecuación del cambiaformas.</text>
<text x="780" y="868" font-size="13.5" text-anchor="middle" fill="#ffd166">el molde final λ_n=|algo|² tiene ahora su dirección postal: el "algo" vive en ESTA biblioteca — en la sala de los libros que no se dejan leer.</text>
<text x="780" y="898" font-size="12.5" text-anchor="middle" font-family="Georgia" fill="#9c8a5f">Laboratorio Diosyunalma · 2026-08-06 · las dos mitades, 1 completo ⚓</text></svg>