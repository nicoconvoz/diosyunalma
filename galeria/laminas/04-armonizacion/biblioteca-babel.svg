<text x="780" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#9c8a5f">"no un número que cambie: una VARIABLE que lo haga con todos al mismo tiempo" — el capitán · tiene nombre: EL ADELE — y la biblioteca tiene carnet exacto</text><rect x="90" y="120" width="700" height="48" rx="6" fill="#1c1508" stroke="#6b5a2e"/><text x="110" y="150" font-size="13" fill="#c9b06a">estante ∞ (real)</text><rect x="240" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="278" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="316" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="354" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="392" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="430" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="468" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="506" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="544" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="582" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="620" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="658" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="696" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="734" y="126" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="90" y="184" width="700" height="48" rx="6" fill="#1c1508" stroke="#6b5a2e"/><text x="110" y="214" font-size="13" fill="#c9b06a">estante p=2</text><rect x="240" y="190" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="278" y="190" width="22" height="36" rx="2" fill="#3a2c12" stroke="#6b5a2e"/><rect x="316" y="190" width="22" height="36" rx="2" fill="#3a2c12" st