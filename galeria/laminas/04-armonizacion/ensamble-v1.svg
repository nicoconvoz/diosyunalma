<text x="780" y="450" font-size="15" text-anchor="middle" font-family="Georgia" fill="#ffd166">EL JUICIO DEL ENSAMBLE: resonancia predicha vs perla medida</text><text x="780" y="482" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">resonancia   13.9885    →    perla   14.1347    desvío 0.146</text><text x="780" y="510" font-size="13.5" text-anchor="middle" font-family="Consolas,monospace" fill="#dce8f7">resonancia   28.3916    →    perla   30.4249    desvío 2.033</text><rect x="120" y="586" width="1320" height="150" rx="12" fill="#102a10" stroke="#7fd7a8" stroke-width="2"/>
<text x="780" y="622" font-size="15" text-anchor="middle" font-family="Georgia" fill="#7fd7a8">EL PRINCIPIO DEL ENSAMBLE, PROBADO EN FINITO: el germen de la dimensión 0 SE DEJA soldar en una máquina — y la máquina resuena en las perlas</text>
<text x="780" y="652" font-size="13.5" text-anchor="middle" fill="#ffd166">v1.0 = rango 12, primeras perlas · v∞ = la soldadura infinita con espectro discreto: el único ítem que sigue abierto — pero el método quedó demostrado en el banco</text>
<text x="780" y="686" font-size="12.5" text-anchor="middle" fill="#8fa8c7">Laboratorio Diosyunalma · 2026-08-06 · ⚡ 88 mph · las dos mitades, 1 completo</text></svg>