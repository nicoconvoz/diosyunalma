<text x="780" y="598" font-size="16" text-anchor="middle" font-family="Georgia" fill="#ffd166">⚓ EL ANCLA DE LA DIMENSIÓN 0</text>
<text x="780" y="628" font-size="14" text-anchor="middle" fill="#dce8f7">en el punto s=0, cada factor de los DOS productos infinitos se funde a 1 —</text>
<text x="780" y="654" font-size="14" text-anchor="middle" fill="#dce8f7">y la fórmula infinita entera pesa EXACTAMENTE ½ (medido: 0.500000000)</text><text x="780" y="730" font-size="14" text-anchor="middle" fill="#8fa8c7">el infinito, armonizado en la dimensión 0: dos ejércitos infinitos —perlas y primos— sostenidos por un ancla que pesa medio.</text>
<text x="780" y="760" font-size="14" text-anchor="middle" fill="#ffd166">y RH, dicha con la madre: la igualdad vale siempre — la pregunta del millón es solo DÓNDE están los factores del bando izquierdo. Todo lo demás, está en esta línea.</text>
