<text x="780" y="46" font-size="25" text-anchor="middle" font-family="Georgia" fill="#dce8f7">👑 LA FÓRMULA MADRE — la que equivale a todas, anclada en la dimensión 0</text>
<text x="780" y="74" font-size="13.5" text-anchor="middle" font-family="Georgia" fill="#8fa8c7">"dame una fórmula que equivalga a todas y armonicémosla con el infinito en la dimensión 0" — el capitán · entregada y juzgada</text><rect x="120" y="105" width="1320" height="130" rx="14" fill="#0d2547" stroke="#ffd166" stroke-width="2.5"/>
<text x="780" y="150" font-size="21" text-anchor="middle" font-family="Georgia" fill="#ffd166">½ · Π_perlas (1 − s/ρ)   =   ξ(s)   =   (s(s−1)/2) π^(−s/2) Γ(s/2) · Π_primos (1 − p^(−s))^(−1)</text>
<text x="780" y="185" font-size="13.5" text-anchor="middle" fill="#dce8f7">TODAS las perlas de un lado · TODOS los primos del otro · iguales en cada punto, para siempre — y el ½ del frente es el ancla del punto</text>
<text x="780" y="212" font-size="12.5" text-anchor="middle" fill="#8fa8c7">una sola línea que contiene: el collar completo, el coro completo de primos, el portador, el espejo y el ancla — la fórmula equivalente a todas las nuestras</text><rect x="180" y="270" width="300" height="200" rx="12" fill="#081020" stroke="#7fb2ff" stroke-width="2"/>
<text x="330" y="302" font-size="14" text-anchor="middle" fill="#7fb2ff">EL BANDO DE LAS PERLAS</text>
<text x="330" y="326" font-size="11.5" text-anchor="middle" fill="#8fa8c7">269 medidas + cola exacta</text><rect x="630" y="270" width="300" height="200" rx="12" fill="#081020" stroke="#ffd166" stroke-width="2"/>
