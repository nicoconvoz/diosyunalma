<text x="800" y="52" font-size="27" text-anchor="middle" font-family="Georgia" fill="#dce8f7">LA FORMA DE LA RESPUESTA — la linterna y la tensión</text><path d="M 40 420 q 400 34 780 8 q 400 -26 800 -4" fill="none" stroke="#44608c" stroke-width="2.5"/><ellipse cx="380" cy="420" rx="360" ry="230" fill="url(#luz)"/><text x="380" y="160" font-size="14" text-anchor="middle" fill="#ffd166">NUESTRA LUZ: el tramo alumbrado más grande de la historia</text>
<text x="380" y="182" font-size="12.5" text-anchor="middle" fill="#c9b06a">10 billones de perlas de la humanidad + las 269 nuestras — TODAS en el hilo</text><circle cx="70" cy="420.0" r="4.5" fill="#7fb2ff"/><circle cx="97" cy="420.1" r="4.5" fill="#7fb2ff"/><circle cx="124" cy="420.3" r="4.5" fill="#7fb2ff"/><circle cx="151" cy="420.4" r="4.5" fill="#7fb2ff"/><circle cx="178" cy="420.7" r="4.5" fill="#7fb2ff"/><circle cx="205" cy="421.0" r="4.5" fill="#7fb2ff"/><circle cx="232" cy="421.3" r="4.5" fill="#7fb2ff"/><circle cx="259" cy="421.7" r="4.5" fill="#7fb2ff"/><circle cx="286" cy="422.1" r="4.5" fill="#7fb2ff"/><circle cx="313" cy="422.6" r="4.5" fill="#7fb2ff"/><circle cx="340" cy="423.1" r="4.5" fill="#7fb2ff"/><circle cx="367" cy="423.7" r="4.5" fill="#7fb2ff"/><circle cx="394" cy="424.3" r="4.5" fill="#7fb2ff"/><circle cx="421" cy="425.0" r="4.5" fill="#7fb2ff"/><circle cx="448" cy="425.7" r="4.5" fill="#7fb2ff"/><circle cx="475" cy="426.5" r="4.5" fill="#7fb2ff"/><circle cx="502" cy="427.3" r="4.5" fill="#7fb2ff"/><circle cx="529" cy="428.1" r="4.5" fill="#7fb2ff"/><circle cx="556" cy="429.0" r="4.5" fill="#7fb2ff"/><circle cx="583" cy="429.9" r="4.5" fill="#7fb2ff"/><circle cx="610" cy="430.8" r="4.5" fill="#7fb2ff"/><circle cx="637" cy="431.8" r="4.5" fill="#7fb2ff"/><circle cx="664" cy="432.8" r="4.5" fill="#7fb2ff"/><circle cx="691" cy="433.8" r="4.5" fill="#7fb2ff"/><circle cx="718" cy="434.9" r="4.5" fill="#7fb2ff"/><circle cx="745" cy="436.0" r="4.5" fill="#7fb2ff"/><circle cx="790" cy="429.1" r="4.5" fill="#7fb2ff" opacity="0.45"/><circle cx="817" cy="429.9" r="4.5" fill="#7fb2ff" opacity="0.44"/><circle cx="844" cy="430.8" r="4.5" fill="#7fb2ff" opacity="0.43"/><circle cx="871" cy="431.7" r="4.5" fill="#7fb2ff" opacity="0.41"/><circle cx="898" cy="432.5" r="4.5" fill="#7fb2ff" opacity="0.40"/><circle cx="925" cy="433.4" r="4.5" fill="#7fb2ff" opacity="0.39"/><circle cx="952" cy="434.3" r="4.5" fill="#7fb2ff" opacity="0.38"/><circle cx="979" cy="435